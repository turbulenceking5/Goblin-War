<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#0d1220">
<title>Goblin War — Change Log</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#141a2e; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#0d1220; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#0d1220; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #0d1220 100%), url('assets/ui/bg-dither.jpg'); background-blend-mode:overlay; background-size:auto, 350px;
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Press Start 2P', 'Cinzel Decorative', serif; font-size:12px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); line-height:1.5; }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px; display:inline-flex; align-items:center; gap:6px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn img{ width:14px; height:14px; flex:none; image-rendering:pixelated; }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:16px; text-align:center; }
  .changelog-entry{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .changelog-date{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:6px; }
  .changelog-entry ul{ margin:0; padding-left:18px; }
  .changelog-entry li{ font-size:14.5px; color:var(--parchment); margin-bottom:4px; line-height:1.4; }
</style>
</head>
<body>
  <header>
    <h1>CHANGE LOG</h1>
    <button id="back-btn" onclick="location.href='settings.html?_='+Date.now()"><img src="assets/ui/sword-icon.png" alt=""> Back to Settings</button>
  </header>
  <main>
    <div class="subtitle">Everything shipped so far</div>
    <div id="changelog-list"></div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
// Loaded from changelog.json — the single source of truth shared with index.html's "What's
// New" popup, same pattern as index.html's own version.json fetch (a JSON data file, not a
// JS module import — see the matching comment there). Update changelog.json whenever a
// change ships.
// Namespaced per logged-in account — see the matching comment in index.html — set once
// authGateReady resolves, below.
let CHANGELOG_SEEN_KEY = null;
let CHANGELOG = [];
// Deliberately not cache-busted — same normal HTTP caching as this page itself, matching
// how index.html loads it (see its own comment on changelogReady).
const changelogReady = fetch('changelog.json')
  .then(r => r.json())
  .then(data => { CHANGELOG = data; });

function renderChangelog(){
  const container = document.getElementById('changelog-list');
  const newestFirst = CHANGELOG.slice().reverse();
  container.innerHTML = newestFirst.map(entry => `
    <div class="changelog-entry">
      <div class="changelog-date">${entry.date}</div>
      <ul>${entry.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('');
  // Reading the full log here counts as "seen" — no need for the map's popup to repeat it.
  if(CHANGELOG_SEEN_KEY) localStorage.setItem(CHANGELOG_SEEN_KEY, String(CHANGELOG[CHANGELOG.length-1].id));
}
changelogReady.then(renderChangelog);
authGateReady.then(session=>{
  if(!session) return; // being redirected to login.html
  CHANGELOG_SEEN_KEY = `goblinwar_lastSeenChangelog_${session.user.id}`;
  changelogReady.then(renderChangelog); // re-run now that CHANGELOG_SEEN_KEY is set, so the "mark seen" write happens
});
</script>
<script>
// Service worker registration — see sw.js for what it does and why (network-first, offline
// fallback only; never serves stale content while the network is actually reachable). The
// registration URL itself is cache-busted, same reasoning as every internal nav link (CLAUDE.md)
// — GitHub Pages' CDN (Cache-Control: max-age=600) could otherwise keep handing back a stale
// cached copy of sw.js itself for several minutes after a real update ships.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js?_=' + Date.now()).catch(()=>{}));
}
</script>
</body>
</html>
