<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Change Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:16px; text-align:center; }
  .changelog-entry{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .changelog-date{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:6px; }
  .changelog-entry ul{ margin:0; padding-left:18px; }
  .changelog-entry li{ font-size:14.5px; color:var(--parchment); margin-bottom:4px; line-height:1.4; }
</style>
</head>
<body>
  <header>
    <h1>CHANGE LOG</h1>
    <button id="back-btn" onclick="location.href='settings.html?_='+Date.now()">&larr; Back to Settings</button>
  </header>
  <main>
    <div class="subtitle">Everything shipped so far</div>
    <div id="changelog-list"></div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
// Kept identical to the CHANGELOG array in index.html (see CLAUDE.md's no-modules
// convention) — update both whenever a change ships, or this page and the "What's New"
// popup on the map will disagree.
// Namespaced per logged-in account — see the matching comment in index.html — set once
// authGateReady resolves, below.
let CHANGELOG_SEEN_KEY = null;
const CHANGELOG = [
  { id:1, date:"2026-09-03", changes:[
    "Added a Change Log to Settings, and a \"What's New\" popup — it now greets you on the map after any update you haven't seen yet."
  ]},
  { id:2, date:"2026-09-03", changes:[
    "Switched the whole game to a dark theme.",
    "Added an \"Update available\" banner that drops down from the top of the map when a new version has shipped — tap it to refresh."
  ]},
  { id:3, date:"2026-09-03", changes:[
    "Goblin and Ork raiders now show real portrait art in combat instead of a hand-drawn icon.",
    "Goblin raiding parties now come in four distinct varieties — Raider, Shieldbearer, Skirmisher, and Archer — each with its own toughness and bite, not just a reskinned fight."
  ]},
  { id:4, date:"2026-09-03", changes:[
    "Bandits now show real portrait art too — every enemy in the game has a proper look.",
    "Ork raiding parties now come in three varieties — Raider, Berserker, and Warlord — with the Warlord as the toughest fight in the game."
  ]},
  { id:5, date:"2026-09-04", changes:[
    "Added accounts and cloud saves — log in from Settings to back up your character and load it on another device."
  ]},
  { id:6, date:"2026-09-04", changes:[
    "An account is now required to play — log in or sign up on the new login screen before entering the realm."
  ]},
  { id:7, date:"2026-09-04", changes:[
    "Change Log moved out of Settings into its own page, reached via a Change Log button, so Settings stays uncluttered."
  ]},
  { id:8, date:"2026-09-04", changes:[
    "Your account can now hold multiple characters — choose or create one right after logging in.",
    "Each character has exactly one save, kept up to date automatically as you play (plus a Save Now button in Settings) — the old local save slots are gone.",
    "Settings now shows Switch Character and Delete This Character in place of the old save slots and New Game reset."
  ]},
  { id:9, date:"2026-09-04", changes:[
    "Combat victories now grant XP, and leveling up grants a skill point plus a small Health/Stamina boost.",
    "The Character sheet's Level, XP bar, and Strength/Agility/Intelligence are live — spend skill points on your stats there."
  ]},
  { id:10, date:"2026-09-04", changes:[
    "Skill points can now unlock 9 real perks on the Character sheet — combat bonuses, extra carry capacity, safer travel, and cheaper Marketplace prices."
  ]},
  { id:11, date:"2026-09-04", changes:[
    "Combat isn't just Attack/Flee anymore — a new Specials button lets you unleash active moves like Crushing Blow, War Cry, and Cleave, once per fight.",
    "6 special attacks can be unlocked with skill points on the Character sheet, alongside stats and perks."
  ]},
  { id:12, date:"2026-09-04", changes:[
    "Added a Quest Board to every settlement — accept minor jobs like delivering a message for gold and XP.",
    "Cities and Capitals now have a Notable Figure who offers one important task at a time, like clearing out bandits."
  ]},
  { id:13, date:"2026-09-04", changes:[
    "Notable Figures now stay in one place — Captain Aldric Vane, Yselle Thorn, Elder Bram Oswick, Scoutmaster Priska Ren, and Sir Corwin Hale each call a specific city home, and will vanish if it's ever conquered.",
    "The Quest Board now also offers Deliver Cargo jobs, and a Notable Figure whose home is at war will ask you to Drive Off the Raiders instead of dealing with bandits — for a bigger reward."
  ]},
  { id:14, date:"2026-09-04", changes:[
    "Kingdoms now defend themselves with only their own forces, not the combined strength of every kingdom sharing their race — raids and Guard House numbers now reflect that one kingdom alone."
  ]},
  { id:15, date:"2026-09-04", changes:[
    "The Palace can now offer a Petition for Troops — convince a peaceful kingdom's court to reinforce an allied kingdom under attack, for gold and XP."
  ]},
  { id:16, date:"2026-09-04", changes:[
    "Skills moved off the Character sheet onto their own new Skills tab — Level/XP, Strength/Agility/Intelligence, Perks, and Special Attacks all live there now, so the Character sheet stays focused on your hero and gear."
  ]},
  { id:17, date:"2026-09-04", changes:[
    "Goblin and Ork raiding parties can now ambush you with 2-3 enemies at once instead of just one — pick your target, watch each enemy's own health bar, and everyone still standing swings back each round.",
    "Cleave now actually hits every enemy in the fight, and War Cry now weakens all of them at once — both moves were previously written for this but had nothing to loop over."
  ]},
  { id:18, date:"2026-09-04", changes:[
    "Enemies can now drop loot on defeat — Healing Potions, gear pieces, and a couple of race-flavored extras, on top of the usual gold and XP."
  ]},
  { id:19, date:"2026-09-04", changes:[
    "Talk to Townsfolk is now a real action — settlement gossip that reacts to whether the place is at war, its size, and whether it's changed hands recently."
  ]},
  { id:20, date:"2026-09-04", changes:[
    "Wars are now fought between specific kingdoms, not just \"at war with someone\" — each war has a real enemy, shown wherever it matters.",
    "Raids have become real sieges — an attacking kingdom grinds down a settlement's defenses over several weeks instead of resolving in one instant roll, with Guard House now showing live siege progress.",
    "Added a red frontline marker on the map for any settlement bordering enemy territory.",
    "You can now step into a war yourself: Defend the Walls fights off a siege in person, the Palace can Negotiate Peace with a specific enemy, and a Refugee Camp lets you Aid the Refugees a recent war displaced."
  ]},
  { id:21, date:"2026-09-05", changes:[
    "Food and Waterskin now relieve new Hunger and Thirst meters instead of a per-trip Food cost — Eat and Drink from your Bag, and keep an eye on both, since fighting raises them and letting either run out too long will start costing you Health.",
    "Added The Pub to cities and some towns — buy a Meal & Drink to fully satisfy Hunger and Thirst in one go.",
    "Bedroll is now a pricier Marketplace purchase, but carrying one now also leaves you extra rested after sleeping, on top of its existing safer-camping effect."
  ]},
  { id:22, date:"2026-09-05", changes:[
    "Goblin raiding parties can now include a Goblin Chieftain (their toughest, best-paying variant) or a Goblin Shaman, and Ork raiding parties can now include an Ork Shaman — three new enemy portraits in the mix."
  ]},
];

function renderChangelog(){
  const container = document.getElementById('changelog-list');
  const newestFirst = CHANGELOG.slice().reverse();
  container.innerHTML = newestFirst.map(entry => `
    <div class="changelog-entry">
      <div class="changelog-date">${entry.date}</div>
      <ul>${entry.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('');
  // Reading the full log here counts as "seen" — no need for the map's popup to repeat it.
  if(CHANGELOG_SEEN_KEY) localStorage.setItem(CHANGELOG_SEEN_KEY, String(CHANGELOG[CHANGELOG.length-1].id));
}
renderChangelog();
authGateReady.then(session=>{
  if(!session) return; // being redirected to login.html
  CHANGELOG_SEEN_KEY = `goblinwar_lastSeenChangelog_${session.user.id}`;
  renderChangelog(); // re-run now that CHANGELOG_SEEN_KEY is set, so the "mark seen" write happens
});
</script>
</body>
</html>
