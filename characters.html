<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Choose Character</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; --bad:#e2857f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #logout-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--bad); border:1.5px solid var(--bad);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #logout-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:16px; text-align:center; }
  .status{ text-align:center; color:#a9926a; font-size:14px; padding:20px 0; }

  .char-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .char-name{ font-family:'Cinzel Decorative', serif; font-size:17px; color:var(--gold-lt); margin-bottom:4px; }
  .char-summary{ font-size:13.5px; color:var(--parchment); margin-bottom:12px; }
  .char-actions{ display:flex; gap:10px; }
  .btn{
    font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px;
    border:none; border-radius:8px; padding:10px 14px; cursor:pointer; flex:1;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; box-shadow:0 3px 0 #7a5715; }
  .btn-secondary{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }
  .btn-danger{
    background:transparent; color:var(--bad); border:1.5px solid var(--bad);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; border-radius:8px;
    padding:10px 14px; cursor:pointer; flex:none;
  }
  .btn-danger:active{ transform:scale(.96); }

  .create-card{
    background:rgba(255,255,255,.06); border:1.5px dashed rgba(209,164,69,.4); border-radius:10px;
    padding:16px; margin-top:8px;
  }
  .create-prompt{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:.5px; color:var(--gold-lt);
    background:transparent; border:none; width:100%; text-align:center; cursor:pointer; padding:6px 0;
  }
  .create-form{ display:none; flex-direction:column; gap:10px; }
  .create-form.show{ display:flex; }
  input, select{
    font-family:'EB Garamond', serif; font-size:15px; color:var(--parchment);
    background:rgba(0,0,0,.25); border:1.5px solid rgba(209,164,69,.4); border-radius:8px;
    padding:11px 12px; width:100%;
  }
  input::placeholder{ color:#7a6b4d; }
  select{ font-family:'EB Garamond', serif; } /* Safari ignores the shorthand rule's font-family on <select> otherwise */
  .field-label{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:#a9926a; margin-bottom:-4px; }
  .difficulty-options{ display:flex; flex-direction:column; gap:8px; }
  .difficulty-check{ display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--parchment); line-height:1.4; cursor:pointer; }
  .difficulty-check input{ width:auto; flex:none; margin-top:2px; accent-color:var(--gold); }
  .difficulty-note{ font-size:10.5px; color:#a9926a; font-style:italic; }
  .error{ font-size:13px; color:var(--bad); min-height:0; }
  .create-btn-row{ display:flex; gap:10px; }
  .deceased-badge{
    display:inline-block; font-family:'Cinzel', serif; font-size:10px; letter-spacing:.5px;
    color:var(--bad); border:1px solid var(--bad); border-radius:5px; padding:2px 7px; margin-left:8px;
  }
</style>
</head>
<body>
  <header>
    <h1>CHOOSE YOUR HERO</h1>
    <button id="logout-btn">Log Out</button>
  </header>
  <main>
    <div class="subtitle">One save per character</div>
    <div id="status" class="status">Loading your characters…</div>
    <div id="char-list"></div>

    <div class="create-card">
      <button class="create-prompt" id="show-create-btn">+ Create New Character</button>
      <div class="create-form" id="create-form">
        <input id="new-name" type="text" placeholder="Character name" maxlength="24" autocomplete="off">
        <div class="field-label">Starting City</div>
        <select id="start-city"><option value="5">Loading cities…</option></select>
        <div class="field-label">Difficulty</div>
        <div class="difficulty-options">
          <label class="difficulty-check"><input type="checkbox" id="diff-player">Permadeath: you — losing a fight ends this character for good, instead of surviving at 10 HP</label>
          <label class="difficulty-check"><input type="checkbox" id="diff-companions" checked>Permadeath: companions — not relevant yet, since none can be recruited, but locked in now for when they can</label>
          <label class="difficulty-check"><input type="checkbox" id="diff-mercenaries" checked>Permadeath: mercenaries — a hired sword can die for good in a fight (already true by default)</label>
        </div>
        <div class="difficulty-note">Chosen once, here — there's no way to change it after this character is created.</div>
        <div class="error" id="create-error"></div>
        <div class="create-btn-row">
          <button class="btn btn-secondary" id="cancel-create-btn">Cancel</button>
          <button class="btn btn-primary" id="confirm-create-btn">Begin Adventure</button>
        </div>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;
const DEFAULT_INVENTORY = [
  { name:"Food", qty:10, weight:1, value:2 },
  { name:"Waterskin", qty:1, weight:2, value:3 },
  { name:"Bedroll", qty:1, weight:3, value:45 }, // matches index.html's MARKET_ITEMS price
];

function dateStr(dayCount){
  const day = (dayCount % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(dayCount / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(dayCount / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  return `Day ${day}, Month ${month}, Year ${year}`;
}

let burgNames = {}; // id -> name, for display only
function locationName(burgId){ return burgNames[burgId] || `Location #${burgId}`; }

// Character names are free-text the player chose themselves (see confirm-create-btn below) and
// get rendered into innerHTML in loadCharacters() — escape before interpolating so a name like
// "<img src=x onerror=...>" can't run script against the player's own account.
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// A brand-new character's starting snapshot — same shape collectLiveState()/
// applyLoadedState() in index.html and settings.html use, just built from scratch instead
// of read off live localStorage keys. Matches initPlayerStateIfMissing()'s defaults in
// index.html (see CLAUDE.md's no-modules convention — duplicated, not shared). burgId defaults
// to Bary (the original hardcoded start) so a save loaded before the Starting City picker
// existed, or one somehow missing the field, still lands somewhere real. `difficulty`'s three
// defaults below (player off, companions/mercenaries on) match the game's original,
// pre-difficulty-setting behavior exactly — see index.html's PERMADEATH_* consts — so a
// character predating this field (or created via a path that never passes one) plays exactly
// as it always did.
function freshCharacterData(name, burgId, difficulty){
  const diff = Object.assign({ permadeathPlayer:false, permadeathCompanions:true, permadeathMercenaries:true }, difficulty);
  return {
    name,
    burgId: burgId || "5", day: 0, hour: 8, heading: 0,
    health: 100, maxHealth: 100,
    stamina: 100, maxStamina: 100,
    hunger: 100, thirst: 100,
    isDead: false,
    permadeathPlayer: diff.permadeathPlayer,
    permadeathCompanions: diff.permadeathCompanions,
    permadeathMercenaries: diff.permadeathMercenaries,
    age: "24", gold: 50,
    inventory: JSON.stringify(DEFAULT_INVENTORY),
    equipped: "{}",
    level: 1, xp: 0, skillPoints: 0,
    stats: JSON.stringify({str:0,agi:0,int:0}), skills: "{}", kills: "{}",
    quests: "[]", completedQuests: "[]", questsCompletedTotal: 0,
    visitedBurgs: "[]", defeatedVariants: "{}", party: "[]", mercenaries: "[]",
    territoryControl: "{}", relations: "{}", reinforcements: "{}", lastWarTick: 0, population: "{}",
    sieges: "{}", refugeeArrivals: "{}", siegeDefenseCooldowns: "{}",
    savedAt: new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
  };
}

// Writes a character snapshot onto the live goblinwar_* keys index.html and friends read.
// Merged onto freshCharacterData(data.name) first, rather than conditionally patching whatever
// currently sits in localStorage — a save made before some mechanic existed (e.g. an old
// character predating Hunger/Thirst or the war-relations system) simply lacks that field in its
// own `data`, and without this reset it would silently keep whatever the *previously active*
// character on this device left behind instead of falling back to a sane default. This was a
// real cross-character bleed bug: switching from a character with, say, sieges underway to an
// older character with no `sieges` field at all left that same siege data active for the second
// character too.
function applyCharacterData(data){
  const merged = Object.assign(freshCharacterData(data.name || "Unnamed Hero"), data);
  localStorage.setItem("goblinwar_characterName", merged.name);
  localStorage.setItem("goblinwar_currentBurg", merged.burgId);
  localStorage.setItem("goblinwar_gameDay", String(merged.day));
  localStorage.setItem("goblinwar_gameHour", String(merged.hour));
  localStorage.setItem("goblinwar_heading", String(merged.heading));
  localStorage.setItem("goblinwar_health", String(merged.health));
  localStorage.setItem("goblinwar_maxHealth", String(merged.maxHealth));
  localStorage.setItem("goblinwar_stamina", String(merged.stamina));
  localStorage.setItem("goblinwar_maxStamina", String(merged.maxStamina));
  localStorage.setItem("goblinwar_hunger", String(merged.hunger));
  localStorage.setItem("goblinwar_thirst", String(merged.thirst));
  localStorage.setItem("goblinwar_isDead", String(merged.isDead));
  localStorage.setItem("goblinwar_permadeathPlayer", String(merged.permadeathPlayer));
  localStorage.setItem("goblinwar_permadeathCompanions", String(merged.permadeathCompanions));
  localStorage.setItem("goblinwar_permadeathMercenaries", String(merged.permadeathMercenaries));
  localStorage.setItem("goblinwar_age", String(merged.age));
  localStorage.setItem("goblinwar_gold", String(merged.gold));
  localStorage.setItem("goblinwar_inventory", merged.inventory);
  localStorage.setItem("goblinwar_equipped", merged.equipped);
  localStorage.setItem("goblinwar_level", String(merged.level));
  localStorage.setItem("goblinwar_xp", String(merged.xp));
  localStorage.setItem("goblinwar_skillPoints", String(merged.skillPoints));
  localStorage.setItem("goblinwar_stats", merged.stats);
  localStorage.setItem("goblinwar_skills", merged.skills);
  localStorage.setItem("goblinwar_kills", merged.kills);
  localStorage.setItem("goblinwar_quests", merged.quests);
  localStorage.setItem("goblinwar_completedQuests", merged.completedQuests);
  localStorage.setItem("goblinwar_questsCompletedTotal", String(merged.questsCompletedTotal));
  localStorage.setItem("goblinwar_visitedBurgs", merged.visitedBurgs);
  localStorage.setItem("goblinwar_defeatedVariants", merged.defeatedVariants);
  localStorage.setItem("goblinwar_party", merged.party);
  localStorage.setItem("goblinwar_mercenaries", merged.mercenaries);
  localStorage.setItem("goblinwar_territoryControl", merged.territoryControl);
  localStorage.setItem("goblinwar_relations", merged.relations);
  localStorage.setItem("goblinwar_reinforcements", merged.reinforcements);
  localStorage.setItem("goblinwar_lastWarTick", String(merged.lastWarTick));
  localStorage.setItem("goblinwar_population", merged.population);
  localStorage.setItem("goblinwar_sieges", merged.sieges);
  localStorage.setItem("goblinwar_refugeeArrivals", merged.refugeeArrivals);
  localStorage.setItem("goblinwar_siegeDefenseCooldowns", merged.siegeDefenseCooldowns);
}

function targetPage(){
  const params = new URLSearchParams(location.search);
  const redirect = params.get('redirect');
  const page = (redirect && /^[a-zA-Z0-9_-]+\.html$/.test(redirect) && redirect !== 'characters.html') ? redirect : 'index.html';
  return page + '?_=' + Date.now();
}

function playCharacter(row){
  // Defense in depth alongside loadCharacters() simply not rendering a Play button for a
  // deceased character (permadeath, see below) — this is what actually stops a resumed session
  // in this codebase (dead or alive) from continuing, if a Play click ever reaches this function.
  if(row.data && row.data.isDead){ alert(`${row.name} has fallen — this character can't be continued.`); return; }
  localStorage.setItem('goblinwar_activeCharacterId', row.id);
  // Seeds settings.html's stale-save check (goblinwar_localSyncedAt) with the server timestamp
  // this device just loaded, so it has something real to compare against later rather than
  // treating every character as stale the first time this device opens Settings.
  if(row.updated_at) localStorage.setItem('goblinwar_localSyncedAt', row.updated_at);
  applyCharacterData(row.data);
  location.href = targetPage();
}

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut(); // assets/auth-client.js's SIGNED_OUT listener redirects to login.html
});

document.getElementById('show-create-btn').addEventListener('click', ()=>{
  document.getElementById('create-form').classList.add('show');
  document.getElementById('show-create-btn').style.display = 'none';
  document.getElementById('new-name').focus();
});
document.getElementById('cancel-create-btn').addEventListener('click', ()=>{
  document.getElementById('create-form').classList.remove('show');
  document.getElementById('show-create-btn').style.display = 'block';
  document.getElementById('create-error').textContent = '';
  document.getElementById('new-name').value = '';
});

let session = null;

document.getElementById('confirm-create-btn').addEventListener('click', async ()=>{
  const errorEl = document.getElementById('create-error');
  errorEl.textContent = '';
  const name = document.getElementById('new-name').value.trim();
  if(!name){ errorEl.textContent = 'Give your hero a name.'; return; }
  if(!session){ errorEl.textContent = 'Still signing you in — try again in a moment.'; return; }
  const burgId = document.getElementById('start-city').value;
  const difficulty = {
    permadeathPlayer: document.getElementById('diff-player').checked,
    permadeathCompanions: document.getElementById('diff-companions').checked,
    permadeathMercenaries: document.getElementById('diff-mercenaries').checked,
  };
  const { data: row, error } = await sb.from('characters')
    .insert({ user_id: session.user.id, name, data: freshCharacterData(name, burgId, difficulty) })
    .select().single();
  if(error){ errorEl.textContent = error.message; return; }
  playCharacter(row);
});

async function loadCharacters(){
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('char-list');
  const { data: rows, error } = await sb.from('characters')
    .select('id, name, data, updated_at')
    .eq('user_id', session.user.id)
    .order('updated_at', { ascending: false });
  if(error){ statusEl.textContent = `Could not load your characters: ${error.message}`; return; }
  if(!rows.length){ statusEl.textContent = "You haven't created a character yet."; return; }
  statusEl.style.display = 'none';
  listEl.innerHTML = rows.map(row => {
    const d = row.data || {};
    const hp = (d.health!==undefined) ? `${d.health}/${d.maxHealth||100} HP &middot; ` : '';
    // A permadeath character (see the Difficulty options above) gets no Play button at all —
    // "no more continuing this save" per the project owner — just a deceased badge and Delete.
    // playCharacter() also refuses on the data itself as defense in depth, but this is what
    // actually stops a resumed session in the normal case.
    const playBtn = d.isDead ? '' : `<button class="btn btn-primary" data-play="${row.id}">Play</button>`;
    return `
      <div class="char-card" data-id="${row.id}">
        <div class="char-name">${escapeHTML(row.name)}${d.isDead ? '<span class="deceased-badge">Deceased</span>' : ''}</div>
        <div class="char-summary">${hp}${locationName(d.burgId)} &middot; ${dateStr(d.day||0)}</div>
        <div class="char-actions">
          <button class="btn-danger" data-delete="${row.id}">Delete</button>
          ${playBtn}
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-play]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = rows.find(r => r.id === btn.dataset.play);
      if(row) playCharacter(row);
    });
  });
  listEl.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const row = rows.find(r => r.id === btn.dataset.delete);
      if(!row) return;
      if(!confirm(`Delete ${row.name}? This cannot be undone.`)) return;
      const { error } = await sb.from('characters').delete().eq('id', row.id);
      if(error){ alert(`Could not delete: ${error.message}`); return; }
      if(localStorage.getItem('goblinwar_activeCharacterId') === row.id){
        localStorage.removeItem('goblinwar_activeCharacterId');
      }
      loadCharacters();
    });
  });
}

// Starting City choice, per the project owner: Human cities/capitals only — a fresh character
// always begins somewhere in Human territory, never a Dwarf/Ork/Goblin settlement. Sorted
// capitals-first (they're the more recognizable, story-relevant starts), then alphabetically.
function populateStartCitySelect(data){
  const sel = document.getElementById('start-city');
  const humanCities = Object.entries(data.burgs)
    .filter(([id, b]) => b.race === 'human' && (b.tier === 'city' || b.tier === 'capital'))
    .sort((a, b) => {
      const [, ab] = a, [, bb] = b;
      if((ab.tier === 'capital') !== (bb.tier === 'capital')) return ab.tier === 'capital' ? -1 : 1;
      return ab.name.localeCompare(bb.name);
    });
  sel.innerHTML = humanCities.map(([id, b]) =>
    `<option value="${id}">${escapeHTML(b.name)} — ${b.tier === 'capital' ? 'Capital' : 'City'}, ${escapeHTML(b.state)}</option>`
  ).join('');
  if(sel.querySelector('option[value="5"]')) sel.value = "5"; // Bary — the original default start
}

authGateReady.then(s=>{
  if(!s) return; // already being redirected
  session = s;
  fetch('assets/travel-graph.json').then(r=>r.json()).then(data=>{
    Object.entries(data.burgs).forEach(([id,b])=> burgNames[id] = b.name);
    populateStartCitySelect(data);
    loadCharacters();
  }).catch(()=>{
    // still usable without name resolution — fall back to raw ids
    loadCharacters();
  });
});
</script>
</body>
</html>
