// Loot drops — each defeated enemy independently rolls LOOT_CHANCE for whether it drops
// anything at all; if it does, a weighted pick from that race's LOOT_TABLES entry decides
// which single item. Items are referenced by name from MARKET_ITEMS above rather than
// duplicating weight/price here — addItem() reads those straight off that entry.
const LOOT_CHANCE = 0.25; // per enemy, not per fight — a 3-enemy raid gets more rolls, not a bigger one
const LOOT_TABLES = {
  bandit: [ { name:"Healing Potion", weight:5 }, { name:"Books", weight:2 }, { name:"Lucky Charm", weight:1 } ],
  goblin: [ { name:"Healing Potion", weight:5 }, { name:"Leather Cap", weight:2 }, { name:"Leather Boots", weight:2 }, { name:"Sword", weight:1 } ],
  ork:    [ { name:"Healing Potion", weight:4 }, { name:"Leather Armour", weight:2 }, { name:"Shield", weight:2 }, { name:"Sword", weight:2 }, { name:"Lucky Charm", weight:1 } ],
};
// Returns a MARKET_ITEMS entry, or null if this enemy drops nothing.
function rollLoot(race){
  const table = LOOT_TABLES[race];
  if(!table || Math.random() >= LOOT_CHANCE) return null;
  const totalWeight = table.reduce((sum, e) => sum + e.weight, 0);
  let roll = Math.random() * totalWeight;
  for(const entry of table){
    if(roll < entry.weight) return MARKET_ITEMS.find(mi => mi.name === entry.name);
    roll -= entry.weight;
  }
  return null;
}

// A small narrative beat shown as the very first combat-log line, ahead of the mechanical
// "X blocks your path!" message — meant to make a fight feel like a moment in the player's own
// story rather than just a stat check, regardless of what triggered it (ambush, siege defense,
// or anything added later). Deliberately generic/scene-agnostic rather than per-race or
// per-location, so one small pool covers every combat entry point; picked fresh every fight.
const COMBAT_INTRO_LINES = [
  "Your heart pounds as steel rasps free of its sheath.",
  "There's no turning back now — only forward, or not at all.",
  "The world narrows to a single, sharpening point: survive this.",
  "Every old fight taught you something. You're about to find out if it was enough.",
  "Fear is just another weight to carry, and you've carried worse.",
  "The road remembers every traveler who never made it home. Not you — not today.",
  "Whatever comes next, you'll face it standing.",
  "One breath in, one breath out. Then the world turns to violence.",
];
// enemySpecs: array of {name, hp, dmgRange, goldRange, xpRange, art} — 1 entry for a Bandit
// ambush, 2-3 for a Goblin/Ork raiding party (see triggerEnemyFight below).
function startCombat(enemySpecs, playerDmgRange, onEnd, race){
  combat = {
    enemies: enemySpecs.map(s => ({
      name: s.name, hp: s.hp, maxHp: s.hp, dmgRange: s.enemyDmgRange.slice(),
      goldRange: s.goldRange, xpRange: s.xpRange, art: s.art
    })),
    targetIndex: 0,
    allies: buildCombatAllies(), fallenAllies: [],
    playerDmgRange, onEnd, usedMoves: {}, race
  };
  const multi = combat.enemies.length > 1;
  document.getElementById('combat-title').textContent = multi ? 'Ambush!' : `${combat.enemies[0].name} Ambush!`;
  const intro = COMBAT_INTRO_LINES[Math.floor(Math.random()*COMBAT_INTRO_LINES.length)];
  const blocksLine = multi
    ? `${combat.enemies.length} enemies block your path!`
    : `${combat.enemies[0].name} block${combat.enemies[0].name.endsWith('s')?'':'s'} your path!`;
  document.getElementById('combat-log').innerHTML = `<div class="combat-intro-line">${intro}</div><div>${blocksLine}</div>`;
  document.getElementById('combat-specials-panel').classList.remove('show');
  document.getElementById('combat-special-btn').classList.remove('active');
  updateCombatUI();
  document.getElementById('combat-view').classList.add('show');
}

function updateCombatUI(){
  if(!combat) return;
  renderEnemies();
  renderAllies();
  document.getElementById('combat-player-hp-bar').style.width = Math.max(0, Math.round((playerHealth/playerMaxHealth)*100)) + '%';
  document.getElementById('combat-player-hp-text').textContent = `${playerHealth}/${playerMaxHealth}`;
  document.getElementById('combat-player-stamina-bar').style.width = Math.max(0, Math.round((playerStamina/playerMaxStamina)*100)) + '%';
  document.getElementById('combat-player-stamina-text').textContent = `${playerStamina}/${playerMaxStamina}`;
  document.getElementById('combat-attack-btn').disabled = playerStamina < STAMINA_COST_PER_ATTACK;
  renderSpecialsPanel();
}

// One slot per enemy, clickable to retarget. Dead slots are dimmed and inert (both CSS
// pointer-events and a guard in the click handler, since a stale render could still be on
// screen for a moment). Solo fights (Bandit) get no selection ring — see :only-child CSS.
function renderEnemies(){
  const wrap = document.getElementById('combat-enemies');
  if(!combat){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = combat.enemies.map((e, i) => {
    const dead = e.hp <= 0;
    const selected = i === combat.targetIndex && !dead;
    const pct = Math.max(0, Math.round((e.hp / e.maxHp) * 100));
    return `
      <div class="combat-enemy-slot${dead?' dead':''}${selected?' selected':''}" data-idx="${i}">
        <div class="combat-enemy-icon"><img src="${e.art}" alt="${e.name}"></div>
        <div class="combat-name"><span>${e.name}</span><span>${Math.max(0,e.hp)}/${e.maxHp}</span></div>
        <div class="combat-bar-track"><div class="combat-bar-fill enemy" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
  wrap.querySelectorAll('.combat-enemy-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      const i = Number(slot.dataset.idx);
      if(!combat || combat.enemies[i].hp <= 0) return;
      combat.targetIndex = i;
      renderEnemies();
    });
  });
}

// Your hired mercenaries' HP, if any — not clickable, they're never a target, only shown so a
// falling ally reads as a real loss rather than a silent stat change. See "Party in combat" in
// context/combat.md.
function renderAllies(){
  const wrap = document.getElementById('combat-allies');
  // #combat-stage lays its children out with a flex `gap` — an empty-but-present div would
  // still eat a gap slot on every fight with no hired mercenaries (the common case), so this
  // toggles display rather than just clearing innerHTML.
  if(!combat || !combat.allies.length){ wrap.innerHTML = ''; wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = combat.allies.map(a => {
    const dead = a.hp <= 0;
    const pct = Math.max(0, Math.round((a.hp / a.maxHp) * 100));
    return `
      <div class="combat-ally-slot${dead?' dead':''}">
        <div class="combat-ally-icon"><img src="${a.portrait}" alt="${a.title}"></div>
        <div class="combat-name"><span>${a.title}</span><span>${Math.max(0,a.hp)}/${a.maxHp}</span></div>
        <div class="combat-bar-track"><div class="combat-bar-fill ally" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function combatLog(msg){
  const log = document.getElementById('combat-log');
  const div = document.createElement('div');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// A hired mercenary's combat HP is never persisted (see buildCombatAllies) — with the
// permadeathMercenaries difficulty toggle on (the default, matching the original unconditional
// behavior — see the PERMADEATH_* consts and context/roadmap.md's "Difficulty setting —
// permadeath"), dropping to 0 removes them from goblinwar_mercenaries right then, permanently,
// rather than waiting to see how the fight itself ends. combat.fallenAllies just tracks the
// names so endCombat's toast can name who was lost, on any outcome (victory included — winning
// the fight doesn't undo a mercenary who already fell mid-fight). With the toggle off, they're
// merely knocked out of the rest of *this* fight (already excluded from pickDefender/
// runAllyAttacks by the hp<=0 checks those use) and roster back in fully healed next time,
// same as the player's own no-permadeath default.
function mercenaryFalls(ally){
  ally.hp = 0;
  if(!permadeathMercenaries){
    combatLog(`${ally.title} is knocked out of the fight, but will be back on your side next time.`);
    return;
  }
  saveMercenaries(getMercenaries().filter(m => m.instanceId !== ally.instanceId));
  combat.fallenAllies.push(ally.title);
  combatLog(`${ally.title} falls, and won't be getting back up.`);
}

// Picks who defends against one incoming enemy swing this round: the player, or a random still-
// alive mercenary. Hiring a fuller party now has real defensive value — every extra sword in
// your roster is one more chance an enemy swings at them instead of you. See "Party in combat"
// in context/combat.md.
function pickDefender(){
  const aliveAllies = combat.allies.filter(a => a.hp > 0);
  const pool = [{ isPlayer:true }, ...aliveAllies.map(a => ({ isPlayer:false, ally:a }))];
  return pool[Math.floor(Math.random()*pool.length)];
}

// Resolves one enemy's hit against whichever defender pickDefender chose. ignoreDefense
// (Reckless Swing's targeted enemy only) skips Evasion and armor — mercenaries have neither
// stat, so it only changes anything when the player ends up being the one hit.
function applyEnemyHit(enemy, defender, ignoreDefense){
  if(defender.isPlayer){
    if(!ignoreDefense && hasPerk('evasion') && Math.random() < 0.15){
      combatLog(`You dodge the ${enemy.name}'s counter-attack entirely.`);
      return;
    }
    const edmg = ignoreDefense ? randRange(enemy.dmgRange) : Math.max(1, randRange(enemy.dmgRange) - getEquipDefenseBonus());
    setHealth(playerHealth - edmg);
    combatLog(ignoreDefense
      ? `The ${enemy.name} makes you pay for it — ${edmg} damage, ignoring your armor.`
      : `The ${enemy.name} hits you for ${edmg} damage.`);
  } else {
    const ally = defender.ally;
    const edmg = Math.max(1, randRange(enemy.dmgRange));
    ally.hp -= edmg;
    combatLog(`The ${enemy.name} hits your ${ally.title} for ${edmg} damage.`);
    if(ally.hp <= 0) mercenaryFalls(ally);
  }
}

// Every alive enemy counters each round — the real difficulty lever for a multi-enemy fight.
// bypassEnemy (Reckless Swing only): that one enemy's hit ignores armor/Evasion; everyone else
// counters normally. Stops early if the player is already down so the log doesn't keep
// narrating hits on a defeated player.
function runEnemyCounters(bypassEnemy){
  for(const enemy of combat.enemies){
    if(enemy.hp <= 0) continue;
    if(playerHealth <= 0) break;
    applyEnemyHit(enemy, pickDefender(), enemy === bypassEnemy);
  }
}

// Every alive mercenary swings once per round too, right after the player's own action —
// automatic, no extra UI, always at whichever enemy is currently targeted (retargeting mid-loop
// if an earlier ally's hit just finished it off). See "Party in combat" in context/combat.md.
function runAllyAttacks(){
  for(const ally of combat.allies){
    if(ally.hp <= 0) continue;
    if(aliveEnemies().length === 0) return;
    autoAdvanceTarget();
    const target = combat.enemies[combat.targetIndex];
    const dmg = randRange(ally.dmgRange);
    target.hp -= dmg;
    combatLog(`Your ${ally.title} hits the ${target.name} for ${dmg} damage.`);
  }
  autoAdvanceTarget();
}

function aliveEnemies(){ return combat.enemies.filter(e => e.hp > 0); }

// If the current target just died, retarget to the next alive enemy. No-op if it's still alive
// (player can always manually retarget by clicking a different slot).
function autoAdvanceTarget(){
  if(combat.enemies[combat.targetIndex] && combat.enemies[combat.targetIndex].hp > 0) return;
  const next = combat.enemies.findIndex(e => e.hp > 0);
  if(next !== -1) combat.targetIndex = next;
}

function combatAttack(){
  if(!combat) return;
  if(playerStamina < STAMINA_COST_PER_ATTACK){
    combatLog(`You're too exhausted to attack — flee and rest up first.`);
    updateCombatUI();
    return;
  }
  const target = combat.enemies[combat.targetIndex];
  const freeAttack = hasPerk('second_wind') && Math.random() < 0.25;
  if(!freeAttack) setStamina(playerStamina - STAMINA_COST_PER_ATTACK);
  const dmg = randRange(combat.playerDmgRange) + getEquipDamageBonus();
  target.hp -= dmg;
  combatLog(`You hit the ${target.name} for ${dmg} damage.` + (freeAttack ? ` (Second Wind — no stamina spent!)` : ''));
  if(aliveEnemies().length === 0){
    updateCombatUI();
    endCombat('victory');
    return;
  }
  autoAdvanceTarget();
  runAllyAttacks();
  if(aliveEnemies().length === 0){
    updateCombatUI();
    endCombat('victory');
    return;
  }
  runEnemyCounters(null);
  updateCombatUI();
  if(playerHealth <= 0){ endCombat('defeat'); }
}

// Active special attacks — unlocked with a skill point (skills.html) same as PERKS, gated
// on a stat threshold, but usable in combat rather than always-on. Each costs more stamina
// than a basic Attack and is usable once per fight (combat.usedMoves), reset when a new fight
// starts (see startCombat). Duplicated in skills.html (unlock UI only) per the no-modules
// convention — the effects below are the only place they actually do anything.
//
// Cleave and War Cry act on every alive enemy in combat.enemies — real multi-enemy fights
// (2-3 Goblin/Ork raiders) exist now, see triggerEnemyFight/pickAmbushEnemy and context/combat.md.
const MOVES = [
  { id:"crushing_blow",   name:"Crushing Blow",   stat:"str", req:2, cost:35, desc:"2x damage to your target." },
  { id:"reckless_swing",  name:"Reckless Swing",  stat:"str", req:4, cost:30, desc:"2.5x damage to your target, but its counter-hit this turn ignores your armor and Evasion." },
  { id:"precise_shot",    name:"Precise Shot",    stat:"agi", req:2, cost:25, desc:"Always deals your maximum damage roll to your target instead of a random one." },
  { id:"adrenaline_rush", name:"Adrenaline Rush", stat:"agi", req:4, cost:15, desc:"A free extra attack on your target this turn, at no extra stamina cost." },
  { id:"war_cry",         name:"War Cry",         stat:"int", req:2, cost:20, desc:"Cuts every enemy's damage by 30% for the rest of the fight. Deals no damage itself." },
  { id:"cleave",          name:"Cleave",          stat:"str", req:6, cost:40, desc:"Hits every enemy in the fight for 60% damage." },
];
function canUseMove(move){
  return !!combat && hasPerk(move.id) && !combat.usedMoves[move.id] && playerStamina >= move.cost;
}
function combatSpecial(moveId){
  if(!combat) return;
  const move = MOVES.find(m => m.id === moveId);
  if(!move || !canUseMove(move)) return;
  combat.usedMoves[moveId] = true;
  setStamina(playerStamina - move.cost);

  const target = combat.enemies[combat.targetIndex];
  let dmg = 0;
  switch(moveId){
    case 'crushing_blow':
      dmg = randRange(combat.playerDmgRange)*2 + getEquipDamageBonus();
      target.hp -= dmg;
      combatLog(`Crushing Blow! You hit the ${target.name} for ${dmg} damage.`);
      break;
    case 'reckless_swing':
      dmg = Math.round(randRange(combat.playerDmgRange)*2.5) + getEquipDamageBonus();
      target.hp -= dmg;
      combatLog(`Reckless Swing! You hit the ${target.name} for ${dmg} damage, leaving yourself wide open.`);
      break;
    case 'precise_shot':
      dmg = combat.playerDmgRange[1] + getEquipDamageBonus();
      target.hp -= dmg;
      combatLog(`Precise Shot! You hit the ${target.name} for ${dmg} damage.`);
      break;
    case 'adrenaline_rush':
      dmg = randRange(combat.playerDmgRange) + getEquipDamageBonus();
      target.hp -= dmg;
      combatLog(`Adrenaline Rush! A free extra strike hits the ${target.name} for ${dmg} damage.`);
      break;
    case 'war_cry':
      aliveEnemies().forEach(e => {
        e.dmgRange = [Math.max(1,Math.round(e.dmgRange[0]*0.7)), Math.max(1,Math.round(e.dmgRange[1]*0.7))];
      });
      combatLog(`War Cry! Every enemy's attacks are weaker for the rest of the fight.`);
      break;
    case 'cleave':
      aliveEnemies().forEach(e => {
        const hit = Math.round(randRange(combat.playerDmgRange)*0.6) + getEquipDamageBonus();
        e.hp -= hit;
        combatLog(`Cleave! You strike the ${e.name} for ${hit} damage.`);
      });
      break;
  }

  if(aliveEnemies().length === 0){
    updateCombatUI();
    endCombat('victory');
    return;
  }

  autoAdvanceTarget();
  runAllyAttacks();
  if(aliveEnemies().length === 0){
    updateCombatUI();
    endCombat('victory');
    return;
  }
  runEnemyCounters(moveId === 'reckless_swing' ? target : null);

  document.getElementById('combat-specials-panel').classList.remove('show');
  document.getElementById('combat-special-btn').classList.remove('active');
  updateCombatUI();
  if(playerHealth <= 0){ endCombat('defeat'); }
}
function renderSpecialsPanel(){
  const panel = document.getElementById('combat-specials-panel');
  if(!combat){ panel.innerHTML = ''; return; }
  const usable = MOVES.filter(m => hasPerk(m.id));
  if(usable.length === 0){
    panel.innerHTML = `<div class="special-empty-note">No special attacks unlocked yet — spend skill points on the Character sheet.</div>`;
    return;
  }
  panel.innerHTML = usable.map(m => {
    const used = combat.usedMoves[m.id];
    const disabled = used || playerStamina < m.cost;
    const status = used ? ' (used this fight)' : '';
    return `
      <button class="special-move-btn" data-move="${m.id}" ${disabled ? 'disabled' : ''}>
        <div>
          <div class="special-move-name">${m.name}${status}</div>
          <div class="special-move-desc">${m.desc}</div>
        </div>
        <span class="special-move-cost">${m.cost} STA</span>
      </button>
    `;
  }).join('');
  panel.querySelectorAll('.special-move-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> combatSpecial(btn.dataset.move));
  });
}

function combatFlee(){
  if(!combat) return;
  combatLog(`You break off and flee.`);
  endCombat('flee');
}

function endCombat(result){
  const enemies = combat ? combat.enemies : [];
  const onEnd = combat ? combat.onEnd : null;
  const enemyRace = combat ? combat.race : null;
  const attackerKingdom = combat ? combat.attackerKingdom : null;
  const fallenAllies = combat ? combat.fallenAllies : [];
  // Nulled synchronously (not inside the setTimeout below) so a click during the
  // victory/defeat delay hits combatAttack/combatFlee's `if(!combat) return;` guard
  // instead of re-entering — without this, mashing Attack right as the killing blow
  // lands could re-trigger endCombat('victory') again before every enemy's hp<=0 stopped
  // aliveEnemies().length===0 from re-passing, stacking duplicate gold rewards and onEnd calls.
  combat = null;
  // Fighting works up a real appetite and thirst regardless of how it ends — victory, defeat,
  // or fleeing are all real exertion, per the project owner.
  addHunger(COMBAT_HUNGER_GAIN);
  addThirst(COMBAT_THIRST_GAIN);
  let permadeathTriggered = false; // set below — skips the normal onEnd() call at the bottom, since a redirect to characters.html is already underway by then
  setTimeout(()=>{
    document.getElementById('combat-view').classList.remove('show');
    // Named regardless of outcome — a mercenary who fell mid-fight stays fallen even if the
    // fight itself was ultimately won. See mercenaryFalls.
    const fallenNote = fallenAllies.length
      ? ` ${fallenAllies.join(', ')} fell in the fight and won't be coming back.`
      : '';
    if(result === 'victory'){
      let goldTotal = 0, xpTotal = 0;
      const lootFound = [], lootLeftBehind = [];
      enemies.forEach(e => {
        goldTotal += randRange(e.goldRange);
        xpTotal += randRange(e.xpRange);
        const drop = rollLoot(enemyRace);
        if(drop){
          if(addItem(drop.name, 1, drop.weight, drop.price)) lootFound.push(drop.name);
          else lootLeftBehind.push(drop.name);
        }
      });
      if(hasPerk('scavenger')) goldTotal = Math.round(goldTotal * 1.2);
      setGold(playerGold + goldTotal);
      let anyLevelUp = addXp(xpTotal);
      applyEnemyCasualtyLoss(enemyRace, attackerKingdom, currentBurg, enemies.length);
      addKills(enemyRace, enemies.length);
      enemies.forEach(e => recordDefeatedVariant(e.name));

      // "2x Goblin Raider, 1x Goblin Archer" — group defeated enemies by name for the toast.
      const counts = {};
      enemies.forEach(e => { counts[e.name] = (counts[e.name]||0) + 1; });
      const names = Object.keys(counts).map(n => counts[n] > 1 ? `${counts[n]}x ${n}` : n).join(', ');
      let msg = `Victory! You defeated ${names}, found ${goldTotal} gold, and gained ${xpTotal} XP.`;
      if(lootFound.length) msg += ` Looted: ${lootFound.join(', ')}.`;
      if(lootLeftBehind.length) msg += ` (Too heavy to carry, left behind: ${lootLeftBehind.join(', ')}.)`;

      // Notable Figure kill-quests complete on the next matching victory anywhere — Kill
      // Bandits wants a Bandit, Drive Off the Raiders wants a Goblin or Ork (see
      // context/quests.md). Only one can ever be active (checked by source, not type, in
      // showNotableFigurePanel), so there's at most one to resolve here regardless of race.
      if(enemyRace){
        const questMatchesRace = q =>
          (q.type==='kill_bandits' && enemyRace==='bandit') ||
          (q.type==='kill_raiders' && (enemyRace==='goblin' || enemyRace==='ork'));
        const quests = getQuests();
        const remaining = [];
        let questReward = null;
        quests.forEach(q => {
          if(!questReward && q.status==='active' && questMatchesRace(q)) questReward = q;
          else remaining.push(q);
        });
        if(questReward){
          setGold(playerGold + questReward.reward.gold);
          if(addXp(questReward.reward.xp)) anyLevelUp = true;
          saveQuests(remaining);
          recordCompletedQuest(questReward);
          refreshQuestBadge();
          msg += ` ${questReward.giverName}'s task is complete — +${questReward.reward.gold}g, +${questReward.reward.xp} XP.`;
        }
      }

      if(anyLevelUp) msg += ` Level up! You are now level ${playerLevel}.`;
      showToast(msg + fallenNote);
    } else if(result === 'defeat'){
      if(permadeathPlayer){
        // Per the project owner's difficulty setting (see the PERMADEATH_* consts and
        // context/roadmap.md's "Difficulty setting — permadeath"): with this toggle on, a
        // defeat is final — no HP-10 safety net, no continuing this save. Explicitly awaited
        // (unlike goTo()'s routine, keepalive-backed navigation saves) since this is a rare,
        // high-stakes write — losing it would let a "dead" character wrongly reappear as alive
        // next time characters.html loads. onEnd() is deliberately skipped below; whatever it
        // would have done (usually reopening the location view) is moot once this redirects.
        permadeathTriggered = true;
        setHealth(0);
        playerIsDead = true;
        localStorage.setItem(ISDEAD_KEY, 'true');
        showToast(`${localStorage.getItem(NAME_KEY) || 'Your hero'} has fallen. This journey ends here.` + fallenNote);
        saveActiveCharacter().finally(()=>{
          setTimeout(()=>{ location.href = 'characters.html?_=' + Date.now(); }, 1800);
        });
      } else {
        setHealth(10);
        showToast(`You were beaten badly but managed to escape with your life.` + fallenNote);
      }
    } else {
      addHunger(FLEE_HUNGER_PENALTY);
      addThirst(FLEE_THIRST_PENALTY);
      showToast(`You flee from the fight, breathless and worse for wear.` + fallenNote);
    }
    if(onEnd && !permadeathTriggered) onEnd(result);
  }, result === 'victory' || result === 'defeat' ? 700 : 0);
}

document.getElementById('combat-attack-btn').addEventListener('click', combatAttack);
document.getElementById('combat-flee-btn').addEventListener('click', combatFlee);
document.getElementById('combat-special-btn').addEventListener('click', ()=>{
  document.getElementById('combat-specials-panel').classList.toggle('show');
  document.getElementById('combat-special-btn').classList.toggle('active');
});

const PLAYER_DMG_RANGE = [8,15]; // the player's own weapon damage — fixed regardless of who they're fighting
// Picks 1-3 random variants from ENEMY_VARIANTS[race] and starts that fight — see the comment
// on ENEMY_VARIANTS above for how each variant's own difficulty/art is expressed. Bandit
// ambushes stay solo (the documented "easiest fight in the game"); Goblin/Ork raiding-party
// ambushes spawn 2-3 enemies, each an independently-rolled variant (repeats allowed), matching
// triggerAmbushFight's plural "raiders" flavor text below.
function triggerEnemyFight(race, onEnd){
  const variants = ENEMY_VARIANTS[race] || ENEMY_VARIANTS.bandit;
  const count = race === 'bandit' ? 1 : (2 + Math.floor(Math.random()*2)); // 2 or 3
  const specs = [];
  for(let i=0;i<count;i++) specs.push(variants[Math.floor(Math.random()*variants.length)]);
  startCombat(specs, PLAYER_DMG_RANGE, onEnd || (()=>{}), race);
}
const RAID_AMBUSH_CHANCE = 0.5; // of an ambush at a Good-alliance settlement whose kingdom is at war, this fraction are a themed raiding party instead of a plain Bandit
// Decides what an ambush actually is: a Goblin/Ork raiding party if the relevant settlement
// belongs to a Good-alliance kingdom currently at war (orks/goblins pressing into human/dwarf
// land — the game's own "Goblin War" premise), a plain Bandit otherwise. Bad-alliance
// territory never spawns a themed raid — the game doesn't cast Human/Dwarf as ambush enemies.
function pickAmbushEnemy(burgId){
  const b = graph.burgs[burgId];
  if(b && b.race && ALLIANCE[b.race] === 'Good' && isAtWarAt(burgId) && Math.random() < RAID_AMBUSH_CHANCE){
    return Math.random() < 0.5 ? 'ork' : 'goblin';
  }
  return 'bandit';
}
function triggerAmbushFight(burgId, onEnd, context){
  const enemy = pickAmbushEnemy(burgId);
  const scene = context === 'camp' ? 'creep into your camp in the night' : 'ambush you on the road';
  const label = enemy === 'bandit' ? 'Bandits' : (enemy === 'ork' ? 'Ork raiders' : 'Goblin raiders');
  showToast(`${label} ${scene}!`);
  triggerEnemyFight(enemy, onEnd);
}

// ===================== TRAVEL GRAPH =====================
// Graph nodes are map CELLS (not just burgs) — every point along every real
// road/trail/sea route is a node, so junctions are handled naturally instead
// of only counting direct burg-to-burg route matches.
const LOC_KEY = "goblinwar_currentBurg";
const ROAD_PACE = 20;    // miles per day, travelling via drawn roads
const OFFROAD_PACE = 12; // miles per day, cross-country with no road
// A carried Horse (MARKET_ITEMS) speeds up overland road travel — checked in computeTravel only
// (not routeBetween, which quest-distance pricing also calls and shouldn't react to what the
// player happens to own). Doesn't apply to a route with any sea leg (bySea) — a horse doesn't
// swim — nor to the no-route straight-line fallback, so it's strictly a road-pace bonus.
const HORSE_PACE_MULT = 1.5;
// A route with any sea edge in it charges a ferry fare, proportional to how many (scaled) miles
// of that route are actually sea rather than road — unlike Hunger/Thirst, this is a real
// affordability gate (see beginTravel): every sea gap wide enough to need a boat costs gold to
// cross, not just time. Deliberately excluded from Hunger/Thirst's "never blocks travel" design —
// gold isn't a survival meter the way those are, so gating it doesn't risk soft-locking anyone.
const FERRY_GOLD_PER_MILE = 2;
const FERRY_MIN_FARE = 5; // even the shortest sea hop costs a token fare once any sea leg is involved
// The world data's raw mileage is realistic-scale (real road distances), which makes
// crossing the map take dozens of in-game days. DISTANCE_SCALE compresses every trip
// down to a friendlier, more game-like length without changing the map or pace numbers.
const DISTANCE_SCALE = 5;

let graph = null;      // { burgs, states, burgByCell, edges:[{a,b,mi,kind,pts}] }
let adjacency = {};     // cellId -> [{to, mi, edge, forward}]
let currentBurg = localStorage.getItem(LOC_KEY) || "5"; // Bary
let selectedBurg = null;
let playerMarkerEl = null;
let reachableSet = new Set(); // cell ids reachable from currentBurg's cell
const labelElByBurg = {}; // (unused holdover — no longer needed with tap-zones)

function buildAdjacency(){
  graph.edges.forEach(e=>{
    (adjacency[e.a] = adjacency[e.a]||[]).push({to:e.b, mi:e.mi, edge:e, forward:true});
    (adjacency[e.b] = adjacency[e.b]||[]).push({to:e.a, mi:e.mi, edge:e, forward:false});
  });
}

// Minimal binary min-heap — the cell graph has thousands of nodes, so a
// plain array-sort priority queue (fine for ~800 burgs) is too slow here.
class MinHeap{
  constructor(){ this.a = []; }
  push(item){
    const a = this.a; a.push(item);
    let i = a.length-1;
    while(i>0){
      const p = (i-1)>>1;
      if(a[p][0] <= a[i][0]) break;
      [a[p],a[i]] = [a[i],a[p]]; i = p;
    }
  }
  pop(){
    const a = this.a;
    const top = a[0];
    const last = a.pop();
    if(a.length){
      a[0] = last;
      let i = 0;
      while(true){
        const l = 2*i+1, r = 2*i+2; let smallest = i;
        if(l<a.length && a[l][0]<a[smallest][0]) smallest = l;
        if(r<a.length && a[r][0]<a[smallest][0]) smallest = r;
        if(smallest===i) break;
        [a[smallest],a[i]] = [a[i],a[smallest]]; i = smallest;
      }
    }
    return top;
  }
  get size(){ return this.a.length; }
}

// Dijkstra shortest road path between two CELL ids.
// Returns { miles, edges:[{edge,forward},...] } or null if unreachable.
function cellRoute(fromCell, toCell){
  if(fromCell === toCell) return { miles:0, edges:[] };
  const dist = {}; dist[fromCell] = 0;
  const prev = {};
  const visited = new Set();
  const pq = new MinHeap();
  pq.push([0, fromCell]);
  while(pq.size){
    const [d, node] = pq.pop();
    if(visited.has(node)) continue;
    visited.add(node);
    if(node === toCell){
      const edgeList=[]; let cur=toCell;
      while(prev[cur]){ edgeList.unshift(prev[cur].step); cur = prev[cur].from; }
      return { miles: d, edges: edgeList };
    }
    (adjacency[node]||[]).forEach(step=>{
      if(visited.has(step.to)) return;
      const nd = d + step.mi;
      if(dist[step.to] === undefined || nd < dist[step.to]){
        dist[step.to] = nd;
        prev[step.to] = { from: node, step };
        pq.push([nd, step.to]);
      }
    });
  }
  return null;
}

// Full reachability (ignores distance) — used only for the dead-end
// recovery check at load time, not for gating travel.
function computeReachable(fromCell){
  const seen = new Set([fromCell]);
  const stack = [fromCell];
  while(stack.length){
    const node = stack.pop();
    (adjacency[node]||[]).forEach(step=>{
      if(!seen.has(step.to)){ seen.add(step.to); stack.push(step.to); }
    });
  }
  return seen;
}

// When the player stops or camps mid-journey, they're not standing at a named
// settlement anymore — campPos holds that in-between position (snapped to the
// nearest real road-graph point) so travel math still has a valid place to
// route from, without needing every part of the game to support arbitrary
// off-settlement positions.
let campPos = null; // {x, y, cell, name} or null when at a real settlement
function getCurrentCell(){ return campPos ? campPos.cell : graph.burgs[currentBurg].cell; }
function getCurrentXY(){ return campPos ? {x:campPos.x, y:campPos.y} : {x:graph.burgs[currentBurg].x, y:graph.burgs[currentBurg].y}; }
function getCurrentDisplayName(){ return campPos ? `the road near ${campPos.name}` : graph.burgs[currentBurg].name; }

const HOURS_PER_DAY = 24;
const AMBUSH_CHANCE_PER_DAY = 0.12; // chance per day of travel that bandits ambush the road
const NIGHT_AMBUSH_CHANCE = 0.15;   // chance bandits strike an exposed camp overnight
// A carried Bedroll is never consumed — real shelter isn't used up by sleeping in it once — it's
// a passive possession with two effects: camping itself is safer (stacks with hasPerk('sure_feet')
// below), and resting with one leaves the player a little *more* than fully rested — see
// BEDROLL_STAMINA_BONUS and restFully() below.
const BEDROLL_AMBUSH_MULT = 0.85;    // 15% safer camping while a Bedroll is carried
const BEDROLL_STAMINA_BONUS = 15;    // resting with a Bedroll fills Stamina to max+this, not just max
function rollAmbush(hours){
  const days = hours/HOURS_PER_DAY;
  const chancePerDay = AMBUSH_CHANCE_PER_DAY * (hasPerk('sure_feet') ? 0.9 : 1);
  return Math.random() < 1 - Math.pow(1-chancePerDay, days);
}
// ===================== HUNGER & THIRST =====================
// Replaces the old "Food is silently spent per trip" model. Travel, waiting, and combat all
// drain these two 0-100 meters (100 = full/hydrated, 0 = starving/parched — same "starts full,
// depletes with use" convention as Health/Stamina). Per the project owner, Food and Waterskin are
// a passive travel-range reserve, not something manually eaten — there's no Eat/Drink button
// anywhere anymore (inventory.html dropped them). Instead, every positive (draining) call to
// addHunger/addThirst below is paid for out of carried Food/Waterskin automatically, one unit at
// a time, before it ever touches the meter — see autoEatForHunger/autoDrinkForThirst. As long as
// you're carrying enough, the meter just stays full; it only starts actually dropping once supply
// runs out, which is what tells the player it's time to buy more. Letting either one bottom out
// doesn't just sit there looking bad: any amount that would push a meter below 0 becomes real
// Health damage instead (see addHunger/addThirst below), floored so starvation alone can never be
// fatal on its own — combat is still the only way to actually reach 0 HP. Per the project owner:
// Food and Waterskin no longer restore Stamina at all: their only job now is fighting off
// Hunger/Thirst depletion. HUNGER_KEY/THIRST_KEY and playerHunger/playerThirst themselves live up
// near playerHealth/playerStamina (initPlayerStateIfMissing needs them before this point in the
// file executes) — just the rest of the mechanic lives here.
const HUNGER_PER_DAY = 20;   // hunger lost per full day of travel/waiting
const THIRST_PER_DAY = 25;   // thirst lost per full day — drains faster than hunger
const COMBAT_HUNGER_GAIN = 8;    // flat drain per fight, any outcome — exertion either way
const COMBAT_THIRST_GAIN = 10;
// Fleeing always succeeds — combatFlee never rolls to fail — but per the project owner it
// shouldn't be a strictly free escape hatch either, so it costs extra Hunger/Thirst on top of
// the flat COMBAT_HUNGER_GAIN/COMBAT_THIRST_GAIN every outcome already pays (running hard away
// from a fight is its own exertion). Deliberately not a Stamina cost: Stamina can already sit at
// 0 going into a flee, and Hunger/Thirst overflow only ever converts to Health damage, floored at
// STARVATION_HEALTH_FLOOR — so a player who fled with nothing left can never be soft-locked by it.
const FLEE_HUNGER_PENALTY = 6;
const FLEE_THIRST_PENALTY = 8;
const HUNGER_OVERFLOW_HEALTH_MULT = 0.5; // Health lost per point of hunger that would drop below 0
const THIRST_OVERFLOW_HEALTH_MULT = 0.8; // thirst overflow hurts more — dehydration is more urgent
const STARVATION_HEALTH_FLOOR = 1;       // hunger/thirst overflow alone can never drop you below this
const FOOD_HUNGER_RESTORE = 35;      // hunger one unit of Food automatically covers
const WATERSKIN_THIRST_RESTORE = 35; // thirst one unit of Waterskin automatically covers
// hasPerk('field_rations') used to cut travel's Food cost 10% (see roadmap.md's Skills &
// Progression section) — now that travel drains Hunger/Thirst instead of spending Food
// directly, its discount carries over to these instead, its natural equivalent.
function hoursToHungerGain(hours){
  const mult = hasPerk('field_rations') ? 0.9 : 1;
  return Math.max(2, Math.round((hours/HOURS_PER_DAY)*HUNGER_PER_DAY*mult));
}
function hoursToThirstGain(hours){
  const mult = hasPerk('field_rations') ? 0.9 : 1;
  return Math.max(2, Math.round((hours/HOURS_PER_DAY)*THIRST_PER_DAY*mult));
}

// A positive (draining) hunger/thirst amount is paid for out of carried Food/Waterskin first,
// one unit at a time, before it's allowed to touch the meter at all — per the project owner,
// eating/drinking is automatic now, not a player action (see the HUNGER & THIRST header comment
// above). Only whatever Food/Waterskin can't fully cover — a partial last unit, or none carried
// — actually reaches addHunger/addThirst's own clamp/overflow logic below. Returns the leftover.
function autoEatForHunger(amount){
  while(amount > 0 && getFoodQty() > 0){
    consumeItem(FOOD_NAME, 1);
    amount -= FOOD_HUNGER_RESTORE;
  }
  return Math.max(0, amount);
}
function autoDrinkForThirst(amount){
  while(amount > 0 && getItem("Waterskin")){
    consumeItem("Waterskin", 1);
    amount -= WATERSKIN_THIRST_RESTORE;
  }
  return Math.max(0, amount);
}

// Shared by both meters: clamps to [0,100], persists, and — only when amount is positive and
// pushes the raw total below 0 — converts the shortfall into Health damage rather than just
// clipping it away. A negative amount (only the Tavern's Meal & Drink calls one now, see
// buildTavernMealHTML) skips the auto-eat/drink step above entirely and never triggers this
// overflow, since raw is always >= 0 whenever the meter isn't already empty.
function addHunger(amount){
  if(amount > 0) amount = autoEatForHunger(amount);
  const raw = playerHunger - amount;
  playerHunger = Math.max(0, Math.min(100, raw));
  localStorage.setItem(HUNGER_KEY, String(playerHunger));
  const underflow = -raw;
  if(underflow > 0) setHealth(Math.max(STARVATION_HEALTH_FLOOR, playerHealth - Math.round(underflow * HUNGER_OVERFLOW_HEALTH_MULT)));
  refreshPlayerStatUI();
}
function addThirst(amount){
  if(amount > 0) amount = autoDrinkForThirst(amount);
  const raw = playerThirst - amount;
  playerThirst = Math.max(0, Math.min(100, raw));
  localStorage.setItem(THIRST_KEY, String(playerThirst));
  const underflow = -raw;
  if(underflow > 0) setHealth(Math.max(STARVATION_HEALTH_FLOOR, playerHealth - Math.round(underflow * THIRST_OVERFLOW_HEALTH_MULT)));
  refreshPlayerStatUI();
}

// "Wait here" — lets the player pass time at their current location, via Play/Pause/3x
// controls (bottom-left, alongside Find Me/Make Camp), without needing to travel anywhere.
// Deliberately a *safe* fast-forward, per the project owner: unlike travel or camping, it never
// rolls an ambush and never runs the weekly faction AI tick — every tick calls advanceTime with
// `quiet:true`, which skips exactly those two side effects (see advanceTime above) while still
// moving the real clock live, same as travel's own progress display. It does still drain Hunger/
// Thirst at the exact same effective rate travel does, just accrued incrementally in real time
// instead of as one lump sum, and only ever applied for the *new* hours crossed since the last
// tick so it can't double-apply. No affordability gate — unlike the old Food system, there's
// nothing stopping the player from waiting indefinitely; ignoring the meters just costs Health
// via addHunger/addThirst.
const WAIT_HOURS_PER_TICK = 2; // in-game hours advanced per real-time tick, at 1x
const WAIT_TICK_MS = 1000;
let waitState = null; // {speed, totalHours, hungerApplied, thirstApplied, intervalId}

function updateWaitUI(){
  const playBtn = document.getElementById('wait-play-btn');
  const pauseBtn = document.getElementById('wait-pause-btn');
  const speedBtn = document.getElementById('wait-speed-btn');
  const status = document.getElementById('wait-status');
  const active = !!waitState;
  if(playBtn) playBtn.classList.toggle('active', active);
  if(pauseBtn) pauseBtn.disabled = !active;
  if(speedBtn) speedBtn.classList.toggle('active', active && waitState.speed === 3);
  if(status) status.textContent = active ? `Waiting… H${playerHunger} T${playerThirst}` : 'Wait here';
}

function waitTick(){
  if(!waitState) return;
  const delta = WAIT_HOURS_PER_TICK * (waitState.speed === 3 ? 3 : 1);
  waitState.totalHours += delta;
  const hungerSoFar = hoursToHungerGain(waitState.totalHours);
  const thirstSoFar = hoursToThirstGain(waitState.totalHours);
  const newHunger = hungerSoFar - waitState.hungerApplied;
  const newThirst = thirstSoFar - waitState.thirstApplied;
  if(newHunger > 0){ addHunger(newHunger); waitState.hungerApplied = hungerSoFar; }
  if(newThirst > 0){ addThirst(newThirst); waitState.thirstApplied = thirstSoFar; }
  advanceTime(delta, true);
  updateWaitUI();
}

function startWaiting(){
  if(waitState || activeTravel) return;
  waitState = { speed: 1, totalHours: 0, hungerApplied: 0, thirstApplied: 0, intervalId: null };
  waitState.intervalId = setInterval(waitTick, WAIT_TICK_MS);
  updateWaitUI();
}
// Exposed as the Pause button, but also the generic "something else needs the calendar/screen
// now" escape hatch — called whenever the player leaves the open map (showLocationView,
// showCampView, beginTravel) so waiting can never keep silently ticking behind another screen.
function stopWaiting(){
  if(!waitState) return;
  clearInterval(waitState.intervalId);
  waitState = null;
  updateWaitUI();
}
function toggleWaitSpeed(){
  if(!waitState) return;
  waitState.speed = waitState.speed === 3 ? 1 : 3;
  updateWaitUI();
}
document.getElementById('wait-play-btn').addEventListener('click', startWaiting);
document.getElementById('wait-pause-btn').addEventListener('click', stopWaiting);
document.getElementById('wait-speed-btn').addEventListener('click', toggleWaitSpeed);

// Shared by computeTravel (below, from the player's live position) and computeDistanceBetween
// (used by quest generation to price/gate a delivery target from its giver settlement, not the
// player's current position — see the QUESTS section) so the actual routing math only lives
// once. fromXY only matters for the no-route straight-line fallback.
function routeBetween(fromCell, fromXY, toBurg){
  const route = cellRoute(fromCell, toBurg.cell);
  if(route){
    const miles = Math.round(route.miles / DISTANCE_SCALE);
    const hours = Math.max(1, Math.ceil(miles/ROAD_PACE));
    const bySea = route.edges.some(s=>s.edge.kind==='sea');
    const seaMiles = bySea ? Math.round(route.edges.filter(s=>s.edge.kind==='sea').reduce((sum,s)=>sum+s.mi,0) / DISTANCE_SCALE) : 0;
    return { miles, hours, edges: route.edges, viaRoad:true, bySea, seaMiles };
  }
  // No route connects them at all (very rare now) — still travelable, just slower.
  const straight = (Math.hypot(fromXY.x-toBurg.x, fromXY.y-toBurg.y) * 3) / DISTANCE_SCALE;
  const miles = Math.round(straight);
  const hours = Math.max(1, Math.ceil(miles/OFFROAD_PACE));
  return { miles, hours, edges:null, viaRoad:false, bySea:false, seaMiles:0 };
}
function computeTravel(toId){
  const toBurg = graph.burgs[toId];
  if(!toBurg) return null;
  const r = routeBetween(getCurrentCell(), getCurrentXY(), toBurg);
  const mounted = r.viaRoad && !r.bySea && !!getItem('Horse');
  const hours = mounted ? Math.max(1, Math.ceil(r.hours / HORSE_PACE_MULT)) : r.hours;
  const ferryCost = r.seaMiles > 0 ? Math.max(FERRY_MIN_FARE, Math.round(r.seaMiles * FERRY_GOLD_PER_MILE)) : 0;
  return { ...r, hours, mounted, ferryCost, hungerGain: hoursToHungerGain(hours), thirstGain: hoursToThirstGain(hours) };
}
// Giver-to-target distance for a quest offer, independent of where the player actually is right
// now (they're standing at the giver when a Quest Board panel is open, but this is more robust
// than assuming that, and reads clearer at the call site) — see generateBoardOffers below.
function computeDistanceBetween(burgIdA, burgIdB){
  const a = graph.burgs[burgIdA], b = graph.burgs[burgIdB];
  if(!a || !b) return null;
  return routeBetween(a.cell, {x:a.x, y:a.y}, b);
}
function formatDuration(hours){
  if(hours < HOURS_PER_DAY) return `${hours} hour${hours===1?'':'s'}`;
  const d = Math.floor(hours/HOURS_PER_DAY), h = hours%HOURS_PER_DAY;
  return `${d} day${d===1?'':'s'}${h ? ` ${h} hour${h===1?'':'s'}` : ''}`;
}

function refreshReachability(){
  reachableSet = computeReachable(getCurrentCell());
}

// ===================== PLAYER MARKER =====================
const HEADING_KEY = "goblinwar_heading";
let heading = parseFloat(localStorage.getItem(HEADING_KEY) || "0"); // degrees, 0 = facing north
let markerIconEl = null; // the inner rotatable group

function setHeading(deg){
  heading = deg;
  localStorage.setItem(HEADING_KEY, String(heading));
  if(markerIconEl) markerIconEl.setAttribute("transform", `rotate(${heading})`);
}

function headingFromDelta(dx, dy){
  return Math.atan2(dx, -dy) * 180 / Math.PI; // 0=north, 90=east, 180=south, -90=west
}

function positionPlayerMarker(x, y){
  if(playerMarkerEl){
    playerMarkerEl.setAttribute("transform", `translate(${x},${y})`);
    return;
  }
  const ns = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(ns, "g");
  g.setAttribute("transform", `translate(${x},${y})`);
  g.style.pointerEvents = "none";
  g.innerHTML = `
    <circle r="5.5" fill="none" stroke="#d1a445" stroke-width="1.4">
      <animate attributeName="r" values="5.5;8.5;5.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.25;.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g id="marker-icon" transform="rotate(${heading})">
      <path d="M0,-7 L5,6 L0,2.5 L-5,6 Z" fill="#7b2e2e" stroke="#f1e6c4" stroke-width="0.9"/>
    </g>
  `;
  svgEl.appendChild(g);
  playerMarkerEl = g;
  markerIconEl = g.querySelector('#marker-icon');
}
function drawPlayerMarker(){
  if(!svgEl) return;
  const b = graph.burgs[currentBurg];
  if(!b) return;
  positionPlayerMarker(b.x, b.y);
}

// Build a flat list of {x,y} points tracing the actual road route (concatenating each
// edge's real polyline, in the right direction), for path-following travel animation.
let routePreviewEl = null;
function drawRoutePreview(fromPos, toId, edgeSteps){
  if(!routePreviewEl) return;
  const { points } = buildRoutePolyline(fromPos, toId, edgeSteps);
  const d = points.map((p,i)=> (i===0?'M':'L') + p.x + ',' + p.y).join(' ');
  routePreviewEl.setAttribute('d', d);
  routePreviewEl.style.opacity = '.9';
}
function clearRoutePreview(){
  if(routePreviewEl) routePreviewEl.style.opacity = '0';
}

function buildRoutePolyline(fromPos, toId, edgeSteps){
  if(!edgeSteps){
    // off-road (no drawn path) — animate a straight line to the destination
    const endBurg = graph.burgs[toId];
    return { points:[{x:fromPos.x, y:fromPos.y}, {x:endBurg.x, y:endBurg.y}], cellIds:[fromPos.cell, endBurg.cell] };
  }
  const points = [{x:fromPos.x, y:fromPos.y}];
  const cellIds = [fromPos.cell];
  edgeSteps.forEach(step=>{
    const pts = step.forward ? step.edge.pts : [...step.edge.pts].reverse();
    pts.slice(1).forEach(([x,y])=> points.push({x,y}));
    cellIds.push(step.forward ? step.edge.b : step.edge.a);
  });
  return { points, cellIds };
}

// Animate the marker (and camera) moving along the real road route from currentBurg,
// at a constant linear speed (no easing) so it reads as steady travel rather than a
// quick dart. Returns a controller {cancelled, rafId} so travel can be interrupted
// mid-journey. onProgress(info) reports {frac, x, y, cell, name} each frame — frac is
// the actual distance-fraction covered so far, and {x,y,cell} is the nearest real
// road-graph point to the current position, used to snap the player there if they
// stop or camp before arriving.
function animateTravel(fromPos, toId, edgeSteps, destName, durationMs, onDone, onProgress){
  const { points, cellIds } = buildRoutePolyline(fromPos, toId, edgeSteps);
  const controller = { cancelled:false, rafId:null };
  if(points.length < 2){ onDone(); return controller; }

  const segLens = [];
  let totalLen = 0;
  for(let i=1;i<points.length;i++){
    const d = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    segLens.push(d);
    totalLen += d;
  }
  if(totalLen === 0){ onDone(); return controller; }

  function posAtDistance(dist){
    let remaining = dist;
    for(let i=0;i<segLens.length;i++){
      if(remaining <= segLens[i] || i === segLens.length-1){
        const t = segLens[i] > 0 ? remaining/segLens[i] : 0;
        const p0 = points[i], p1 = points[i+1];
        const nearCell = t < 0.5 ? cellIds[i] : cellIds[i+1];
        const nearPoint = t < 0.5 ? p0 : p1;
        return {
          x: p0.x + (p1.x-p0.x)*Math.min(1,t),
          y: p0.y + (p1.y-p0.y)*Math.min(1,t),
          dx: p1.x-p0.x, dy: p1.y-p0.y,
          nearCell, nearX: nearPoint.x, nearY: nearPoint.y
        };
      }
      remaining -= segLens[i];
    }
    const last = points.length-1;
    return { x: points[last].x, y: points[last].y, dx:1, dy:0, nearCell: cellIds[last], nearX: points[last].x, nearY: points[last].y };
  }

  const t0 = performance.now();
  function frame(now){
    if(controller.cancelled) return;
    let p = Math.min(1, (now - t0) / durationMs); // linear — no easing, constant travel speed
    const pos = posAtDistance(totalLen * p);
    if(onProgress) onProgress({ frac:p, x:pos.nearX, y:pos.nearY, cell:pos.nearCell, name: destName });
    setHeading(headingFromDelta(pos.dx, pos.dy));
    positionPlayerMarker(pos.x, pos.y);
    // Recenter every frame from the *current* zoom level (not a value cached at
    // the start of the journey) so the character is always what the camera is
    // zoomed on, even if the player pinches or scrolls to zoom mid-journey.
    centerOnLogical(pos.x, pos.y, view.scale);
    if(p < 1){ controller.rafId = requestAnimationFrame(frame); }
    else { onDone(); }
  }
  controller.rafId = requestAnimationFrame(frame);
  return controller;
}

// Chaikin corner-cutting — same technique and same reasoning as render-painterly.js's river
// smoothing: roads/trails are drawn from a handful of straight-line waypoints (travel-graph.json's
// edge `pts`), which reads as an angular, jagged path rather than a real road. Chaikin only ever
// interpolates between existing points (never extrapolates a tangent past them), so unlike
// Catmull-Rom it can't overshoot into a loop or cusp on a sharp turn.
function chaikinSmooth(points, iterations = 3){
  let pts = points;
  for(let it = 0; it < iterations; it++){
    const next = [pts[0]];
    for(let i = 0; i < pts.length - 1; i++){
      const [x1, y1] = pts[i], [x2, y2] = pts[i+1];
      next.push([x1 + 0.25*(x2-x1), y1 + 0.25*(y2-y1)]);
      next.push([x1 + 0.75*(x2-x1), y1 + 0.75*(y2-y1)]);
    }
    next.push(pts[pts.length-1]);
    pts = next;
  }
  return pts;
}
function smoothedPathD(pts){
  const smoothed = pts.length < 3 ? pts : chaikinSmooth(pts);
  return 'M' + smoothed.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
}

// Every individual road/trail edge in travel-graph.json is just a straight 2-point segment
// between two adjacent cells — Chaikin (or any smoothing) on 2 points is a no-op, there's no
// interior bend to soften. The jagged look is the *macro* shape formed by chaining many short
// straight edges together across the network. To get a river-like flowing curve, connected
// edges have to be merged into one long polyline *before* smoothing — so this walks the graph:
// starting from every junction/dead-end cell (anything with road-edge degree != 2), it follows
// each attached edge through however many degree-2 "pass-through" cells come next (concatenating
// their points, dropping the duplicate shared point at each join) until hitting the next
// junction or dead-end, and calls that whole run one chain. A leftover pure loop (every cell on
// it degree-2, no junction anywhere) is walked separately at the end. Each returned chain is a
// single point list ready for chaikinSmooth/smoothedPathD, same as one continuous river.
// `kinds` may be a single kind string or an array — roads and trails render identically now
// (see buildRoads below), so they're chained together as one network rather than two, or a
// path that happens to switch from 'road' to 'trail' partway would show an artificial break
// at that boundary instead of one continuous chain.
function buildEdgeChains(kinds){
  const kindSet = Array.isArray(kinds) ? new Set(kinds) : new Set([kinds]);
  const edges = graph.edges.filter(e => kindSet.has(e.kind) && e.pts && e.pts.length >= 2);
  const degree = {};
  const adj = {};
  for(const e of edges){
    degree[e.a] = (degree[e.a]||0) + 1;
    degree[e.b] = (degree[e.b]||0) + 1;
    (adj[e.a] = adj[e.a]||[]).push({edge:e, other:e.b});
    (adj[e.b] = adj[e.b]||[]).push({edge:e, other:e.a});
  }
  const used = new Set();
  const chains = [];
  const ptsFrom = (e, fromCell) => e.a === fromCell ? e.pts : e.pts.slice().reverse();

  for(const cellIdStr in adj){
    const cellId = Number(cellIdStr);
    if(degree[cellId] === 2) continue; // only start a chain at a junction or dead-end
    for(const {edge, other} of adj[cellId]){
      if(used.has(edge)) continue;
      used.add(edge);
      let chainPts = ptsFrom(edge, cellId);
      let currentCell = other;
      while(degree[currentCell] === 2){
        const next = adj[currentCell].find(o => !used.has(o.edge));
        if(!next) break;
        used.add(next.edge);
        chainPts = chainPts.concat(ptsFrom(next.edge, currentCell).slice(1));
        currentCell = next.other;
      }
      chains.push(chainPts);
    }
  }
  // Leftover pure loops — every cell on them stayed degree-2, so the pass above never started
  // a chain there at all. Rare (a road/trail ring with no fork or dead-end anywhere on it).
  for(const e of edges){
    if(used.has(e)) continue;
    used.add(e);
    let chainPts = ptsFrom(e, e.a);
    let currentCell = e.b;
    while(currentCell !== e.a){
      const next = (adj[currentCell]||[]).find(o => !used.has(o.edge));
      if(!next) break;
      used.add(next.edge);
      chainPts = chainPts.concat(ptsFrom(next.edge, currentCell).slice(1));
      currentCell = next.other;
    }
    chains.push(chainPts);
  }
  return chains;
}

// ---- permanent road/trail network, drawn as real SVG paths instead of being baked into
// world-raster.jpg like Azgaar's original export had. Sea edges (graph.edges' third kind)
// are deliberately not drawn here — a line across open water is mostly redundant clutter
// when the water itself already reads as "you'd cross the sea to get there", unlike a road
// or trail across land which has no other visual cue at all. Roads and trails render
// identically — both get the same worn dirt-path look (dark earthen edge + lighter dusty
// fill, see the .road-road-edge/.road-road-fill CSS and the two-pass draw below). An earlier
// pass kept trails visually distinct (thinner, dashed, less prominent, since they're the far
// more numerous minor paths — see travel-and-map.md) but that read as "this settlement isn't
// really connected" even where it plainly was, so per the project owner every real path now
// gets the full road treatment.
function buildRoads(){
  const g = document.getElementById('roads');
  g.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  // A darker earthen edge stroke, then a lighter dusty fill stroke on top, the same
  // halo-then-centerline two-pass trick the river renderer uses (see render-painterly.js) so
  // it reads as an actual path rather than a thin generic line. Drawn as two full passes (all
  // chains' edges, then all chains' fills) rather than edge+fill per chain in turn, so one
  // chain's fill never gets covered by a *different* chain's edge at a junction.
  const roadDs = buildEdgeChains(['road', 'trail']).map(smoothedPathD);
  for(const d of roadDs){
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "road-line road-road-edge");
    g.appendChild(path);
  }
  for(const d of roadDs){
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "road-line road-road-fill");
    g.appendChild(path);
  }
}

// ---- a small dot at every Village/Town's exact point — world-raster.jpg used to have

// ---- settlement name labels, drawn as real SVG text instead of being baked into

// (some names huge, most just missing) rather than as decluttered. Every settlement's name is
// always shown now — small text under a small dot, all the way down.
const LABEL_FONT_SIZE = { village:3, town:3, city:3.8, capital:4.5 };
const LABEL_OFFSET_Y = { village:5, town:5, city:9, capital:11 };
function buildLabels(){

// ---- castle-medallion image marking City/Capital-tier settlements, centered exactly on the
// settlement's own point — it *is* their marker now, per the project owner, rather than a
// separate dot (buildSettlementDots skips City/Capital tier entirely) plus an icon floating
// above it. Two earlier offsets (-11, then -6) existed only to clear label text that used to
// sit at or near the point; now that buildLabels() offsets its text well clear on its own
// (see LABEL_OFFSET_Y above) and the icon needs no dot to hover over, there's nothing left to
// dodge, so the icon just sits at 0 offset.
// Dense clusters can still put two settlements close enough that one's icon overlaps a
// *different* settlement's own point. Rather than chase that per-pair, buildCityIcons() checks
// each candidate icon position against every settlement's point (not just City/Capital ones)
// and simply skips drawing it if it would land within MIN_CLEARANCE of one — better to omit
// an icon in a crowded area than to cover a neighboring settlement's marker.
const CITY_ICON_HREF = "assets/icons/Map/Cities.png"; // 1024x848, transparent outside the coin
const CITY_ICON_ASPECT = 848/1024;
const CITY_ICON_OFFSET_Y = 0; // logical units above the point — the icon *is* the marker now
const CITY_ICON_MIN_CLEARANCE = 7; // logical units — skip if this close to any settlement's point
function buildCityIcons(){
  const g = document.getElementById('city-icons');
  g.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  const allBurgs = Object.values(graph.burgs);
  for(const id in graph.burgs){
    const b = graph.burgs[id];
    if(b.tier !== 'city' && b.tier !== 'capital') continue;
    const iconY = b.y + CITY_ICON_OFFSET_Y;
    const tooClose = allBurgs.some(other => other !== b && Math.hypot(other.x-b.x, other.y-iconY) < CITY_ICON_MIN_CLEARANCE);
    if(tooClose) continue;
    const w = b.tier === 'capital' ? 20 : 14;
    const h = w * CITY_ICON_ASPECT;
    const icon = document.createElementNS(ns, "image");
    icon.setAttributeNS("http://www.w3.org/1999/xlink", "href", CITY_ICON_HREF);
    icon.setAttribute("href", CITY_ICON_HREF);
    icon.setAttribute("x", b.x - w/2);
    icon.setAttribute("y", iconY - h/2);
    icon.setAttribute("width", w);
    icon.setAttribute("height", h);
    g.appendChild(icon);
  }
}

function onMapTap(burgId){
  const burg = graph.burgs[burgId];
  if(!burg){ closeCard(); return; }
  selectedBurg = burgId;
  showHighlight(burg.x, burg.y);

  document.getElementById('info-name').textContent = burg.name;
  const controller = getController(burgId);
  const raceTag = controller && controller !== 'neutral'
    ? `<span class="tag ${controller}">${RACE_LABEL[controller]}</span>` : '';
  const stateTag = burg.state ? `<span style="color:#a9926a;">${burg.state}</span>` : '';
  const capturedNote = (controller !== burg.race) ? ` <span style="color:#e2857f; font-weight:700;">(captured)</span>` : '';
  const popLine = `<br><span style="font-size:11px; color:#a9926a;">Population ${formatPopulation(getPopulation(burgId))}</span>`;
  document.getElementById('info-meta').innerHTML = `${raceTag}<span>${TIER_LABEL[burg.tier]||burg.tier}</span>${stateTag ? ' — '+stateTag : ''}${capturedNote}${popLine}`;

  const travelDiv = document.getElementById('info-travel');
  const travelBtn = document.getElementById('btn-travel');

  if(burgId === currentBurg && !campPos){
    travelDiv.textContent = "You are here.";
    travelBtn.style.display = 'block';
    travelBtn.textContent = 'Enter Settlement';
  } else {
    const t = computeTravel(burgId);
    if(!t){
      travelDiv.textContent = "Distance unknown.";
      travelBtn.style.display = 'none';
    } else {
      // No affordability gate anymore — travel is never blocked by Food/Waterskin item count.
      // Hunger/Thirst just drain (see HUNGER_PER_DAY/THIRST_PER_DAY); ignoring them too long
      // costs Health instead, via addHunger/addThirst's overflow handling.
      const seaNote = t.bySea ? ` (includes a sea crossing — <b>${t.ferryCost}g ferry fare</b>)` : (t.mounted ? ' (riding — faster pace)' : '');
      travelDiv.innerHTML = t.viaRoad
        ? `<b>${t.miles} miles</b> by road${seaNote} — about <b>${formatDuration(t.hours)}</b> travel, <b>-${t.hungerGain} hunger</b>, <b>-${t.thirstGain} thirst</b>.`
        : `<b>${t.miles} miles</b> cross-country (no road yet) — about <b>${formatDuration(t.hours)}</b> travel, <b>-${t.hungerGain} hunger</b>, <b>-${t.thirstGain} thirst</b>.`;
      travelBtn.style.display = 'block';
      if(t.viaRoad) drawRoutePreview({...getCurrentXY(), cell:getCurrentCell()}, burgId, t.edges);
      travelBtn.textContent = t.ferryCost > 0 ? `Travel Here (${t.hours}h, ${t.ferryCost}g)` : `Travel Here (${t.hours}h)`;
    }
  }
  document.getElementById('info-card').classList.add('open');
}

let activeTravel = null; // {controller, destId, destName, totalHours, lastSnap}

// Hunger/Thirst are only ever actually applied (addHunger/addThirst) at arrival or at a
// mid-journey interruption (campMidTravel) — see those call sites — but leaving the header's
// #stat-hunger/#stat-thirst frozen at their pre-travel values for the whole animation, then
// jumping straight to the post-trip numbers the instant it ended, would read as if travel cost
// nothing until it suddenly did. This repaints them every animation frame with a smooth
// linear interpolation from their values at departure down toward exactly what they'll actually
// be on arrival (start - drain, reached precisely at frac=1, so there's no discontinuity with the
// real addHunger/addThirst calls that follow) — display-only, never touches the real meters
// itself, so it can't cause a double application no matter how it's called. Floored at 0 for
// display even though the real addHunger/addThirst calls at arrival can still register genuine
// underflow past that (see their own Health-penalty handling).
function updateLiveHungerThirstDisplay(startHunger, hungerGain, startThirst, thirstGain, frac){
  const hp = document.getElementById('stat-hunger');
  const tp = document.getElementById('stat-thirst');
  if(hp) hp.textContent = Math.max(0, Math.round(startHunger - hungerGain*frac));
  if(tp) tp.textContent = Math.max(0, Math.round(startThirst - thirstGain*frac));
}
// Same live-preview idea as updateLiveHungerThirstDisplay just above, for the clock instead of
// Hunger/Thirst — display-only, the real gameHour only actually moves via advanceTime at arrival
// (or campMidTravel/stopTravel if the trip's interrupted). Without this, a long journey would
// visibly cross into evening or night on the map (see updateNightOverlay) but the header clock
// would just sit frozen at the departure time for the whole animation, then jump.
function updateLiveClockDisplay(startHour, totalHours, frac){
  const hour = (startHour + totalHours*frac) % 24;
  document.getElementById('clock-time').textContent = timeStr(hour);
  updateNightOverlay(hour);
}

function beginTravel(destId){
  stopWaiting();
  const t = computeTravel(destId);
  if(!t) return;
  // The one real affordability gate travel has (see FERRY_GOLD_PER_MILE above) — everything
  // else about this trip (Hunger/Thirst) is allowed to proceed broke, but a sea crossing
  // genuinely can't happen without paying for passage.
  if(t.ferryCost > 0 && playerGold < t.ferryCost){
    showToast(`You can't afford the ${t.ferryCost}g ferry fare for this crossing.`);
    return;
  }
  if(t.ferryCost > 0) setGold(playerGold - t.ferryCost);
  const destName = graph.burgs[destId].name;
  const startHunger = playerHunger, startThirst = playerThirst, startHour = gameHour;
  closeCard();

  const fromPos = { ...getCurrentXY(), cell:getCurrentCell() };
  centerOnLogical(fromPos.x, fromPos.y, view.scale);
  showTravelControls(destName);

  // Constant, unhurried travel speed (like Bannerlord's overworld) — no artificial
  // cap, no easing curve, so it reads as steady progress rather than a quick dart.
  // A long journey genuinely takes longer to watch; Stop / Set Up Camp exist so
  // you're never stuck sitting through one.
  const duration = Math.max(4000, 2000 + t.miles*20);
  const controller = animateTravel(fromPos, destId, t.edges, destName, duration, ()=>{
    hideTravelControls();
    activeTravel = null;
    campPos = null;
    currentBurg = destId;
    localStorage.setItem(LOC_KEY, currentBurg);
    advanceTime(t.hours);
    addHunger(t.hungerGain);
    addThirst(t.thirstGain);
    refreshReachability();
    if(rollAmbush(t.hours)){
      triggerAmbushFight(currentBurg, ()=> showLocationView(currentBurg), 'road');
    } else {
      showLocationView(currentBurg);
    }
  }, (info)=>{
    if(!activeTravel) return;
    activeTravel.lastSnap = info;
    updateLiveHungerThirstDisplay(startHunger, t.hungerGain, startThirst, t.thirstGain, info.frac);
    updateLiveClockDisplay(startHour, t.hours, info.frac);
  });

  activeTravel = { controller, destId, destName, totalHours: t.hours, startHunger, startThirst, hungerGain: t.hungerGain, thirstGain: t.thirstGain, lastSnap:{frac:0, x:fromPos.x, y:fromPos.y, cell:fromPos.cell, name: getCurrentDisplayName()} };
}

// Cancels the current journey in place — the character stops exactly where the
// animation had gotten to (snapped to the nearest real road-graph point), not
// back at the start. No time cost.
function stopTravel(){
  if(!activeTravel) return;
  activeTravel.controller.cancelled = true;
  cancelAnimationFrame(activeTravel.controller.rafId);
  hideTravelControls();
  const snap = activeTravel.lastSnap;
  campPos = { x:snap.x, y:snap.y, cell:snap.cell, name: snap.name };
  positionPlayerMarker(campPos.x, campPos.y);
  centerOnLogical(campPos.x, campPos.y, view.scale);
  refreshReachability();
  // No Hunger/Thirst — or clock time — is actually lost on a plain Stop (unlike Camp): both the
  // header's live Hunger/Thirst display and the live clock (see updateLiveClockDisplay) had been
  // moving purely as a preview of what arrival *would* cost, so both need restoring to their
  // real, untouched values rather than being left showing a time/meter state that never actually
  // applied.
  refreshPlayerStatUI();
  refreshCalendarUI();
  showToast(`You stop on the road toward ${activeTravel.destName}.`);
  activeTravel = null;
}

// Cancels the journey in place, advances the clock for whatever hours the distance already
// covered amounted to (real hours now, not rounded down to whole days — see advanceTime), and
// opens the Camp screen.
function campMidTravel(){
  if(!activeTravel) return;
  activeTravel.controller.cancelled = true;
  cancelAnimationFrame(activeTravel.controller.rafId);
  hideTravelControls();
  const snap = activeTravel.lastSnap;
  campPos = { x:snap.x, y:snap.y, cell:snap.cell, name: snap.name };
  positionPlayerMarker(campPos.x, campPos.y);
  centerOnLogical(campPos.x, campPos.y, view.scale);
  refreshReachability();
  const partialHours = Math.max(1, Math.round(activeTravel.totalHours * activeTravel.lastSnap.frac));
  advanceTime(partialHours);
  addHunger(hoursToHungerGain(partialHours));
  addThirst(hoursToThirstGain(partialHours));
  showCampView(activeTravel.destId, activeTravel.destName, partialHours);
  activeTravel = null;
}

document.getElementById('btn-stop-travel').addEventListener('click', stopTravel);
document.getElementById('btn-camp-travel').addEventListener('click', campMidTravel);

document.getElementById('btn-travel').addEventListener('click', ()=>{
  if(!selectedBurg) return;
  if(selectedBurg === currentBurg && !campPos){
    closeCard();
    showLocationView(currentBurg);
    return;
  }
  beginTravel(selectedBurg);
});
