// Camp reuses the same split-screen shell as a settlement's location-view,
// just populated with camp-specific content instead.
function showCampView(destId, destName, partialHours){
  stopWaiting();
  const standalone = !destId; // camped from the map directly, not mid-journey
  const here = getCurrentDisplayName();

  document.getElementById('loc-heading').textContent = "Camp";
  document.getElementById('loc-sub').textContent = standalone
    ? `Making camp at ${here}`
    : `On the road to ${destName} — ${formatDuration(partialHours)} passed`;
  document.getElementById('loc-banner-art').innerHTML = CAMP_ART;
  document.getElementById('loc-banner-portrait').classList.remove('show');
  document.getElementById('loc-banner-portrait').innerHTML = '';

  const list = document.getElementById('loc-action-list');
  list.innerHTML = `
    <button class="loc-action" id="camp-rest-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h3l2-5 4 10 3-7 2 4h4"/></svg>
      <span class="li-text"><b>Rest Until Morning</b><span>Restores health &amp; stamina &middot; Passes 1 day</span></span>
    </button>
    ${standalone ? '' : `
    <button class="loc-action" id="camp-continue-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span class="li-text"><b>Continue to ${destName}</b><span>Resume the journey from here</span></span>
    </button>`}
    <button class="loc-action" id="camp-choose-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      <span class="li-text"><b>${standalone ? 'Back to Map' : 'Choose a Different Destination'}</b><span>${standalone ? 'Return to the map' : 'Return to the map from here'}</span></span>
    </button>
  `;
  document.getElementById('camp-rest-btn').addEventListener('click', ()=>{
    function finishRest(){
      restThroughNight();
      const healed = playerMaxHealth - playerHealth;
      const staminaBack = playerMaxStamina - playerStamina;
      const hadBedroll = !!getItem('Bedroll');
      restFully();
      let msg = (healed > 0 || staminaBack > 0) ? `You rest and recover your health and stamina.` : "You rest. Already fully rested.";
      if(hadBedroll) msg += ` Your bedroll leaves you extra rested.`;
      showToast(msg);
      document.getElementById('loc-sub').textContent = standalone
        ? `Making camp at ${here} — resting`
        : `On the road to ${destName} — resting`;
    }
    if(Math.random() < NIGHT_AMBUSH_CHANCE * (hasPerk('sure_feet') ? 0.9 : 1) * (getItem('Bedroll') ? BEDROLL_AMBUSH_MULT : 1)){
      triggerAmbushFight(currentBurg, finishRest, 'camp');
    } else {
      finishRest();
    }
  });
  if(!standalone){
    document.getElementById('camp-continue-btn').addEventListener('click', ()=>{
      document.getElementById('location-view').classList.remove('show');
      beginTravel(destId);
    });
  }
  document.getElementById('camp-choose-btn').addEventListener('click', ()=>{
    document.getElementById('location-view').classList.remove('show');
  });

  document.getElementById('location-view').classList.add('show');
}

// ===================== QUESTS =====================
// See context/quests.md. Two sources, per design: the Quest Board (any settlement, minor
// "Deliver a Message" offers, several at once) and a Notable Figure (City/Capital only, one
// important "Kill Bandits" offer at a time, capped globally at one active regardless of type).
// Offers aren't persisted — they're regenerated deterministically from burgId+gameDay (and an
// offer index) via a seeded PRNG, so reopening the same panel the same day shows the same
// offers without needing separate storage, the same way Work's cooldown reuses gameDay rather
// than a real-world timer.
function getQuests(){ try{ return JSON.parse(localStorage.getItem(QUEST_KEY)) || []; }catch(e){ return []; } }
function saveQuests(quests){ localStorage.setItem(QUEST_KEY, JSON.stringify(quests)); }
function getActiveQuests(){ return getQuests().filter(q => q.status === 'active'); }
function getCompletedQuests(){ try{ return JSON.parse(localStorage.getItem(COMPLETEDQUEST_KEY)) || []; }catch(e){ return []; } }
// Quests are deleted outright on completion (see checkQuestTurnIns/endCombat below), not
// archived — this is the one place a lightweight record survives that, purely for quests.html's
// "Recently Completed" list. Newest first, capped at COMPLETED_QUESTS_MAX so a long-lived
// character's save doesn't grow this list forever.
function recordCompletedQuest(q){
  const history = getCompletedQuests();
  history.unshift({ type:q.type, giverName:q.giverName, targetName:q.targetName, reward:q.reward, completedDay:gameDay });
  localStorage.setItem(COMPLETEDQUEST_KEY, JSON.stringify(history.slice(0, COMPLETED_QUESTS_MAX)));
  localStorage.setItem(QUESTS_COMPLETED_TOTAL_KEY, String(getQuestsCompletedTotal() + 1));
}
// Drives the small count badge on the map toolbar's Quests button (quests.html has no live map
// to update, so this only ever needs to run here) — called after anything that adds or removes
// an active quest, plus once from refreshPlayerStatUI so it's right on load too.
function refreshQuestBadge(){
  const badge = document.getElementById('quest-nav-badge');
  if(!badge) return;
  const count = getActiveQuests().length;
  badge.textContent = count;
  badge.hidden = count === 0;
}
// A small gold flag above every settlement that's the delivery target of an active quest.
// Notable Figure kill-quests have no targetBurgId — they complete on the next matching combat
// victory anywhere, not by visiting a place — so only DELIVERY_QUEST_TYPES ever mark the map.
// Rebuilt from scratch (same pattern as buildFrontlineMarkers/buildCityIcons) rather than
// diffed, since it only needs to run on load and after a quest is accepted/turned in/abandoned,
// never per frame.
function buildQuestMarkers(){
  const g = document.getElementById('quest-markers');
  if(!g) return;
  g.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  const targets = new Set();
  getActiveQuests().forEach(q => {
    if(DELIVERY_QUEST_TYPES.includes(q.type) && q.targetBurgId) targets.add(q.targetBurgId);
  });
  targets.forEach(burgId => {
    const b = graph.burgs[burgId];
    if(!b) return;
    const pole = document.createElementNS(ns, "line");
    pole.setAttribute("x1", b.x); pole.setAttribute("y1", b.y - 4);
    pole.setAttribute("x2", b.x); pole.setAttribute("y2", b.y - 16);
    pole.setAttribute("stroke", "#3a2c18"); pole.setAttribute("stroke-width", "1.4");
    g.appendChild(pole);
    const flag = document.createElementNS(ns, "path");
    flag.setAttribute("d", `M${b.x},${b.y-16} L${b.x+8},${b.y-13} L${b.x},${b.y-10} Z`);
    flag.setAttribute("fill", "#d1a445");
    flag.setAttribute("stroke", "#3a2c18");
    flag.setAttribute("stroke-width", "0.8");
    g.appendChild(flag);
  });
}
// A delivery target should never be somewhere actively hostile to whoever's asking — a
// settlement sends couriers toward its own side, not into the enemy's. Alliance-relative (Good
// vs. Bad — see ALLIANCE/getController in the FACTIONS section) rather than kingdom-specific, so
// it still excludes correctly even when the giver and target belong to different kingdoms on
// the same side. A burg with no meaningful alliance either way (a 'neutral' controller) is never
// treated as enemy territory.
function isEnemyTerritory(giverBurgId, targetBurgId){
  const giverAlliance = ALLIANCE[getController(giverBurgId)];
  const targetAlliance = ALLIANCE[getController(targetBurgId)];
  return !!(giverAlliance && targetAlliance && giverAlliance !== targetAlliance);
}

// mulberry32 — small, deterministic, good enough for flavor generation (not cryptographic).
function seededRandom(seed){
  let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function hashSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = Math.imul(31,h) + str.charCodeAt(i) | 0; }
  return h >>> 0;
}

function questTitle(q){
  if(q.type === 'deliver_message') return 'Deliver a Message';
  if(q.type === 'deliver_cargo') return 'Deliver Cargo';
  if(q.type === 'kill_bandits') return 'Deal with the Bandits';
  if(q.type === 'kill_raiders') return 'Drive Off the Raiders';
  return 'Quest';
}
// Delivery-only — kill quests have no fixed destination to measure a distance to.
function questDistanceNote(q){
  if(typeof q.distanceHours !== 'number') return '';
  return ` (${formatDuration(q.distanceHours)} away)`;
}
function questDesc(q){
  if(q.type === 'deliver_message') return `Carry word from ${q.giverName} to ${q.targetName}.${questDistanceNote(q)}`;
  if(q.type === 'deliver_cargo') return `Carry a shipment from ${q.giverName} to ${q.targetName}.${questDistanceNote(q)}`;
  if(q.type === 'kill_bandits') return `${q.giverName} asked you to see to the bandits plaguing the roads.`;
  if(q.type === 'kill_raiders') return `${q.giverName} asked you to drive off the goblin and ork raiders threatening the region.`;
  return '';
}

// How many Board slots a settlement can ever show at once, by tier — a village posts less work
// than a capital. Replaces the old flat BOARD_OFFERS_PER_DAY.
const BOARD_MAX_QUESTS_BY_TIER = { village:1, town:2, city:2, capital:3 };
// Extra gold/XP per hour of travel between giver and target — a courier run across half the
// map should pay better than one to the next settlement over.
const DISTANCE_GOLD_PER_HOUR = 0.5;
const DISTANCE_XP_PER_HOUR = 0.3;
// The Board now resets once a real in-game month, not once a day — per the project owner.
// Seeded off a month index (floor(gameDay/DAYS_PER_MONTH)) instead of gameDay itself, same
// "reuse the calendar as the refresh signal" idea Work's cooldown and the old daily offers
// already used, just a longer cycle.
function getBoardMonthIndex(){ return Math.floor(gameDay / DAYS_PER_MONTH); }
// Rolls how many of this settlement's tier cap are actually posted this month (0 up to the cap,
// inclusive) — a village doesn't necessarily have its one possible job every single month.
function getBoardQuestCount(burgId){
  const tier = graph.burgs[burgId].tier;
  const max = BOARD_MAX_QUESTS_BY_TIER[tier] ?? 2;
  const month = getBoardMonthIndex();
  return Math.floor(seededRandom(hashSeed(`board_count_${burgId}_${month}`)) * (max + 1));
}
// Minor, board-sourced offers — regenerated fresh each call, filtered against what's already
// active so accepting one doesn't leave a duplicate sitting on the board the same month. Each
// slot is independently seeded as either a Deliver a Message or a heavier-paying Deliver Cargo
// — both complete identically on arrival (see checkQuestTurnIns), only the flavor and reward
// differ, per quests.md's "mostly a new offer-generator, not new architecture" pattern. Targets
// are drawn only from settlements not currently hostile to the giver (see isEnemyTerritory) —
// per the project owner, delivering into enemy territory doesn't make sense — and reward scales
// up with real travel distance from the giver, not just a flat random roll.
function generateBoardOffers(burgId){
  const active = getActiveQuests();
  const month = getBoardMonthIndex();
  const count = getBoardQuestCount(burgId);
  const candidateIds = Object.keys(graph.burgs).filter(id => id !== burgId && !isEnemyTerritory(burgId, id));
  const offers = [];
  for(let i=0;i<count;i++){
    if(!candidateIds.length) break; // no non-hostile target exists at all — extremely rare
    const targetId = candidateIds[Math.floor(seededRandom(hashSeed(`board_${burgId}_${month}_${i}_t`)) * candidateIds.length)];
    const target = graph.burgs[targetId];
    const dist = computeDistanceBetween(burgId, targetId) || { miles:0, hours:1 };
    const isCargo = seededRandom(hashSeed(`board_${burgId}_${month}_${i}_type`)) < 0.5;
    const type = isCargo ? 'deliver_cargo' : 'deliver_message';
    const distanceGold = Math.round(dist.hours * DISTANCE_GOLD_PER_HOUR);
    const distanceXp = Math.round(dist.hours * DISTANCE_XP_PER_HOUR);
    const gold = (isCargo ? 15 : 10) + Math.floor(seededRandom(hashSeed(`board_${burgId}_${month}_${i}_g`)) * 16) + distanceGold; // 15-30 cargo, 10-25 message, plus distance
    const xp = 8 + Math.floor(seededRandom(hashSeed(`board_${burgId}_${month}_${i}_x`)) * 13) + distanceXp; // 8-20, plus distance
    const alreadyActive = active.some(q => q.type===type && q.giverBurgId===burgId && q.targetBurgId===targetId);
    if(!alreadyActive){
      offers.push({ offerId:`board_${burgId}_${month}_${i}`, type, source:'board',
        giverBurgId:burgId, giverName:graph.burgs[burgId].name, targetBurgId:targetId, targetName:target.name,
        distanceMiles:dist.miles, distanceHours:dist.hours,
        reward:{gold, xp} });
    }
  }
  return offers;
}

// A recurring cast for the important, character-given quest — no portraits or dialogue yet,
// just a name and a line, same spirit as the Inn's RUMOURS/Guard House's flavor lines. Each is
// pinned to one real settlement (`homeBurgId`) rather than being randomly assigned per day —
// they stay put, they don't roam between cities. All five sit in Good-alliance (human/dwarf)
// territory to match their names/flavor: Bary and Yeone (human, Kingdom of Bary/Duchy of
// Pendalbor) plus Stothers (human, Duchy of Skipia), Mosver and Sodoy (dwarf, Grand Duchy of
// Mevia/Republic of Fjeland).
// `portrait` shows up overlaid on the settlement banner while showNotableFigurePanel is open
// — see #loc-banner-portrait. All five now have one.
const NOTABLE_FIGURES = [
  { name:"Captain Aldric Vane", title:"a hard-eyed watch captain", homeBurgId:"5", portrait:"assets/figures/captain-aldric-vane.png" },
  { name:"Yselle Thorn", title:"a sharp-tongued merchant-lady", homeBurgId:"3", portrait:"assets/figures/yselle-thorn.png" },
  { name:"Elder Bram Oswick", title:"a weathered elder", homeBurgId:"1", portrait:"assets/figures/elder-bram-oswick.png" },
  { name:"Scoutmaster Priska Ren", title:"a restless border scout", homeBurgId:"24", portrait:"assets/figures/scoutmaster-priska-ren.png" },
  { name:"Sir Corwin Hale", title:"a knight between postings", homeBurgId:"11", portrait:"assets/figures/sir-corwin-hale.png" },
];
// Returns the figure whose home this is, or null if there's no figure here at all, or their
// home has been captured by another race since — the "they disappear if their city falls"
// rule the project owner asked for. Original race/state never changes (see
// factions-and-territory.md), so comparing the home's *current* controller against its
// original race is exactly the "still theirs" check.
function getFigureForBurg(burgId){
  const figure = NOTABLE_FIGURES.find(f => f.homeBurgId === burgId);
  if(!figure) return null;
  const home = graph.burgs[figure.homeBurgId];
  if(!home || getController(figure.homeBurgId) !== home.race) return null;
  return figure;
}
// Which task a figure offers reacts to real game state rather than being random: at peace,
// Bandits are the region's actual problem; once the figure's home kingdom is at war (see
// factions-and-territory.md), the real Goblin War threat takes over as the ask, with a bigger
// reward reflecting the bigger danger. Same reactive-world spirit as Marketplace pricing and
// pickAmbushEnemy already reacting to war state.
function generateNotableFigureOffer(burgId){
  const figure = getFigureForBurg(burgId);
  if(!figure) return null;
  const atWar = isAtWarAt(figure.homeBurgId);
  const type = atWar ? 'kill_raiders' : 'kill_bandits';
  const seed = hashSeed(`figure_${figure.name}_${gameDay}`);
  const gold = (atWar ? 35 : 20) + Math.floor(seededRandom(seed+1) * (atWar ? 26 : 21)); // 35-60 raiders, 20-40 bandits
  const xp = (atWar ? 25 : 18) + Math.floor(seededRandom(seed+2) * (atWar ? 21 : 13));   // 25-45 raiders, 18-30 bandits
  return { figure, type, gold, xp };
}

// Both delivery types (Deliver a Message, Deliver Cargo) complete identically — the moment the
// player reaches the quest's target settlement. Called at the top of showLocationView so it
// fires on arrival, on re-entering, even after a Back from a sub-panel; harmless to call
// repeatedly since a completed quest is removed immediately.
const DELIVERY_QUEST_TYPES = ['deliver_message', 'deliver_cargo'];
function checkQuestTurnIns(burgId){
  const quests = getQuests();
  const remaining = [];
  let anyCompleted = false;
  quests.forEach(q => {
    if(q.status === 'active' && DELIVERY_QUEST_TYPES.includes(q.type) && q.targetBurgId === burgId){
      setGold(playerGold + q.reward.gold);
      const leveledUp = addXp(q.reward.xp);
      const verb = q.type === 'deliver_cargo' ? 'Cargo delivered!' : 'Delivered!';
      showToast(`${verb} ${q.giverName}'s ${q.type === 'deliver_cargo' ? 'shipment' : 'message'} reaches ${q.targetName}. +${q.reward.gold}g, +${q.reward.xp} XP.`
        + (leveledUp ? ` Level up! You are now level ${playerLevel}.` : ''));
      recordCompletedQuest(q);
      anyCompleted = true;
    } else {
      remaining.push(q);
    }
  });
  if(anyCompleted){ saveQuests(remaining); buildQuestMarkers(); refreshQuestBadge(); }
}

// Closes whatever settlement panel is open and centers/zooms the map on burgId — the same
// recenter target the FIND ME button (#recenter-btn) uses — then opens its info-card (name,
// tier, population, Travel Here), same as tapping it directly. Used by the Quest Board's offer
// cards below (so a delivery target can be seen before accepting) and by quests.html's View
// Location button, via the ?viewBurg= query param finishLoad checks above.
function viewLocation(burgId){
  const burg = graph.burgs[burgId];
  if(!burg) return;
  document.getElementById('location-view').classList.remove('show');
  centerOnLogical(burg.x, burg.y, Math.max(view.scale, viewport.clientWidth/((STAGE_W/LOGICAL_W)*REGION_W)));
  onMapTap(burgId);
}

function showQuestBoardPanel(burgId){
  const b = graph.burgs[burgId];
  const active = getActiveQuests();
  const offers = generateBoardOffers(burgId);

  const activeHTML = active.length ? active.map(q => `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin-bottom:10px;">
      <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">${questTitle(q)}</div>
      <div style="font-size:13px; color:#a9926a; line-height:1.5;">${questDesc(q)}</div>
      <div style="font-size:12px; color:#7fbf6a; font-weight:700; margin-top:8px;">${q.reward.gold}g &middot; ${q.reward.xp} XP</div>
    </div>
  `).join('') : `<div style="font-size:12.5px; color:#a9926a; font-style:italic; text-align:center; padding:6px 0 14px;">No quests in progress.</div>`;

  const offersHTML = offers.length ? offers.map(o => `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin-bottom:10px;">
      <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">${questTitle(o)}</div>
      <div style="font-size:13px; color:#a9926a; line-height:1.5; margin-bottom:10px;">${questDesc(o)}</div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span style="font-size:12px; color:#7fbf6a; font-weight:700;">${o.reward.gold}g &middot; ${o.reward.xp} XP</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" style="flex:none; padding:8px 14px;" data-view="${o.targetBurgId}">View Location</button>
          <button class="btn btn-primary" style="flex:none; padding:8px 16px;" data-offer="${o.offerId}">Accept</button>
        </div>
      </div>
    </div>
  `).join('') : `<div style="font-size:12.5px; color:#a9926a; font-style:italic; text-align:center; padding:6px 0;">Nothing posted today — check back tomorrow.</div>`;

  const list = document.getElementById('loc-action-list');
  list.innerHTML = `
    <button class="loc-action" id="quest-back-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
    </button>
    <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:10px 0 8px;">Your Active Quests</div>
    ${activeHTML}
    <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:10px 0 8px;">On the Board</div>
    ${offersHTML}
  `;
  document.getElementById('quest-back-btn').addEventListener('click', ()=> showLocationView(burgId));
  list.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=> viewLocation(btn.dataset.view));
  });
  list.querySelectorAll('[data-offer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const offer = offers.find(o => o.offerId === btn.dataset.offer);
      if(!offer) return;
      const quests = getQuests();
      quests.push({ id:`q_${Date.now()}_${Math.floor(Math.random()*1e6)}`, type:offer.type, source:offer.source,
        giverBurgId:offer.giverBurgId, giverName:offer.giverName, targetBurgId:offer.targetBurgId, targetName:offer.targetName,
        distanceMiles:offer.distanceMiles, distanceHours:offer.distanceHours,
        reward:offer.reward, acceptedDay:gameDay, status:'active' });
      saveQuests(quests);
      buildQuestMarkers();
      refreshQuestBadge();
      showToast(`Accepted: ${questTitle(offer)} to ${offer.targetName}.`);
      showQuestBoardPanel(burgId);
    });
  });
}

// Only reachable from a settlement that's home to one of NOTABLE_FIGURES (see
// getFigureForBurg) — showLocationView only offers the action there in the first place. Still
// defensive here: a settlement can change hands between opening the location view and tapping
// this action (e.g. re-opening after a Back), so this re-checks rather than trusting the
// caller. Capped at one active notable-figure quest globally (checked by `source`, not `type`,
// so the cap still holds once a second important quest type exists) — these are meant to feel
// like a real ask from a real person, not a stack of odd jobs.
function showNotableFigurePanel(burgId){
  const b = graph.burgs[burgId];
  const list = document.getElementById('loc-action-list');
  const figure = getFigureForBurg(burgId);
  const activeFigureQuest = getActiveQuests().find(q => q.source === 'notable_figure');

  let bodyHTML;
  if(!figure){
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; font-size:13px; color:#a9926a; font-style:italic;">
        This place has changed hands. Whoever once sought your help here is gone.
      </div>
    `;
  } else if(activeFigureQuest && activeFigureQuest.giverBurgId === burgId){
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px;">
        <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">${questTitle(activeFigureQuest)}</div>
        <div style="font-size:13px; color:#a9926a; line-height:1.5;">${questDesc(activeFigureQuest)}</div>
        <div style="font-size:12px; color:#7fbf6a; font-weight:700; margin-top:8px;">${activeFigureQuest.reward.gold}g &middot; ${activeFigureQuest.reward.xp} XP &mdash; paid out on your next ${activeFigureQuest.type === 'kill_raiders' ? 'goblin or ork kill' : 'bandit kill'}</div>
      </div>
    `;
  } else if(activeFigureQuest){
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; font-size:13px; color:#a9926a; line-height:1.5;">
        You already have a task in progress for ${activeFigureQuest.giverName}. ${figure.name} has nothing more to ask of you right now.
      </div>
    `;
  } else {
    const { type, gold, xp } = generateNotableFigureOffer(burgId);
    const ask = type === 'kill_raiders'
      ? 'the goblin and ork raiders threatening the region — the war has reached these roads'
      : 'the bandits plaguing the roads';
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px;">
        <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">${figure.name}</div>
        <div style="font-size:13px; color:#a9926a; line-height:1.5; margin-bottom:10px;">${figure.title}, in ${b.name}, asks for your help dealing with ${ask}.</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; color:#7fbf6a; font-weight:700;">${gold}g &middot; ${xp} XP</span>
          <button class="btn btn-primary" style="flex:none; padding:8px 16px;" id="notable-accept-btn">Accept</button>
        </div>
      </div>
    `;
  }

  list.innerHTML = `
    <button class="loc-action" id="notable-back-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
    </button>
    <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:10px 0 8px;">Notable Figure</div>
    ${bodyHTML}
  `;
  // While this panel's open, the figure appears layered over the settlement's own banner art
  // (see #loc-banner-portrait) instead of the panel being a disconnected card — the same
  // backdrop the player just walked into. showLocationView's own reset (on Back, or leaving
  // this settlement entirely) clears it again.
  const portraitEl = document.getElementById('loc-banner-portrait');
  if(figure && figure.portrait){
    portraitEl.innerHTML = `<img src="${figure.portrait}" alt="${figure.name}">`;
    portraitEl.classList.add('show');
  } else {
    portraitEl.classList.remove('show');
    portraitEl.innerHTML = '';
  }
  document.getElementById('notable-back-btn').addEventListener('click', ()=> showLocationView(burgId));
  const acceptBtn = document.getElementById('notable-accept-btn');
  if(acceptBtn){
    acceptBtn.addEventListener('click', ()=>{
      const offer = generateNotableFigureOffer(burgId);
      if(!offer) { showNotableFigurePanel(burgId); return; } // home was captured between render and click
      const { figure, type, gold, xp } = offer;
      const quests = getQuests();
      quests.push({ id:`q_${Date.now()}_${Math.floor(Math.random()*1e6)}`, type, source:'notable_figure',
        giverBurgId:burgId, giverName:figure.name, targetBurgId:null, targetName:null,
        reward:{gold, xp}, acceptedDay:gameDay, status:'active' });
      saveQuests(quests);
      refreshQuestBadge();
      showToast(`${figure.name} is counting on you.`);
      showNotableFigurePanel(burgId);
    });
  }
}

// A conversation, not a cash transaction — per the project owner, recruiting a companion means
// hearing their story (their own `blurb`) and choosing whether to accept them, unlike a
// mercenary's instant, upkeep-charging hire. Declining costs nothing and isn't remembered — Back
// (or Not Now) just returns to the location view, and the same companion is still here to talk
// to again next visit, same as an unaccepted Notable Figure quest offer.
function showCompanionPanel(burgId){
  const b = graph.burgs[burgId];
  const list = document.getElementById('loc-action-list');
  const companion = getCompanionForBurg(burgId);
  const full = getActivePartySize() >= MAX_PARTY_SIZE;

  let bodyHTML;
  if(!companion){
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; font-size:13px; color:#a9926a; font-style:italic;">
        Whoever was here has already moved on.
      </div>
    `;
  } else {
    bodyHTML = `
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px;">
        <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:2px;">${companion.name}</div>
        <div style="font-size:11.5px; color:#a9926a; font-style:italic; margin-bottom:8px;">${companion.title}</div>
        <div style="font-size:13px; color:var(--parchment); line-height:1.5; margin-bottom:12px;">&ldquo;${companion.blurb}&rdquo;</div>
        ${full
          ? `<div style="font-size:12px; color:#a9926a; text-align:center;">Your party is full (${MAX_PARTY_SIZE}/${MAX_PARTY_SIZE}) — there's no room for ${companion.name} right now.</div>`
          : `<div style="display:flex; gap:10px;">
               <button class="btn btn-secondary" style="flex:1; padding:9px 0;" id="companion-decline-btn">Not Now</button>
               <button class="btn btn-primary" style="flex:1; padding:9px 0;" id="companion-recruit-btn">Recruit</button>
             </div>`
        }
      </div>
    `;
  }

  list.innerHTML = `
    <button class="loc-action" id="companion-back-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
    </button>
    <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:10px 0 8px;">A New Face</div>
    ${bodyHTML}
  `;
  // Same banner-overlay treatment as showNotableFigurePanel — the companion appears layered
  // over the settlement's own art rather than the panel reading as a disconnected card.
  const portraitEl = document.getElementById('loc-banner-portrait');
  if(companion && companion.portrait){
    portraitEl.innerHTML = `<img src="${companion.portrait}" alt="${companion.name}">`;
    portraitEl.classList.add('show');
  } else {
    portraitEl.classList.remove('show');
    portraitEl.innerHTML = '';
  }
  document.getElementById('companion-back-btn').addEventListener('click', ()=> showLocationView(burgId));
  const declineBtn = document.getElementById('companion-decline-btn');
  if(declineBtn) declineBtn.addEventListener('click', ()=> showLocationView(burgId));
  const recruitBtn = document.getElementById('companion-recruit-btn');
  if(recruitBtn){
    recruitBtn.addEventListener('click', ()=>{
      const c = getCompanionForBurg(burgId);
      if(!c || getActivePartySize() >= MAX_PARTY_SIZE){ showCompanionPanel(burgId); return; } // state shifted between render and click
      const party = getParty();
      party.push(c.id);
      saveParty(party);
      showToast(`${c.name} joins your party.`);
      showLocationView(burgId);
    });
  }
}

function showLocationView(burgId){
  stopWaiting();
  const b = graph.burgs[burgId];
  if(!b) return;
  recordVisitedBurg(burgId);
  checkQuestTurnIns(burgId);
  document.getElementById('loc-heading').textContent = b.name;
  const controller = getController(burgId);
  const controlNote = (controller !== b.race) ? ` · ${RACE_LABEL[controller]}-controlled` : '';
  document.getElementById('loc-sub').textContent = `${TIER_LABEL[b.tier]||b.tier}${controlNote}`;
  document.getElementById('loc-banner-art').innerHTML = TIER_ART[b.tier] || TIER_ART.village;
  document.getElementById('loc-banner-portrait').classList.remove('show');
  document.getElementById('loc-banner-portrait').innerHTML = '';

  const workedToday = hasWorkedToday(burgId);
  const actions = [
    { icon:`<path d="M5 3h14l-1 9a6 6 0 0 1-12 0L5 3z"/><path d="M8 21h8"/><path d="M12 15v6"/>`, title:"The Tavern", desc:"Rest up, hear local rumours, and buy a meal and a drink", action:'tavern' },
    { icon:`<path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>`, title:"Marketplace", desc:"Buy food and supplies", action:'market' },
    { icon:`<path d="M14.7 6.3a1 1 0 0 0-1.4 0L11 8.6 15.4 13l2.3-2.3a1 1 0 0 0 0-1.4z"/><path d="M11 8.6 4 15.6V20h4.4L15.4 13"/>`, title:"Work", desc: workedToday ? "Already worked here today — come back tomorrow" : "Take on odd jobs for a few hours' pay", action:'work', disabled:workedToday },
    { icon:`<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5"/><path d="M11 19c0-3 2.5-5 5-5s5 2 5 5"/>`, title:"Talk to Townsfolk", desc:"Ask what's happening in the world", action:'talk' },
    { icon:`<path d="M6 3h12v4H6z"/><path d="M9 7v14M9 9h6M9 12h6M9 15h4"/>`, title:"Quest Board", desc:"See what work needs doing", action:'questboard' },
  ];
  // City/Capital settlements get extra actions on top of the base five, so a big
  // settlement actually feels bigger rather than just carrying a fancier building icon.
  if(b.tier === 'city' || b.tier === 'capital'){
    actions.push({ icon:`<path d="M12 3l2.5 4.5H20l-4 4 1.5 5.5L12 14l-5.5 3 1.5-5.5-4-4h5.5z"/>`, title:"Temple", desc:"Seek a blessing", action:'temple' });
    actions.push({ icon:`<path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-7h6v7"/>`, title:"Guard House", desc:"Hear how the watch is holding the walls", action:'guardhouse' });
    actions.push({ icon:`<path d="M6 3l3 3-8 8-3-3z"/><path d="M13 10l3-3 5 5-3 3z"/><path d="M6 18l3-3"/>`, title:"Blacksmith", desc:"Buy masterwork weapons and armour", action:'blacksmith' });
    // Not every City/Capital gets this one — only the handful that are home to a
    // NOTABLE_FIGURES entry, and only while that figure's home hasn't been captured
    // (see getFigureForBurg). Most settlements simply won't show it, same as most
    // settlements don't have a Palace.
    if(getFigureForBurg(burgId)){
      actions.push({ icon:`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>`, title:"Notable Figure", desc:"Someone here wants a word", action:'notable_figure' });
    }
    // Same pinned-to-one-city, disappears-if-captured pattern as Notable Figure just above, but
    // a completely different encounter — see COMPANIONS/getCompanionForBurg and
    // showCompanionPanel below. Already hidden once recruited (getCompanionForBurg checks
    // goblinwar_party itself), so there's no need to also gate this push on party size.
    if(getCompanionForBurg(burgId)){
      actions.push({ icon:`<circle cx="9" cy="8" r="3.5"/><path d="M3 21c0-3.9 2.7-7 6-7s6 3.1 6 7"/><path d="M18 8v6M15 11h6"/>`, title:"A New Face", desc:"Someone here seems to be watching you with interest", action:'companion' });
    }
  }
  if(b.tier === 'capital'){
    actions.push({ icon:`<path d="M4 21h16"/><path d="M5 21V9l3-3 4 3 4-3 3 3v12"/><path d="M12 21v-6"/>`, title:"The Palace", desc:"Learn of the ruling court", action:'palace' });
  }
  // Any settlement, any tier, can be under siege (advanceSiege doesn't restrict targeting by
  // tier) or have taken in refugees this week — both conditions are rare enough day-to-day that
  // showing the action only when it actually applies is worth the extra check.
  const activeSiege = getSieges()[burgId];
  if(activeSiege){
    const defendedToday = hasDefendedToday(burgId);
    actions.push({ icon:`<path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-7h6v7"/><path d="M3 10h18"/>`, title:"Defend the Walls", desc: defendedToday ? "You've already fought here today — come back tomorrow" : `${activeSiege.attackerKingdom}'s forces are attacking`, action:'defend_walls', disabled:defendedToday });
  }
  if(hasRecentRefugeeArrival(burgId)){
    actions.push({ icon:`<circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M13 20c.3-2.3 2-4 3.5-4.2"/>`, title:"Refugee Camp", desc:"Help those who fled the fighting", action:'refugee_camp' });
  }
  const list = document.getElementById('loc-action-list');
  list.innerHTML = actions.map(a => `
    <button class="loc-action" data-action="${a.action}" ${a.disabled ? 'disabled' : ''}>
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${a.icon}</svg>
      <span class="li-text"><b>${a.title}</b><span>${a.desc}</span></span>
    </button>
  `).join('');
  list.querySelectorAll('.loc-action').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.action === 'tavern') showTavernPanel(burgId);
      else if(btn.dataset.action === 'market') showMarketPanel(burgId);
      else if(btn.dataset.action === 'blacksmith') showBlacksmithPanel(burgId);
      else if(btn.dataset.action === 'work') doWork(burgId);
      else if(btn.dataset.action === 'questboard') showQuestBoardPanel(burgId);
      else if(btn.dataset.action === 'temple') showFlavorPanel(burgId, 'Temple', TEMPLE_LINES);
      else if(btn.dataset.action === 'guardhouse'){
        showFlavorPanel(burgId, 'Guard House', GUARDHOUSE_LINES, buildGuardHouseStats(burgId) + buildMercenaryHireHTML(burgId));
        wireMercenaryButtons(burgId);
      }
      else if(btn.dataset.action === 'palace'){
        showFlavorPanel(burgId, 'The Palace', PALACE_LINES, buildPalacePetitionHTML(burgId) + buildNegotiatePeaceHTML(burgId));
        wirePalaceButtons(burgId);
      }
      else if(btn.dataset.action === 'notable_figure') showNotableFigurePanel(burgId);
      else if(btn.dataset.action === 'companion') showCompanionPanel(burgId);
      else if(btn.dataset.action === 'talk') showFlavorPanel(burgId, 'Talk to Townsfolk', getTownsfolkLines(burgId));
      else if(btn.dataset.action === 'defend_walls') triggerSiegeDefenseFight(burgId, (result)=> resolveSiegeDefense(burgId, result));
      else if(btn.dataset.action === 'refugee_camp'){
        showFlavorPanel(burgId, 'Refugee Camp', REFUGEE_LINES, buildRefugeeAidHTML(burgId));
        const aidBtn = document.getElementById('refugee-aid-btn');
        if(aidBtn) aidBtn.addEventListener('click', ()=> acceptRefugeeAid(burgId));
      }
      else showToast("Not built yet — coming in a future update.");
    });
  });

  document.getElementById('location-view').classList.add('show');
}

// Work is on cooldown per-settlement, once per calendar day — resets whenever gameDay
// advances (travelling far enough or resting), not on a real-world timer.
const WORK_COOLDOWN_KEY = "goblinwar_workCooldowns";
function getWorkCooldowns(){
  try{ return JSON.parse(localStorage.getItem(WORK_COOLDOWN_KEY)) || {}; }catch(e){ return {}; }
}
function hasWorkedToday(burgId){ return getWorkCooldowns()[burgId] === gameDay; }
function recordWorked(burgId){
  const cd = getWorkCooldowns();
  cd[burgId] = gameDay;
  localStorage.setItem(WORK_COOLDOWN_KEY, JSON.stringify(cd));
}

const WORK_LINES = [
  "You spend the afternoon hauling crates at the docks.",
  "You help mend a fence for a grateful farmer.",
  "You lend a hand chopping wood behind the smithy.",
  "You do a few hours of odd jobs for the innkeeper.",
  "You help a merchant unload a cart of goods.",
];
function doWork(burgId){
  if(hasWorkedToday(burgId)){
    showToast("Already worked here today — come back tomorrow.");
    return;
  }
  const earned = randRange([3,15]);
  setGold(playerGold + earned);
  recordWorked(burgId);
  const line = WORK_LINES[Math.floor(Math.random()*WORK_LINES.length)];
  showToast(`${line} You earn ${earned} gold.`);
  showLocationView(burgId);
}

// (see context/roadmap.md's "Party / Companions" and "Companion loyalty" — a mercenary never
// gets that system, it's cash only). Mercenaries now fight too — each type's combatHp/
// combatDmgRange feed startCombat's ally roster (see "Party in combat" in context/combat.md) —
// and can die for good mid-fight, per the project owner; MERCENARY_TYPES here is where a new
// role's combat stats live alongside its hire price, since party.html's duplicate copy never
// needs them (it only displays the roster, it doesn't run combat).
const MERCENARY_KEY = "goblinwar_mercenaries"; // JSON array of {instanceId, typeId, hiredDay, lastUpkeepDay}
const MAX_PARTY_SIZE = 3; // shared cap across recruited companions (goblinwar_party) and hired mercenaries

  { id:"sellsword",        title:"Hired Sellsword",   blurb:"A blade for hire, hood up, face down.",       hireCost:40, upkeep:5, portrait:"assets/mercenaries/sellsword.png",        combatHp:40, combatDmgRange:[8,14] },

  { id:"veteran_guard",    title:"Veteran Guard",     blurb:"Old armor, older habits — steady in a fight.", hireCost:55, upkeep:6, portrait:"assets/mercenaries/veteran-guard.png",    combatHp:55, combatDmgRange:[6,11] },
];
// Recruitable companions — see party.html's own COMPANIONS copy (duplicated per the no-modules
// convention; that copy doesn't need homeBurgId since it only ever displays already-recruited
// companions, never triggers a recruit). Each is pinned to one real settlement, same pattern as
// NOTABLE_FIGURES — but per the project owner, spread across different cities ("random cities")
// rather than sharing any of theirs (5, 3, 1, 24, 11), and Thrain (a dwarf) sits in Dwarf
// territory rather than Human, matching his own race. Recruiting is a conversation, not a cash
// transaction like hiring a mercenary — the player hears their story (`blurb`, reused verbatim
// as what the companion actually says) and chooses whether to accept, no upkeep either way.
const COMPANIONS = [
  { id:"brannoc-ward", name:"Ser Brannoc Ward", title:"a sellsword knight, more scars than shine", blurb:"Fights for coin now, but still remembers what it felt like to fight for something else.", portrait:"assets/party/brannoc-ward.png", homeBurgId:"19" },

];
function getParty(){ try{ return JSON.parse(localStorage.getItem(PARTY_KEY)) || []; }catch(e){ return []; } }
function saveParty(list){ localStorage.setItem(PARTY_KEY, JSON.stringify(list)); }
function getMercenaries(){ try{ return JSON.parse(localStorage.getItem(MERCENARY_KEY)) || []; }catch(e){ return []; } }
function saveMercenaries(list){ localStorage.setItem(MERCENARY_KEY, JSON.stringify(list)); }
function getActivePartySize(){ return getParty().length + getMercenaries().length; }
// Returns the companion whose home this is, or null if there's no companion here at all,
// they're already recruited, or their home's been captured by another race since — same three
// checks (place, state, captured) getFigureForBurg runs for NOTABLE_FIGURES, and the same
// "they disappear if their city falls" rule per the project owner.
function getCompanionForBurg(burgId){
  const companion = COMPANIONS.find(c => c.homeBurgId === burgId);
  if(!companion) return null;
  if(getParty().includes(companion.id)) return null;
  const home = graph.burgs[companion.homeBurgId];
  if(!home || getController(companion.homeBurgId) !== home.race) return null;
  return companion;
}
// Snapshots the current hired mercenaries into fresh combat-only HP pools — see startCombat and
// "Party in combat" in context/combat.md. Companions (goblinwar_party) don't join yet since

// mercenary's combat HP is never persisted — it's full at the start of every fight — so the only
// lasting consequence of one dropping to 0 is mercenaryFalls() removing them from the roster
// outright, not a wound that carries between fights.
function buildCombatAllies(){

}

function hireMercenary(burgId, typeId){

  if(!type) return;
  if(getActivePartySize() >= MAX_PARTY_SIZE){ showToast("Your party is full."); return; }
  if(playerGold < type.hireCost){ showToast("Not enough gold to hire them."); return; }
  setGold(playerGold - type.hireCost);
  const mercs = getMercenaries();
  mercs.push({ instanceId:`${type.id}_${gameDay}_${Math.floor(Math.random()*100000)}`, typeId:type.id, hiredDay:gameDay, lastUpkeepDay:gameDay });
  saveMercenaries(mercs);
  showToast(`${type.title} joins you — ${type.hireCost}g paid, ${type.upkeep}g/day upkeep from here.`);
  showFlavorPanel(burgId, 'Guard House', GUARDHOUSE_LINES, buildGuardHouseStats(burgId) + buildMercenaryHireHTML(burgId));
  wireMercenaryButtons(burgId);

function wireMercenaryButtons(burgId){
  document.querySelectorAll('[data-hire]').forEach(btn=>{
    btn.addEventListener('click', ()=> hireMercenary(burgId, btn.dataset.hire));
  });
}
// Charged from advanceTime() (see the calendar section above) whenever a day actually crosses —
// once per elapsed day, not per settlement (a mercenary's
// pay doesn't pause just because the player is out of town). A mercenary who can't be paid in
// full leaves outright rather than partially — simpler than prorating, and gives the player a
// clear "pay up or lose them" signal via the toast instead of a silent shortfall.
function chargeMercenaryUpkeep(){
  const mercs = getMercenaries();
  if(!mercs.length) return;
  const departedTitles = [];
  const kept = mercs.filter(m => {
    const type = MERCENARY_TYPES.find(t => t.id === m.typeId);
    if(!type) return false; // stale/unknown type — drop it rather than keep an uncharged freeloader
    const daysOwed = gameDay - m.lastUpkeepDay;
    if(daysOwed <= 0) return true;
    const cost = daysOwed * type.upkeep;
    if(playerGold >= cost){
      setGold(playerGold - cost);
      m.lastUpkeepDay = gameDay;
      return true;
    }
    departedTitles.push(type.title);
    return false;
  });
  // Always persist — not just on a departure. A survivor's updated lastUpkeepDay lives only on
  // the in-memory `m` mutated above; skipping this save whenever nobody left would leave that
  // update unwritten, so the same already-paid days would be billed again next time this runs.
  saveMercenaries(kept);
  if(departedTitles.length){
    showToast(`${departedTitles.join(', ')} left your service — you couldn't cover their pay.`);
  }
}

// Petition for Troops — the player-facing trigger for alliance reinforcement (see
// getArmyStrength/setReinforcement above). Only offered at a Capital that (a) still belongs to
// its own original court (not captured — a captured capital has no court of its own left to
// petition) and (b) is currently at peace, when (c) at least one allied kingdom (same
// ALLIANCE, any race) is at war and could use the help. Picks whichever qualifying ally has
// the *least* current reinforcement — so repeat petitions (at different Capitals, or the same
// one after the last grant expires) spread help around rather than always favoring one ally.
function findAllyNeedingReinforcement(kingdom){
  const alliance = ALLIANCE[KINGDOM_RACE[kingdom]];
  if(getWarState(kingdom) !== 'peace') return null; // can't spare troops while fighting your own war
  const allies = ALL_KINGDOMS.filter(k => k !== kingdom && ALLIANCE[KINGDOM_RACE[k]] === alliance && getWarState(k) === 'war');
  if(!allies.length) return null;
  allies.sort((a,b) => getReinforcementBonus(a) - getReinforcementBonus(b));
  return allies[0];
}
// Regenerated fresh each call, seeded by kingdom+gameDay like the Quest Board/Notable Figure
// offers — reopening the Palace the same day shows the same numbers, a new day rerolls them.
function generatePetitionOffer(burgId){
  const b = graph.burgs[burgId];
  const kingdom = b.state;
  if(!kingdom || getController(burgId) !== b.race) return null; // no legitimate court left here
  const ally = findAllyNeedingReinforcement(kingdom);
  if(!ally) return null;
  const seed = hashSeed(`petition_${kingdom}_${gameDay}`);
  const gold = 20 + Math.floor(seededRandom(seed+1) * 21); // 20-40
  const xp = 15 + Math.floor(seededRandom(seed+2) * 11);   // 15-25
  return { kingdom, ally, gold, xp };
}
function buildPalacePetitionHTML(burgId){
  const offer = generatePetitionOffer(burgId);
  if(!offer) return '';
  return `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin-top:12px;">
      <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">Petition for Troops</div>
      <div style="font-size:13px; color:#a9926a; line-height:1.5; margin-bottom:10px;">${offer.kingdom} stands at peace while ${offer.ally} fights on. Urge the court to send reinforcements.</div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:#7fbf6a; font-weight:700;">${offer.gold}g &middot; ${offer.xp} XP</span>
        <button class="btn btn-primary" style="flex:none; padding:8px 16px;" id="petition-accept-btn">Petition</button>
      </div>
    </div>
  `;
}
// Resolves instantly — no travel or turn-in step, unlike Deliver/Kill quests. The trip to this
// specific Capital already *is* the "go there" part; convincing the court is one conversation,
// not a multi-stage task, so accepting immediately applies the reinforcement and pays out.
function acceptPetition(burgId){
  const offer = generatePetitionOffer(burgId);
  if(!offer) { showLocationView(burgId); return; } // war/peace state shifted since the panel opened
  setReinforcement(offer.ally, getArmyStrength(offer.kingdom) * REINFORCEMENT_FRACTION, offer.kingdom);
  setGold(playerGold + offer.gold);
  const leveledUp = addXp(offer.xp);
  showToast(`${offer.kingdom} agrees to send reinforcements to ${offer.ally}! +${offer.gold}g, +${offer.xp} XP.`
    + (leveledUp ? ` Level up! You are now level ${playerLevel}.` : ''));
  showFlavorPanel(burgId, 'The Palace', PALACE_LINES, buildPalacePetitionHTML(burgId) + buildNegotiatePeaceHTML(burgId));
  wirePalaceButtons(burgId);
}

// Negotiate Peace — the counterpart to Petition for Troops, and the direct payoff of tracking
// pairwise relations (see getEnemiesAtWar) instead of a single per-kingdom war flag: the player
// can now buy off *one specific enemy* rather than an undifferentiated "the war." Offered at any
// Capital still held by its own court that has at least one active war relation. The gold cost
// scales with how much leverage the player effectively has — cheaper against a relatively weak
// enemy (reusing the same strength-ratio math advanceSiege already computes), pricier against a
// strong one. Picks the weakest enemy when more than one applies, same "start with the easiest
// win" logic Petition for Troops' least-reinforced-ally pick already uses.
const NEGOTIATE_PEACE_BASE_COST = 150;
function generateNegotiatePeaceOffer(burgId){
  const b = graph.burgs[burgId];
  const kingdom = b.state;
  if(!kingdom || getController(burgId) !== b.race) return null; // no legitimate court left here
  const enemies = getEnemiesAtWar(kingdom);
  if(!enemies.length) return null;
  const myStrength = getArmyStrength(kingdom);
  enemies.sort((a,b2) => getArmyStrength(a) - getArmyStrength(b2));
  const enemy = enemies[0];
  const enemyStrength = getArmyStrength(enemy);
  const ratio = enemyStrength / ((myStrength + enemyStrength) || 1); // weaker enemy -> lower ratio -> cheaper truce
  const cost = Math.round(NEGOTIATE_PEACE_BASE_COST * Math.max(0.4, Math.min(1.6, ratio * 2)));
  return { kingdom, enemy, cost };
}
function buildNegotiatePeaceHTML(burgId){
  const offer = generateNegotiatePeaceOffer(burgId);
  if(!offer) return '';
  return `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin-top:12px;">
      <div style="font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px;">Negotiate Peace</div>
      <div style="font-size:13px; color:#a9926a; line-height:1.5; margin-bottom:10px;">${offer.kingdom} is at war with ${offer.enemy}. Bribe envoys to broker a truce between them.</div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:#e0a860; font-weight:700;">${offer.cost}g</span>
        <button class="btn btn-primary" style="flex:none; padding:8px 16px;" id="negotiate-peace-btn">Negotiate</button>
      </div>
    </div>
  `;
}
// On success, ends the war relation outright and cancels any active siege between the two
// kingdoms (see cancelSiegesBetween) — the defender keeps whatever it still held; there's no
// partial credit for a siege that was almost finished.
function acceptNegotiatePeace(burgId){
  const offer = generateNegotiatePeaceOffer(burgId);
  if(!offer){ showLocationView(burgId); return; } // relations shifted since the panel opened
  if(playerGold < offer.cost){ showToast("Not enough gold to sway the court."); return; }
  setGold(playerGold - offer.cost);
  setRelation(offer.kingdom, offer.enemy, 'peace');
  cancelSiegesBetween(offer.kingdom, offer.enemy);
  buildFrontlineMarkers();
  showToast(`${offer.kingdom} and ${offer.enemy} agree to a truce.`);
  showFlavorPanel(burgId, 'The Palace', PALACE_LINES, buildPalacePetitionHTML(burgId) + buildNegotiatePeaceHTML(burgId));
  wirePalaceButtons(burgId);
}
// Both Palace cards can appear together in the same panel render, so their click handlers are
// wired from one shared place rather than duplicating the "if the button exists, wire it" guard
// at every call site that re-renders the panel.
function wirePalaceButtons(burgId){
  const petitionBtn = document.getElementById('petition-accept-btn');
  if(petitionBtn) petitionBtn.addEventListener('click', ()=> acceptPetition(burgId));
  const negotiateBtn = document.getElementById('negotiate-peace-btn');
  if(negotiateBtn) negotiateBtn.addEventListener('click', ()=> acceptNegotiatePeace(burgId));
}

// Aid the Refugees — the simplest of the three player-involvement hooks, deliberately: spend
// gold and Food to help a settlement's recently-arrived refugees (see hasRecentRefugeeArrival)
// settle in, same instant-resolve pattern as Petition for Troops rather than a travel/turn-in
// quest.
const REFUGEE_AID_GOLD_COST = 15;
const REFUGEE_AID_FOOD_COST = 2;
const REFUGEE_AID_POP_BOOST = 0.05; // ~50 people helped onto their feet rather than left destitute
const REFUGEE_AID_XP_RANGE = [10,20];
function buildRefugeeAidHTML(burgId){
  if(!hasRecentRefugeeArrival(burgId)) return '';
  return `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin-top:12px;">

// Defend the Walls — fighting in an active siege's defense (see goblinwar_sieges/advanceSiege).
// Once per settlement per day (same cooldown pattern as Work, see hasWorkedToday), so it can't
// be spammed to trivialize every siege — per the project's own "player can grow strong but never
// solo-topple a city" design constraint (see roadmap.md), one fight meaningfully helps rather
// than instantly deciding the outcome.
const SIEGE_DEFENSE_PROGRESS_RELIEF = 30; // % knocked off the siege's progress on a successful defense
const SIEGE_DEFENSE_GOLD_RANGE = [15,35];
const SIEGE_DEFENSE_XP_RANGE = [20,35];
function getSiegeDefenseCooldowns(){ try{ return JSON.parse(localStorage.getItem(SIEGE_DEFENSE_COOLDOWN_KEY)) || {}; }catch(e){ return {}; } }
function hasDefendedToday(burgId){ return getSiegeDefenseCooldowns()[burgId] === gameDay; }
function recordSiegeDefended(burgId){
  const cd = getSiegeDefenseCooldowns();
  cd[burgId] = gameDay;
  localStorage.setItem(SIEGE_DEFENSE_COOLDOWN_KEY, JSON.stringify(cd));
}
// Builds a fight from the attacking kingdom's own race/variant table (see ENEMY_VARIANTS) and
// starts it via the same generic startCombat used by ambushes — siege attacks are never solo,
// same "2-3 enemies" curation triggerEnemyFight already applies to raiding-party ambushes.
// startCombat's own title/log strings are ambush-flavored, so they're overwritten right after
// the call with siege-appropriate text instead.
function triggerSiegeDefenseFight(burgId, onEnd){
  const siege = getSieges()[burgId];
  if(!siege) return;
  const attackerRace = KINGDOM_RACE[siege.attackerKingdom] || 'ork';
  const variants = ENEMY_VARIANTS[attackerRace] || ENEMY_VARIANTS.ork;
  const count = 2 + Math.floor(Math.random()*2); // 2 or 3
  const specs = [];
  for(let i=0;i<count;i++) specs.push(variants[Math.floor(Math.random()*variants.length)]);
  startCombat(specs, PLAYER_DMG_RANGE, onEnd || (()=>{}), attackerRace);
  // Recorded so endCombat's victory branch can attribute killed-enemy population loss (see
  // applyEnemyCasualtyLoss) to this specific kingdom rather than just "the nearest settlement of
  // that race" — a plain ambush has no particular kingdom behind it, but a siege's attacker does.
  combat.attackerKingdom = siege.attackerKingdom;
  document.getElementById('combat-title').textContent = 'Defend the Walls!';
  // Appended, not overwritten — startCombat already seeded the log with a random
  // COMBAT_INTRO_LINES beat plus its own "N enemies block your path!" line; this replaces
  // only that second, ambush-flavored line with siege-appropriate wording instead of
  // discarding the story beat above it.
  const log = document.getElementById('combat-log');
  log.innerHTML = log.querySelector('.combat-intro-line').outerHTML
    + `<div>${siege.attackerKingdom}'s forces storm the walls of ${graph.burgs[burgId].name}!</div>`;
}
// Combat's onEnd hook, per-siege: victory knocks a meaningful chunk off progress (not an
// instant win) plus a reward; defeat/flee simply leaves the siege to advance normally on the
// next weekly tick.
function resolveSiegeDefense(burgId, result){
  const sieges = getSieges();
  const siege = sieges[burgId];
  if(!siege) return;
  recordSiegeDefended(burgId);
  if(result === 'victory'){
    siege.progress = Math.max(0, siege.progress - SIEGE_DEFENSE_PROGRESS_RELIEF);
    setSieges(sieges);
    const gold = randRange(SIEGE_DEFENSE_GOLD_RANGE);
    const xp = randRange(SIEGE_DEFENSE_XP_RANGE);
    setGold(playerGold + gold);
    const leveledUp = addXp(xp);
    showToast(`You help drive back ${siege.attackerKingdom}'s attack! The siege eases — +${gold}g, +${xp} XP.`
      + (leveledUp ? ` Level up! You are now level ${playerLevel}.` : ''));
  } else {
    showToast(`The attack presses on despite your efforts.`);
  }
  showLocationView(burgId);
}

fetch('assets/travel-graph.json').then(r=>r.json()).then(graphData=>{
  graph = graphData;
  buildAdjacency();
  buildFactionData();
  buildBurgAdjacency();
  if(!graph.burgs[currentBurg]){
    currentBurg = "5"; // Bary — fallback if a stale/invalid location was saved
    localStorage.setItem(LOC_KEY, currentBurg);
  } else if(!(adjacency[graph.burgs[currentBurg].cell] && adjacency[graph.burgs[currentBurg].cell].length)){
    // Saved location exists but has no road connections at all (extremely
    // rare — only 1 of 796 settlements is fully isolated) — fall back
    // to Bary rather than stranding the player somewhere with no way out.
    currentBurg = "5";
    localStorage.setItem(LOC_KEY, currentBurg);
  }

  buildRoads();
  buildSettlementDots();
  buildHitzones();
  buildLabels();
  buildCityIcons();
  buildFrontlineMarkers();
  buildQuestMarkers();
  drawPlayerMarker();
  refreshCalendarUI();
  refreshPlayerStatUI();
  refreshReachability();

  const img = document.getElementById('map-img');
  const finishLoad = ()=>{
    // A ?viewBurg=<id> param (quests.html's View Location button — see viewLocation below)
    // overrides the normal "recenter on where you actually are" behavior, so a quest's
    // destination opens centered and highlighted instead of wherever the player last stood.
    // Centers directly at the standard REGION_W-wide scale rather than going through
    // viewLocation() itself — that helper's Math.max(view.scale, ...) guard is meant to avoid
    // zooming a live session *out* below whatever the player was already zoomed in to (see FIND
    // ME/#recenter-btn), but view.scale is still just its meaningless {scale:1} default this
    // early in a fresh page load, so taking a max against it here would leave the map more
    // zoomed in than a normal load ever starts at.
    const viewBurgId = new URLSearchParams(location.search).get('viewBurg');
    const targetBurg = viewBurgId && graph.burgs[viewBurgId];
    if(targetBurg){
      centerOnLogical(targetBurg.x, targetBurg.y, viewport.clientWidth / ((STAGE_W/LOGICAL_W)*REGION_W));
      onMapTap(viewBurgId);
    } else {
      centerOnLogical(START_X, START_Y, viewport.clientWidth / ((STAGE_W/LOGICAL_W)*REGION_W));
      // if returning to a saved location elsewhere, recenter there instead
      const b = graph.burgs[currentBurg];
      if(b && (b.x !== START_X || b.y !== START_Y)){
        centerOnLogical(b.x, b.y, viewport.clientWidth / ((STAGE_W/LOGICAL_W)*REGION_W));
      }
    }
    document.getElementById('loading').classList.add('hide');
    authGateReady.then(session=>{
      if(!session) return; // being redirected to login.html
      CHANGELOG_SEEN_KEY = `goblinwar_lastSeenChangelog_${session.user.id}`;
      checkForWhatsNew();
    });
  };
  if(img.complete) finishLoad();
  else img.addEventListener('load', finishLoad);
}).catch(err=>{
  document.getElementById('loading').textContent = 'Could not load the map.';
  console.error(err);
});

// no-modules convention) — but this copy also carries the world-state keys
// (territoryControl/warState/lastWarTick/population), which never round-tripped through the
// old local save slots at all; now that a Supabase account can run more than one character
// on the same device, leaving those in flat localStorage would let two characters bleed
// into each other's faction/war progress, so they're part of the per-character snapshot too.
function collectCharacterSnapshot(){
  return {
    name: localStorage.getItem(NAME_KEY) || "Unnamed Hero",
    burgId: localStorage.getItem(LOC_KEY) || "5",
    day: parseInt(localStorage.getItem(CAL_KEY) || "0", 10),
    hour: parseFloat(localStorage.getItem(HOUR_KEY) || "8"),
    heading: parseFloat(localStorage.getItem(HEADING_KEY) || "0"),
    health: parseInt(localStorage.getItem(HEALTH_KEY) || "100", 10),
    maxHealth: parseInt(localStorage.getItem(MAXHEALTH_KEY) || "100", 10),
    stamina: parseInt(localStorage.getItem(STAMINA_KEY) || "100", 10),
    maxStamina: parseInt(localStorage.getItem(MAXSTAMINA_KEY) || "100", 10),
    hunger: parseInt(localStorage.getItem(HUNGER_KEY) || "100", 10),
    thirst: parseInt(localStorage.getItem(THIRST_KEY) || "100", 10),
    isDead: localStorage.getItem(ISDEAD_KEY) === 'true',
    permadeathPlayer: localStorage.getItem(PERMADEATH_PLAYER_KEY) === 'true',
    permadeathCompanions: localStorage.getItem(PERMADEATH_COMPANIONS_KEY) === 'true',
    permadeathMercenaries: localStorage.getItem(PERMADEATH_MERCENARIES_KEY) === 'true',
    age: localStorage.getItem(AGE_KEY) || "24",
    gold: parseInt(localStorage.getItem(GOLD_KEY) || "50", 10),
    inventory: localStorage.getItem(INV_KEY) || JSON.stringify(DEFAULT_INVENTORY),
    equipped: localStorage.getItem(EQUIPPED_KEY) || "{}",
    level: parseInt(localStorage.getItem(LEVEL_KEY) || "1", 10),
    xp: parseInt(localStorage.getItem(XP_KEY) || "0", 10),
    skillPoints: parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10),
    stats: localStorage.getItem(STATS_KEY) || JSON.stringify({str:0,agi:0,int:0}),
    skills: localStorage.getItem(SKILLS_KEY) || "{}",
    kills: localStorage.getItem(KILLS_KEY) || "{}",
    quests: localStorage.getItem(QUEST_KEY) || "[]",
    completedQuests: localStorage.getItem(COMPLETEDQUEST_KEY) || "[]",
    questsCompletedTotal: getQuestsCompletedTotal(),
    visitedBurgs: localStorage.getItem(VISITED_BURGS_KEY) || "[]",
    defeatedVariants: localStorage.getItem(DEFEATED_VARIANTS_KEY) || "{}",
    party: localStorage.getItem(PARTY_KEY) || "[]",
    mercenaries: localStorage.getItem(MERCENARY_KEY) || "[]",
    territoryControl: localStorage.getItem(TERRITORY_KEY) || "{}",
    relations: localStorage.getItem(RELATIONS_KEY) || "{}",
    reinforcements: localStorage.getItem(REINFORCE_KEY) || "{}",
    lastWarTick: parseInt(localStorage.getItem(LASTWARTICK_KEY) || "0", 10),
    population: localStorage.getItem(POPULATION_KEY) || "{}",
    sieges: localStorage.getItem(SIEGE_KEY) || "{}",
    refugeeArrivals: localStorage.getItem(REFUGEE_ARRIVAL_KEY) || "{}",
    siegeDefenseCooldowns: localStorage.getItem(SIEGE_DEFENSE_COOLDOWN_KEY) || "{}",
    savedAt: new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
  };
}

// Fires on an interval, on tab-hide, and before leaving to another page (see goTo() below) —
// not on every single state mutation, which would mean hooking dozens of call sites across
// this file. That leaves a small window (well under a minute, or however long the tab stays
// foregrounded after the last action) where a hard crash could lose the very latest change,
// but covers every normal way a player actually stops playing.
async function saveActiveCharacter(){
  const activeId = localStorage.getItem('goblinwar_activeCharacterId');
  if(!activeId) return;
  const savedAt = new Date().toISOString();
  await sb.from('characters')
    .update({ data: collectCharacterSnapshot(), updated_at: savedAt })
    .eq('id', activeId)
    // Records what this device just wrote — settings.html's stale-save warning (see
    // LOCALSYNC_KEY there) compares this against the row's live updated_at to catch the same
    // character having been saved more recently elsewhere since this device's last write.
    .then(()=>{ localStorage.setItem('goblinwar_localSyncedAt', savedAt); }, ()=>{}); // best-effort — a failed autosave shouldn't surface as an error to the player
}
setInterval(saveActiveCharacter, 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') saveActiveCharacter();
});

// Every nav-bar link to another page goes through this instead of a bare location.href, so
// the active character is saved before we leave — otherwise anything since the last autosave
// tick would be lost the moment the player taps to Inventory/Hero/Settings. Per the project
// owner, this used to visibly block navigation (await the save, then navigate) since a plain
// fetch can get aborted when the browser unloads this page for the next one — that's what made
// every single toolbar tap feel slow. assets/auth-client.js's shared `sb` client now sends
// every request with `keepalive:true`, which is the fetch spec's own mechanism for a request
// surviving exactly that unload, so the save no longer needs to finish before navigating away —
// same guarantee, without the wait.
function goTo(page){
  saveActiveCharacter();
  location.href = page + '?_=' + Date.now();
}
</script>
</body>
</html>
