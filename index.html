<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Map</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a;
    --parchment:#e9dcb8; --parchment-shadow:#b9a06e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--water-dk); font-family:'EB Garamond', serif; touch-action:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  header{
    position:relative; z-index:20;
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(9px + env(safe-area-inset-top)) 14px 9px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:17px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #date-badge{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    color:var(--parchment); background:rgba(255,255,255,.06);
    border:1px solid rgba(209,164,69,.5); border-radius:3px;
    padding:5px 9px; text-align:right; line-height:1.4;
  }
  #date-badge b{ color:var(--gold-lt); }
  #clock-badge{
    display:flex; align-items:center; gap:3px; justify-content:flex-end;
    margin-top:2px; padding-top:2px; border-top:1px solid rgba(209,164,69,.25);
  }
  #clock-badge svg{ width:11px; height:11px; flex:none; color:var(--gold-lt); }
  #clock-badge b{ font-size:10.5px; }

  #toolbar{
    position:relative; z-index:19;
    background:#1b1208;
    border-bottom:2px solid rgba(169,122,31,.5);
    padding:8px 10px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; row-gap:8px;
  }
  #nav-icons{ display:flex; gap:4px; order:1; }
  .nav-btn{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--gold-lt);
    font-family:'Cinzel', serif; font-size:9px; letter-spacing:.3px; text-transform:uppercase;
    padding:6px 8px; border-radius:8px; white-space:nowrap;
  }
  .nav-btn:active{ background:rgba(255,255,255,.08); }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-badge{
    position:absolute; top:2px; right:3px; min-width:14px; height:14px; padding:0 3px;
    background:#c0392b; color:#fff; border-radius:7px; box-shadow:0 0 0 1.5px #1c150c;
    font-family:'Cinzel', serif; font-size:9px; font-weight:700; line-height:14px; text-align:center;
  }
  #zoom-controls{ display:flex; gap:8px; order:2; }
  #player-stats{ display:flex; flex-wrap:wrap; gap:7px; order:3; flex:1 1 100%; justify-content:center; }
  .stat-pill{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.06); border:1px solid rgba(209,164,69,.4);
    border-radius:20px; padding:5px 11px;
    font-family:'Cinzel', serif; font-size:13px; color:var(--parchment);
  }
  .stat-pill svg{ width:14px; height:14px; color:var(--gold-lt); flex:none; }
  .stat-pill.hunger-pill img{ width:16px; height:16px; flex:none; object-fit:contain; image-rendering:pixelated; }
  .stat-pill.thirst-pill svg{ color:#5bb0c7; }
  .stat-pill.stamina-pill svg{ color:#5b8fc7; }
  .stat-pill:first-child svg{ color:#c0524f; }
  /* Text abbreviations alongside each icon/color — so Health/Stamina/Hunger/Thirst are told
     apart by a label, not just hue, for players who can't reliably distinguish the pill colors. */
  .stat-tag{ font-size:9px; color:#a9926a; letter-spacing:.5px; }
  .zbtn{
    width:38px; height:38px; border-radius:9px; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold-lt); font-family:'Cinzel',serif; font-size:18px; font-weight:700;
  }
  .zbtn:active{ transform:scale(.94); }

  #map-viewport{ position:relative; flex:1; overflow:hidden; background:var(--water-dk); touch-action:none; }
  #map-stage{
    position:absolute; left:0; top:0;
    width:10240px; height:5108px;
    transform-origin:0 0;
    will-change:transform;
  }
  #map-img{ position:absolute; inset:0; width:10240px; height:5108px; display:block; user-select:none; -webkit-user-drag:none; }
  #overlay{ position:absolute; inset:0; width:10240px; height:5108px; }

  .hitzone{ fill:transparent; cursor:pointer; }
  .map-label{
    font-family:'Cinzel', serif; text-anchor:middle;
    fill:var(--gold-lt); paint-order:stroke; stroke:#1c150c; stroke-width:.6px; stroke-linejoin:round;
  }
  .road-line{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .road-line.road-road-edge{ stroke:#5c4326; stroke-width:2.2; opacity:.4; }
  .road-line.road-road-fill{ stroke:#c9a66b; stroke-width:1.1; opacity:.75; }
  .settlement-dot{ fill:var(--parchment); stroke:#1c150c; stroke-width:.5; }
  #highlight-ring{
    fill:none; stroke:var(--gold-lt); stroke-width:3;
    opacity:0; transition:opacity .15s;
    filter:drop-shadow(0 0 4px rgba(209,164,69,.8));
  }
  #highlight-ring.show{ opacity:1; }
  #highlight-ring circle{ animation:pulse-ring 1.4s ease-in-out infinite; transform-origin:center; }
  @keyframes pulse-ring{ 0%,100%{ r:22; opacity:1; } 50%{ r:27; opacity:.6; } }

  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; letter-spacing:1px; margin-right:6px; color:#fff; font-family:'Cinzel',serif; }
  .tag.human{ background:#33502f; }
  .tag.dwarf{ background:#2f4d55; }
  .tag.ork,.tag.goblin{ background:#6e2626; }

  #route-preview{ fill:none; stroke:#d1a445; stroke-width:2.6; stroke-dasharray:1 5; stroke-linecap:round; opacity:0; pointer-events:none; }

  .player-token{ pointer-events:none; }

  #ui-vignette{ position:absolute; inset:0; pointer-events:none; z-index:15; box-shadow: inset 0 0 100px 34px rgba(0,0,0,.5); }
  /* A color wash over the whole viewport, not the map content itself — stays put regardless of
     pan/zoom, same reasoning as #ui-vignette above it. Opacity is set live from gameHour (see
     updateNightOverlay) via --night-opacity, smoothly ramped through dawn/dusk rather than a hard
     day/night cutoff — see the "Day/night cycle" section of context/travel-and-map.md. */
  #night-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:14;
    background:#0a1230; opacity:var(--night-opacity, 0);
    transition:opacity 1.2s ease;
  }

  #recenter-btn{
    position:fixed; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    border:2px solid #7a5715; color:#241705; font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #recenter-btn:active{ transform:scale(.94); }

  #camp-here-btn{
    position:fixed; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:rgba(20,14,6,.88);
    border:2px solid var(--gold-lt); color:var(--gold-lt); font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #camp-here-btn:active{ transform:scale(.94); }
  #camp-here-btn.hide{ display:none; }

  #wait-controls{
    position:fixed; left:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
    background:rgba(24,17,8,.95); border:1.5px solid var(--gold); border-radius:12px;
    padding:8px 10px; display:flex; align-items:center; gap:7px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  #wait-controls.hide{ display:none; }
  .wait-btn{
    width:34px; height:34px; flex:none; border-radius:50%; border:1.5px solid var(--gold-lt);
    background:rgba(20,14,6,.6); color:var(--gold-lt); font-family:'Cinzel', serif; font-weight:700; font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .wait-btn.active{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; }
  .wait-btn:active{ transform:scale(.92); }
  .wait-btn:disabled{ opacity:.4; }
  #wait-status{
    font-family:'Cinzel', serif; font-size:9.5px; letter-spacing:.3px; color:var(--parchment);
    min-width:74px; text-align:center; line-height:1.25;
  }

  #info-card{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    border-top:3px solid var(--gold); border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,.45);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(115%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
  }
  #info-card.open{ transform:translateY(0); }
  #info-card .handle{ width:38px; height:4px; border-radius:3px; background:var(--parchment-shadow); margin:0 auto 10px; }
  #info-name{ font-family:'Cinzel Decorative', serif; font-size:20px; color:var(--parchment); margin:0 0 2px; }
  #info-meta{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:0 0 10px; }
  #info-travel{ font-size:15px; color:var(--parchment); margin:0 0 14px; line-height:1.5; }
  #info-travel b{ color:var(--gold-lt); }
  #info-actions{ display:flex; gap:10px; }
  .btn{ font-family:'Cinzel', serif; font-size:13px; letter-spacing:1px; border:none; border-radius:8px; padding:11px 16px; cursor:pointer; flex:1; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; box-shadow:0 3px 0 #7a5715; }
  .btn-secondary{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }

  #travel-controls{
    position:fixed; left:12px; right:12px; top:calc(160px + env(safe-area-inset-top,0px)); z-index:35;
    background:rgba(24,17,8,.95); border:1.5px solid var(--gold); border-radius:12px;
    padding:12px 14px; display:none; box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  #travel-controls.show{ display:block; }
  #travel-status{
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; color:var(--parchment);
    margin-bottom:10px; text-align:center;
  }
  #travel-status b{ color:var(--gold-lt); }
  #travel-buttons{ display:flex; gap:8px; }
  .travel-btn{
    flex:1; font-family:'Cinzel', serif; font-size:11.5px; letter-spacing:.5px;
    border-radius:8px; padding:9px 10px; cursor:pointer; border:1.5px solid var(--gold-lt);
  }
  .travel-btn:active{ transform:scale(.96); }
  #btn-stop-travel{ background:transparent; color:var(--gold-lt); }
  #btn-camp-travel{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; border-color:#7a5715; }

  #toast{
    position:fixed; top:calc(66px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:80; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #loading{
    position:fixed; inset:0; z-index:50; background:var(--water-dk);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--gold-lt); font-family:'Cinzel', serif; font-size:12px; letter-spacing:2px;
  }
  #loading.hide{ display:none; }

  #update-banner{
    position:fixed; top:0; left:0; right:0; z-index:95;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    color:#241705; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px; font-weight:700;
    text-align:center; cursor:pointer;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    transform:translateY(-100%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #update-banner.show{ transform:translateY(0); }
  #update-banner:active{ filter:brightness(.95); }

  #whats-new-modal{
    position:fixed; inset:0; z-index:90; display:none;
    background:rgba(10,7,3,.75);
    align-items:center; justify-content:center; padding:20px;
  }
  #whats-new-modal.show{ display:flex; }
  #whats-new-card{
    max-width:380px; width:100%; max-height:80vh; overflow-y:auto;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    border:2px solid var(--gold); border-radius:14px;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 12px 30px rgba(0,0,0,.6);
  }
  #whats-new-title{ font-family:'Cinzel Decorative', serif; font-size:19px; color:var(--gold-lt); margin:0 0 14px; text-align:center; text-shadow:none; }
  .whats-new-entry{ margin-bottom:16px; }
  .whats-new-entry:last-child{ margin-bottom:0; }
  .whats-new-date{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:6px; }
  .whats-new-entry ul{ margin:0; padding-left:18px; }
  .whats-new-entry li{ font-size:14px; color:var(--parchment); margin-bottom:4px; line-height:1.4; }
  #whats-new-dismiss{ width:100%; margin-top:6px; }

  #location-view{ position:fixed; inset:0; z-index:60; display:none; background:var(--water-dk); }
  #location-view.show{ display:block; }
  #loc-actions{
    box-sizing:border-box; width:100%; max-width:560px; height:100%; margin:0 auto; overflow-y:auto;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    padding:calc(180px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  /* Full-width banner pinned to the top of the screen, above the scrolling action list —
     #loc-actions' top padding above is sized to this banner's height so the heading/back
     button never sit underneath it. Holds the settlement's TIER_ART; #loc-banner-portrait
     overlays a talking character's portrait on top of it once one exists (see
     showNotableFigurePanel) — same backdrop, so a conversation reads as happening *at* this
     place rather than in a disconnected panel. */
  #loc-banner{
    position:fixed; top:0; left:0; right:0; z-index:62;
    height:calc(160px + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
    background:linear-gradient(180deg,#2c3f45,#1c2a2c);
    border-bottom:3px solid var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #loc-banner-art{ height:100%; display:flex; align-items:center; justify-content:center; }
  #loc-banner-art svg{ height:72%; width:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  #loc-banner-portrait{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    height:100%; display:none; align-items:flex-end; justify-content:center; pointer-events:none;
  }
  #loc-banner-portrait.show{ display:flex; }
  #loc-banner-portrait img{ height:96%; width:auto; filter:drop-shadow(0 8px 14px rgba(0,0,0,.65)); }
  #loc-back{
    align-self:flex-start;
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4);
    border-radius:6px; padding:7px 12px; margin-bottom:14px; cursor:pointer;
  }
  #loc-back:active{ transform:scale(.96); }
  #loc-heading{ font-family:'Cinzel Decorative', serif; font-size:18px; color:var(--parchment); margin:0 0 2px; }
  #loc-sub{ font-family:'Cinzel', serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:0 0 16px; }
  .loc-action{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
    text-align:left; width:100%; font-family:'EB Garamond', serif;
  }
  .loc-action:active{ transform:scale(.98); background:rgba(255,255,255,.12); }
  .loc-action:disabled{ opacity:.5; cursor:not-allowed; }
  .loc-action:disabled:active{ transform:none; background:rgba(255,255,255,.06); }

  .buy-row{ display:flex; align-items:center; gap:10px; margin:-4px 0 14px; }
  .qty-slider{
    flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:var(--parchment-shadow); outline:none;
  }
  .qty-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold)); border:2px solid #7a5715; cursor:pointer;
  }
  .qty-slider::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; border:2px solid #7a5715;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold)); cursor:pointer;
  }
  .qty-readout{
    flex:none; min-width:64px; text-align:center; font-family:'Cinzel', serif; font-size:11.5px;
    color:var(--parchment); background:rgba(255,255,255,.08); border-radius:8px; padding:6px 4px;
  }
  .buy-row .btn{ flex:none; padding:10px 16px; }
  .loc-action .li-icon{ width:26px; height:26px; flex:none; color:var(--parchment); }
  .loc-action .li-text b{ display:block; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px; color:var(--parchment); }
  .loc-action .li-text span{ font-size:12.5px; color:#a9926a; }

  #combat-view{
    position:fixed; inset:0; z-index:70; display:none; flex-direction:column;
    background:radial-gradient(ellipse at 50% 0%, #2c1414, #150a0a 70%);
  }
  #combat-view.show{ display:flex; }
  #combat-header{ padding:calc(18px + env(safe-area-inset-top)) 16px 8px; text-align:center; }
  #combat-title{ font-family:'Cinzel Decorative', serif; font-size:22px; color:#e2857f; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #combat-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 20px; gap:14px; }
  #combat-enemies{ display:flex; gap:14px; justify-content:center; align-items:flex-end; flex-wrap:wrap; width:100%; max-width:340px; }
  .combat-enemy-slot{
    display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; max-width:140px;
    padding:8px; border-radius:10px; border:1.5px solid transparent; cursor:pointer; transition:opacity .2s, border-color .2s;
  }
  .combat-enemy-slot .combat-enemy-icon{ filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); display:flex; align-items:center; justify-content:center; }
  .combat-enemy-slot .combat-enemy-icon img{ display:block; width:auto; height:auto; max-width:110px; max-height:130px; object-fit:contain; }
  .combat-enemy-slot .combat-name{ font-size:11px; margin-bottom:0; }
  .combat-enemy-slot .combat-bar-track{ width:100%; height:10px; }
  .combat-enemy-slot.selected{ border-color:var(--gold); background:rgba(209,164,69,.08); }
  .combat-enemy-slot.dead{ opacity:.35; pointer-events:none; filter:grayscale(1); }
  /* Solo fights (Bandit ambush) look the same as before — no selection ring, bigger portrait. */
  #combat-enemies .combat-enemy-slot:only-child{ max-width:320px; cursor:default; }
  #combat-enemies .combat-enemy-slot:only-child .combat-enemy-icon img{ max-width:190px; max-height:210px; }
  #combat-enemies .combat-enemy-slot:only-child.selected{ border-color:transparent; background:none; }
  /* Your hired mercenaries, if any — see "Party in combat" in context/combat.md. No selection
     ring (they're never a target, only enemies are) and no click handler, just a live HP bar
     per ally that empties out and grays if they fall in the fight. */
  #combat-allies{ display:flex; gap:10px; justify-content:center; align-items:flex-end; flex-wrap:wrap; width:100%; max-width:340px; }

  .combat-ally-slot .combat-ally-icon img{ display:block; width:auto; height:auto; max-width:52px; max-height:64px; object-fit:contain; }
  .combat-ally-slot .combat-name{ font-size:10px; margin-bottom:0; }

  .combat-bar-row{ width:100%; max-width:320px; }

  .combat-bar-track{ background:rgba(0,0,0,.35); border-radius:8px; height:14px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
  .combat-bar-fill{ height:100%; transition:width .3s; }
  .combat-bar-fill.enemy{ background:linear-gradient(90deg,#8c3a3a,#c0524f); }
  .combat-bar-fill.player{ background:linear-gradient(90deg,#3d7a3d,#5ba05b); }
  .combat-bar-fill.stamina{ background:linear-gradient(90deg,#3d5f7a,#5b8fc7); }
  .combat-bar-fill.ally{ background:linear-gradient(90deg,#8a6a2e,#d1a445); }
  #combat-log{
    width:100%; max-width:320px; height:100px; overflow-y:auto;
    background:rgba(0,0,0,.3); border-radius:8px; padding:10px 12px;
    font-family:'EB Garamond', serif; font-size:13.5px; color:#e9dcb8; line-height:1.5;
  }

  #combat-actions{ display:flex; gap:10px; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const TIER_LABEL = { village:"Village", town:"Town", city:"City", capital:"Capital" };
const RACE_LABEL = { human:"Human", dwarf:"Dwarf", ork:"Ork", goblin:"Goblin" };
const ALLIANCE = { human:"Good", dwarf:"Good", ork:"Bad", goblin:"Bad" };

// ===================== MAP CANVAS / VIEW (raster + CSS transform pan/zoom) =====================
const STAGE_W = 10240, STAGE_H = 5108;      // native raster pixel size
const LOGICAL_W = 2560, LOGICAL_H = 1277;   // coordinate space our data uses (1 unit = 2 raster px)
const START_X = 705, START_Y = 448;         // Bary — human starting kingdom
const REGION_W = 260;                        // default zoom shows this many logical units wide

let view = { scale: 1, tx: 0, ty: 0 };
let svgEl = document.getElementById('overlay'); // the interaction overlay (tap zones, marker, etc.)

function clampView(){
  const holder = document.getElementById('map-viewport');
  const vw = holder.clientWidth, vh = holder.clientHeight;
  const minScaleToFillW = vw / STAGE_W, minScaleToFillH = vh / STAGE_H;
  const minScale = Math.max(minScaleToFillW, minScaleToFillH); // can't zoom out past fitting the map
  const maxScale = 3.0; // deepest zoom-in (beyond native pixel res, graceful upscale)
  view.scale = Math.max(minScale, Math.min(maxScale, view.scale));
  const scaledW = STAGE_W*view.scale, scaledH = STAGE_H*view.scale;
  view.tx = Math.max(vw - scaledW, Math.min(0, view.tx));
  view.ty = Math.max(vh - scaledH, Math.min(0, view.ty));
}
function applyView(){
  clampView();
  document.getElementById('map-stage').style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
}
function centerOnLogical(lx, ly, scale){
  const holder = document.getElementById('map-viewport');
  const vw = holder.clientWidth, vh = holder.clientHeight;
  if(scale!=null) view.scale = scale;
  const px = lx * (STAGE_W/LOGICAL_W) * view.scale;
  const py = ly * (STAGE_H/LOGICAL_H) * view.scale;
  view.tx = vw/2 - px;
  view.ty = vh/2 - py;
  applyView();
}

function zoomBy(factor, centerXpx, centerYpx){
  const holder = document.getElementById('map-viewport');
  const rect = holder.getBoundingClientRect();
  const cx = centerXpx!=null ? centerXpx-rect.left : holder.clientWidth/2;
  const cy = centerYpx!=null ? centerYpx-rect.top : holder.clientHeight/2;
  const worldX = (cx - view.tx)/view.scale, worldY = (cy - view.ty)/view.scale;
  view.scale *= factor;
  view.tx = cx - worldX*view.scale;
  view.ty = cy - worldY*view.scale;
  applyView();
}
document.getElementById('zoom-in').addEventListener('click', ()=> zoomBy(1.35));
document.getElementById('zoom-out').addEventListener('click', ()=> zoomBy(0.74));

// ---- pan, pinch-zoom, and tap-to-select ----
const viewport = document.getElementById('map-viewport');
let pointers = new Map();
let dragStart = null, dragMoved = false;
let pinchStartDist = null, pinchStartScale = null;
let viewUpdateQueued = false;
function scheduleViewUpdate(){
  if(viewUpdateQueued) return;
  viewUpdateQueued = true;
  requestAnimationFrame(()=>{ applyView(); viewUpdateQueued = false; });
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

viewport.addEventListener('pointerdown', (e)=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragStart = {x:e.clientX, y:e.clientY}; dragMoved = false; }
  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStartDist = dist(pts[0],pts[1]); pinchStartScale = view.scale;
    dragMoved = true;
  }
});
viewport.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){
    const dxPx = e.clientX - prev.x, dyPx = e.clientY - prev.y;
    if(Math.abs(e.clientX-dragStart.x) > 6 || Math.abs(e.clientY-dragStart.y) > 6) dragMoved = true;
    view.tx += dxPx; view.ty += dyPx;
    scheduleViewUpdate();
  } else if(pointers.size===2 && pinchStartDist){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const midX=(pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    zoomBy((pinchStartScale*(d/pinchStartDist))/view.scale, midX, midY);
  }
});
viewport.addEventListener('pointerup', (e)=>{
  if(pointers.size===1 && dragStart && !dragMoved) handleTap(dragStart.x, dragStart.y);
  pointers.delete(e.pointerId);
  if(pointers.size<2){ pinchStartDist=null; }
  if(pointers.size<1){ dragStart=null; }
});
viewport.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStartDist=null; dragStart=null; });
viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomBy(e.deltaY>0?0.89:1.12, e.clientX, e.clientY);
}, {passive:false});

function handleTap(clientX, clientY){
  const el = document.elementFromPoint(clientX, clientY);
  if(el && el.classList && el.classList.contains('hitzone')){
    onMapTap(el.dataset.burg);
  } else {
    closeCard();
  }
}

document.getElementById('recenter-btn').addEventListener('click', ()=>{
  const pos = getCurrentXY();
  centerOnLogical(pos.x, pos.y, Math.max(view.scale, (viewport.clientWidth)/((STAGE_W/LOGICAL_W)*REGION_W)));
});

document.getElementById('camp-here-btn').addEventListener('click', ()=>{
  closeCard();
  showCampView(null, null, 0);
});

const CAL_KEY = "goblinwar_gameDay";
const HOUR_KEY = "goblinwar_gameHour";
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;
let gameDay = parseInt(localStorage.getItem(CAL_KEY) || "0", 10);
// Hour-of-day, 0 up to (not including) 24 — the real clock, separate from gameDay's whole-day
// counter. New characters start at 8 (a reasonable "morning departure"); see
// characters.html's freshCharacterData for where that default actually lives for a fresh save.
let gameHour = parseFloat(localStorage.getItem(HOUR_KEY) || "8");

function timeStr(hour){
  const h24 = Math.floor(hour) % 24;
  const mm = Math.round((hour - Math.floor(hour)) * 60) % 60;
  const period = h24 < 12 ? 'AM' : 'PM';
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${String(mm).padStart(2,'0')} ${period}`;
}
// 0 = full daylight, 1 = deepest night — ramped smoothly through dawn (6-8) and dusk (18-21)
// rather than an instant cutoff, so both the clock icon and the map's night tint ease in/out.
function nightFactor(hour){
  const h = hour % 24;
  if(h >= 8 && h < 18) return 0;
  if(h >= 6 && h < 8) return 1 - (h-6)/2;
  if(h >= 18 && h < 21) return (h-18)/3;
  return 1;
}
const MAX_NIGHT_OPACITY = 0.5;
function updateNightOverlay(hour){
  const f = nightFactor(hour);
  document.getElementById('map-viewport').style.setProperty('--night-opacity', String(f * MAX_NIGHT_OPACITY));
  const isNight = f >= 0.5;
  // Toggled via inline style rather than the `hidden` attribute — `hidden`'s UA `display:none`
  // rule didn't actually suppress these inline <svg> children in testing, even though the
  // attribute itself was set correctly; setting display directly sidesteps that entirely.
  document.getElementById('clock-icon-sun').style.display = isNight ? 'none' : '';
  document.getElementById('clock-icon-moon').style.display = isNight ? '' : 'none';
}
function refreshCalendarUI(){
  const day = (gameDay % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(gameDay / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(gameDay / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  document.getElementById('date-day').textContent = day;
  document.getElementById('date-month').textContent = month;
  document.getElementById('date-year').textContent = year;
  document.getElementById('clock-time').textContent = timeStr(gameHour);
  updateNightOverlay(gameHour);
}
// The single source of truth for time passing now — advances the real clock by any number of
// hours (not just whole days the way the old advanceDays did), rolling into a new gameDay only
// once the clock actually crosses midnight, so a short trip visibly moves the clock a few hours
// instead of being silently discarded below a 24-hour threshold. `quiet` skips the once-per-day
// side effects (mercenary upkeep, faction AI) entirely — waiting is the only caller that passes
// it, per the project owner's "waiting is a safe fast-forward" rule (see WAIT_HOURS_PER_TICK).
function advanceTime(hours, quiet){
  if(hours <= 0) return;
  const total = gameHour + hours;
  const daysCrossed = Math.floor(total / 24);
  gameHour = total - daysCrossed*24;
  localStorage.setItem(HOUR_KEY, String(gameHour));
  if(daysCrossed > 0){
    gameDay += daysCrossed;
    localStorage.setItem(CAL_KEY, String(gameDay));
    if(!quiet){ chargeMercenaryUpkeep(); maybeRunFactionAI(); }
  }
  refreshCalendarUI();
}
// Resting always wakes the player at a fixed hour, regardless of what time they fell asleep —
// "sleep through the night" rather than "add exactly 24 hours to whenever you dozed off" (which
// would leave the clock reading the same time of day it started at). Runs the same once-per-day
// side effects advanceTime's non-quiet path does, since resting is a real way a whole day passes.
const WAKE_HOUR = 6;
function restThroughNight(){
  gameDay += 1;
  gameHour = WAKE_HOUR;
  localStorage.setItem(CAL_KEY, String(gameDay));
  localStorage.setItem(HOUR_KEY, String(gameHour));
  chargeMercenaryUpkeep();
  maybeRunFactionAI();
  refreshCalendarUI();
}

// Silent on a brand-new game (nothing to compare against yet); otherwise shows every
// entry newer than the last one this player has dismissed, newest first. Requires
// CHANGELOG_SEEN_KEY to already be set (see the authGateReady.then(...) call site below).
function checkForWhatsNew(){
  if(!CHANGELOG_SEEN_KEY) return;
  const latestId = CHANGELOG[CHANGELOG.length-1].id;
  let seenRaw = localStorage.getItem(CHANGELOG_SEEN_KEY);
  if(seenRaw === null){
    // First time this account's own key has been touched. Migrate from the old flat,
    // pre-accounts key if this browser has one (a player who was already playing before
    // login existed) so their real progress isn't lost — without this, every account's
    // first-ever login reads as "brand new game, nothing to compare against yet" and goes
    // silent even though there are changes they haven't actually seen. A browser with
    // neither key (a truly first-ever player) still falls through to that silent case.
    seenRaw = localStorage.getItem(LEGACY_CHANGELOG_SEEN_KEY);
    if(seenRaw === null){
      localStorage.setItem(CHANGELOG_SEEN_KEY, String(latestId));
      return;
    }
  }
  const seenId = parseInt(seenRaw, 10);
  if(seenId >= latestId){
    localStorage.setItem(CHANGELOG_SEEN_KEY, String(latestId));
    return;
  }
  const unseen = CHANGELOG.filter(entry => entry.id > seenId).slice().reverse();
  document.getElementById('whats-new-list').innerHTML = unseen.map(entry => `
    <div class="whats-new-entry">
      <div class="whats-new-date">${entry.date}</div>
      <ul>${entry.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('');
  document.getElementById('whats-new-modal').classList.add('show');
}
document.getElementById('whats-new-dismiss').addEventListener('click', ()=>{
  localStorage.setItem(CHANGELOG_SEEN_KEY, String(CHANGELOG[CHANGELOG.length-1].id));
  document.getElementById('whats-new-modal').classList.remove('show');
});

// ===================== UPDATE CHECK =====================
// No service worker or build step — "there's an update" just means the live version.json
// on the server reports a newer changelogId than the CHANGELOG already baked into this
// loaded page. Bump version.json (see CLAUDE.md) whenever CHANGELOG grows, or returning
// players already on an old tab will never see this banner. Tapping it force-reloads with
// a cache-busting query string so the browser can't just re-serve the stale cached page.
const UPDATE_CHECK_INTERVAL_MS = 5 * 60 * 1000;
function checkForUpdate(){
  fetch(`version.json?t=${Date.now()}`, {cache:'no-store'})
    .then(r=>r.json())
    .then(data=>{
      const currentLatest = CHANGELOG[CHANGELOG.length-1].id;
      if(data.changelogId > currentLatest) document.getElementById('update-banner').classList.add('show');
    })
    .catch(()=>{}); // offline or unreachable — silently retry on the next interval
}
document.getElementById('update-banner').addEventListener('click', ()=>{
  saveActiveCharacter(); // keepalive (see assets/auth-client.js) — survives the reload below without blocking it
  location.href = location.pathname + '?_=' + Date.now();
});
setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkForUpdate(); });
checkForUpdate();

// ===================== TERRITORY CONTROL & FACTION AI =====================
// A settlement's *historical* kingdom/race (graph.burgs[id].state/.race, from the Azgaar
// export) never changes — that's its permanent identity. Its *current controller* is a
// separate, sparse override (goblinwar_territoryControl), only present once a settlement has
// actually been fought over. War is tracked as pairwise relations between specific kingdoms
// (goblinwar_relations) rather than a single per-kingdom flag — a kingdom can be at war with
// one enemy while at peace with everyone else — and that's what the Marketplace prices react
// to (see showMarketPanel, via the derived getWarState/isAtWarAt), regardless of who's
// currently occupying any one of its settlements.
const TERRITORY_KEY = "goblinwar_territoryControl";
const RELATIONS_KEY = "goblinwar_relations";
const REINFORCE_KEY = "goblinwar_reinforcements";
const LASTWARTICK_KEY = "goblinwar_lastWarTick";
const SIEGE_KEY = "goblinwar_sieges";
const SIEGE_DEFENSE_COOLDOWN_KEY = "goblinwar_siegeDefenseCooldowns"; // moved up here (used by initPlayerStateIfMissing, called well before the Defend the Walls code below is defined) — see that section for the actual cooldown accessors
const WAR_TICK_INTERVAL_DAYS = 7;   // faction AI only rolls once per in-game week
const WAR_DECLARE_CHANCE = 0.06;    // per cross-alliance kingdom pair, per tick, while at peace
const WAR_PEACE_CHANCE = 0.15;      // per cross-alliance kingdom pair, per tick, while at war — sues for peace
const RAID_CHANCE = 0.35;           // per kingdom, per enemy it's at war with, per tick — attempts to start/advance a siege
const RAID_CANDIDATE_POOL = 15;     // nearest enemy-held settlements considered when no real border exists (see pickRaidTarget)
const RAID_SUCCESS_MIN = 0.2, RAID_SUCCESS_MAX = 0.8; // siege progress per tick is population-driven (see pickRaidTarget/advanceSiege) but always stays uncertain
const SIEGE_PROGRESS_MAX_PER_TICK = 45; // % progress a siege can gain in one tick, at the highest clamped success chance

// Tick-scoped read cache for the sparse override maps below (territory control, population,
// relations, sieges, reinforcements). Every getXxx() normally does a fresh JSON.parse on every
// call — fine for the rare, player-triggered reads elsewhere (Marketplace, Guard House,
// onMapTap), but runFactionAITick's own callees (getArmyStrength, findNearestPeacefulSettlement)
// each re-scan every one of the ~800 settlements, calling these getters an enormous number of
// times in the course of one weekly tick. Once a save has run long enough that most settlements
// carry an override, re-parsing that JSON on every single one of those reads made a single tick
// take multiple seconds and get slower over time (measured directly — see the perf note in
// factions-and-territory.md). Set at the start of runFactionAITick, cleared at the end; every
// getXxx() below returns the SAME cached object while active, so a setXxx() call's in-place
// mutation (they all still write straight through to localStorage too) is visible to every
// later read in the same tick without needing a separate invalidation step.
let _tickCache = null;

let KINGDOM_RACE = {};  // kingdom name -> race, derived from graph.burgs once loaded
let ALL_KINGDOMS = [];
function buildFactionData(){
  KINGDOM_RACE = {};
  Object.values(graph.burgs).forEach(b=>{
    if(b.state && b.race && b.race !== 'neutral' && !KINGDOM_RACE[b.state]) KINGDOM_RACE[b.state] = b.race;
  });
  ALL_KINGDOMS = Object.keys(KINGDOM_RACE);
}

// Burg-to-burg adjacency, derived once from the existing cell-level road/sea graph (adjacency,
// built by buildAdjacency() from graph.edges — see travel-and-map.md). Neither burgs nor
// kingdoms have any adjacency data of their own in travel-graph.json; edges only connect map
// cells, most of which aren't a settlement at all. For each burg, this BFSes outward through
// the cell graph and, along every branch, stops at the first cell that's home to some *other*
// burg — giving "which settlements does a road/sea route reach before any other settlement."
// Cheap to compute (796 burgs, 3069 edges) and, like KINGDOM_RACE/ALL_KINGDOMS, rebuilt fresh
// every load rather than persisted, since it's entirely derived from static map data.
let burgAdjacency = {}; // burgId -> [burgId, ...]
function buildBurgAdjacency(){
  burgAdjacency = {};
  const burgCells = {}; // cellId -> burgId, for the cells that ARE a burg
  Object.values(graph.burgs).forEach(b=>{ burgCells[b.cell] = b.id; });
  Object.values(graph.burgs).forEach(startBurg=>{
    const neighbors = new Set();
    const visited = new Set([startBurg.cell]);
    let frontier = (adjacency[startBurg.cell] || []).map(step=>step.to);
    while(frontier.length){
      const next = [];
      frontier.forEach(cell=>{
        if(visited.has(cell)) return;
        visited.add(cell);
        if(burgCells[cell] !== undefined && burgCells[cell] !== startBurg.id){
          neighbors.add(burgCells[cell]); // found a settlement on this branch — stop following it
        } else {
          (adjacency[cell] || []).forEach(step=>{ if(!visited.has(step.to)) next.push(step.to); });
        }
      });
      frontier = next;
    }
    burgAdjacency[startBurg.id] = Array.from(neighbors);
  });
}

// True if this settlement directly borders (via the road/sea graph) a settlement controlled by
// an opposite-alliance kingdom it's currently at war with — a real frontline, not the old
// proximity guess. Used both for raid targeting (pickRaidTarget) and the map's frontline
// markers (buildFrontlineMarkers).
function isFrontlineBurg(burgId){
  const kingdom = getControllerKingdom(burgId);
  if(!kingdom) return false;
  return (burgAdjacency[burgId] || []).some(neighborId=>{
    const neighborKingdom = getControllerKingdom(neighborId);
    if(!neighborKingdom || neighborKingdom === kingdom) return false;
    if(ALLIANCE[KINGDOM_RACE[neighborKingdom]] === ALLIANCE[KINGDOM_RACE[kingdom]]) return false;
    return getRelation(kingdom, neighborKingdom) === 'war';
  });
}

// goblinwar_territoryControl overrides store the specific conquering KINGDOM now (e.g.
// "Kingdom of Warg"), not just its race — this is what lets getArmyStrength (below) credit a
// captured settlement's population to the one kingdom that actually holds it, instead of
// pooling it across every kingdom that happens to share its race. getControllerKingdom is the
// kingdom-level accessor; getController derives the race from it (KINGDOM_RACE) and is kept
// around because most of the codebase — onMapTap, showLocationView, buildGuardHouseStats'
// label, getFigureForBurg — only ever needed "which race holds this," not which kingdom.
//
// Backward-compat note: saves from before this change stored a bare race string here (e.g.
// "ork") instead of a kingdom name. getController still resolves those correctly (a stored
// value that's a real ALLIANCE key is treated as an already-race value). getArmyStrength can't
// recover which specific kingdom made that old capture, though — a legacy-format override
// simply won't match any kingdom's name, so that settlement's population stops counting toward
// any kingdom's strength until it's captured again (which writes the new kingdom-name format).
// Self-healing, not silently wrong — worth knowing if regional strength ever looks light on an
// old save.
function getTerritoryControl(){
  if(_tickCache) return _tickCache.territory;
  try{ return JSON.parse(localStorage.getItem(TERRITORY_KEY)) || {}; }catch(e){ return {}; }
}
function getControllerKingdom(burgId){
  const overrides = getTerritoryControl();
  if(overrides[burgId]) return overrides[burgId];
  const b = graph.burgs[burgId];
  return b ? b.state : null;
}
function getController(burgId){
  const kingdom = getControllerKingdom(burgId);
  if(kingdom && ALLIANCE[kingdom]) return kingdom; // legacy save: this was already a race string
  if(kingdom) return KINGDOM_RACE[kingdom] || 'neutral';
  const b = graph.burgs[burgId];
  return b ? b.race : null;
}
function setController(burgId, kingdom){
  const overrides = getTerritoryControl();
  overrides[burgId] = kingdom;
  localStorage.setItem(TERRITORY_KEY, JSON.stringify(overrides));
}

// Pairwise kingdom relations — only opposite-alliance kingdoms ever have a meaningful entry
// (same-alliance kingdoms never fight, per ALLIANCE/attemptRaid's old alliance filter, now
// baked directly into runFactionAITick's pair loop below). Canonical, order-independent key so
// getRelation(a,b) and getRelation(b,a) always agree. Absent entry defaults to "peace", same
// sparse-override philosophy as territory control/population — a fresh or pre-this-update save
// simply starts with everyone at peace and wars begin fresh, rather than trying to reconstruct
// "who was fighting whom" from the old single-flag-per-kingdom system.
function getRelationKey(k1, k2){ return [k1, k2].sort().join('::'); }
function getRelationsMap(){
  if(_tickCache) return _tickCache.relations;
  try{ return JSON.parse(localStorage.getItem(RELATIONS_KEY)) || {}; }catch(e){ return {}; }
}
function getRelation(k1, k2){ return getRelationsMap()[getRelationKey(k1, k2)] || 'peace'; }
function setRelation(k1, k2, state){
  const map = getRelationsMap();
  map[getRelationKey(k1, k2)] = state;
  localStorage.setItem(RELATIONS_KEY, JSON.stringify(map));
}
// Every opposite-alliance kingdom this one currently has a "war" relation with. Reads
// getRelationsMap() once up front rather than calling getRelation() per candidate (which would
// re-parse the same localStorage JSON once per candidate kingdom) — this function sits in
// isAtWarAt's hot path, itself called up to once per burg inside findNearestPeacefulSettlement's
// O(796) scan, so an avoidable per-candidate re-parse here compounds badly at scale (many
// kingdoms at war, many settlements bleeding attrition every tick).
function getEnemiesAtWar(kingdom){
  const alliance = ALLIANCE[KINGDOM_RACE[kingdom]];
  const relations = getRelationsMap();
  return ALL_KINGDOMS.filter(k => k !== kingdom && ALLIANCE[KINGDOM_RACE[k]] !== alliance && (relations[getRelationKey(kingdom, k)] || 'peace') === 'war');
}
// Derived, not stored: "is this kingdom fighting *someone*" — kept as its own function (rather
// than inlining getEnemiesAtWar().length everywhere) because every existing caller (Marketplace
// pricing, pickAmbushEnemy, Guard House, Petition for Troops) only ever needed this coarser
// question, not which specific enemy. Signature unchanged from the old per-kingdom flag, so
// none of those callers needed to change.
//
// Memoized per-kingdom for the duration of one tick (see _tickCache) — this is isAtWarAt's own
// hot path, called once per settlement inside findNearestPeacefulSettlement's O(796) scan, which
// itself runs once per attritioned/besieged settlement (hundreds, once many kingdoms are at
// war). Recomputing getEnemiesAtWar's full ALL_KINGDOMS scan on every one of those calls measured
// out to tens of millions of redundant relation-key lookups per tick — safe to cache because
// nothing after runFactionAITick's first (declare/peace) pass ever calls setRelation again, so a
// kingdom's war state genuinely can't change partway through the second pass this feeds.
function getWarState(kingdom){
  if(_tickCache){
    if(kingdom in _tickCache.warState) return _tickCache.warState[kingdom];
    const result = getEnemiesAtWar(kingdom).length ? 'war' : 'peace';
    _tickCache.warState[kingdom] = result;
    return result;
  }
  return getEnemiesAtWar(kingdom).length ? 'war' : 'peace';
}
function isAtWarAt(burgId){
  const b = graph.burgs[burgId];
  return b && b.state ? getWarState(b.state) === 'war' : false;
}

// Population, in the same "thousands of people" unit travel-graph.json already uses
// (Bary is 12.93, i.e. ~12,930) — a settlement's population.field is its starting figure,
// forever; goblinwar_population is the same sparse-override pattern as territory control,
// only present once a settlement's population has actually moved. War shrinks it (some die,
// the rest flee as refugees to the nearest settlement currently at peace, growing it there
// instead of just vanishing), and total controlled population is what an attacking kingdom's
// raid odds are actually built from — see advanceSiege below.
const POPULATION_KEY = "goblinwar_population";
const REFUGEE_ARRIVAL_KEY = "goblinwar_refugeeArrivals";
const WAR_ATTRITION_RATE = 0.02;    // weekly population loss, every settlement of a kingdom at war
const RAID_DAMAGE_RATE = 0.08;      // additional loss for the specific settlement raided this tick
const REFUGEE_DEATH_SHARE = 0.4;    // of population lost to war, this fraction dies...
const REFUGEE_FLEE_SHARE = 0.6;     // ...and this fraction flees to the nearest peaceful settlement
const REFUGEE_ARRIVAL_WINDOW_DAYS = 7; // how long a settlement counts as "recently received refugees" for the Aid the Refugees action
const MILITARY_FRACTION = 0.08;     // rough share of population a kingdom could field as soldiers

function getPopulationOverrides(){
  if(_tickCache) return _tickCache.population;
  try{ return JSON.parse(localStorage.getItem(POPULATION_KEY)) || {}; }catch(e){ return {}; }
}
function getPopulation(burgId){
  const overrides = getPopulationOverrides();
  if(overrides[burgId] !== undefined) return overrides[burgId];
  const b = graph.burgs[burgId];
  return (b && b.population) ? b.population : 0;
}
function setPopulation(burgId, pop){
  const overrides = getPopulationOverrides();
  overrides[burgId] = Math.max(0, Math.round(pop*1000)/1000); // keep to the nearest real person, not the nearest whole "thousands" unit
  localStorage.setItem(POPULATION_KEY, JSON.stringify(overrides));
}
function formatPopulation(pop){ return Math.round(pop*1000).toLocaleString(); }

// Stamped on a settlement whenever applyWarLoss's flee path (below) lands population there —
// what the Aid the Refugees location action (see showLocationView) checks to decide whether a
// settlement is currently hosting a fresh wave of arrivals worth the player helping with.
function getRefugeeArrivals(){ try{ return JSON.parse(localStorage.getItem(REFUGEE_ARRIVAL_KEY)) || {}; }catch(e){ return {}; } }
function stampRefugeeArrival(burgId){
  const map = getRefugeeArrivals();
  map[burgId] = gameDay;
  localStorage.setItem(REFUGEE_ARRIVAL_KEY, JSON.stringify(map));
}
function hasRecentRefugeeArrival(burgId){
  const day = getRefugeeArrivals()[burgId];
  return day !== undefined && (gameDay - day) <= REFUGEE_ARRIVAL_WINDOW_DAYS;
}

// Alliance reinforcement — the one deliberate exception to "every kingdom stands entirely
// alone militarily" (see getArmyStrength below). Petitioning at a Palace (see
// buildPalacePetitionHTML) grants a temporary strength bonus to a threatened allied kingdom,
// sourced from a specific *other*, currently-peaceful kingdom's own strength — never pooled
// automatically, always triggered by the player convincing a court to send troops. One active
// reinforcement per kingdom at a time; a new petition overwrites rather than stacks, so this
// can't be farmed into an ever-growing bonus.
const REINFORCEMENT_FRACTION = 0.25;  // the petitioned kingdom sends this fraction of its own strength
const REINFORCEMENT_DURATION_DAYS = 14;
function getReinforcements(){
  if(_tickCache) return _tickCache.reinforcements;
  try{ return JSON.parse(localStorage.getItem(REINFORCE_KEY)) || {}; }catch(e){ return {}; }
}
function setReinforcement(kingdom, amount, fromKingdom){
  const map = getReinforcements();
  map[kingdom] = { amount, expiresDay: gameDay + REINFORCEMENT_DURATION_DAYS, fromKingdom };
  localStorage.setItem(REINFORCE_KEY, JSON.stringify(map));
}
function getReinforcementBonus(kingdom){
  const r = getReinforcements()[kingdom];
  if(!r || gameDay > r.expiresDay) return 0;
  return r.amount;
}

// Total population one specific kingdom currently controls, times MILITARY_FRACTION, plus any
// active reinforcement bonus (above) — what advanceSiege compares attacker vs. defender with.
// Deliberately not capped to any one settlement's local garrison — a kingdom's whole territory
// backs up any single raid — but scoped to that kingdom alone otherwise: other kingdoms of the
// same race (even allied ones) contribute nothing automatically. See the comment on
// getController/getControllerKingdom above for why.
function getArmyStrength(kingdom){
  const base = Object.keys(graph.burgs).reduce((sum,id)=> getControllerKingdom(id)===kingdom ? sum+getPopulation(id) : sum, 0) * MILITARY_FRACTION;
  return base + getReinforcementBonus(kingdom);
}

// Closest settlement whose kingdom is currently at peace — where a burg's refugees go.
function findNearestPeacefulSettlement(fromBurgId){
  const from = graph.burgs[fromBurgId];
  if(!from) return null;
  let best = null, bestDist = Infinity;
  Object.values(graph.burgs).forEach(b=>{
    if(b.id === fromBurgId || isAtWarAt(b.id)) return;
    const d = Math.hypot(b.x-from.x, b.y-from.y);
    if(d < bestDist){ bestDist = d; best = b; }
  });
  return best;
}

// Applies a fractional population loss to one settlement: REFUGEE_DEATH_SHARE of it is gone
// for good, REFUGEE_FLEE_SHARE relocates to the nearest peaceful settlement (added to that
// settlement's population, not lost) rather than the whole loss simply vanishing.
function applyWarLoss(burgId, rate){
  const pop = getPopulation(burgId);
  const loss = pop * rate;
  if(loss <= 0) return;
  const died = loss * REFUGEE_DEATH_SHARE;
  const fled = loss * REFUGEE_FLEE_SHARE;
  setPopulation(burgId, pop - died - fled);
  if(fled > 0){
    const haven = findNearestPeacefulSettlement(burgId);
    if(haven){
      setPopulation(haven.id, getPopulation(haven.id) + fled);
      stampRefugeeArrival(haven.id);
    }
  }
}

// Killed enemies count toward their own side's decline — a small, cumulative cost distinct
// from the weekly tick's own attrition/siege damage above, applied from the player's own
// combat victories (see endCombat). Symmetric by design: Ork/Goblin kills reduce Ork/Goblin
// population and Human/Dwarf kills reduce Human/Dwarf population, the same logic either way —
// though in practice only Ork/Goblin enemies are ever actually fought today (Bandit ambushes
// and themed raiding parties, see combat.md's pickAmbushEnemy), so the Good-alliance direction
// is currently latent rather than something a player can trigger. Bandit kills are excluded —
// Bandits aren't tied to any kingdom or race population at all.
const ENEMY_CASUALTY_POP_LOSS = 0.01; // ~10 people per enemy actually killed
function findNearestSettlementOfRace(fromBurgId, race){
  const from = graph.burgs[fromBurgId];
  if(!from) return null;
  let best = null, bestDist = Infinity;
  Object.values(graph.burgs).forEach(b=>{
    if(getController(b.id) !== race) return;
    const d = Math.hypot(b.x-from.x, b.y-from.y);
    if(d < bestDist){ bestDist = d; best = b; }
  });
  return best;
}
// attackerKingdom (from a siege's Defend the Walls fight, see triggerSiegeDefenseFight) lets
// this attribute the loss to that *specific* kingdom's own nearest-held settlement instead of
// just "the nearest settlement of that race" — feeding directly back into its own
// getArmyStrength on the next weekly tick, so repeatedly defending against one kingdom's sieges
// measurably weakens that kingdom's future ones. A plain ambush has no specific kingdom behind
// it, so it falls back to the race-wide nearest-settlement search.
function applyEnemyCasualtyLoss(race, attackerKingdom, nearBurgId, count){
  if(!race || race === 'bandit' || count <= 0) return;
  const totalLoss = ENEMY_CASUALTY_POP_LOSS * count;
  if(attackerKingdom){
    const ownBurgs = Object.values(graph.burgs).filter(b => getControllerKingdom(b.id) === attackerKingdom);
    if(!ownBurgs.length) return;
    const from = graph.burgs[nearBurgId];
    let best = ownBurgs[0], bestDist = Infinity;
    ownBurgs.forEach(b=>{
      const d = from ? Math.hypot(b.x-from.x, b.y-from.y) : 0;
      if(d < bestDist){ bestDist = d; best = b; }
    });
    setPopulation(best.id, getPopulation(best.id) - totalLoss);
  } else {
    const target = findNearestSettlementOfRace(nearBurgId, race);
    if(target) setPopulation(target.id, getPopulation(target.id) - totalLoss);
  }
}

// War-driven Marketplace pricing (see showMarketPanel): a kingdom at war is short on
// supply, so buying costs more everywhere; but weapons/armour/firewood are in high demand
// there too, so *selling* those specific goods pays a premium instead of the usual cut price.
const WAR_BUY_MULTIPLIER = 1.5;
const WAR_SELL_BONUS_MULT = 1.2;
const PEACE_SELL_FRACTION = 0.5;
function isWarRelevant(mi){ return !!mi.slot || mi.name === "Firewood"; }
// A small "shopping around matters" discount, keyed off data travel-graph.json already carries
// per burg (b.port, b.tier) rather than needing a new biome/elevation pipeline (see
// roadmap.md's "Settlement specialties" — a mountain-Town discount was the original idea there,
// but nothing in the live game's data pulls elevation through yet, so this picks two discounts
// that data *does* support instead of blocking on that bigger gap).
const PORT_WATERSKIN_DISCOUNT = 0.8;  // a coastal settlement's Waterskin is cheaper — easy fresh water/fish trade
const VILLAGE_FOOD_DISCOUNT = 0.85;   // a Village's Food is cheaper — closer to the farms that grow it
function getSettlementDiscount(mi, burgId){
  const b = graph.burgs[burgId];
  if(!b) return 1;
  if(mi.name === "Waterskin" && b.port) return PORT_WATERSKIN_DISCOUNT;
  if(mi.name === "Food" && b.tier === "village") return VILLAGE_FOOD_DISCOUNT;
  return 1;
}
function getBuyPrice(mi, burgId){
  return Math.round(mi.price * (isAtWarAt(burgId) ? WAR_BUY_MULTIPLIER : 1) * (hasPerk('silver_tongue') ? 0.9 : 1) * getSettlementDiscount(mi, burgId));
}
function getSellPrice(mi, burgId){
  return (isWarRelevant(mi) && isAtWarAt(burgId))
    ? Math.round(mi.price * WAR_SELL_BONUS_MULT)
    : Math.round(mi.price * PEACE_SELL_FRACTION);
}

function getSieges(){
  if(_tickCache) return _tickCache.sieges;
  try{ return JSON.parse(localStorage.getItem(SIEGE_KEY)) || {}; }catch(e){ return {}; }
}
function setSieges(map){ localStorage.setItem(SIEGE_KEY, JSON.stringify(map)); }
// A settlement's own local defense, distinct from getArmyStrength(kingdom) (that kingdom's
// whole mobilizable strength) — surfaced in the Guard House panel alongside an active siege.
function getGarrisonStrength(burgId){ return getPopulation(burgId) * MILITARY_FRACTION; }
// Ends any siege currently running between these two specific kingdoms (either direction) —
// called when they reach peace, since a truce leaves no one left to besiege whom. The defender
// keeps whatever it still held; nothing else about the siege's partial progress is preserved.
function cancelSiegesBetween(k1, k2){
  const sieges = getSieges();
  let changed = false;
  Object.keys(sieges).forEach(bid=>{
    const s = sieges[bid];
    if((s.attackerKingdom===k1 && s.defenderKingdom===k2) || (s.attackerKingdom===k2 && s.defenderKingdom===k1)){
      delete sieges[bid];
      changed = true;
    }
  });
  if(changed) setSieges(sieges);
}

// Picks one settlement belonging to defenderKingdom for attackerKingdom to besiege. Prefers a
// real border settlement — one directly reachable (via burgAdjacency, see buildBurgAdjacency
// above) from territory the attacker already controls — over the old "nearest by straight-line
// distance" guess, falling back to that guess only when the two kingdoms' territory doesn't
// actually touch (e.g. separated by sea or unclaimed land in between).
function pickRaidTarget(attackerKingdom, defenderKingdom){
  const ownBurgs = Object.values(graph.burgs).filter(b => getControllerKingdom(b.id) === attackerKingdom);
  if(!ownBurgs.length) return null;
  const defenderBurgs = Object.values(graph.burgs).filter(b => getControllerKingdom(b.id) === defenderKingdom);
  if(!defenderBurgs.length) return null;

  const ownBurgIds = new Set(ownBurgs.map(b=>b.id));
  const borderCandidates = defenderBurgs.filter(b => (burgAdjacency[b.id]||[]).some(n => ownBurgIds.has(n)));
  if(borderCandidates.length) return borderCandidates[Math.floor(Math.random()*borderCandidates.length)];

  const cx = ownBurgs.reduce((s,b)=>s+b.x,0) / ownBurgs.length;
  const cy = ownBurgs.reduce((s,b)=>s+b.y,0) / ownBurgs.length;
  const sorted = defenderBurgs.slice().sort((a,b)=> Math.hypot(a.x-cx,a.y-cy) - Math.hypot(b.x-cx,b.y-cy));
  const candidates = sorted.slice(0, RAID_CANDIDATE_POOL);
  return candidates[Math.floor(Math.random()*candidates.length)];
}

// Starts a new siege (if attackerKingdom has none running against defenderKingdom yet) or
// advances the existing one by one tick's worth of progress — replacing the old single-tick
// coin-flip raid with a persistent, multi-week conflict over one specific settlement. Progress
// per tick still comes from the same clamped attacker/defender strength ratio the old
// attemptRaid used, just applied repeatedly instead of once; the besieged settlement also takes
// RAID_DAMAGE_RATE attrition every tick it remains under siege, not only at the start. At 100%
// progress the settlement actually changes hands and the siege ends.
function advanceSiege(attackerKingdom, defenderKingdom){
  const sieges = getSieges();
  const existing = Object.entries(sieges).find(([bid, s]) => s.attackerKingdom===attackerKingdom && s.defenderKingdom===defenderKingdom);
  let burgId, siege;
  if(existing){
    [burgId, siege] = existing;
  } else {
    const target = pickRaidTarget(attackerKingdom, defenderKingdom);
    if(!target) return null;
    burgId = target.id;
    siege = { attackerKingdom, defenderKingdom, startedDay: gameDay, progress: 0 };
  }

  const attackerStrength = getArmyStrength(attackerKingdom);
  const defenderStrength = getArmyStrength(defenderKingdom);
  const rawChance = attackerStrength / ((attackerStrength + defenderStrength) || 1);
  const successChance = Math.min(RAID_SUCCESS_MAX, Math.max(RAID_SUCCESS_MIN, rawChance));
  siege.progress += successChance * SIEGE_PROGRESS_MAX_PER_TICK;
  applyWarLoss(burgId, RAID_DAMAGE_RATE);

  const target = graph.burgs[burgId];
  let captured = false;
  if(siege.progress >= 100){
    setController(burgId, attackerKingdom);
    delete sieges[burgId];
    captured = true;
  } else {
    sieges[burgId] = siege;
  }
  setSieges(sieges);
  return { captured, target };
}

// Runs the whole weekly tick and returns a short list of {text} events worth telling the player
// about (captures only — declarations/peace deals are frequent enough that surfacing every one
// would be noise). Two passes: first, war/peace rolls once per cross-alliance kingdom pair
// (same-alliance kingdoms never fight — see ALLIANCE); second, every kingdom currently at war
// bleeds attrition and, per specific enemy it's fighting, has a chance to start or advance a
// siege against that enemy.
function runFactionAITick(){
  // Populate the tick-scoped read cache (see its declaration near KINGDOM_RACE above) — every
  // getXxx() call for the rest of this function, and everything it calls (getArmyStrength,
  // applyWarLoss, findNearestPeacefulSettlement, advanceSiege, etc.), reuses these same parsed
  // objects instead of re-parsing localStorage on every one of the many thousands of reads one
  // tick performs. try/finally so a thrown error still clears it rather than leaking a stale
  // cache into whatever runs next.
  _tickCache = {
    territory: getTerritoryControl(),
    population: getPopulationOverrides(),
    relations: getRelationsMap(),
    sieges: getSieges(),
    reinforcements: getReinforcements(),
    warState: {}, // see getWarState — populated lazily, safe for the whole tick once the declare/peace pass below finishes
  };
  try{
    const events = [];
    for(let i=0;i<ALL_KINGDOMS.length;i++){
      for(let j=i+1;j<ALL_KINGDOMS.length;j++){
        const k1 = ALL_KINGDOMS[i], k2 = ALL_KINGDOMS[j];
        if(ALLIANCE[KINGDOM_RACE[k1]] === ALLIANCE[KINGDOM_RACE[k2]]) continue;
        if(getRelation(k1, k2) === 'peace'){
          if(Math.random() < WAR_DECLARE_CHANCE) setRelation(k1, k2, 'war');
        } else if(Math.random() < WAR_PEACE_CHANCE){
          setRelation(k1, k2, 'peace');
          cancelSiegesBetween(k1, k2);
        }
      }
    }
    ALL_KINGDOMS.forEach(kingdom=>{
      const enemies = getEnemiesAtWar(kingdom);
      if(!enemies.length) return;
      // Every settlement that originally belongs to this kingdom bleeds a little population just
      // from being at war, regardless of whether it's the one under siege this tick.
      Object.values(graph.burgs).filter(b=>b.state===kingdom).forEach(b=> applyWarLoss(b.id, WAR_ATTRITION_RATE));
      enemies.forEach(enemy=>{
        if(Math.random() < RAID_CHANCE){
          const result = advanceSiege(kingdom, enemy);
          if(result && result.captured){
            events.push(`${result.target.name} has fallen to ${RACE_LABEL[KINGDOM_RACE[kingdom]]} forces from ${kingdom}.`);
          }
        }
      });
    });
    return events;
  } finally {
    _tickCache = null;
  }
}

function maybeRunFactionAI(){
  if(!graph || !ALL_KINGDOMS.length) return;
  const lastTick = parseInt(localStorage.getItem(LASTWARTICK_KEY) || "0", 10);
  if(gameDay - lastTick < WAR_TICK_INTERVAL_DAYS) return;
  localStorage.setItem(LASTWARTICK_KEY, String(gameDay));
  const events = runFactionAITick();
  buildFrontlineMarkers();
  if(events.length){
    const summary = events.length === 1 ? events[0] : `${events.length} settlements changed hands this week, including ${events[0]}`;
    showToast(summary);
  }
}

// ===================== PLAYER STATE (health / gold / inventory / weight / age) =====================
const NAME_KEY = "goblinwar_characterName";
const HEALTH_KEY = "goblinwar_health";
const MAXHEALTH_KEY = "goblinwar_maxHealth";
const STAMINA_KEY = "goblinwar_stamina";
const MAXSTAMINA_KEY = "goblinwar_maxStamina";
const HUNGER_KEY = "goblinwar_hunger";
const THIRST_KEY = "goblinwar_thirst";
// Difficulty — permadeath, chosen once at character creation (characters.html) and never
// changed afterward. Per the project owner: three independent toggles rather than one global
// switch. Defaults below all match the game's original, pre-difficulty-setting behavior exactly,
// so an existing character (predating this field, filled in by applyCharacterData's merge onto
// freshCharacterData) never silently changes how it plays. permadeathCompanions is stored and
// round-tripped like the other two but genuinely unused right now — nothing can recruit a
// companion yet (see context/roadmap.md's "Party / Companions"), so there's nothing for it to
// gate; it exists now so that flow doesn't also need a snapshot-shape migration later.
const ISDEAD_KEY = "goblinwar_isDead";
const PERMADEATH_PLAYER_KEY = "goblinwar_permadeathPlayer";
const PERMADEATH_COMPANIONS_KEY = "goblinwar_permadeathCompanions";
const PERMADEATH_MERCENARIES_KEY = "goblinwar_permadeathMercenaries";
const AGE_KEY = "goblinwar_age";
const GOLD_KEY = "goblinwar_gold";
const INV_KEY = "goblinwar_inventory";
const LEVEL_KEY = "goblinwar_level";
const XP_KEY = "goblinwar_xp";
const SKILLPOINTS_KEY = "goblinwar_skillPoints";
const STATS_KEY = "goblinwar_stats";
const SKILLS_KEY = "goblinwar_skills";
const QUEST_KEY = "goblinwar_quests";
const COMPLETEDQUEST_KEY = "goblinwar_completedQuests";
const COMPLETED_QUESTS_MAX = 20; // trims oldest once history grows past this many entries
const PARTY_KEY = "goblinwar_party"; // JSON array of recruited companion ids — see party.html
// Cumulative combat-victory kills, grouped by enemy race — {race: count} — feeds character.html's
// small cosmetic Titles line (see TITLES below). Incremented in endCombat('victory') by
// combat.enemies.length against combat.race, not per-enemy, since a raiding-party fight's
// enemies are already all rolled from the same race per triggerEnemyFight.
const KILLS_KEY = "goblinwar_kills";
// Cumulative tracking feeding achievements.html — see context/roadmap.md's "Achievements page".
// None of these ever shrink, so an achievement's progress can always be read straight off them
// rather than needing a separate "unlocked:true" flag anywhere.
const VISITED_BURGS_KEY = "goblinwar_visitedBurgs"; // JSON array of every burgId shown via showLocationView at least once
const DEFEATED_VARIANTS_KEY = "goblinwar_defeatedVariants"; // JSON object {enemyName: true} — every ENEMY_VARIANTS name beaten at least once
const QUESTS_COMPLETED_TOTAL_KEY = "goblinwar_questsCompletedTotal"; // cumulative count, since goblinwar_completedQuests itself trims to COMPLETED_QUESTS_MAX

    return sum + (stats ? stats.def : 0);
  }, 0);
  return base + (hasPerk('iron_skin') ? 1 : 0);
}

function getCarriedWeight(){ return playerInventory.reduce((sum, it) => sum + it.weight*it.qty, 0); }

// Adds qty of an item (creating the stack, at the given weight/value-per-unit, if not
// already carried). Refuses (returns false, no change made) if it would push total
// carried weight over CARRY_CAPACITY.
function addItem(name, qty, weightEach, valueEach){
  const addedWeight = weightEach * qty;
  if(getCarriedWeight() + addedWeight > getCarryCapacity()) return false;
  const existing = getItem(name);
  if(existing) existing.qty += qty;
  else playerInventory.push({ name, qty, weight:weightEach, value:valueEach });
  saveInventory();
  return true;
}
// Removes up to qty of an item, clamped at 0; drops the stack entirely once empty.
function consumeItem(name, qty){
  const existing = getItem(name);
  if(!existing) return;
  existing.qty = Math.max(0, existing.qty - qty);
  if(existing.qty === 0) playerInventory = playerInventory.filter(it => it !== existing);
  saveInventory();
}

// Shared by the Inn's "Rest for the Night" and Camp's "Rest"/finishRest — both always fully
// restore Health, and Stamina too, or a bit more than full when a Bedroll is carried (see
// BEDROLL_STAMINA_BONUS). Deliberately bypasses setStamina's own clamp for this one write, so
// the bonus genuinely shows as playerStamina > playerMaxStamina right after resting rather than
// being immediately clipped back down — it then erodes back toward normal as Stamina is spent in
// combat via the usual setStamina(playerStamina - cost) calls, which never raise the value.
function restFully(){
  setHealth(playerMaxHealth);
  const bonus = getItem('Bedroll') ? BEDROLL_STAMINA_BONUS : 0;
  playerStamina = playerMaxStamina + bonus;
  localStorage.setItem(STAMINA_KEY, String(playerStamina));
  refreshPlayerStatUI();
}

// XP needed to go from `level` to `level+1` — not cumulative; playerXp tracks progress
// within the current level and resets (carrying any overshoot) on level-up.
function xpForLevel(level){ return Math.round(40 * Math.pow(level, 1.5)); }
// Grants XP, handling one or more level-ups in the same call (a big reward could clear more
// than one threshold at once). Each level-up grants a skill point and a flat Health/Stamina
// bump so leveling feels good before any point is spent — see context/roadmap.md. Returns
// true if at least one level-up happened, so callers can show a distinct toast/log line.
function addXp(amount){
  playerXp += amount;
  let leveledUp = false;
  while(playerXp >= xpForLevel(playerLevel)){
    playerXp -= xpForLevel(playerLevel);
    playerLevel += 1;
    playerSkillPoints += 1;
    playerMaxHealth += 8;
    playerMaxStamina += 4;
    playerHealth = Math.min(playerMaxHealth, playerHealth + 8);
    playerStamina = Math.min(playerMaxStamina, playerStamina + 4);
    leveledUp = true;
  }
  localStorage.setItem(LEVEL_KEY, String(playerLevel));
  localStorage.setItem(XP_KEY, String(playerXp));
  localStorage.setItem(SKILLPOINTS_KEY, String(playerSkillPoints));
  localStorage.setItem(MAXHEALTH_KEY, String(playerMaxHealth));
  localStorage.setItem(MAXSTAMINA_KEY, String(playerMaxStamina));
  localStorage.setItem(HEALTH_KEY, String(playerHealth));
  localStorage.setItem(STAMINA_KEY, String(playerStamina));
  refreshPlayerStatUI();
  return leveledUp;
}
