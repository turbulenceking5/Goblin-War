<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a;
    --parchment:#e9dcb8; --parchment-shadow:#b9a06e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--water-dk); font-family:'EB Garamond', serif; touch-action:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  header{
    position:relative; z-index:20;
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:9px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:17px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  .subtitle{ font-family:'Cinzel', serif; font-size:8.5px; letter-spacing:2.5px; color:#a9926a; text-transform:uppercase; }
  #date-badge{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    color:var(--parchment); background:rgba(255,255,255,.06);
    border:1px solid rgba(209,164,69,.5); border-radius:3px;
    padding:5px 9px; text-align:right; line-height:1.4;
  }
  #date-badge b{ color:var(--gold-lt); }

  #toolbar{
    position:relative; z-index:19;
    background:#1b1208;
    border-bottom:2px solid rgba(169,122,31,.5);
    padding:6px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  #nav-icons{ display:flex; gap:6px; }
  .nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:transparent; border:none; color:var(--gold-lt);
    font-family:'Cinzel', serif; font-size:8px; letter-spacing:.5px; text-transform:uppercase;
    padding:4px 7px; border-radius:6px;
  }
  .nav-btn:active{ background:rgba(255,255,255,.08); }
  .nav-btn svg{ width:18px; height:18px; }
  #zoom-controls{ display:flex; gap:6px; }
  .zbtn{
    width:30px; height:30px; border-radius:7px; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold-lt); font-family:'Cinzel',serif; font-size:15px; font-weight:700;
  }
  .zbtn:active{ transform:scale(.94); }

  #map-viewport{ position:relative; flex:1; overflow:hidden; background:var(--water-dk); touch-action:none; }
  #svg-holder{ position:absolute; inset:0; width:100%; height:100%; }
  #svg-holder svg{ width:100%; height:100%; display:block; }

  #svg-holder #labels-village text,
  #svg-holder #labels-town text,
  #svg-holder #labels-city text,
  #svg-holder #labels-capital text,
  #svg-holder #labels-state text{ cursor:pointer; }
  #svg-holder text.label-selected{ fill:#7b2e2e !important; }

  #full-map-view{ position:absolute; inset:0; display:none; background:var(--water-dk); }
  #full-map-view.show{ display:block; }
  #full-map-img{ width:100%; height:100%; object-fit:contain; display:block; }

  #ui-vignette{ position:absolute; inset:0; pointer-events:none; z-index:15; box-shadow: inset 0 0 100px 34px rgba(0,0,0,.5); }

  #view-toggle{
    position:fixed; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    border:2px solid #7a5715; color:#241705; font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #view-toggle:active{ transform:scale(.94); }

  #info-card{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(180deg,#efe2bd 0%, #e2d1a2 100%);
    border-top:3px solid var(--gold); border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,.45);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(115%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
  }
  #info-card.open{ transform:translateY(0); }
  #info-card .handle{ width:38px; height:4px; border-radius:3px; background:var(--parchment-shadow); margin:0 auto 10px; }
  #info-name{ font-family:'Cinzel Decorative', serif; font-size:20px; color:var(--ink); margin:0 0 2px; }
  #info-meta{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#6a5a3a; margin:0 0 10px; }
  #info-travel{ font-size:15px; color:#4d3a24; margin:0 0 14px; line-height:1.5; }
  #info-travel b{ color:var(--ink); }
  #info-actions{ display:flex; gap:10px; }
  .btn{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:1px;
    border:none; border-radius:8px; padding:11px 16px; cursor:pointer; flex:1;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700;
    box-shadow:0 3px 0 #7a5715;
  }
  .btn-secondary{ background:transparent; color:#4d3a24; border:1.5px solid var(--parchment-shadow); }

  #toast{
    position:fixed; top:66px; left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #loading{
    position:fixed; inset:0; z-index:50; background:var(--water-dk);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--gold-lt); font-family:'Cinzel', serif; font-size:12px; letter-spacing:2px;
  }
  #loading.hide{ display:none; }

  /* ---- Settlement (location) view — split screen ---- */
  #location-view{
    position:fixed; inset:0; z-index:60; display:none;
    background:var(--water-dk);
  }
  #location-view.show{ display:flex; }
  #loc-actions{
    width:52%; height:100%; overflow-y:auto;
    background:linear-gradient(180deg,#efe2bd 0%, #e2d1a2 100%);
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  #loc-visual{
    width:48%; height:100%;
    background:linear-gradient(180deg,#2c3f45,#1c2a2c);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:14px; text-align:center;
  }
  #loc-visual svg{ width:78%; max-width:220px; }
  #loc-visual-name{ font-family:'Cinzel Decorative', serif; color:var(--gold-lt); font-size:16px; margin-top:10px; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #loc-visual-tier{ font-family:'Cinzel', serif; color:#a9926a; font-size:9px; letter-spacing:2px; text-transform:uppercase; margin-top:3px; }

  #loc-back{
    align-self:flex-start;
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:#4d3a24; border:1.5px solid var(--parchment-shadow);
    border-radius:6px; padding:7px 12px; margin-bottom:14px; cursor:pointer;
  }
  #loc-back:active{ transform:scale(.96); }
  #loc-heading{ font-family:'Cinzel Decorative', serif; font-size:18px; color:var(--ink); margin:0 0 2px; }
  #loc-sub{ font-family:'Cinzel', serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#6a5a3a; margin:0 0 16px; }
  .loc-action{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.35); border:1.5px solid var(--parchment-shadow);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
    text-align:left; width:100%; font-family:'EB Garamond', serif;
  }
  .loc-action:active{ transform:scale(.98); background:rgba(255,255,255,.55); }
  .loc-action .li-icon{ width:26px; height:26px; flex:none; color:var(--ink); }
  .loc-action .li-text b{ display:block; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px; color:var(--ink); }
  .loc-action .li-text span{ font-size:12.5px; color:#6a5a3a; }

  /* ---- traveling marker ---- */
  .player-token{ pointer-events:none; }
</style>

<body>
<div id="app">

  <header>
    <div>
      <h1 id="header-title">THE REALM</h1>
      <div class="subtitle" id="header-sub">Tap or hover a name</div>
    </div>
    <div id="date-badge">Day <b id="date-day">1</b>, Month <b id="date-month">1</b>, Year <b id="date-year">1</b></div>
  </header>

  <div id="toolbar">
    <div id="nav-icons">
      <button class="nav-btn" onclick="location.href='inventory.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
        Bag
      </button>
      <button class="nav-btn" onclick="location.href='party.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.6"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M13.5 14.2c2.6.3 4.5 2.4 4.5 5.8"/></svg>
        Party
      </button>
      <button class="nav-btn" onclick="location.href='character.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Hero
      </button>
      <button class="nav-btn" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4.6a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.7a7.6 7.6 0 0 0-1.7 1l-2.4-.6-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-.6a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.4.6 2-3.4-2-1.5z"/></svg>
        Settings
      </button>
    </div>
    <div id="zoom-controls">
      <button class="zbtn" id="zoom-out">–</button>
      <button class="zbtn" id="zoom-in">+</button>
    </div>
  </div>

  <div id="map-viewport">
    <div id="svg-holder"></div>
    <div id="full-map-view">
      <img id="full-map-img" src="assets/full-map.jpg" alt="Full world map overview">
    </div>
    <div id="ui-vignette"></div>
  </div>

  <button id="view-toggle">FULL<br>MAP</button>

  <div id="toast"></div>

  <div id="info-card">
    <div class="handle"></div>
    <h2 id="info-name">—</h2>
    <div id="info-meta"></div>
    <div id="info-travel"></div>
    <div id="info-actions">
      <button class="btn btn-secondary" id="btn-close">Close</button>
      <button class="btn btn-primary" id="btn-travel">Travel Here</button>
    </div>
  </div>

  <div id="loading">LOADING THE MAP…</div>

  <div id="location-view">
    <div id="loc-actions">
      <button id="loc-back">&larr; Back to Map</button>
      <h2 id="loc-heading">—</h2>
      <div id="loc-sub"></div>
      <div id="loc-action-list"></div>
    </div>
    <div id="loc-visual">
      <div id="loc-visual-art"></div>
      <div id="loc-visual-name">—</div>
      <div id="loc-visual-tier"></div>
    </div>
  </div>
</div>

<script>
const TIER_LABEL = { village:"Village", town:"Town", city:"City", capital:"Capital", state:"Region / State" };
const TIER_BY_GROUP = { 'labels-village':'village','labels-town':'town','labels-city':'city','labels-capital':'capital','labels-state':'state' };

// ===================== MAP CANVAS / VIEW =====================
const FULL_W = 2560, FULL_H = 1277;
const START_X = 705, START_Y = 448;   // Bary — human starting kingdom
const REGION_W = 700;                  // default zoom level
const MIN_W = 120;                     // deepest zoom-in allowed
const MAX_W = REGION_W;                // can't zoom out past the default region view

let vb = { x: START_X - REGION_W/2, y: 0, w: REGION_W, h: REGION_W };
let svgEl = null;

function svgAspect(){
  const holder = document.getElementById('map-viewport');
  return holder.clientHeight / holder.clientWidth;
}
function applyViewBox(){
  vb.w = Math.max(MIN_W, Math.min(MAX_W, vb.w));
  vb.h = vb.w * svgAspect();
  vb.x = Math.max(0, Math.min(FULL_W - vb.w, vb.x));
  vb.y = Math.max(0, Math.min(FULL_H - vb.h, vb.y));
  if(svgEl) svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}
vb.y = START_Y - (REGION_W*svgAspect())/2;

function zoomBy(factor, centerXpx, centerYpx){
  const holder = document.getElementById('map-viewport');
  const rect = holder.getBoundingClientRect();
  const cx = centerXpx!=null ? vb.x + (centerXpx-rect.left)/rect.width * vb.w : vb.x + vb.w/2;
  const cy = centerYpx!=null ? vb.y + (centerYpx-rect.top)/rect.height * vb.h : vb.y + vb.h/2;
  vb.x = cx - (cx - vb.x) * factor;
  vb.y = cy - (cy - vb.y) * factor;
  vb.w = vb.w * factor;
  applyViewBox();
}
document.getElementById('zoom-in').addEventListener('click', ()=> zoomBy(0.75));
document.getElementById('zoom-out').addEventListener('click', ()=> zoomBy(1.33));

// ---- pan, pinch-zoom, and tap-to-select (unified so tap hit-testing survives pointer capture) ----
const viewport = document.getElementById('map-viewport');
let pointers = new Map();
let dragStart = null;      // {x,y} screen px at gesture start
let dragMoved = false;
let pinchStartDist = null, pinchStartW = null;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

viewport.addEventListener('pointerdown', (e)=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){
    dragStart = {x:e.clientX, y:e.clientY};
    dragMoved = false;
  }
  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStartDist = dist(pts[0],pts[1]);
    pinchStartW = vb.w;
    dragMoved = true; // a pinch is never a tap
  }
});
viewport.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){
    const rect = viewport.getBoundingClientRect();
    const dxPx = e.clientX - prev.x, dyPx = e.clientY - prev.y;
    if(Math.abs(e.clientX-dragStart.x) > 6 || Math.abs(e.clientY-dragStart.y) > 6) dragMoved = true;
    vb.x -= dxPx/rect.width * vb.w;
    vb.y -= dyPx/rect.height * vb.h;
    applyViewBox();
  } else if(pointers.size===2 && pinchStartDist){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const factor = pinchStartDist/d;
    const midX=(pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    zoomBy((pinchStartW*factor)/vb.w, midX, midY);
  }
});
viewport.addEventListener('pointerup', (e)=>{
  const wasSingle = pointers.size===1 && dragStart;
  if(wasSingle && !dragMoved){
    handleTap(dragStart.x, dragStart.y);
  }
  pointers.delete(e.pointerId);
  if(pointers.size<2){ pinchStartDist=null; }
  if(pointers.size<1){ dragStart=null; }
});
viewport.addEventListener('pointercancel', (e)=>{
  pointers.delete(e.pointerId);
  pinchStartDist=null; dragStart=null;
});
viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomBy(e.deltaY>0?1.12:0.89, e.clientX, e.clientY);
}, {passive:false});

function handleTap(clientX, clientY){
  const el = document.elementFromPoint(clientX, clientY);
  onMapTap(el);
}


// ===================== GAME CALENDAR =====================
const CAL_KEY = "goblinwar_gameDay";
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;
let gameDay = parseInt(localStorage.getItem(CAL_KEY) || "0", 10);

function refreshCalendarUI(){
  const day = (gameDay % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(gameDay / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(gameDay / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  document.getElementById('date-day').textContent = day;
  document.getElementById('date-month').textContent = month;
  document.getElementById('date-year').textContent = year;
}
function advanceDays(n){
  gameDay += n;
  localStorage.setItem(CAL_KEY, String(gameDay));
  refreshCalendarUI();
}

// ===================== TRAVEL GRAPH =====================
const LOC_KEY = "goblinwar_currentBurg";
const ROAD_PACE = 20;    // miles per day, travelling via drawn roads
const OFFROAD_PACE = 12; // miles per day, cross-country with no road

let graph = null;      // { burgs: {id:{name,tier,x,y}}, edges:[{a,b,mi}] }
let adjacency = {};     // id -> [{to, mi}]
let currentBurg = localStorage.getItem(LOC_KEY) || "5"; // Bary
let selectedBurg = null;
let playerMarkerEl = null;

function buildAdjacency(){
  graph.edges.forEach(e=>{
    (adjacency[e.a] = adjacency[e.a]||[]).push({to:e.b, mi:e.mi});
    (adjacency[e.b] = adjacency[e.b]||[]).push({to:e.a, mi:e.mi});
  });
}

// Dijkstra shortest road distance from currentBurg to targetId. Returns miles or null.
function roadDistance(fromId, toId){
  if(fromId === toId) return 0;
  const dist = {}; dist[fromId] = 0;
  const visited = new Set();
  const pq = [[0, fromId]];
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);
    const [d, node] = pq.shift();
    if(visited.has(node)) continue;
    visited.add(node);
    if(node === toId) return d;
    (adjacency[node]||[]).forEach(edge=>{
      const nd = d + edge.mi;
      if(dist[edge.to] === undefined || nd < dist[edge.to]){
        dist[edge.to] = nd;
        pq.push([nd, edge.to]);
      }
    });
  }
  return null;
}

function straightLineMiles(fromId, toId){
  const a = graph.burgs[fromId], b = graph.burgs[toId];
  if(!a || !b) return null;
  const dx = a.x-b.x, dy = a.y-b.y;
  return Math.hypot(dx,dy) * 3; // 3 miles per map unit, per the map's scale bar
}

function computeTravel(toId){
  const road = roadDistance(currentBurg, toId);
  if(road !== null){
    return { miles: Math.round(road), days: Math.max(1, Math.ceil(road/ROAD_PACE)), viaRoad:true };
  }
  const straight = straightLineMiles(currentBurg, toId);
  if(straight === null) return null;
  const miles = Math.round(straight * 1.4); // rough terrain penalty for unmapped routes
  return { miles, days: Math.max(1, Math.ceil(miles/OFFROAD_PACE)), viaRoad:false };
}

// ===================== PLAYER MARKER =====================
const HEADING_KEY = "goblinwar_heading";
let heading = parseFloat(localStorage.getItem(HEADING_KEY) || "0"); // degrees, 0 = facing north
let markerIconEl = null; // the inner rotatable group

function setHeading(deg){
  heading = deg;
  localStorage.setItem(HEADING_KEY, String(heading));
  if(markerIconEl) markerIconEl.setAttribute("transform", `rotate(${heading})`);
}

function headingFromDelta(dx, dy){
  return Math.atan2(dx, -dy) * 180 / Math.PI; // 0=north, 90=east, 180=south, -90=west
}

function positionPlayerMarker(x, y){
  if(playerMarkerEl){
    playerMarkerEl.setAttribute("transform", `translate(${x},${y})`);
    return;
  }
  const ns = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(ns, "g");
  g.setAttribute("transform", `translate(${x},${y})`);
  g.style.pointerEvents = "none";
  g.innerHTML = `
    <circle r="5.5" fill="none" stroke="#d1a445" stroke-width="1.4">
      <animate attributeName="r" values="5.5;8.5;5.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.25;.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g id="marker-icon" transform="rotate(${heading})">
      <path d="M0,-7 L5,6 L0,2.5 L-5,6 Z" fill="#7b2e2e" stroke="#f1e6c4" stroke-width="0.9"/>
    </g>
  `;
  svgEl.appendChild(g);
  playerMarkerEl = g;
  markerIconEl = g.querySelector('#marker-icon');
}
function drawPlayerMarker(){
  if(!svgEl) return;
  const b = graph.burgs[currentBurg];
  if(!b) return;
  positionPlayerMarker(b.x, b.y);
}

function centerOn(burgId){
  const b = graph.burgs[burgId];
  if(!b) return;
  vb.x = b.x - vb.w/2;
  vb.y = b.y - vb.h/2;
  applyViewBox();
}

// Animate the marker (and camera) moving from the current burg to a destination burg.
// The marker rotates to face the direction of travel immediately, and holds that
// heading after arrival until the next journey changes it.
function animateTravel(fromId, toId, durationMs, onDone){
  const a = graph.burgs[fromId], b = graph.burgs[toId];
  if(!a || !b){ onDone(); return; }
  setHeading(headingFromDelta(b.x - a.x, b.y - a.y));
  const offsetX = vb.x - a.x, offsetY = vb.y - a.y; // camera position relative to character, held fixed
  const t0 = performance.now();
  function frame(now){
    let p = Math.min(1, (now - t0) / durationMs);
    p = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; // ease-in-out
    const x = a.x + (b.x - a.x) * p;
    const y = a.y + (b.y - a.y) * p;
    positionPlayerMarker(x, y);
    vb.x = x + offsetX;
    vb.y = y + offsetY;
    applyViewBox();
    if(p < 1){ requestAnimationFrame(frame); }
    else { onDone(); }
  }
  requestAnimationFrame(frame);
}


// ===================== UI: label selection / info card =====================
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function findBurgIdFromLabel(el){
  // match the label's text content + tier to our graph (labels come from the same SVG/data source)
  const group = el.closest('[id^="labels-"]');
  if(!group) return null;
  const tier = TIER_BY_GROUP[group.id];
  if(!tier || tier === 'state') return null;
  const name = el.textContent.trim();
  for(const id in graph.burgs){
    const b = graph.burgs[id];
    if(b.tier === tier && b.name === name) return id;
  }
  return null;
}

let selectedEl = null;
function closeCard(){
  document.getElementById('info-card').classList.remove('open');
  if(selectedEl){ selectedEl.classList.remove('label-selected'); selectedEl = null; }
  selectedBurg = null;
}
document.getElementById('btn-close').addEventListener('click', closeCard);

document.getElementById('svg-holder').addEventListener('click', (e)=>{ e.preventDefault(); });

function onMapTap(el){
  if(!el || el.tagName.toLowerCase() !== 'text'){ closeCard(); return; }
  const group = el.closest('[id^="labels-"]');
  if(!group || !(group.id in TIER_BY_GROUP)){ closeCard(); return; }
  const tier = TIER_BY_GROUP[group.id];
  const name = el.textContent.trim();

  if(selectedEl) selectedEl.classList.remove('label-selected');
  el.classList.add('label-selected');
  selectedEl = el;

  document.getElementById('info-name').textContent = name;
  document.getElementById('info-meta').innerHTML =
    `<span>${TIER_LABEL[tier]||tier}</span>`;

  const travelDiv = document.getElementById('info-travel');
  const travelBtn = document.getElementById('btn-travel');

  if(tier === 'state'){
    travelDiv.textContent = "A region, not a single place — tap a settlement within it to travel.";
    travelBtn.style.display = 'none';
    selectedBurg = null;
    document.getElementById('info-card').classList.add('open');
    return;
  }

  const burgId = findBurgIdFromLabel(el);
  selectedBurg = burgId;

  if(!burgId){
    travelDiv.textContent = "Unable to locate this settlement in the travel data.";
    travelBtn.style.display = 'none';
  } else if(burgId === currentBurg){
    travelDiv.textContent = "You are here.";
    travelBtn.style.display = 'block';
    travelBtn.textContent = 'Enter Settlement';
  } else {
    const t = computeTravel(burgId);
    if(!t){
      travelDiv.textContent = "Distance unknown.";
      travelBtn.style.display = 'none';
    } else {
      travelDiv.innerHTML = `<b>${t.miles} miles</b> ${t.viaRoad ? 'by road' : 'cross-country (no road)'} — about <b>${t.days} day${t.days===1?'':'s'}</b> travel.`;
      travelBtn.style.display = 'block';
      travelBtn.textContent = `Travel Here (${t.days}d)`;
    }
  }
  document.getElementById('info-card').classList.add('open');
}

document.getElementById('btn-travel').addEventListener('click', ()=>{
  if(!selectedBurg) return;

  if(selectedBurg === currentBurg){
    closeCard();
    showLocationView(currentBurg);
    return;
  }

  const t = computeTravel(selectedBurg);
  if(!t) return;
  const destId = selectedBurg;
  const destName = graph.burgs[destId].name;
  const fromId = currentBurg;
  closeCard();
  showToast(`Traveling to ${destName}…`);

  const duration = Math.min(2600, 800 + t.days*180);
  animateTravel(fromId, destId, duration, ()=>{
    currentBurg = destId;
    localStorage.setItem(LOC_KEY, currentBurg);
    advanceDays(t.days);
    showLocationView(currentBurg);
  });
});

function showLocationView(burgId){
  const b = graph.burgs[burgId];
  if(!b) return;
  document.getElementById('loc-heading').textContent = b.name;
  document.getElementById('loc-sub').textContent = `${TIER_LABEL[b.tier]||b.tier}`;
  document.getElementById('loc-visual-art').innerHTML = TIER_ART[b.tier] || TIER_ART.village;
  document.getElementById('loc-visual-name').textContent = b.name;
  document.getElementById('loc-visual-tier').textContent = TIER_LABEL[b.tier]||b.tier;

  const actions = [
    { icon:`<circle cx="12" cy="12" r="9"/><path d="M9 10h6M9 14h4"/>`, title:"The Inn", desc:"Rest up and hear local rumours", stub:true },
    { icon:`<path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>`, title:"Marketplace", desc:"Buy and sell gear", stub:true },
    { icon:`<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5"/><path d="M11 19c0-3 2.5-5 5-5s5 2 5 5"/>`, title:"Talk to Townsfolk", desc:"Ask what's happening in the world", stub:true },
  ];
  const list = document.getElementById('loc-action-list');
  list.innerHTML = actions.map(a => `
    <button class="loc-action" data-stub="${a.stub}">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${a.icon}</svg>
      <span class="li-text"><b>${a.title}</b><span>${a.desc}</span></span>
    </button>
  `).join('');
  list.querySelectorAll('.loc-action').forEach(btn=>{
    btn.addEventListener('click', ()=> showToast("Not built yet — coming in a future update."));
  });

  document.getElementById('location-view').classList.add('show');
}
document.getElementById('loc-back').addEventListener('click', ()=>{
  document.getElementById('location-view').classList.remove('show');
});

// ===================== FULL MAP TOGGLE =====================
const toggleBtn = document.getElementById('view-toggle');
const fullView = document.getElementById('full-map-view');
let showingFull = false;
toggleBtn.addEventListener('click', ()=>{
  showingFull = !showingFull;
  fullView.classList.toggle('show', showingFull);
  document.getElementById('svg-holder').style.display = showingFull ? 'none' : 'block';
  toggleBtn.innerHTML = showingFull ? 'BACK TO<br>MAP' : 'FULL<br>MAP';
  document.getElementById('header-title').textContent = showingFull ? 'FULL WORLD MAP' : 'THE REALM';
  document.getElementById('header-sub').textContent = showingFull ? 'Overview only — travel on the region map' : 'Tap or hover a name';
  if(showingFull) closeCard();
});

// ===================== LOAD =====================
Promise.all([
  fetch('assets/game-map.svg').then(r=>r.text()),
  fetch('assets/travel-graph.json').then(r=>r.json())
]).then(([svgText, graphData])=>{
  graph = graphData;
  buildAdjacency();

  const holder = document.getElementById('svg-holder');
  holder.innerHTML = svgText;
  svgEl = holder.querySelector('svg');
  svgEl.removeAttribute('width');
  svgEl.removeAttribute('height');
  applyViewBox();

  drawPlayerMarker();
  refreshCalendarUI();
  document.getElementById('loading').classList.add('hide');
}).catch(err=>{
  document.getElementById('loading').textContent = 'Could not load the map.';
  console.error(err);
});

window.addEventListener('resize', applyViewBox);
