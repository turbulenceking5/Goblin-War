<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Map</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a;
    --parchment:#e9dcb8; --parchment-shadow:#b9a06e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--water-dk); font-family:'EB Garamond', serif; touch-action:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  header{
    position:relative; z-index:20;
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(9px + env(safe-area-inset-top)) 14px 9px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:17px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #date-badge{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    color:var(--parchment); background:rgba(255,255,255,.06);
    border:1px solid rgba(209,164,69,.5); border-radius:3px;
    padding:5px 9px; text-align:right; line-height:1.4;
  }
  #date-badge b{ color:var(--gold-lt); }

  #toolbar{
    position:relative; z-index:19;
    background:#1b1208;
    border-bottom:2px solid rgba(169,122,31,.5);
    padding:8px 10px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; row-gap:8px;
  }
  #nav-icons{ display:flex; gap:4px; order:1; }
  .nav-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--gold-lt);
    font-family:'Cinzel', serif; font-size:9px; letter-spacing:.3px; text-transform:uppercase;
    padding:6px 8px; border-radius:8px; white-space:nowrap;
  }
  .nav-btn:active{ background:rgba(255,255,255,.08); }
  .nav-btn svg{ width:22px; height:22px; }
  #zoom-controls{ display:flex; gap:8px; order:2; }
  #player-stats{ display:flex; flex-wrap:wrap; gap:7px; order:3; flex:1 1 100%; justify-content:center; }
  .stat-pill{
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.06); border:1px solid rgba(209,164,69,.4);
    border-radius:20px; padding:5px 11px;
    font-family:'Cinzel', serif; font-size:13px; color:var(--parchment);
  }
  .stat-pill svg{ width:14px; height:14px; color:var(--gold-lt); flex:none; }
  .stat-pill.food-pill svg{ color:#c9924a; }
  .stat-pill.stamina-pill svg{ color:#5b8fc7; }
  .stat-pill:first-child svg{ color:#c0524f; }
  .zbtn{
    width:38px; height:38px; border-radius:9px; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold-lt); font-family:'Cinzel',serif; font-size:18px; font-weight:700;
  }
  .zbtn:active{ transform:scale(.94); }

  #map-viewport{ position:relative; flex:1; overflow:hidden; background:var(--water-dk); touch-action:none; }
  #map-stage{
    position:absolute; left:0; top:0;
    width:10240px; height:5108px;
    transform-origin:0 0;
    will-change:transform;
  }
  #map-img{ position:absolute; inset:0; width:10240px; height:5108px; display:block; user-select:none; -webkit-user-drag:none; }
  #overlay{ position:absolute; inset:0; width:10240px; height:5108px; }

  .hitzone{ fill:transparent; cursor:pointer; }
  #highlight-ring{
    fill:none; stroke:var(--gold-lt); stroke-width:3;
    opacity:0; transition:opacity .15s;
    filter:drop-shadow(0 0 4px rgba(209,164,69,.8));
  }
  #highlight-ring.show{ opacity:1; }
  #highlight-ring circle{ animation:pulse-ring 1.4s ease-in-out infinite; transform-origin:center; }
  @keyframes pulse-ring{ 0%,100%{ r:22; opacity:1; } 50%{ r:27; opacity:.6; } }

  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; letter-spacing:1px; margin-right:6px; color:#fff; font-family:'Cinzel',serif; }
  .tag.human{ background:#33502f; }
  .tag.dwarf{ background:#2f4d55; }
  .tag.ork,.tag.goblin{ background:#6e2626; }

  #route-preview{ fill:none; stroke:#d1a445; stroke-width:2.6; stroke-dasharray:1 5; stroke-linecap:round; opacity:0; pointer-events:none; }

  .player-token{ pointer-events:none; }

  #ui-vignette{ position:absolute; inset:0; pointer-events:none; z-index:15; box-shadow: inset 0 0 100px 34px rgba(0,0,0,.5); }

  #recenter-btn{
    position:fixed; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    border:2px solid #7a5715; color:#241705; font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #recenter-btn:active{ transform:scale(.94); }

  #camp-here-btn{
    position:fixed; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:rgba(20,14,6,.88);
    border:2px solid var(--gold-lt); color:var(--gold-lt); font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #camp-here-btn:active{ transform:scale(.94); }
  #camp-here-btn.hide{ display:none; }

  #info-card{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    border-top:3px solid var(--gold); border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,.45);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(115%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
  }
  #info-card.open{ transform:translateY(0); }
  #info-card .handle{ width:38px; height:4px; border-radius:3px; background:var(--parchment-shadow); margin:0 auto 10px; }
  #info-name{ font-family:'Cinzel Decorative', serif; font-size:20px; color:var(--parchment); margin:0 0 2px; }
  #info-meta{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:0 0 10px; }
  #info-travel{ font-size:15px; color:var(--parchment); margin:0 0 14px; line-height:1.5; }
  #info-travel b{ color:var(--gold-lt); }
  #info-actions{ display:flex; gap:10px; }
  .btn{ font-family:'Cinzel', serif; font-size:13px; letter-spacing:1px; border:none; border-radius:8px; padding:11px 16px; cursor:pointer; flex:1; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; box-shadow:0 3px 0 #7a5715; }
  .btn-secondary{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }

  #travel-controls{
    position:fixed; left:12px; right:12px; top:calc(160px + env(safe-area-inset-top,0px)); z-index:35;
    background:rgba(24,17,8,.95); border:1.5px solid var(--gold); border-radius:12px;
    padding:12px 14px; display:none; box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  #travel-controls.show{ display:block; }
  #travel-status{
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; color:var(--parchment);
    margin-bottom:10px; text-align:center;
  }
  #travel-status b{ color:var(--gold-lt); }
  #travel-buttons{ display:flex; gap:8px; }
  .travel-btn{
    flex:1; font-family:'Cinzel', serif; font-size:11.5px; letter-spacing:.5px;
    border-radius:8px; padding:9px 10px; cursor:pointer; border:1.5px solid var(--gold-lt);
  }
  .travel-btn:active{ transform:scale(.96); }
  #btn-stop-travel{ background:transparent; color:var(--gold-lt); }
  #btn-camp-travel{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; border-color:#7a5715; }

  #toast{
    position:fixed; top:calc(66px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:80; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #loading{
    position:fixed; inset:0; z-index:50; background:var(--water-dk);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--gold-lt); font-family:'Cinzel', serif; font-size:12px; letter-spacing:2px;
  }
  #loading.hide{ display:none; }

  #update-banner{
    position:fixed; top:0; left:0; right:0; z-index:95;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    color:#241705; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px; font-weight:700;
    text-align:center; cursor:pointer;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    transform:translateY(-100%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #update-banner.show{ transform:translateY(0); }
  #update-banner:active{ filter:brightness(.95); }

  #whats-new-modal{
    position:fixed; inset:0; z-index:90; display:none;
    background:rgba(10,7,3,.75);
    align-items:center; justify-content:center; padding:20px;
  }
  #whats-new-modal.show{ display:flex; }
  #whats-new-card{
    max-width:380px; width:100%; max-height:80vh; overflow-y:auto;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    border:2px solid var(--gold); border-radius:14px;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 12px 30px rgba(0,0,0,.6);
  }
  #whats-new-title{ font-family:'Cinzel Decorative', serif; font-size:19px; color:var(--gold-lt); margin:0 0 14px; text-align:center; text-shadow:none; }
  .whats-new-entry{ margin-bottom:16px; }
  .whats-new-entry:last-child{ margin-bottom:0; }
  .whats-new-date{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:6px; }
  .whats-new-entry ul{ margin:0; padding-left:18px; }
  .whats-new-entry li{ font-size:14px; color:var(--parchment); margin-bottom:4px; line-height:1.4; }
  #whats-new-dismiss{ width:100%; margin-top:6px; }

  #location-view{ position:fixed; inset:0; z-index:60; display:none; background:var(--water-dk); }
  #location-view.show{ display:block; }
  #loc-actions{
    box-sizing:border-box; width:100%; max-width:560px; height:100%; margin:0 auto; overflow-y:auto;
    background:linear-gradient(180deg,#2b2115 0%, #1c150c 100%);
    padding:calc(16px + env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  /* Reserved corner for per-location art, once it exists — pinned in place (not part of
     the scrolling action list) so it stays visible; the extra bottom padding on
     #loc-actions above keeps the last action button from hiding behind it. */
  #loc-visual{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:61;
    width:112px; height:130px;
    background:linear-gradient(180deg,#2c3f45,#1c2a2c);
    border:2px solid var(--gold); border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px; text-align:center;
  }
  #loc-visual svg{ width:68%; max-width:70px; }
  #loc-visual-name{ font-family:'Cinzel Decorative', serif; color:var(--gold-lt); font-size:10.5px; margin-top:6px; text-shadow:0 2px 3px rgba(0,0,0,.6); line-height:1.2; }
  #loc-visual-tier{ font-family:'Cinzel', serif; color:#a9926a; font-size:7px; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; }
  #loc-back{
    align-self:flex-start;
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4);
    border-radius:6px; padding:7px 12px; margin-bottom:14px; cursor:pointer;
  }
  #loc-back:active{ transform:scale(.96); }
  #loc-heading{ font-family:'Cinzel Decorative', serif; font-size:18px; color:var(--parchment); margin:0 0 2px; }
  #loc-sub{ font-family:'Cinzel', serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:0 0 16px; }
  .loc-action{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
    text-align:left; width:100%; font-family:'EB Garamond', serif;
  }
  .loc-action:active{ transform:scale(.98); background:rgba(255,255,255,.12); }
  .loc-action:disabled{ opacity:.5; cursor:not-allowed; }
  .loc-action:disabled:active{ transform:none; background:rgba(255,255,255,.06); }

  .buy-row{ display:flex; align-items:center; gap:10px; margin:-4px 0 14px; }
  .qty-slider{
    flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:var(--parchment-shadow); outline:none;
  }
  .qty-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold)); border:2px solid #7a5715; cursor:pointer;
  }
  .qty-slider::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; border:2px solid #7a5715;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold)); cursor:pointer;
  }
  .qty-readout{
    flex:none; min-width:64px; text-align:center; font-family:'Cinzel', serif; font-size:11.5px;
    color:var(--parchment); background:rgba(255,255,255,.08); border-radius:8px; padding:6px 4px;
  }
  .buy-row .btn{ flex:none; padding:10px 16px; }
  .loc-action .li-icon{ width:26px; height:26px; flex:none; color:var(--parchment); }
  .loc-action .li-text b{ display:block; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px; color:var(--parchment); }
  .loc-action .li-text span{ font-size:12.5px; color:#a9926a; }

  #combat-view{
    position:fixed; inset:0; z-index:70; display:none; flex-direction:column;
    background:radial-gradient(ellipse at 50% 0%, #2c1414, #150a0a 70%);
  }
  #combat-view.show{ display:flex; }
  #combat-header{ padding:calc(18px + env(safe-area-inset-top)) 16px 8px; text-align:center; }
  #combat-title{ font-family:'Cinzel Decorative', serif; font-size:22px; color:#e2857f; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #combat-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 20px; gap:14px; }
  #combat-enemy-icon{ filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); display:flex; align-items:center; justify-content:center; }
  #combat-enemy-icon img{ display:block; width:auto; height:auto; max-width:190px; max-height:210px; object-fit:contain; }
  .combat-bar-row{ width:100%; max-width:320px; }
  .combat-name{ font-family:'Cinzel', serif; font-size:12px; color:var(--parchment); margin-bottom:4px; display:flex; justify-content:space-between; letter-spacing:.5px; }
  .combat-bar-track{ background:rgba(0,0,0,.35); border-radius:8px; height:14px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
  .combat-bar-fill{ height:100%; transition:width .3s; }
  .combat-bar-fill.enemy{ background:linear-gradient(90deg,#8c3a3a,#c0524f); }
  .combat-bar-fill.player{ background:linear-gradient(90deg,#3d7a3d,#5ba05b); }
  .combat-bar-fill.stamina{ background:linear-gradient(90deg,#3d5f7a,#5b8fc7); }
  #combat-log{
    width:100%; max-width:320px; height:100px; overflow-y:auto;
    background:rgba(0,0,0,.3); border-radius:8px; padding:10px 12px;
    font-family:'EB Garamond', serif; font-size:13.5px; color:#e9dcb8; line-height:1.5;
  }
  #combat-log div{ margin-bottom:4px; }
  #combat-actions{ display:flex; gap:10px; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .combat-btn{ flex:1; font-family:'Cinzel', serif; font-size:13.5px; letter-spacing:.5px; padding:13px; border-radius:10px; cursor:pointer; border:none; }
  .combat-btn:active{ transform:scale(.97); }
  #combat-attack-btn{ background:linear-gradient(180deg,#c0524f,#8c3a3a); color:#fff; border:1.5px solid #6e2626; font-weight:700; box-shadow:0 3px 0 #5a1f1f; }
  #combat-attack-btn:disabled{ opacity:.4; box-shadow:none; cursor:not-allowed; }
  #combat-flee-btn{ background:transparent; color:var(--parchment); border:1.5px solid rgba(255,255,255,.3); }
</style>
</head>
<body>
<div id="app">

  <div id="update-banner">&#8635; Update available — tap to refresh</div>

  <header>
    <div>
      <h1 id="header-title">GOBLIN WAR</h1>
    </div>
    <div id="date-badge">Day <b id="date-day">1</b>, Month <b id="date-month">1</b>, Year <b id="date-year">1</b></div>
  </header>

  <div id="toolbar">
    <div id="nav-icons">
      <button class="nav-btn" onclick="location.href='inventory.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
        Inventory
      </button>
      <button class="nav-btn" onclick="location.href='party.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.6"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M13.5 14.2c2.6.3 4.5 2.4 4.5 5.8"/></svg>
        Party
      </button>
      <button class="nav-btn" onclick="location.href='character.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Hero
      </button>
      <button class="nav-btn" onclick="location.href='settings.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4.6a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.7a7.6 7.6 0 0 0-1.7 1l-2.4-.6-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-.6a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.4.6 2-3.4-2-1.5z"/></svg>
        Settings
      </button>
    </div>
    <div id="player-stats">
      <span class="stat-pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C0.3 8 2.1 4.5 5.6 4c2-.3 3.8.7 6.4 3.3C14.6 4.7 16.4 3.7 18.4 4c3.5.5 5.3 4 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg><b id="stat-hp">100/100</b></span>
      <span class="stat-pill stamina-pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg><b id="stat-stamina">100/100</b></span>
      <span class="stat-pill food-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V3"/><path d="M12 6l-4-2M12 6l4-2M12 10l-4-2M12 10l4-2M12 14l-4-2M12 14l4-2"/></svg><b id="stat-food">10</b></span>

<script>
const TIER_LABEL = { village:"Village", town:"Town", city:"City", capital:"Capital" };
const RACE_LABEL = { human:"Human", dwarf:"Dwarf", ork:"Ork", goblin:"Goblin" };
const ALLIANCE = { human:"Good", dwarf:"Good", ork:"Bad", goblin:"Bad" };

// ===================== MAP CANVAS / VIEW (raster + CSS transform pan/zoom) =====================
const STAGE_W = 10240, STAGE_H = 5108;      // native raster pixel size
const LOGICAL_W = 2560, LOGICAL_H = 1277;   // coordinate space our data uses (1 unit = 2 raster px)
const START_X = 705, START_Y = 448;         // Bary — human starting kingdom
const REGION_W = 260;                        // default zoom shows this many logical units wide

let view = { scale: 1, tx: 0, ty: 0 };
let svgEl = document.getElementById('overlay'); // the interaction overlay (tap zones, marker, etc.)

function clampView(){
  const holder = document.getElementById('map-viewport');
  const vw = holder.clientWidth, vh = holder.clientHeight;
  const minScaleToFillW = vw / STAGE_W, minScaleToFillH = vh / STAGE_H;
  const minScale = Math.max(minScaleToFillW, minScaleToFillH); // can't zoom out past fitting the map
  const maxScale = 3.0; // deepest zoom-in (beyond native pixel res, graceful upscale)
  view.scale = Math.max(minScale, Math.min(maxScale, view.scale));
  const scaledW = STAGE_W*view.scale, scaledH = STAGE_H*view.scale;
  view.tx = Math.max(vw - scaledW, Math.min(0, view.tx));
  view.ty = Math.max(vh - scaledH, Math.min(0, view.ty));
}
function applyView(){
  clampView();
  document.getElementById('map-stage').style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
}
function centerOnLogical(lx, ly, scale){
  const holder = document.getElementById('map-viewport');
  const vw = holder.clientWidth, vh = holder.clientHeight;
  if(scale!=null) view.scale = scale;
  const px = lx * (STAGE_W/LOGICAL_W) * view.scale;
  const py = ly * (STAGE_H/LOGICAL_H) * view.scale;
  view.tx = vw/2 - px;
  view.ty = vh/2 - py;
  applyView();
}

function zoomBy(factor, centerXpx, centerYpx){
  const holder = document.getElementById('map-viewport');
  const rect = holder.getBoundingClientRect();
  const cx = centerXpx!=null ? centerXpx-rect.left : holder.clientWidth/2;
  const cy = centerYpx!=null ? centerYpx-rect.top : holder.clientHeight/2;
  const worldX = (cx - view.tx)/view.scale, worldY = (cy - view.ty)/view.scale;
  view.scale *= factor;
  view.tx = cx - worldX*view.scale;
  view.ty = cy - worldY*view.scale;
  applyView();
}
document.getElementById('zoom-in').addEventListener('click', ()=> zoomBy(1.35));
document.getElementById('zoom-out').addEventListener('click', ()=> zoomBy(0.74));

// ---- pan, pinch-zoom, and tap-to-select ----
const viewport = document.getElementById('map-viewport');
let pointers = new Map();
let dragStart = null, dragMoved = false;
let pinchStartDist = null, pinchStartScale = null;
let viewUpdateQueued = false;
function scheduleViewUpdate(){
  if(viewUpdateQueued) return;
  viewUpdateQueued = true;
  requestAnimationFrame(()=>{ applyView(); viewUpdateQueued = false; });
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

viewport.addEventListener('pointerdown', (e)=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragStart = {x:e.clientX, y:e.clientY}; dragMoved = false; }
  if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStartDist = dist(pts[0],pts[1]); pinchStartScale = view.scale;
    dragMoved = true;
  }
});
viewport.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){
    const dxPx = e.clientX - prev.x, dyPx = e.clientY - prev.y;
    if(Math.abs(e.clientX-dragStart.x) > 6 || Math.abs(e.clientY-dragStart.y) > 6) dragMoved = true;
    view.tx += dxPx; view.ty += dyPx;
    scheduleViewUpdate();
  } else if(pointers.size===2 && pinchStartDist){
    const pts=[...pointers.values()];
    const d = dist(pts[0],pts[1]);
    const midX=(pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    zoomBy((pinchStartScale*(d/pinchStartDist))/view.scale, midX, midY);
  }
});
viewport.addEventListener('pointerup', (e)=>{
  if(pointers.size===1 && dragStart && !dragMoved) handleTap(dragStart.x, dragStart.y);
  pointers.delete(e.pointerId);
  if(pointers.size<2){ pinchStartDist=null; }
  if(pointers.size<1){ dragStart=null; }
});
viewport.addEventListener('pointercancel', (e)=>{ pointers.delete(e.pointerId); pinchStartDist=null; dragStart=null; });
viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomBy(e.deltaY>0?0.89:1.12, e.clientX, e.clientY);
}, {passive:false});

function handleTap(clientX, clientY){
  const el = document.elementFromPoint(clientX, clientY);
  if(el && el.classList && el.classList.contains('hitzone')){
    onMapTap(el.dataset.burg);
  } else {
    closeCard();
  }
}

document.getElementById('recenter-btn').addEventListener('click', ()=>{
  const pos = getCurrentXY();
  centerOnLogical(pos.x, pos.y, Math.max(view.scale, (viewport.clientWidth)/((STAGE_W/LOGICAL_W)*REGION_W)));
});

document.getElementById('camp-here-btn').addEventListener('click', ()=>{
  closeCard();
  showCampView(null, null, 0);
});

const CAL_KEY = "goblinwar_gameDay";
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;
let gameDay = parseInt(localStorage.getItem(CAL_KEY) || "0", 10);

function refreshCalendarUI(){
  const day = (gameDay % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(gameDay / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(gameDay / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  document.getElementById('date-day').textContent = day;
  document.getElementById('date-month').textContent = month;
  document.getElementById('date-year').textContent = year;
}
function advanceDays(n){
  gameDay += n;
  localStorage.setItem(CAL_KEY, String(gameDay));
  refreshCalendarUI();
  maybeRunFactionAI();
}

// ===================== CHANGE LOG / WHAT'S NEW =====================
// One entry per shipped update, oldest first (ids only ever go up). This exact array is
// duplicated in settings.html (see CLAUDE.md's no-modules convention) — add a new entry to
// both whenever a change ships, or the Settings Change Log and this popup will disagree.
const CHANGELOG_SEEN_KEY = "goblinwar_lastSeenChangelog";
const CHANGELOG = [
  { id:1, date:"2026-09-03", changes:[
    "Added a Change Log to Settings, and this \"What's New\" popup — it now greets you on the map after any update you haven't seen yet."
  ]},
  { id:2, date:"2026-09-03", changes:[
    "Switched the whole game to a dark theme.",
    "Added an \"Update available\" banner that drops down from the top of the map when a new version has shipped — tap it to refresh."
  ]},
  { id:3, date:"2026-09-03", changes:[
    "Goblin and Ork raiders now show real portrait art in combat instead of a hand-drawn icon.",
    "Goblin raiding parties now come in four distinct varieties — Raider, Shieldbearer, Skirmisher, and Archer — each with its own toughness and bite, not just a reskinned fight."
  ]},
  { id:4, date:"2026-09-03", changes:[
    "Bandits now show real portrait art too — every enemy in the game has a proper look.",
    "Ork raiding parties now come in three varieties — Raider, Berserker, and Warlord — with the Warlord as the toughest fight in the game."
  ]},
];

// Silent on a brand-new game (nothing to compare against yet); otherwise shows every
// entry newer than the last one this player has dismissed, newest first.
function checkForWhatsNew(){
  const latestId = CHANGELOG[CHANGELOG.length-1].id;
  const seenRaw = localStorage.getItem(CHANGELOG_SEEN_KEY);
  if(seenRaw === null){
    localStorage.setItem(CHANGELOG_SEEN_KEY, String(latestId));
    return;
  }
  const seenId = parseInt(seenRaw, 10);
  if(seenId >= latestId) return;
  const unseen = CHANGELOG.filter(entry => entry.id > seenId).slice().reverse();
  document.getElementById('whats-new-list').innerHTML = unseen.map(entry => `
    <div class="whats-new-entry">
      <div class="whats-new-date">${entry.date}</div>
      <ul>${entry.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('');
  document.getElementById('whats-new-modal').classList.add('show');
}
document.getElementById('whats-new-dismiss').addEventListener('click', ()=>{
  localStorage.setItem(CHANGELOG_SEEN_KEY, String(CHANGELOG[CHANGELOG.length-1].id));
  document.getElementById('whats-new-modal').classList.remove('show');
});

// ===================== UPDATE CHECK =====================
// No service worker or build step — "there's an update" just means the live version.json
// on the server reports a newer changelogId than the CHANGELOG already baked into this
// loaded page. Bump version.json (see CLAUDE.md) whenever CHANGELOG grows, or returning
// players already on an old tab will never see this banner. Tapping it force-reloads with
// a cache-busting query string so the browser can't just re-serve the stale cached page.
const UPDATE_CHECK_INTERVAL_MS = 5 * 60 * 1000;
function checkForUpdate(){
  fetch(`version.json?t=${Date.now()}`, {cache:'no-store'})
    .then(r=>r.json())
    .then(data=>{
      const currentLatest = CHANGELOG[CHANGELOG.length-1].id;
      if(data.changelogId > currentLatest) document.getElementById('update-banner').classList.add('show');
    })
    .catch(()=>{}); // offline or unreachable — silently retry on the next interval
}
document.getElementById('update-banner').addEventListener('click', ()=>{
  location.href = location.pathname + '?_=' + Date.now();
});
setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkForUpdate(); });
checkForUpdate();

// ===================== TERRITORY CONTROL & FACTION AI =====================
// A settlement's *historical* kingdom/race (graph.burgs[id].state/.race, from the Azgaar
// export) never changes — that's its permanent identity. Its *current controller* is a
// separate, sparse override (goblinwar_territoryControl), only present once a settlement has
// actually been fought over. War state (goblinwar_warState) belongs to kingdoms, not
// settlements or races — a captured settlement stays labeled by its original kingdom, and
// that kingdom's war/peace status is what the Marketplace prices react to (see showMarketPanel),
// regardless of who's currently occupying any one of its settlements.
const TERRITORY_KEY = "goblinwar_territoryControl";
const WARSTATE_KEY = "goblinwar_warState";
const LASTWARTICK_KEY = "goblinwar_lastWarTick";
const WAR_TICK_INTERVAL_DAYS = 7;   // faction AI only rolls once per in-game week
const WAR_DECLARE_CHANCE = 0.06;    // per kingdom, per tick, while at peace
const WAR_PEACE_CHANCE = 0.15;      // per kingdom, per tick, while at war — sues for peace
const RAID_CHANCE = 0.35;           // per kingdom, per tick, while at war — attempts a raid
const RAID_CANDIDATE_POOL = 15;     // nearest enemy-held settlements considered per raid
const RAID_SUCCESS_MIN = 0.2, RAID_SUCCESS_MAX = 0.8; // raid success is population-driven (see attemptRaid) but always stays uncertain

let KINGDOM_RACE = {};  // kingdom name -> race, derived from graph.burgs once loaded
let ALL_KINGDOMS = [];
function buildFactionData(){
  KINGDOM_RACE = {};
  Object.values(graph.burgs).forEach(b=>{
    if(b.state && b.race && b.race !== 'neutral' && !KINGDOM_RACE[b.state]) KINGDOM_RACE[b.state] = b.race;
  });
  ALL_KINGDOMS = Object.keys(KINGDOM_RACE);
}

function getTerritoryControl(){ try{ return JSON.parse(localStorage.getItem(TERRITORY_KEY)) || {}; }catch(e){ return {}; } }
function getController(burgId){
  const overrides = getTerritoryControl();
  if(overrides[burgId]) return overrides[burgId];
  const b = graph.burgs[burgId];
  return b ? b.race : null;
}
function setController(burgId, race){
  const overrides = getTerritoryControl();
  overrides[burgId] = race;
  localStorage.setItem(TERRITORY_KEY, JSON.stringify(overrides));
}

function getWarStateMap(){ try{ return JSON.parse(localStorage.getItem(WARSTATE_KEY)) || {}; }catch(e){ return {}; } }
function getWarState(kingdom){ return getWarStateMap()[kingdom] || 'peace'; }
function setWarState(kingdom, state){
  const map = getWarStateMap();
  map[kingdom] = state;
  localStorage.setItem(WARSTATE_KEY, JSON.stringify(map));
}
function isAtWarAt(burgId){
  const b = graph.burgs[burgId];
  return b && b.state ? getWarState(b.state) === 'war' : false;
}

// Population, in the same "thousands of people" unit travel-graph.json already uses
// (Bary is 12.93, i.e. ~12,930) — a settlement's population.field is its starting figure,
// forever; goblinwar_population is the same sparse-override pattern as territory control,
// only present once a settlement's population has actually moved. War shrinks it (some die,
// the rest flee as refugees to the nearest settlement currently at peace, growing it there
// instead of just vanishing), and total controlled population is what an attacking kingdom's
// raid odds are actually built from — see attemptRaid below.
const POPULATION_KEY = "goblinwar_population";
const WAR_ATTRITION_RATE = 0.02;    // weekly population loss, every settlement of a kingdom at war
const RAID_DAMAGE_RATE = 0.08;      // additional loss for the specific settlement raided this tick
const REFUGEE_DEATH_SHARE = 0.4;    // of population lost to war, this fraction dies...
const REFUGEE_FLEE_SHARE = 0.6;     // ...and this fraction flees to the nearest peaceful settlement
const MILITARY_FRACTION = 0.08;     // rough share of population a kingdom could field as soldiers

function getPopulationOverrides(){ try{ return JSON.parse(localStorage.getItem(POPULATION_KEY)) || {}; }catch(e){ return {}; } }
function getPopulation(burgId){
  const overrides = getPopulationOverrides();
  if(overrides[burgId] !== undefined) return overrides[burgId];
  const b = graph.burgs[burgId];
  return (b && b.population) ? b.population : 0;
}
function setPopulation(burgId, pop){
  const overrides = getPopulationOverrides();
  overrides[burgId] = Math.max(0, Math.round(pop*1000)/1000); // keep to the nearest real person, not the nearest whole "thousands" unit
  localStorage.setItem(POPULATION_KEY, JSON.stringify(overrides));
}
function formatPopulation(pop){ return Math.round(pop*1000).toLocaleString(); }

// Total population a race currently controls, times MILITARY_FRACTION — what attemptRaid
// compares attacker vs. defender with. Deliberately not capped to any one settlement's local
// garrison; a kingdom's whole territory backs up any single raid.
function getArmyStrength(race){
  return Object.keys(graph.burgs).reduce((sum,id)=> getController(id)===race ? sum+getPopulation(id) : sum, 0) * MILITARY_FRACTION;
}

// Closest settlement whose kingdom is currently at peace — where a burg's refugees go.
function findNearestPeacefulSettlement(fromBurgId){
  const from = graph.burgs[fromBurgId];
  if(!from) return null;
  let best = null, bestDist = Infinity;
  Object.values(graph.burgs).forEach(b=>{
    if(b.id === fromBurgId || isAtWarAt(b.id)) return;
    const d = Math.hypot(b.x-from.x, b.y-from.y);
    if(d < bestDist){ bestDist = d; best = b; }
  });
  return best;
}

// Applies a fractional population loss to one settlement: REFUGEE_DEATH_SHARE of it is gone
// for good, REFUGEE_FLEE_SHARE relocates to the nearest peaceful settlement (added to that
// settlement's population, not lost) rather than the whole loss simply vanishing.
function applyWarLoss(burgId, rate){
  const pop = getPopulation(burgId);
  const loss = pop * rate;
  if(loss <= 0) return;
  const died = loss * REFUGEE_DEATH_SHARE;
  const fled = loss * REFUGEE_FLEE_SHARE;
  setPopulation(burgId, pop - died - fled);
  if(fled > 0){
    const haven = findNearestPeacefulSettlement(burgId);
    if(haven) setPopulation(haven.id, getPopulation(haven.id) + fled);
  }
}

// War-driven Marketplace pricing (see showMarketPanel): a kingdom at war is short on
// supply, so buying costs more everywhere; but weapons/armour/firewood are in high demand
// there too, so *selling* those specific goods pays a premium instead of the usual cut price.
const WAR_BUY_MULTIPLIER = 1.5;
const WAR_SELL_BONUS_MULT = 1.2;
const PEACE_SELL_FRACTION = 0.5;
function isWarRelevant(mi){ return !!mi.slot || mi.name === "Firewood"; }
function getBuyPrice(mi, burgId){ return Math.round(mi.price * (isAtWarAt(burgId) ? WAR_BUY_MULTIPLIER : 1)); }
function getSellPrice(mi, burgId){
  return (isWarRelevant(mi) && isAtWarAt(burgId))
    ? Math.round(mi.price * WAR_SELL_BONUS_MULT)
    : Math.round(mi.price * PEACE_SELL_FRACTION);
}

// Picks one enemy-alliance settlement to raid, biased toward the attacker's own territory
// (nearest RAID_CANDIDATE_POOL enemy-held settlements to the centroid of what the attacking
// kingdom currently controls) rather than a uniformly random settlement anywhere on the map.
function attemptRaid(attackerKingdom){
  const attackerRace = KINGDOM_RACE[attackerKingdom];
  const attackerAlliance = ALLIANCE[attackerRace];
  const ownBurgs = Object.values(graph.burgs).filter(b => getController(b.id) === attackerRace);
  if(!ownBurgs.length) return null;
  const cx = ownBurgs.reduce((s,b)=>s+b.x,0) / ownBurgs.length;
  const cy = ownBurgs.reduce((s,b)=>s+b.y,0) / ownBurgs.length;
  const enemyBurgs = Object.values(graph.burgs).filter(b=>{
    const race = getController(b.id);
    return race && race !== 'neutral' && ALLIANCE[race] && ALLIANCE[race] !== attackerAlliance;
  });
  if(!enemyBurgs.length) return null;
  enemyBurgs.sort((a,b)=> Math.hypot(a.x-cx,a.y-cy) - Math.hypot(b.x-cx,b.y-cy));
  const candidates = enemyBurgs.slice(0, RAID_CANDIDATE_POOL);
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  const targetRace = getController(target.id);

  // Raid odds come from each side's real (population-derived) military strength, not a flat
  // coin flip — but still clamped so no kingdom is ever a guaranteed win or loss.
  const attackerStrength = getArmyStrength(attackerRace);
  const defenderStrength = getArmyStrength(targetRace);
  const rawChance = attackerStrength / ((attackerStrength + defenderStrength) || 1);
  const successChance = Math.min(RAID_SUCCESS_MAX, Math.max(RAID_SUCCESS_MIN, rawChance));
  const success = Math.random() < successChance;

  applyWarLoss(target.id, RAID_DAMAGE_RATE); // a raid costs the target lives either way
  if(success) setController(target.id, attackerRace);
  return { success, target, attackerKingdom, attackerRace, successChance };
}

// Runs the whole weekly tick across every kingdom and returns a short list of {text} events
// worth telling the player about (captures only — declarations/peace deals are frequent
// enough that surfacing every one would be noise).
function runFactionAITick(){
  const events = [];
  ALL_KINGDOMS.forEach(kingdom=>{
    const state = getWarState(kingdom);
    if(state === 'peace'){
      if(Math.random() < WAR_DECLARE_CHANCE) setWarState(kingdom, 'war');
    } else {
      // Every settlement that originally belongs to this kingdom bleeds a little population
      // just from being at war, regardless of whether it's the one being raided this tick.
      Object.values(graph.burgs).filter(b=>b.state===kingdom).forEach(b=> applyWarLoss(b.id, WAR_ATTRITION_RATE));
      if(Math.random() < RAID_CHANCE){
        const result = attemptRaid(kingdom);
        if(result && result.success){
          events.push(`${result.target.name} has fallen to ${RACE_LABEL[result.attackerRace]} forces from ${kingdom}.`);
        }
      }
      if(Math.random() < WAR_PEACE_CHANCE) setWarState(kingdom, 'peace');
    }
  });
  return events;
}

function maybeRunFactionAI(){
  if(!graph || !ALL_KINGDOMS.length) return;
  const lastTick = parseInt(localStorage.getItem(LASTWARTICK_KEY) || "0", 10);
  if(gameDay - lastTick < WAR_TICK_INTERVAL_DAYS) return;
  localStorage.setItem(LASTWARTICK_KEY, String(gameDay));
  const events = runFactionAITick();
  if(events.length){
    const summary = events.length === 1 ? events[0] : `${events.length} settlements changed hands this week, including ${events[0]}`;
    showToast(summary);
  }
}

// Adds qty of an item (creating the stack, at the given weight/value-per-unit, if not
// already carried). Refuses (returns false, no change made) if it would push total
// carried weight over CARRY_CAPACITY.
function addItem(name, qty, weightEach, valueEach){
  const addedWeight = weightEach * qty;
  if(getCarriedWeight() + addedWeight > CARRY_CAPACITY) return false;
  const existing = getItem(name);
  if(existing) existing.qty += qty;
  else playerInventory.push({ name, qty, weight:weightEach, value:valueEach });
  saveInventory();
  return true;
}

  if(!existing) return;
  existing.qty = Math.max(0, existing.qty - qty);
  if(existing.qty === 0) playerInventory = playerInventory.filter(it => it !== existing);

}

  // lands could re-trigger endCombat('victory') again before enemyHp's negative value
  // stopped combat.enemyHp<=0 from re-passing, stacking duplicate gold rewards and onEnd calls.
  combat = null;

// ===================== TRAVEL GRAPH =====================
// Graph nodes are map CELLS (not just burgs) — every point along every real
// road/trail/sea route is a node, so junctions are handled naturally instead
// of only counting direct burg-to-burg route matches.
const LOC_KEY = "goblinwar_currentBurg";
const ROAD_PACE = 20;    // miles per day, travelling via drawn roads
const OFFROAD_PACE = 12; // miles per day, cross-country with no road
// The world data's raw mileage is realistic-scale (real road distances), which makes
// crossing the map take dozens of in-game days. DISTANCE_SCALE compresses every trip
// down to a friendlier, more game-like length without changing the map or pace numbers.
const DISTANCE_SCALE = 5;

let graph = null;      // { burgs, states, burgByCell, edges:[{a,b,mi,kind,pts}] }
let adjacency = {};     // cellId -> [{to, mi, edge, forward}]
let currentBurg = localStorage.getItem(LOC_KEY) || "5"; // Bary
let selectedBurg = null;
let playerMarkerEl = null;
let reachableSet = new Set(); // cell ids reachable from currentBurg's cell
const labelElByBurg = {}; // (unused holdover — no longer needed with tap-zones)

function buildAdjacency(){
  graph.edges.forEach(e=>{
    (adjacency[e.a] = adjacency[e.a]||[]).push({to:e.b, mi:e.mi, edge:e, forward:true});
    (adjacency[e.b] = adjacency[e.b]||[]).push({to:e.a, mi:e.mi, edge:e, forward:false});
  });
}

// Minimal binary min-heap — the cell graph has thousands of nodes, so a
// plain array-sort priority queue (fine for ~800 burgs) is too slow here.
class MinHeap{
  constructor(){ this.a = []; }
  push(item){
    const a = this.a; a.push(item);
    let i = a.length-1;
    while(i>0){
      const p = (i-1)>>1;
      if(a[p][0] <= a[i][0]) break;
      [a[p],a[i]] = [a[i],a[p]]; i = p;
    }
  }
  pop(){
    const a = this.a;
    const top = a[0];
    const last = a.pop();
    if(a.length){
      a[0] = last;
      let i = 0;
      while(true){
        const l = 2*i+1, r = 2*i+2; let smallest = i;
        if(l<a.length && a[l][0]<a[smallest][0]) smallest = l;
        if(r<a.length && a[r][0]<a[smallest][0]) smallest = r;
        if(smallest===i) break;
        [a[smallest],a[i]] = [a[i],a[smallest]]; i = smallest;
      }
    }
    return top;
  }
  get size(){ return this.a.length; }
}

// Dijkstra shortest road path between two CELL ids.
// Returns { miles, edges:[{edge,forward},...] } or null if unreachable.
function cellRoute(fromCell, toCell){
  if(fromCell === toCell) return { miles:0, edges:[] };
  const dist = {}; dist[fromCell] = 0;
  const prev = {};
  const visited = new Set();
  const pq = new MinHeap();
  pq.push([0, fromCell]);
  while(pq.size){
    const [d, node] = pq.pop();
    if(visited.has(node)) continue;
    visited.add(node);
    if(node === toCell){
      const edgeList=[]; let cur=toCell;
      while(prev[cur]){ edgeList.unshift(prev[cur].step); cur = prev[cur].from; }
      return { miles: d, edges: edgeList };
    }
    (adjacency[node]||[]).forEach(step=>{
      if(visited.has(step.to)) return;
      const nd = d + step.mi;
      if(dist[step.to] === undefined || nd < dist[step.to]){
        dist[step.to] = nd;
        prev[step.to] = { from: node, step };
        pq.push([nd, step.to]);
      }
    });
  }
  return null;
}

// Full reachability (ignores distance) — used only for the dead-end
// recovery check at load time, not for gating travel.
function computeReachable(fromCell){
  const seen = new Set([fromCell]);
  const stack = [fromCell];
  while(stack.length){
    const node = stack.pop();
    (adjacency[node]||[]).forEach(step=>{
      if(!seen.has(step.to)){ seen.add(step.to); stack.push(step.to); }
    });
  }
  return seen;
}

// When the player stops or camps mid-journey, they're not standing at a named
// settlement anymore — campPos holds that in-between position (snapped to the
// nearest real road-graph point) so travel math still has a valid place to
// route from, without needing every part of the game to support arbitrary
// off-settlement positions.
let campPos = null; // {x, y, cell, name} or null when at a real settlement
function getCurrentCell(){ return campPos ? campPos.cell : graph.burgs[currentBurg].cell; }
function getCurrentXY(){ return campPos ? {x:campPos.x, y:campPos.y} : {x:graph.burgs[currentBurg].x, y:graph.burgs[currentBurg].y}; }
function getCurrentDisplayName(){ return campPos ? `the road near ${campPos.name}` : graph.burgs[currentBurg].name; }

const FOOD_PER_DAY = 1;
const HOURS_PER_DAY = 24;
const AMBUSH_CHANCE_PER_DAY = 0.12; // chance per day of travel that bandits ambush the road
const NIGHT_AMBUSH_CHANCE = 0.15;   // chance bandits strike an exposed camp overnight
function rollAmbush(hours){ const days = hours/HOURS_PER_DAY; return Math.random() < 1 - Math.pow(1-AMBUSH_CHANCE_PER_DAY, days); }
// Trips are timed in hours, not days, so a short hop is over in an afternoon rather
// than eating a full day off the calendar — only genuinely long treks (many hours)
// advance the date or cost more than the minimum 1 Food. Both derived from the same
// ROAD_PACE/OFFROAD_PACE "miles per day" numbers, just read as hours instead of days.
function hoursToDaysElapsed(hours){ return Math.floor(hours/HOURS_PER_DAY); }
function hoursToFoodCost(hours){ return Math.max(1, Math.ceil((hours/HOURS_PER_DAY)*FOOD_PER_DAY)); }

function computeTravel(toId){
  const fromXY = getCurrentXY(), fromCell = getCurrentCell();
  const toBurg = graph.burgs[toId];
  if(!toBurg) return null;
  const route = cellRoute(fromCell, toBurg.cell);
  if(route){
    const miles = Math.round(route.miles / DISTANCE_SCALE);
    const hours = Math.max(1, Math.ceil(miles/ROAD_PACE));
    const bySea = route.edges.some(s=>s.edge.kind==='sea');
    return { miles, hours, foodCost: hoursToFoodCost(hours), edges: route.edges, viaRoad:true, bySea };
  }
  // No route connects them at all (very rare now) — still travelable, just slower.
  const straight = (Math.hypot(fromXY.x-toBurg.x, fromXY.y-toBurg.y) * 3) / DISTANCE_SCALE;
  const miles = Math.round(straight);
  const hours = Math.max(1, Math.ceil(miles/OFFROAD_PACE));
  return { miles, hours, foodCost: hoursToFoodCost(hours), edges:null, viaRoad:false, bySea:false };
}
function formatDuration(hours){
  if(hours < HOURS_PER_DAY) return `${hours} hour${hours===1?'':'s'}`;
  const d = Math.floor(hours/HOURS_PER_DAY), h = hours%HOURS_PER_DAY;
  return `${d} day${d===1?'':'s'}${h ? ` ${h} hour${h===1?'':'s'}` : ''}`;
}

function headingFromDelta(dx, dy){

}

// Build a flat list of {x,y} points tracing the actual road route (concatenating each
// edge's real polyline, in the right direction), for path-following travel animation.
let routePreviewEl = null;
function drawRoutePreview(fromPos, toId, edgeSteps){
  if(!routePreviewEl) return;
  const { points } = buildRoutePolyline(fromPos, toId, edgeSteps);
  const d = points.map((p,i)=> (i===0?'M':'L') + p.x + ',' + p.y).join(' ');
  routePreviewEl.setAttribute('d', d);
  routePreviewEl.style.opacity = '.9';
}
function clearRoutePreview(){
  if(routePreviewEl) routePreviewEl.style.opacity = '0';
}

function buildRoutePolyline(fromPos, toId, edgeSteps){
  if(!edgeSteps){
    // off-road (no drawn path) — animate a straight line to the destination
    const endBurg = graph.burgs[toId];
    return { points:[{x:fromPos.x, y:fromPos.y}, {x:endBurg.x, y:endBurg.y}], cellIds:[fromPos.cell, endBurg.cell] };
  }
  const points = [{x:fromPos.x, y:fromPos.y}];
  const cellIds = [fromPos.cell];
  edgeSteps.forEach(step=>{
    const pts = step.forward ? step.edge.pts : [...step.edge.pts].reverse();
    pts.slice(1).forEach(([x,y])=> points.push({x,y}));
    cellIds.push(step.forward ? step.edge.b : step.edge.a);
  });
  return { points, cellIds };
}

// Animate the marker (and camera) moving along the real road route from currentBurg,
// at a constant linear speed (no easing) so it reads as steady travel rather than a
// quick dart. Returns a controller {cancelled, rafId} so travel can be interrupted
// mid-journey. onProgress(info) reports {frac, x, y, cell, name} each frame — frac is
// the actual distance-fraction covered so far, and {x,y,cell} is the nearest real
// road-graph point to the current position, used to snap the player there if they
// stop or camp before arriving.
function animateTravel(fromPos, toId, edgeSteps, destName, durationMs, onDone, onProgress){
  const { points, cellIds } = buildRoutePolyline(fromPos, toId, edgeSteps);
  const controller = { cancelled:false, rafId:null };
  if(points.length < 2){ onDone(); return controller; }

  const segLens = [];
  let totalLen = 0;
  for(let i=1;i<points.length;i++){
    const d = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    segLens.push(d);
    totalLen += d;
  }
  if(totalLen === 0){ onDone(); return controller; }

  function posAtDistance(dist){
    let remaining = dist;
    for(let i=0;i<segLens.length;i++){
      if(remaining <= segLens[i] || i === segLens.length-1){
        const t = segLens[i] > 0 ? remaining/segLens[i] : 0;
        const p0 = points[i], p1 = points[i+1];
        const nearCell = t < 0.5 ? cellIds[i] : cellIds[i+1];
        const nearPoint = t < 0.5 ? p0 : p1;
        return {
          x: p0.x + (p1.x-p0.x)*Math.min(1,t),
          y: p0.y + (p1.y-p0.y)*Math.min(1,t),
          dx: p1.x-p0.x, dy: p1.y-p0.y,
          nearCell, nearX: nearPoint.x, nearY: nearPoint.y
        };
      }
      remaining -= segLens[i];
    }
    const last = points.length-1;
    return { x: points[last].x, y: points[last].y, dx:1, dy:0, nearCell: cellIds[last], nearX: points[last].x, nearY: points[last].y };
  }

  const t0 = performance.now();
  function frame(now){
    if(controller.cancelled) return;
    let p = Math.min(1, (now - t0) / durationMs); // linear — no easing, constant travel speed
    const pos = posAtDistance(totalLen * p);
    if(onProgress) onProgress({ frac:p, x:pos.nearX, y:pos.nearY, cell:pos.nearCell, name: destName });
    setHeading(headingFromDelta(pos.dx, pos.dy));
    positionPlayerMarker(pos.x, pos.y);
    // Recenter every frame from the *current* zoom level (not a value cached at
    // the start of the journey) so the character is always what the camera is
    // zoomed on, even if the player pinches or scrolls to zoom mid-journey.
    centerOnLogical(pos.x, pos.y, view.scale);
    if(p < 1){ controller.rafId = requestAnimationFrame(frame); }
    else { onDone(); }
  }
  controller.rafId = requestAnimationFrame(frame);
  return controller;
}

// ---- castle-medallion image marking City/Capital-tier settlements, offset just above the
// settlement's own point, so major cities read at a glance while zoomed out without
// covering the settlement's name. It can't truly draw *behind* the name — the map's
// labels are baked into world-raster.jpg, a flat image with no separate DOM layer to
// z-order against (see labelElByBurg's comment) — and testing at high zoom showed
// Azgaar centers each label directly ON the point (not offset below/beside it, as
// originally assumed), so a real vertical gap above the point is needed to clear it.
// That offset alone isn't enough in dense clusters, though: two settlements can sit close
// enough that one's *offset* icon lands on top of a *different* settlement's label. Rather
// than chase that per-pair, buildCityIcons() checks each candidate icon position against
// every settlement's point (not just City/Capital ones) and simply skips drawing it if it
// would land within MIN_CLEARANCE of one — better to omit an icon in a crowded area than
// to cover a name.
const CITY_ICON_HREF = "assets/icons/Map/Cities.png"; // 1024x848, transparent outside the coin
const CITY_ICON_ASPECT = 848/1024;
const CITY_ICON_OFFSET_Y = -11; // logical units above the point — close enough to read as "attached" while still clearing that settlement's own centered label
const CITY_ICON_MIN_CLEARANCE = 12; // logical units — skip if this close to any settlement's point
function buildCityIcons(){
  const g = document.getElementById('city-icons');
  g.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  const allBurgs = Object.values(graph.burgs);
  for(const id in graph.burgs){
    const b = graph.burgs[id];
    if(b.tier !== 'city' && b.tier !== 'capital') continue;
    const iconY = b.y + CITY_ICON_OFFSET_Y;
    const tooClose = allBurgs.some(other => other !== b && Math.hypot(other.x-b.x, other.y-iconY) < CITY_ICON_MIN_CLEARANCE);
    if(tooClose) continue;
    const w = b.tier === 'capital' ? 20 : 14;
    const h = w * CITY_ICON_ASPECT;
    const icon = document.createElementNS(ns, "image");
    icon.setAttributeNS("http://www.w3.org/1999/xlink", "href", CITY_ICON_HREF);
    icon.setAttribute("href", CITY_ICON_HREF);
    icon.setAttribute("x", b.x - w/2);
    icon.setAttribute("y", iconY - h/2);
    icon.setAttribute("width", w);
    icon.setAttribute("height", h);
    g.appendChild(icon);
  }
}

      travelDiv.textContent = "Distance unknown.";
      travelBtn.style.display = 'none';
    } else if(t.foodCost > getFoodQty()){
      const seaNote = t.bySea ? ' (includes a sea crossing)' : '';
      travelDiv.innerHTML = (t.viaRoad
        ? `<b>${t.miles} miles</b> by road${seaNote} — about <b>${formatDuration(t.hours)}</b> travel, <b>${t.foodCost} food</b>.`
        : `<b>${t.miles} miles</b> cross-country (no road yet) — about <b>${formatDuration(t.hours)}</b> travel, <b>${t.foodCost} food</b>.`)
        + `<br><span style="color:#e2857f;">Not enough food to make it there (need ${t.foodCost}, have ${getFoodQty()}). Buy more at a Marketplace first.</span>`;
      travelBtn.style.display = 'none';
      if(t.viaRoad) drawRoutePreview({...getCurrentXY(), cell:getCurrentCell()}, burgId, t.edges);
    } else {
      const seaNote = t.bySea ? ' (includes a sea crossing)' : '';
      travelDiv.innerHTML = t.viaRoad
        ? `<b>${t.miles} miles</b> by road${seaNote} — about <b>${formatDuration(t.hours)}</b> travel, <b>${t.foodCost} food</b>.`
        : `<b>${t.miles} miles</b> cross-country (no road yet) — about <b>${formatDuration(t.hours)}</b> travel, <b>${t.foodCost} food</b>.`;
      travelBtn.style.display = 'block';
      if(t.viaRoad) drawRoutePreview({...getCurrentXY(), cell:getCurrentCell()}, burgId, t.edges);
      travelBtn.textContent = `Travel Here (${t.hours}h)`;
    }
  }
  document.getElementById('info-card').classList.add('open');
}

let activeTravel = null; // {controller, destId, destName, totalHours, lastSnap}

function showTravelControls(destName){
  document.getElementById('travel-dest-name').textContent = destName;
  document.getElementById('travel-controls').classList.add('show');
  document.getElementById('camp-here-btn').classList.add('hide');
}
function hideTravelControls(){
  document.getElementById('travel-controls').classList.remove('show');
  document.getElementById('camp-here-btn').classList.remove('hide');
}

function beginTravel(destId){
  const t = computeTravel(destId);
  if(!t) return;
  if(t.foodCost > getFoodQty()){
    showToast("You don't have enough food to make it there. Buy more at a Marketplace first.");
    return;
  }
  const destName = graph.burgs[destId].name;
  closeCard();

  const fromPos = { ...getCurrentXY(), cell:getCurrentCell() };
  centerOnLogical(fromPos.x, fromPos.y, view.scale);
  showTravelControls(destName);

  // Constant, unhurried travel speed (like Bannerlord's overworld) — no artificial
  // cap, no easing curve, so it reads as steady progress rather than a quick dart.
  // A long journey genuinely takes longer to watch; Stop / Set Up Camp exist so
  // you're never stuck sitting through one.
  const duration = Math.max(4000, 2000 + t.miles*20);
  const controller = animateTravel(fromPos, destId, t.edges, destName, duration, ()=>{
    hideTravelControls();
    activeTravel = null;
    campPos = null;
    currentBurg = destId;
    localStorage.setItem(LOC_KEY, currentBurg);
    advanceDays(hoursToDaysElapsed(t.hours));
    consumeItem(FOOD_NAME, t.foodCost);
    refreshReachability();
    if(rollAmbush(t.hours)){
      triggerAmbushFight(currentBurg, ()=> showLocationView(currentBurg), 'road');
    } else {
      showLocationView(currentBurg);
    }
  }, (info)=>{ if(activeTravel) activeTravel.lastSnap = info; });

  activeTravel = { controller, destId, destName, totalHours: t.hours, lastSnap:{frac:0, x:fromPos.x, y:fromPos.y, cell:fromPos.cell, name: getCurrentDisplayName()} };
}

// Cancels the current journey in place — the character stops exactly where the
// animation had gotten to (snapped to the nearest real road-graph point), not
// back at the start. No time cost.
function stopTravel(){
  if(!activeTravel) return;
  activeTravel.controller.cancelled = true;
  cancelAnimationFrame(activeTravel.controller.rafId);
  hideTravelControls();
  const snap = activeTravel.lastSnap;
  campPos = { x:snap.x, y:snap.y, cell:snap.cell, name: snap.name };
  positionPlayerMarker(campPos.x, campPos.y);
  centerOnLogical(campPos.x, campPos.y, view.scale);
  refreshReachability();
  showToast(`You stop on the road toward ${activeTravel.destName}.`);
  activeTravel = null;
}

// Cancels the journey in place, advances the calendar for whatever whole days (if
// any) the distance already covered amounted to, and opens the Camp screen.
function campMidTravel(){
  if(!activeTravel) return;
  activeTravel.controller.cancelled = true;
  cancelAnimationFrame(activeTravel.controller.rafId);
  hideTravelControls();
  const snap = activeTravel.lastSnap;
  campPos = { x:snap.x, y:snap.y, cell:snap.cell, name: snap.name };
  positionPlayerMarker(campPos.x, campPos.y);
  centerOnLogical(campPos.x, campPos.y, view.scale);
  refreshReachability();
  const partialHours = Math.max(1, Math.round(activeTravel.totalHours * activeTravel.lastSnap.frac));
  advanceDays(hoursToDaysElapsed(partialHours));
  consumeItem(FOOD_NAME, hoursToFoodCost(partialHours));
  showCampView(activeTravel.destId, activeTravel.destName, partialHours);
  activeTravel = null;
}

document.getElementById('btn-stop-travel').addEventListener('click', stopTravel);

  }
  beginTravel(selectedBurg);
});

    <button class="loc-action" id="camp-rest-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h3l2-5 4 10 3-7 2 4h4"/></svg>
      <span class="li-text"><b>Rest Until Morning</b><span>Restores health &amp; stamina &middot; Passes 1 day</span></span>
    </button>
    ${standalone ? '' : `
    <button class="loc-action" id="camp-continue-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span class="li-text"><b>Continue to ${destName}</b><span>Resume the journey from here</span></span>
    </button>`}
    <button class="loc-action" id="camp-choose-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      <span class="li-text"><b>${standalone ? 'Back to Map' : 'Choose a Different Destination'}</b><span>${standalone ? 'Return to the map' : 'Return to the map from here'}</span></span>
    </button>
  `;
  document.getElementById('camp-rest-btn').addEventListener('click', ()=>{
    function finishRest(){
      advanceDays(1);
      const healed = playerMaxHealth - playerHealth;
      const staminaBack = playerMaxStamina - playerStamina;
      setHealth(playerMaxHealth);
      setStamina(playerMaxStamina);
      showToast((healed > 0 || staminaBack > 0) ? `You rest and recover your health and stamina.` : "You rest. Already fully rested.");
      document.getElementById('loc-sub').textContent = standalone
        ? `Making camp at ${here} — resting`
        : `On the road to ${destName} — resting`;
    }
    if(Math.random() < NIGHT_AMBUSH_CHANCE){
      triggerAmbushFight(currentBurg, finishRest, 'camp');
    } else {
      finishRest();
    }
  });
  if(!standalone){
    document.getElementById('camp-continue-btn').addEventListener('click', ()=>{
      document.getElementById('location-view').classList.remove('show');
      beginTravel(destId);
    });
  }
  document.getElementById('camp-choose-btn').addEventListener('click', ()=>{
    document.getElementById('location-view').classList.remove('show');
  });

  document.getElementById('location-view').classList.add('show');
}

function showLocationView(burgId){
  const b = graph.burgs[burgId];
  if(!b) return;
  document.getElementById('loc-heading').textContent = b.name;
  const controller = getController(burgId);
  const controlNote = (controller !== b.race) ? ` · ${RACE_LABEL[controller]}-controlled` : '';
  document.getElementById('loc-sub').textContent = `${TIER_LABEL[b.tier]||b.tier}${controlNote}`;
  document.getElementById('loc-visual-art').innerHTML = TIER_ART[b.tier] || TIER_ART.village;
  document.getElementById('loc-visual-name').textContent = b.name;
  document.getElementById('loc-visual-tier').textContent = TIER_LABEL[b.tier]||b.tier;

  const workedToday = hasWorkedToday(burgId);
  const actions = [
    { icon:`<circle cx="12" cy="12" r="9"/><path d="M9 10h6M9 14h4"/>`, title:"The Inn", desc:"Rest up and hear local rumours", action:'inn' },
    { icon:`<path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>`, title:"Marketplace", desc:"Buy food and supplies", action:'market' },
    { icon:`<path d="M14.7 6.3a1 1 0 0 0-1.4 0L11 8.6 15.4 13l2.3-2.3a1 1 0 0 0 0-1.4z"/><path d="M11 8.6 4 15.6V20h4.4L15.4 13"/>`, title:"Work", desc: workedToday ? "Already worked here today — come back tomorrow" : "Take on odd jobs for a few hours' pay", action:'work', disabled:workedToday },
    { icon:`<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5"/><path d="M11 19c0-3 2.5-5 5-5s5 2 5 5"/>`, title:"Talk to Townsfolk", desc:"Ask what's happening in the world", action:'stub' },
  ];
  // City/Capital settlements get extra actions on top of the base four, so a big
  // settlement actually feels bigger rather than just carrying a fancier building icon.
  if(b.tier === 'city' || b.tier === 'capital'){
    actions.push({ icon:`<path d="M12 3l2.5 4.5H20l-4 4 1.5 5.5L12 14l-5.5 3 1.5-5.5-4-4h5.5z"/>`, title:"Temple", desc:"Seek a blessing", action:'temple' });
    actions.push({ icon:`<path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-7h6v7"/>`, title:"Guard House", desc:"Hear how the watch is holding the walls", action:'guardhouse' });
  }
  if(b.tier === 'capital'){
    actions.push({ icon:`<path d="M4 21h16"/><path d="M5 21V9l3-3 4 3 4-3 3 3v12"/><path d="M12 21v-6"/>`, title:"The Palace", desc:"Learn of the ruling court", action:'palace' });
  }
  const list = document.getElementById('loc-action-list');
  list.innerHTML = actions.map(a => `
    <button class="loc-action" data-action="${a.action}" ${a.disabled ? 'disabled' : ''}>
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${a.icon}</svg>
      <span class="li-text"><b>${a.title}</b><span>${a.desc}</span></span>
    </button>
  `).join('');
  list.querySelectorAll('.loc-action').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.action === 'inn') showInnPanel(burgId);
      else if(btn.dataset.action === 'market') showMarketPanel(burgId);
      else if(btn.dataset.action === 'work') doWork(burgId);
      else if(btn.dataset.action === 'temple') showFlavorPanel(burgId, 'Temple', TEMPLE_LINES);
      else if(btn.dataset.action === 'guardhouse') showFlavorPanel(burgId, 'Guard House', GUARDHOUSE_LINES, buildGuardHouseStats(burgId));
      else if(btn.dataset.action === 'palace') showFlavorPanel(burgId, 'The Palace', PALACE_LINES);
      else showToast("Not built yet — coming in a future update.");
    });
  });

  document.getElementById('location-view').classList.add('show');
}

// Work is on cooldown per-settlement, once per calendar day — resets whenever gameDay
// advances (travelling far enough or resting), not on a real-world timer.
const WORK_COOLDOWN_KEY = "goblinwar_workCooldowns";
function getWorkCooldowns(){
  try{ return JSON.parse(localStorage.getItem(WORK_COOLDOWN_KEY)) || {}; }catch(e){ return {}; }
}
function hasWorkedToday(burgId){ return getWorkCooldowns()[burgId] === gameDay; }
function recordWorked(burgId){
  const cd = getWorkCooldowns();
  cd[burgId] = gameDay;
  localStorage.setItem(WORK_COOLDOWN_KEY, JSON.stringify(cd));
}

const WORK_LINES = [
  "You spend the afternoon hauling crates at the docks.",
  "You help mend a fence for a grateful farmer.",
  "You lend a hand chopping wood behind the smithy.",
  "You do a few hours of odd jobs for the innkeeper.",
  "You help a merchant unload a cart of goods.",
];
function doWork(burgId){
  if(hasWorkedToday(burgId)){
    showToast("Already worked here today — come back tomorrow.");
    return;
  }
  const earned = randRange([3,15]);
  setGold(playerGold + earned);
  recordWorked(burgId);
  const line = WORK_LINES[Math.floor(Math.random()*WORK_LINES.length)];
  showToast(`${line} You earn ${earned} gold.`);
  showLocationView(burgId);
}

// City/Capital-only flavor buildings (Temple, Guard House, The Palace) — pure world-building
// color like the Inn's rumour pool, no mechanical effect, so bigger settlements have more to
// see without inventing systems that aren't built yet.
const TEMPLE_LINES = [
  "A hooded priest murmurs a blessing over the altar flame.",
  "Pilgrims from outlying villages kneel in quiet prayer.",
  "Incense curls up through a shaft of coloured light.",
  "A novice presses a small token into your hand and asks for nothing in return.",
  "The bell tower tolls the hour as you step inside.",
];
const GUARDHOUSE_LINES = [
  "A watch-captain briefs a fresh patrol on the state of the roads.",
  "Sharpened pikes line the wall, ready for a call to arms.",
  "A weary sentry mentions bandit sightings on a nearby route.",
  "The garrison drills in the yard, boots striking the packed earth in unison.",
  "A quartermaster counts arrows into crates bound for the wall towers.",
];
const PALACE_LINES = [
  "Courtiers trade quiet gossip beneath tall banners.",
  "A herald reads a proclamation to a half-listening hall.",
  "Petitioners queue for an audience that may not come today.",
  "Guards in ceremonial armour stand motionless beside the throne.",
  "Word in the court is that the war is weighing heavily on the ruler's mind.",
];
function showFlavorPanel(burgId, title, lines, extraHTML){
  const b = graph.burgs[burgId];
  const line = lines[Math.floor(Math.random()*lines.length)];
  const list = document.getElementById('loc-action-list');
  list.innerHTML = `
    <button class="loc-action" id="flavor-back-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
    </button>
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin:14px 0;">
      <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:8px;">${title}</div>
      <div style="font-size:14.5px; line-height:1.55; color:var(--parchment); font-style:italic;">"${line}"</div>
    </div>
    ${extraHTML || ''}
  `;
  document.getElementById('flavor-back-btn').addEventListener('click', ()=> showLocationView(burgId));
}

// Guard House shows real numbers alongside its flavor line — local population and the
// current controller's total mustered strength, both population-derived (see attemptRaid).
function buildGuardHouseStats(burgId){
  const controller = getController(burgId);
  const pop = getPopulation(burgId);
  const army = getArmyStrength(controller);
  return `
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; font-size:13.5px; color:var(--parchment);">
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Local population</span><b>${formatPopulation(pop)}</b></div>
      <div style="display:flex; justify-content:space-between;"><span>${RACE_LABEL[controller]||'Unknown'} forces (kingdom-wide)</span><b>${formatPopulation(army)}</b></div>
    </div>
  `;
}

function showInnPanel(burgId){
  const b = graph.burgs[burgId];
  const rumour = RUMOURS[Math.floor(Math.random()*RUMOURS.length)];
  const list = document.getElementById('loc-action-list');
  list.innerHTML = `
    <button class="loc-action" id="inn-back-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
    </button>
    <button class="loc-action" id="inn-rest-btn">
      <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h3l2-5 4 10 3-7 2 4h4"/></svg>
      <span class="li-text"><b>Rest for the Night</b><span>Restores health &amp; stamina &middot; Passes 1 day</span></span>
    </button>
    <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin:14px 0;">
      <div style="font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:8px;">Tavern Talk</div>
      <div id="inn-rumour" style="font-size:14.5px; line-height:1.55; color:var(--parchment); font-style:italic;">"${rumour}"</div>
    </div>
  `;
  document.getElementById('inn-back-btn').addEventListener('click', ()=> showLocationView(burgId));
  document.getElementById('inn-rest-btn').addEventListener('click', ()=>{
    advanceDays(1);
    const healed = playerMaxHealth - playerHealth;
    const staminaBack = playerMaxStamina - playerStamina;
    setHealth(playerMaxHealth);
    setStamina(playerMaxStamina);
    showToast((healed > 0 || staminaBack > 0) ? `You rest for the night and recover your health and stamina.` : "You rest for the night. Already fully rested.");
    document.getElementById('inn-rumour').textContent = `"${RUMOURS[Math.floor(Math.random()*RUMOURS.length)]}"`;
  });
}

function showMarketPanel(burgId){
  const b = graph.burgs[burgId];
  const list = document.getElementById('loc-action-list');

  const MAX_SLIDER_QTY = 30; // just a sane slider ceiling — affordability/weight cap it lower below
  function render(){
    const atWar = isAtWarAt(burgId);
    const itemRows = MARKET_ITEMS.map((mi, i) => {
      const buyPrice = getBuyPrice(mi, burgId);
      const sellPrice = getSellPrice(mi, burgId);
      const carried = getItem(mi.name);
      const affordableQty = buyPrice > 0 ? Math.floor(playerGold / buyPrice) : MAX_SLIDER_QTY;
      const capacityQty = mi.weight > 0 ? Math.floor((CARRY_CAPACITY - getCarriedWeight()) / mi.weight) : MAX_SLIDER_QTY;
      const maxQty = Math.max(1, Math.min(MAX_SLIDER_QTY, affordableQty, capacityQty));
      const sellNote = (isWarRelevant(mi) && atWar) ? ' &middot; <span style="color:#d9a15a;">wartime demand</span>' : '';
      return `
      <div class="loc-action" style="cursor:default;">
        <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h16l-1.5 12h-13L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
        <span class="li-text"><b>${mi.name}</b><span>${mi.desc} &middot; ${buyPrice}g each &middot; ${mi.weight} weight each &middot; carrying ${carried ? carried.qty : 0}</span></span>
      </div>
      <div class="buy-row">
        <input type="range" class="qty-slider" min="1" max="${maxQty}" value="1" data-slider="${i}">
        <div class="qty-readout" id="qty-readout-${i}">1 &middot; ${buyPrice}g</div>
        <button class="btn btn-primary" data-buy="${i}">Buy</button>
      </div>
      ${carried && carried.qty > 0 ? `
      <div class="buy-row" style="margin-top:-8px;">
        <span style="flex:1; font-size:11.5px; color:#a9926a;">Sell 1 for ${sellPrice}g${sellNote}</span>
        <button class="btn btn-secondary" data-sell="${i}">Sell</button>
      </div>` : ''}
      `;
    }).join('');
    list.innerHTML = `
      <button class="loc-action" id="market-back-btn">
        <svg class="li-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
        <span class="li-text"><b>Back</b><span>Return to ${b.name}</span></span>
      </button>
      <div style="background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:14px; margin:14px 0; font-size:13.5px; color:var(--parchment);">
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Gold</span><b>${playerGold}</b></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Carried weight</span><b>${getCarriedWeight()} / ${CARRY_CAPACITY}</b></div>
        <div style="display:flex; justify-content:space-between;"><span>${b.state||'This region'}</span><b style="color:${atWar?'#e2857f':'#7fbf6a'};">${atWar ? 'At war — prices up' : 'At peace'}</b></div>
      </div>
      ${itemRows}
    `;
    document.getElementById('market-back-btn').addEventListener('click', ()=> showLocationView(burgId));
    list.querySelectorAll('.qty-slider').forEach(slider=>{
      slider.addEventListener('input', ()=>{
        const i = parseInt(slider.dataset.slider, 10);
        const price = getBuyPrice(MARKET_ITEMS[i], burgId);
        document.getElementById(`qty-readout-${i}`).textContent = `${slider.value} · ${slider.value*price}g`;
      });
    });
    list.querySelectorAll('[data-buy]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.buy, 10);
        const slider = list.querySelector(`[data-slider="${i}"]`);
        buyItem(MARKET_ITEMS[i], parseInt(slider.value, 10));
      });
    });
    list.querySelectorAll('[data-sell]').forEach(btn=>{
      btn.addEventListener('click', ()=> sellItem(MARKET_ITEMS[parseInt(btn.dataset.sell, 10)]));
    });
  }

  function buyItem(mi, qty){
    const cost = qty * getBuyPrice(mi, burgId);
    if(playerGold < cost){ showToast("You don't have enough gold for that."); return; }
    if(!addItem(mi.name, qty, mi.weight, mi.price)){ showToast("Not enough room to carry that much — check your weight limit."); return; }
    setGold(playerGold - cost);
    showToast(`Bought ${qty} ${mi.name} for ${cost} gold.`);
    render();
  }

  function sellItem(mi){
    const carried = getItem(mi.name);
    if(!carried || carried.qty < 1) return;
    const price = getSellPrice(mi, burgId);
    consumeItem(mi.name, 1);
    let unequipped = false;
    if(mi.slot && !getItem(mi.name) && getEquipped()[mi.slot] === mi.name){
      setEquippedSlot(mi.slot, null); // sold the last one — can't stay equipped
      unequipped = true;
    }
    setGold(playerGold + price);
    showToast(`Sold 1 ${mi.name} for ${price} gold.${unequipped ? ' Unequipped — none left.' : ''}`);
    render();
  }

  render();
  document.getElementById('location-view').classList.add('show');
}

document.getElementById('loc-back').addEventListener('click', ()=>{
  document.getElementById('location-view').classList.remove('show');
});

// ===================== LOAD =====================
fetch('assets/travel-graph.json').then(r=>r.json()).then(graphData=>{
  graph = graphData;
  buildAdjacency();
  buildFactionData();
  if(!graph.burgs[currentBurg]){
    currentBurg = "5"; // Bary — fallback if a stale/invalid location was saved
    localStorage.setItem(LOC_KEY, currentBurg);
  } else if(!(adjacency[graph.burgs[currentBurg].cell] && adjacency[graph.burgs[currentBurg].cell].length)){
    // Saved location exists but has no road connections at all (extremely
    // rare — only 1 of 796 settlements is fully isolated) — fall back
    // to Bary rather than stranding the player somewhere with no way out.
    currentBurg = "5";
    localStorage.setItem(LOC_KEY, currentBurg);
  }

  buildHitzones();
  buildCityIcons();
  drawPlayerMarker();
  refreshCalendarUI();
  refreshPlayerStatUI();
  refreshReachability();

  const img = document.getElementById('map-img');
  const finishLoad = ()=>{
    centerOnLogical(START_X, START_Y, viewport.clientWidth / ((STAGE_W/LOGICAL_W)*REGION_W));
    // if returning to a saved location elsewhere, recenter there instead
    const b = graph.burgs[currentBurg];
    if(b && (b.x !== START_X || b.y !== START_Y)){
      centerOnLogical(b.x, b.y, viewport.clientWidth / ((STAGE_W/LOGICAL_W)*REGION_W));
    }
    document.getElementById('loading').classList.add('hide');
    checkForWhatsNew();
  };
  if(img.complete) finishLoad();
  else img.addEventListener('load', finishLoad);
}).catch(err=>{
  document.getElementById('loading').textContent = 'Could not load the map.';
  console.error(err);
});

window.addEventListener('resize', applyView);
</script>
