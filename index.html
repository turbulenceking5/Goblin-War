<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a;
    --parchment:#e9dcb8; --parchment-shadow:#b9a06e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--water-dk); font-family:'EB Garamond', serif; touch-action:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  header{
    position:relative; z-index:20;
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  .subtitle{ font-family:'Cinzel', serif; font-size:8.5px; letter-spacing:2.5px; color:#a9926a; text-transform:uppercase; }
  #zoom-controls{ display:flex; gap:6px; }
  .zbtn{
    width:34px; height:34px; border-radius:8px; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold-lt); font-family:'Cinzel',serif; font-size:16px; font-weight:700;
  }
  .zbtn:active{ transform:scale(.94); }

  #map-viewport{ position:relative; flex:1; overflow:hidden; background:var(--water-dk); touch-action:none; }
  #svg-holder{ position:absolute; inset:0; width:100%; height:100%; }
  #svg-holder svg{ width:100%; height:100%; display:block; }

  #svg-holder #labels-village text,
  #svg-holder #labels-town text,
  #svg-holder #labels-city text,
  #svg-holder #labels-capital text,
  #svg-holder #labels-state text{
    cursor:pointer;
  }
  #svg-holder text.label-selected{ fill:#7b2e2e !important; }

  #full-map-view{ position:absolute; inset:0; display:none; background:var(--water-dk); }
  #full-map-view.show{ display:block; }
  #full-map-img{ width:100%; height:100%; object-fit:contain; display:block; }

  #ui-vignette{ position:absolute; inset:0; pointer-events:none; z-index:15; box-shadow: inset 0 0 100px 34px rgba(0,0,0,.5); }

  #view-toggle{
    position:fixed; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(180deg, var(--gold-lt), var(--gold));
    border:2px solid #7a5715; color:#241705; font-family:'Cinzel', serif; font-weight:700; font-size:9px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  #view-toggle:active{ transform:scale(.94); }

  #info-card{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(180deg,#efe2bd 0%, #e2d1a2 100%);
    border-top:3px solid var(--gold); border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,.45);
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(115%); transition:transform .3s cubic-bezier(.3,.9,.4,1);
  }
  #info-card.open{ transform:translateY(0); }
  #info-card .handle{ width:38px; height:4px; border-radius:3px; background:var(--parchment-shadow); margin:0 auto 10px; }
  #info-name{ font-family:'Cinzel Decorative', serif; font-size:20px; color:var(--ink); margin:0 0 4px; }
  #info-meta{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#6a5a3a; margin:0 0 12px; }
  #btn-close{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:1px;
    background:transparent; color:#4d3a24; border:1.5px solid var(--parchment-shadow);
    border-radius:8px; padding:10px 16px; width:100%; cursor:pointer;
  }
  #btn-close:active{ transform:scale(.98); }

  #loading{
    position:fixed; inset:0; z-index:50; background:var(--water-dk);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:var(--gold-lt); font-family:'Cinzel', serif; font-size:12px; letter-spacing:2px;
  }
  #loading.hide{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1 id="header-title">THE REALM</h1>
      <div class="subtitle" id="header-sub">Tap or hover a name</div>
    </div>
    <div id="zoom-controls">
      <button class="zbtn" id="zoom-out">–</button>
      <button class="zbtn" id="zoom-in">+</button>
    </div>
  </header>

  <div id="map-viewport">
    <div id="svg-holder"></div>
    <div id="full-map-view">
      <img id="full-map-img" src="assets/full-map.jpg" alt="Full world map overview">
    </div>
    <div id="ui-vignette"></div>
  </div>

  <button id="view-toggle">FULL<br>MAP</button>

  <div id="info-card">
    <div class="handle"></div>
    <h2 id="info-name">—</h2>
    <div id="info-meta"></div>
    <button id="btn-close">Close</button>
  </div>

  <div id="loading">LOADING THE MAP…</div>
</div>

<script>
const TIER_LABEL = { village:"Village", town:"Town", city:"City", capital:"Capital", state:"Region / State" };

// Full map canvas is 2560 x 1277. Default region view centers on the
// Kingdom of Bary capital burg (the human starting kingdom).
const FULL_W = 2560, FULL_H = 1277;
const START_X = 705, START_Y = 448;
const START_W = 700, START_H = 349;
const MIN_W = 180;     // deepest zoom-in
const MAX_W = 1300;    // furthest zoom-out on the interactive region map

let vb = { x: START_X - START_W/2, y: START_Y - START_H/2, w: START_W, h: START_H };
let svgEl = null;

function clampViewBox(){
  vb.w = Math.max(MIN_W, Math.min(MAX_W, vb.w));
  vb.h = vb.w * (FULL_H/FULL_W) * (svgAspectCorrection());
  vb.x = Math.max(0, Math.min(FULL_W - vb.w, vb.x));
  vb.y = Math.max(0, Math.min(FULL_H - vb.h, vb.y));
}
function svgAspectCorrection(){
  // keep viewBox aspect matched to the on-screen viewport aspect
  const holder = document.getElementById('map-viewport');
  const ratio = holder.clientHeight / holder.clientWidth;
  return ratio / (FULL_H/FULL_W);
}
function applyViewBox(){
  clampViewBox();
  if(svgEl) svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

function zoomBy(factor, centerXpx, centerYpx){
  const holder = document.getElementById('map-viewport');
  const rect = holder.getBoundingClientRect();
  const cx = centerXpx!=null ? vb.x + (centerXpx-rect.left)/rect.width * vb.w : vb.x + vb.w/2;
  const cy = centerYpx!=null ? vb.y + (centerYpx-rect.top)/rect.height * vb.h : vb.y + vb.h/2;
  vb.x = cx - (cx - vb.x) * factor;
  vb.y = cy - (cy - vb.y) * factor;
  vb.w = vb.w * factor;
  applyViewBox();
}

document.getElementById('zoom-in').addEventListener('click', ()=> zoomBy(0.75));
document.getElementById('zoom-out').addEventListener('click', ()=> zoomBy(1.33));

// ---- pan (drag) + pinch zoom ----
const viewport = document.getElementById('map-viewport');
let pointers = new Map();
let dragLast = null;
let pinchStartDist = null;
let pinchStartW = null;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

viewport.addEventListener('pointerdown', (e)=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragLast = {x:e.clientX, y:e.clientY}; }
  if(pointers.size===2){
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartW = vb.w;
  }
});
viewport.addEventListener('pointermove', (e)=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1 && dragLast){
    const rect = viewport.getBoundingClientRect();
    const dxPx = e.clientX - dragLast.x, dyPx = e.clientY - dragLast.y;
    vb.x -= dxPx/rect.width * vb.w;
    vb.y -= dyPx/rect.height * vb.h;
    dragLast = {x:e.clientX, y:e.clientY};
    applyViewBox();
  } else if(pointers.size===2 && pinchStartDist){
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const factor = pinchStartDist/d;
    const midX = (pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
    const targetW = pinchStartW * factor;
    zoomBy(targetW/vb.w, midX, midY);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2){ pinchStartDist=null; }
  if(pointers.size<1){ dragLast=null; }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);
viewport.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomBy(e.deltaY>0?1.12:0.89, e.clientX, e.clientY);
}, {passive:false});

// ---- label selection (event delegation — one listener, not 795) ----
let selectedEl = null;
function selectLabel(el, tier){
  if(selectedEl) selectedEl.classList.remove('label-selected');
  el.classList.add('label-selected');
  selectedEl = el;
  const name = el.textContent.trim();
  document.getElementById('info-name').textContent = name;
  document.getElementById('info-meta').textContent = TIER_LABEL[tier] || tier;
  document.getElementById('info-card').classList.add('open');
}
function closeCard(){
  document.getElementById('info-card').classList.remove('open');
  if(selectedEl){ selectedEl.classList.remove('label-selected'); selectedEl = null; }
}
document.getElementById('btn-close').addEventListener('click', closeCard);

const TIER_BY_GROUP = { 'labels-village':'village','labels-town':'town','labels-city':'city','labels-capital':'capital','labels-state':'state' };

document.getElementById('svg-holder').addEventListener('click', (e)=>{
  if(e.target.tagName.toLowerCase() !== 'text'){ closeCard(); return; }
  const group = e.target.closest('[id^="labels-"]');
  if(!group || !(group.id in TIER_BY_GROUP)){ closeCard(); return; }
  selectLabel(e.target, TIER_BY_GROUP[group.id]);
});

// ---- full map toggle ----
const toggleBtn = document.getElementById('view-toggle');
const fullView = document.getElementById('full-map-view');
let showingFull = false;
toggleBtn.addEventListener('click', ()=>{
  showingFull = !showingFull;
  fullView.classList.toggle('show', showingFull);
  document.getElementById('svg-holder').style.display = showingFull ? 'none' : 'block';
  toggleBtn.innerHTML = showingFull ? 'BACK TO<br>MAP' : 'FULL<br>MAP';
  document.getElementById('header-title').textContent = showingFull ? 'FULL WORLD MAP' : 'THE REALM';
  document.getElementById('header-sub').textContent = showingFull ? 'Overview only — travel on the region map' : 'Tap or hover a name';
  document.getElementById('zoom-controls').style.visibility = showingFull ? 'hidden' : 'visible';
  if(showingFull) closeCard();
});

// ---- load the interactive region SVG ----
fetch('assets/game-map.svg')
  .then(r=>r.text())
  .then(svgText=>{
    const holder = document.getElementById('svg-holder');
    holder.innerHTML = svgText;
    svgEl = holder.querySelector('svg');
    svgEl.removeAttribute('width');
    svgEl.removeAttribute('height');
    applyViewBox();
    document.getElementById('loading').classList.add('hide');
  })
  .catch(err=>{
    document.getElementById('loading').textContent = 'Could not load the map.';
    console.error(err);
  });

window.addEventListener('resize', applyViewBox);
</script>
</body>
</html>
