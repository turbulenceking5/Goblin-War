<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:18px; text-align:center; }

  .gold-card{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:12px;
    padding:16px; margin-bottom:12px;
    font-family:'Cinzel Decorative', serif; font-size:22px; color:var(--gold-lt);
  }
  .gold-card svg{ width:24px; height:24px; }

  .weight-card{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:10px 16px; margin-bottom:10px;
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; color:#a9926a; text-transform:uppercase;
  }
  .weight-card b{ font-family:'Cinzel Decorative', serif; font-size:15px; letter-spacing:0; text-transform:none; color:var(--parchment); }
  .weight-card.over b{ color:#e2857f; }
  .meter-card{ margin-bottom:10px; }
  .meter-card:last-of-type{ margin-bottom:18px; }
  .item-note{ font-size:11.5px; color:#a9926a; font-style:italic; margin-top:2px; }

  .stat-label{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:6px 0 10px; }

  .item-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .item-row.equipped{ border-color:var(--gold); background:rgba(209,164,69,.15); }
  .item-icon{ width:26px; height:26px; flex:none; color:var(--parchment); }
  .item-info{ flex:1; min-width:140px; }
  .item-name{ font-family:'Cinzel', serif; font-size:13.5px; color:var(--parchment); }
  .item-qty{
    font-family:'Cinzel', serif; font-size:12px; color:#a9926a;
    background:rgba(255,255,255,.08); border-radius:20px; padding:3px 10px;
  }
  .item-weight{ font-size:11.5px; color:#a9926a; margin-top:2px; }
  .item-value{ font-family:'Cinzel', serif; font-size:11px; color:var(--gold-lt); white-space:nowrap; }
  .item-stats{ font-size:11px; color:#7fbf6a; margin-top:2px; }
  .equip-btn{
    flex:none; font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:.5px;
    border-radius:7px; padding:7px 12px; cursor:pointer; border:1.5px solid var(--gold);
    background:transparent; color:var(--parchment); width:100%;
  }
  .equip-btn.is-equipped{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; }
  .equip-btn:disabled{ opacity:.4; cursor:default; }
  .empty-note{ text-align:center; color:#a9926a; font-style:italic; padding:20px; }

  .slot-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin-top:4px; }
  .equip-slot{
    aspect-ratio:1; border:1.5px dashed rgba(209,164,69,.35); border-radius:8px;
    background:rgba(255,255,255,.05); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Cinzel', serif; font-size:7.5px; letter-spacing:.3px; text-transform:uppercase;
    color:#a9926a; text-align:center; padding:4px;
  }
  .equip-slot.filled{ border-style:solid; border-color:var(--gold); background:rgba(209,164,69,.2); color:var(--parchment); }
  .equip-slot .slot-label{ font-size:6.5px; opacity:.7; margin-bottom:2px; }
  .equip-slot .slot-item{ font-size:9px; font-weight:700; line-height:1.2; }
  .combat-bonus{ text-align:center; font-size:12px; color:var(--parchment); margin-top:12px; }
  .combat-bonus b{ color:#7fbf6a; }

  #toast{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
  <header>
    <h1>INVENTORY</h1>
    <button id="back-btn" onclick="location.href='index.html?_='+Date.now()">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Bag &amp; Equipment</div>

    <div class="gold-card">
      <svg viewBox="0 0 24 24" fill="#c9a227"><circle cx="12" cy="12" r="9"/></svg>
      <span id="gold-value">50</span> gold
    </div>

    <div class="weight-card" id="weight-card">
      <span>Carried Weight</span>
      <b id="weight-value">0 / 0</b>
    </div>

    <div class="weight-card meter-card">
      <span>Hunger</span>
      <b id="hunger-value">0 / 100</b>
    </div>

    <div class="weight-card meter-card">
      <span>Thirst</span>
      <b id="thirst-value">0 / 100</b>
    </div>

    <div class="stat-label">Carried Items</div>
    <div id="item-list"></div>

    <div class="stat-label" style="margin-top:20px;">Equipment</div>
    <div class="slot-grid" id="equip-grid"></div>
    <div class="combat-bonus" id="combat-bonus"></div>
  </main>
  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const GOLD_KEY = "goblinwar_gold";
const INV_KEY = "goblinwar_inventory";
const EQUIPPED_KEY = "goblinwar_equipped";
const CARRY_CAPACITY = 40;
const SKILLS_KEY = "goblinwar_skills";
const HUNGER_KEY = "goblinwar_hunger";
const THIRST_KEY = "goblinwar_thirst";
// Food and Waterskin are the game's two real consumables (see the item-list special cases
// below) — eating/drinking fights Hunger/Thirst (see index.html's HUNGER & THIRST section),
// not Stamina; per the project owner, neither item touches Stamina at all anymore.
const FOOD_HUNGER_RESTORE = 35;
const WATERSKIN_THIRST_RESTORE = 35;
// Mirrors index.html's getCarryCapacity()/getEquipDamageBonus()/getEquipDefenseBonus() — only
// Pack Mule/Power Strike/Iron Skin matter here, so this doesn't need the full PERKS table, just
// those three flags (duplicated per the no-modules convention).
function getUnlockedSkills(){ try{ return JSON.parse(localStorage.getItem(SKILLS_KEY)) || {}; }catch(e){ return {}; } }
function hasPerk(id){ return !!getUnlockedSkills()[id]; }
function getCarryCapacity(){
  return CARRY_CAPACITY + (hasPerk('pack_mule') ? 10 : 0);
}
const EQUIP_SLOTS = ["head","chest","legs","weapon","shield","trinket"];
const SLOT_LABEL = { head:"Head", chest:"Chest", legs:"Legs", weapon:"Weapon", shield:"Shield", trinket:"Trinket" };
// Mirrors index.html's MARKET_ITEMS slot/dmg/def data for the items that are actually
// equippable — duplicated per the no-modules convention (see CLAUDE.md).
const ITEM_STATS = {
  "Sword": { slot:"weapon", dmg:4, def:0 },
  "Shield": { slot:"shield", dmg:0, def:3 },
  "Leather Cap": { slot:"head", dmg:0, def:1 },
  "Leather Armour": { slot:"chest", dmg:0, def:2 },
  "Leather Boots": { slot:"legs", dmg:0, def:1 },
  "Lucky Charm": { slot:"trinket", dmg:1, def:0 },
};

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function getEquipped(){ try{ return JSON.parse(localStorage.getItem(EQUIPPED_KEY)) || {}; }catch(e){ return {}; } }
function setEquippedSlot(slot, itemName){
  const eq = getEquipped();
  eq[slot] = itemName;
  localStorage.setItem(EQUIPPED_KEY, JSON.stringify(eq));
}

let playerHunger = parseInt(localStorage.getItem(HUNGER_KEY) || "0", 10);
let playerThirst = parseInt(localStorage.getItem(THIRST_KEY) || "0", 10);
// Simple clamped setters — unlike index.html's addHunger/addThirst, this page only ever reduces
// either meter (eating/drinking), so there's no "overflow past 100 costs Health" case to handle
// here at all; that logic lives entirely in index.html, the only place either meter ever rises.
function setHunger(v){
  playerHunger = Math.max(0, Math.min(100, v));
  localStorage.setItem(HUNGER_KEY, String(playerHunger));
}
function setThirst(v){
  playerThirst = Math.max(0, Math.min(100, v));
  localStorage.setItem(THIRST_KEY, String(playerThirst));
}
function getItem(name){ return items.find(it => it.name === name); }
function consumeItem(name, qty){
  const existing = getItem(name);
  if(!existing) return;
  existing.qty = Math.max(0, existing.qty - qty);
  if(existing.qty === 0) items = items.filter(it => it !== existing);
  localStorage.setItem(INV_KEY, JSON.stringify(items));
}

const gold = parseInt(localStorage.getItem(GOLD_KEY) || "50", 10);
document.getElementById('gold-value').textContent = gold;

let items = [];
try{ items = JSON.parse(localStorage.getItem(INV_KEY) || "[]"); }catch(e){ items = []; }

// Bedroll has no button — both its effects are passive, just from being carried (see
// index.html's BEDROLL_AMBUSH_MULT/BEDROLL_STAMINA_BONUS) — so this is purely informational,
// the same spot an equip stat-line would go.
const ITEM_NOTES = {
  "Bedroll": "Makes camping safer, and leaves you a little extra rested afterward — both just from being carried.",
};

function render(){
  const carriedWeight = items.reduce((sum, it) => sum + (it.weight||0)*it.qty, 0);
  const weightCard = document.getElementById('weight-card');
  const capacity = getCarryCapacity();
  document.getElementById('weight-value').textContent = `${carriedWeight} / ${capacity}`;
  weightCard.classList.toggle('over', carriedWeight > capacity);
  document.getElementById('hunger-value').textContent = `${playerHunger} / 100`;
  document.getElementById('thirst-value').textContent = `${playerThirst} / 100`;

  const equipped = getEquipped();
  const list = document.getElementById('item-list');
  if(items.length === 0){
    list.innerHTML = `<div class="empty-note">Your bag is empty.</div>`;
  } else {
    list.innerHTML = items.map(it => {
      const stats = ITEM_STATS[it.name];
      const isEquipped = stats && equipped[stats.slot] === it.name;
      const statLine = stats ? `${stats.dmg ? `+${stats.dmg} dmg` : `-${stats.def} dmg taken`} while equipped` : '';
      const isFood = it.name === 'Food';
      const isWaterskin = it.name === 'Waterskin';
      let actionHTML = '';
      if(stats) actionHTML = `<button class="equip-btn ${isEquipped ? 'is-equipped' : ''}" data-equip-name="${it.name}" data-equip-slot="${stats.slot}">${isEquipped ? 'Unequip' : 'Equip'}</button>`;
      else if(isFood) actionHTML = `<button class="equip-btn" id="eat-food-btn" ${playerHunger <= 0 ? 'disabled' : ''}>${playerHunger <= 0 ? 'Not Hungry' : `Eat (-${FOOD_HUNGER_RESTORE} Hunger)`}</button>`;
      else if(isWaterskin) actionHTML = `<button class="equip-btn" id="drink-waterskin-btn" ${playerThirst <= 0 ? 'disabled' : ''}>${playerThirst <= 0 ? 'Not Thirsty' : `Drink (-${WATERSKIN_THIRST_RESTORE} Thirst)`}</button>`;
      return `
      <div class="item-row ${isEquipped ? 'equipped' : ''}">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="8" width="16" height="12" rx="1.5"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>
        </svg>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          ${it.weight ? `<div class="item-weight">${it.weight} wt each &middot; ${it.weight*it.qty} total</div>` : ''}
          ${statLine ? `<div class="item-stats">${statLine}</div>` : ''}
          ${ITEM_NOTES[it.name] ? `<div class="item-note">${ITEM_NOTES[it.name]}</div>` : ''}
        </div>
        <span class="item-qty">&times;${it.qty}</span>
        ${it.value ? `<span class="item-value">${it.value}g each</span>` : ''}
        ${actionHTML}
      </div>
    `;
    }).join('');
    list.querySelectorAll('[data-equip-name]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const name = btn.dataset.equipName, slot = btn.dataset.equipSlot;
        const currentlyEquipped = getEquipped()[slot] === name;
        setEquippedSlot(slot, currentlyEquipped ? null : name);
        showToast(currentlyEquipped ? `Unequipped ${name}.` : `Equipped ${name}.`);
        render();
      });
    });
    const eatBtn = document.getElementById('eat-food-btn');
    if(eatBtn){
      eatBtn.addEventListener('click', ()=>{
        if(playerHunger <= 0){ showToast("You're not hungry right now."); return; }
        const relief = Math.min(FOOD_HUNGER_RESTORE, playerHunger);
        setHunger(playerHunger - relief);
        consumeItem('Food', 1);
        showToast(`You eat. -${relief} Hunger.`);
        render();
      });
    }
    const drinkBtn = document.getElementById('drink-waterskin-btn');
    if(drinkBtn){
      drinkBtn.addEventListener('click', ()=>{
        if(playerThirst <= 0){ showToast("You're not thirsty right now."); return; }
        const relief = Math.min(WATERSKIN_THIRST_RESTORE, playerThirst);
        setThirst(playerThirst - relief);
        consumeItem('Waterskin', 1);
        showToast(`You take a long drink. -${relief} Thirst.`);
        render();
      });
    }
  }

  const grid = document.getElementById('equip-grid');
  grid.innerHTML = EQUIP_SLOTS.map(slot => {
    const itemName = equipped[slot];
    return `
      <div class="equip-slot ${itemName ? 'filled' : ''}" data-slot="${slot}">
        <div class="slot-label">${SLOT_LABEL[slot]}</div>
        ${itemName ? `<div class="slot-item">${itemName}</div>` : ''}
      </div>
    `;
  }).join('');
  grid.querySelectorAll('.equip-slot.filled').forEach(el=>{
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=>{
      const slot = el.dataset.slot;
      const name = getEquipped()[slot];
      setEquippedSlot(slot, null);
      showToast(`Unequipped ${name}.`);
      render();
    });
  });

  // Includes Power Strike/Iron Skin alongside gear — omitting them would under-report the
  // same bonus combatAttack() actually applies (see index.html's getEquipDamageBonus/
  // getEquipDefenseBonus), which is exactly what this line is meant to preview.
  const dmgBonus = EQUIP_SLOTS.reduce((sum, s) => { const n = equipped[s]; const st = n && ITEM_STATS[n]; return sum + (st ? st.dmg : 0); }, 0) + (hasPerk('power_strike') ? 2 : 0);
  const defBonus = EQUIP_SLOTS.reduce((sum, s) => { const n = equipped[s]; const st = n && ITEM_STATS[n]; return sum + (st ? st.def : 0); }, 0) + (hasPerk('iron_skin') ? 1 : 0);
  document.getElementById('combat-bonus').innerHTML = (dmgBonus || defBonus)
    ? `Combat bonus: <b>+${dmgBonus} damage dealt</b>, <b>-${defBonus} damage taken</b>`
    : `No combat bonus equipped yet.`;
}

render();
</script>
</body>
</html>
