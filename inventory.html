<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:var(--parchment); font-family:'EB Garamond', serif; color:var(--ink); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#8a7440; text-transform:uppercase; margin-bottom:18px; text-align:center; }

  .gold-card{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:rgba(255,255,255,.4); border:1.5px solid var(--parchment-shadow); border-radius:12px;
    padding:16px; margin-bottom:12px;
    font-family:'Cinzel Decorative', serif; font-size:22px; color:#8a6a1f;
  }
  .gold-card svg{ width:24px; height:24px; }

  .weight-card{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.35); border:1.5px solid var(--parchment-shadow); border-radius:10px;
    padding:10px 16px; margin-bottom:18px;
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; color:#6a5a3a; text-transform:uppercase;
  }
  .weight-card b{ font-family:'Cinzel Decorative', serif; font-size:15px; letter-spacing:0; text-transform:none; color:var(--ink); }
  .weight-card.over b{ color:#8c3a3a; }

  .stat-label{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#6a5a3a; margin:6px 0 10px; }

  .item-row{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.35); border:1.5px solid var(--parchment-shadow); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .item-icon{ width:26px; height:26px; flex:none; color:var(--ink); }
  .item-info{ flex:1; }
  .item-name{ font-family:'Cinzel', serif; font-size:13.5px; color:var(--ink); }
  .item-qty{
    font-family:'Cinzel', serif; font-size:12px; color:#6a5a3a;
    background:rgba(0,0,0,.08); border-radius:20px; padding:3px 10px;
  }
  .item-weight{ font-size:11.5px; color:#8a7440; margin-top:2px; }
  .empty-note{ text-align:center; color:#8a7440; font-style:italic; padding:20px; }

  .coming-soon{
    text-align:center; padding:26px 20px; background:rgba(255,255,255,.3);
    border:1.5px dashed var(--parchment-shadow); border-radius:12px; margin-top:8px;
  }
  .coming-soon .icon{ font-size:30px; margin-bottom:8px; opacity:.6; }
  .coming-soon p{ font-size:14.5px; color:#5a4830; line-height:1.6; margin:0; }
</style>
</head>
<body>
  <header>
    <h1>INVENTORY</h1>
    <button id="back-btn" onclick="location.href='index.html'">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Bag &amp; Equipment</div>

    <div class="gold-card">
      <svg viewBox="0 0 24 24" fill="#c9a227"><circle cx="12" cy="12" r="9"/></svg>
      <span id="gold-value">50</span> gold
    </div>

    <div class="weight-card" id="weight-card">
      <span>Carried Weight</span>
      <b id="weight-value">0 / 0</b>
    </div>

    <div class="stat-label">Carried Items</div>
    <div id="item-list"></div>

    <div class="stat-label" style="margin-top:20px;">Equipment</div>
    <div class="coming-soon">
      <div class="icon">🎒</div>
      <p>Weapons and armor aren't built yet. The Marketplace (in any settlement) currently only sells Food.</p>
    </div>
  </main>

<script>
const GOLD_KEY = "goblinwar_gold";
const INV_KEY = "goblinwar_inventory";
const CARRY_CAPACITY = 40;

const gold = parseInt(localStorage.getItem(GOLD_KEY) || "50", 10);
document.getElementById('gold-value').textContent = gold;

let items = [];
try{ items = JSON.parse(localStorage.getItem(INV_KEY) || "[]"); }catch(e){ items = []; }

const carriedWeight = items.reduce((sum, it) => sum + (it.weight||0)*it.qty, 0);
const weightCard = document.getElementById('weight-card');
document.getElementById('weight-value').textContent = `${carriedWeight} / ${CARRY_CAPACITY}`;
if(carriedWeight > CARRY_CAPACITY) weightCard.classList.add('over');

const list = document.getElementById('item-list');
if(items.length === 0){
  list.innerHTML = `<div class="empty-note">Your bag is empty.</div>`;
} else {
  list.innerHTML = items.map(it => `
    <div class="item-row">
      <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="4" y="8" width="16" height="12" rx="1.5"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>
      </svg>
      <div class="item-info">
        <div class="item-name">${it.name}</div>
        ${it.weight ? `<div class="item-weight">${it.weight} wt each &middot; ${it.weight*it.qty} total</div>` : ''}
      </div>
      <span class="item-qty">&times;${it.qty}</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
