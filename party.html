<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Party</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:24px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:18px; text-align:center; }
  .party-count{
    font-family:'Cinzel Decorative', serif; font-size:14px; color:var(--gold-lt);
    text-align:center; margin:-8px 0 16px;
  }

  .coming-soon{
    text-align:center; padding:40px 20px; background:rgba(255,255,255,.05);
    border:1.5px dashed rgba(209,164,69,.35); border-radius:12px; margin-top:20px;
  }
  .coming-soon .icon{ font-size:38px; margin-bottom:10px; opacity:.6; }
  .coming-soon p{ font-size:16px; color:var(--parchment); line-height:1.6; margin:0; }

  .companion-row{
    display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .companion-portrait{
    flex:none; width:64px; height:64px; border-radius:10px; overflow:hidden;
    border:1.5px dashed rgba(209,164,69,.35); background:rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center;
  }
  .companion-portrait img{ width:100%; height:100%; object-fit:cover; object-position:top; }
  .companion-portrait svg{ width:30px; height:30px; }
  .companion-info{ flex:1; min-width:0; }
  .companion-name{ font-family:'Cinzel', serif; font-size:14.5px; color:var(--parchment); }
  .companion-title{ font-size:11.5px; color:#a9926a; font-style:italic; margin-top:2px; }
  .companion-blurb{ font-size:12px; color:var(--parchment); margin-top:6px; line-height:1.4; }
  .companion-upkeep{ font-size:11px; color:#e0a860; margin-top:6px; }
  /* Read-only display of a recruited companion's loyalty (see index.html's adjustPartyLoyalty —
     this page never writes it, same display-only split already used for combatHp/combatDmgRange). */
  .loyalty-row{ display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#a9926a; margin-top:8px; margin-bottom:2px; }
  .loyalty-track{ background:rgba(0,0,0,.35); border-radius:6px; height:8px; overflow:hidden; border:1px solid rgba(255,255,255,.15); margin-top:3px; }
  .loyalty-fill{ height:100%; background:linear-gradient(90deg,#8a6a2e,#d1a445); transition:width .3s; }
  .dismiss-btn{
    flex:none; align-self:flex-start; margin-top:8px; font-family:'Cinzel', serif; font-size:11px;
    padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1.5px solid #a9433a; background:rgba(160,60,50,.15); color:#e2857f; font-weight:700;
  }
  .dismiss-btn:active{ transform:scale(.96); }

  #toast{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
  <header>
    <h1>PARTY</h1>
    <button id="back-btn" onclick="location.href='index.html?_='+Date.now()">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Followers & Companions</div>
    <div class="party-count" id="party-count"></div>
    <div id="party-list"></div>
    <div class="coming-soon" id="empty-state">
      <div class="icon">👥</div>
      <p>No followers yet.<br>Recruitable companions and their own quests will show up here once that system is built.</p>
    </div>
  </main>
  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const PARTY_KEY = "goblinwar_party"; // JSON array of recruited companion ids
const MAX_PARTY_SIZE = 3; // shared cap across recruited companions and hired mercenaries combined

// Catalog of every recruitable companion, matching the ENEMY_VARIANTS/NOTABLE_FIGURES pattern
// in index.html — one array entry plus a portrait file, no other code changes needed once a
// companion's art exists. `portrait` should point at a transparent-background PNG under
// assets/party/, downscaled to a 200px longest edge — smaller than the enemy-art convention in
// context/combat.md (600px), since a companion/mercenary portrait is never shown larger than a
// 64px thumbnail anywhere (`.companion-portrait`, below) — the original 600px imports were
// 270-390KB each and measurably slowed this page down on a real connection, per the project
// owner. A companion with no `portrait` falls back to the same placeholder silhouette
// character.html's hero sheet uses for the player's own not-yet-drawn portrait.
// Prompts for these three live in the "Character Forge" tracker artifact. Recruiting is real now
// — index.html's showCompanionPanel, triggered by a "A New Face" settlement action wherever a
// companion's own homeBurgId matches (this page's copy doesn't need that field, only display
// fields) — see context/roadmap.md's "Party / Companions" for the full flow and
// context/secondary-pages.md for this page's own Part Ways action, this recruit flow's mirror.
const COMPANIONS = [
  { id:"brannoc-ward", name:"Ser Brannoc Ward", title:"a sellsword knight, more scars than shine", blurb:"Fights for coin now, but still remembers what it felt like to fight for something else.", portrait:"assets/party/brannoc-ward.png" },
  { id:"wren-sable", name:"Wren Sable", title:"a hedge-mage chasing rumors of old magic", blurb:"Half the spells in her head came from books she was never supposed to read.", portrait:"assets/party/wren-sable.png" },
  { id:"thrain-emberforge", name:"Thrain Emberforge", title:"a dwarf smith who traded the forge for the road", blurb:"Says he's just here for the good steel. Nobody quite believes him.", portrait:"assets/party/thrain-emberforge.png" },
];

// Hired mercenaries — see index.html's Guard House "Hire a Mercenary" action, the only place
// goblinwar_mercenaries actually gets written. Still anonymous (no name, per the project owner):
// a hired sword, not a character — kept distinct from COMPANIONS above, which is reserved for a
// future recruit-with-loyalty flow. Each role now has real generic portrait art under
// assets/mercenaries/ (faceless by design — full helm or a shadowed hood, never a face — so the
// art stays consistent with "hired sword, not a character" even though it's no longer a
// placeholder silhouette). Duplicated from index.html's own MERCENARY_TYPES per the no-modules
// convention — this copy skips index.html's combatHp/combatDmgRange fields since this page
// never runs combat, only displays the roster. Mercenaries and recruited companions alike fight
// and can die permanently now (see context/combat.md's "Party in combat" — COMPANIONS above skips
// those same fields for the same reason); a roster entry vanishing from this page after a fight,
// with no Dismiss/Part Ways click involved, means exactly that.
const MERCENARY_KEY = "goblinwar_mercenaries";
const MERCENARY_TYPES = [
  { id:"sellsword",        title:"Hired Sellsword",   blurb:"A blade for hire, hood up, face down.",       upkeep:5, portrait:"assets/mercenaries/sellsword.png" },
  { id:"mercenary_archer", title:"Mercenary Archer",  blurb:"Keeps to the back line and never gives a name.", upkeep:5, portrait:"assets/mercenaries/mercenary-archer.png" },
  { id:"veteran_guard",    title:"Veteran Guard",     blurb:"Old armor, older habits — steady in a fight.", upkeep:6, portrait:"assets/mercenaries/veteran-guard.png" },
];

function getParty(){
  try{ return JSON.parse(localStorage.getItem(PARTY_KEY)) || []; }catch(e){ return []; }
}
function saveParty(list){ localStorage.setItem(PARTY_KEY, JSON.stringify(list)); }
// Read-only here — index.html owns every write to this (recruiting, Aid the Refugees/Negotiate
// Peace, Raid a Village/Incite War, a world event's choice — see context/combat.md's "Party in
// combat" sibling doc, context/roadmap.md's "Companion loyalty"). This page only displays it.
const LOYALTY_KEY = "goblinwar_companionLoyalty";
function getCompanionLoyalty(){
  try{ return JSON.parse(localStorage.getItem(LOYALTY_KEY)) || {}; }catch(e){ return {}; }
}
function loyaltyLabel(val){
  if(val >= 80) return "Devoted";
  if(val >= 55) return "Content";
  if(val >= 30) return "Wary";
  if(val >= 10) return "Resentful";
  return "Hostile";
}
function getMercenaries(){
  try{ return JSON.parse(localStorage.getItem(MERCENARY_KEY)) || []; }catch(e){ return []; }
}
function saveMercenaries(list){ localStorage.setItem(MERCENARY_KEY, JSON.stringify(list)); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function dismissMercenary(instanceId){
  const mercs = getMercenaries();
  const m = mercs.find(x => x.instanceId === instanceId);
  if(!m) return;
  const type = MERCENARY_TYPES.find(t => t.id === m.typeId);
  if(!confirm(`Dismiss ${type ? type.title : 'this mercenary'}? This cannot be undone.`)) return;
  saveMercenaries(mercs.filter(x => x.instanceId !== instanceId));
  showToast('Mercenary dismissed.');
  render();
}

// A companion isn't a paid transaction like a mercenary — "Part Ways" rather than "Dismiss" —
// but freeing up the shared party slot works the same way. They can always be talked to again
// at their home city afterward, same as declining in the first place (see index.html's
// showCompanionPanel).
function partWithCompanion(id){
  const companion = COMPANIONS.find(c => c.id === id);
  if(!confirm(`Part ways with ${companion ? companion.name : 'this companion'}?`)) return;
  saveParty(getParty().filter(x => x !== id));
  // Clears their loyalty entry too — tidiness only, since index.html's recruit handler always
  // resets loyalty to 50 on a fresh recruit regardless of what's left over here.
  const loyalty = getCompanionLoyalty();
  delete loyalty[id];
  localStorage.setItem(LOYALTY_KEY, JSON.stringify(loyalty));
  showToast('You part ways.');
  render();
}

function portraitMarkup(c){
  if(c.portrait) return `<img src="${c.portrait}" alt="${c.name}">`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#7b2e2e" stroke-width="1.3">
    <circle cx="12" cy="7" r="4" fill="#e9dcb8"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#e9dcb8"/>
  </svg>`;
}

function render(){
  const recruited = getParty().map(id => COMPANIONS.find(c => c.id === id)).filter(Boolean);
  const mercs = getMercenaries();
  const total = recruited.length + mercs.length;
  document.getElementById('party-count').textContent = `${total} / ${MAX_PARTY_SIZE}`;
  const list = document.getElementById('party-list');
  const emptyState = document.getElementById('empty-state');
  if(total === 0){
    list.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  const loyalty = getCompanionLoyalty();
  const companionRows = recruited.map(c => {
    const loy = loyalty[c.id] === undefined ? 50 : loyalty[c.id];
    return `
    <div class="companion-row">
      <div class="companion-portrait">${portraitMarkup(c)}</div>
      <div class="companion-info">
        <div class="companion-name">${c.name}</div>
        ${c.title ? `<div class="companion-title">${c.title}</div>` : ''}
        ${c.blurb ? `<div class="companion-blurb">${c.blurb}</div>` : ''}
        <div class="loyalty-row"><span>Loyalty</span><span>${loyaltyLabel(loy)}</span></div>
        <div class="loyalty-track"><div class="loyalty-fill" style="width:${loy}%"></div></div>
        <button class="dismiss-btn" data-part="${c.id}">Part Ways</button>
      </div>
    </div>
  `;
  }).join('');
  // Mercenaries never carry a `name` — still anonymous — but each role now has its own generic
  // portrait (see MERCENARY_TYPES above), so this shows that art with the role's title standing
  // in for a companion's name, rather than falling back to the placeholder silhouette.
  const mercRows = mercs.map(m => {
    const type = MERCENARY_TYPES.find(t => t.id === m.typeId) || { title:"Mercenary", blurb:"", upkeep:0 };
    return `
      <div class="companion-row">
        <div class="companion-portrait">${portraitMarkup({ portrait: type.portrait, name: type.title })}</div>
        <div class="companion-info">
          <div class="companion-name">${type.title}</div>
          <div class="companion-blurb">${type.blurb}</div>
          <div class="companion-upkeep">${type.upkeep}g/day upkeep</div>
          <button class="dismiss-btn" data-dismiss="${m.instanceId}">Dismiss</button>
        </div>
      </div>
    `;
  }).join('');
  list.innerHTML = companionRows + mercRows;
  list.querySelectorAll('[data-dismiss]').forEach(btn => {
    btn.addEventListener('click', ()=> dismissMercenary(btn.dataset.dismiss));
  });
  list.querySelectorAll('[data-part]').forEach(btn => {
    btn.addEventListener('click', ()=> partWithCompanion(btn.dataset.part));
  });
}

render();
</script>
</body>
</html>
