<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#0d1220">
<title>Goblin War — Quests</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#141a2e; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#0d1220; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#0d1220; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #0d1220 100%), url('assets/ui/bg-dither.jpg'); background-blend-mode:overlay; background-size:auto, 350px;
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Press Start 2P', 'Cinzel Decorative', serif; font-size:12px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); line-height:1.5; }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px; display:inline-flex; align-items:center; gap:6px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn img{ width:14px; height:14px; flex:none; image-rendering:pixelated; }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:18px; text-align:center; }
  .section-label{ font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:22px 0 8px; }
  .section-label:first-of-type{ margin-top:0; }
  .empty-note{ font-size:12.5px; color:#a9926a; font-style:italic; text-align:center; padding:6px 0 14px; }

  .quest-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; margin-bottom:10px;
  }
  .quest-title{ font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px; }
  .quest-desc{ font-size:13px; color:#a9926a; line-height:1.5; }
  .quest-row{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .quest-reward{ font-size:12px; color:#7fbf6a; font-weight:700; }
  .quest-completed-day{ font-size:11px; color:#a9926a; font-style:italic; }
  .quest-actions{ display:flex; gap:8px; margin-top:8px; }
  .quest-actions button{ flex:1; }
  .view-btn{
    font-family:'Cinzel', serif; font-size:11px; padding:7px 12px; border-radius:8px; cursor:pointer;
    border:1.5px solid rgba(209,164,69,.4); background:transparent; color:var(--parchment); font-weight:700;
  }
  .view-btn:active{ transform:scale(.96); }
  .abandon-btn{
    flex:none; font-family:'Cinzel', serif; font-size:11px; padding:7px 12px; border-radius:8px; cursor:pointer;
    border:1.5px solid #a9433a; background:rgba(160,60,50,.15); color:#e2857f; font-weight:700;
  }
  .abandon-btn:active{ transform:scale(.96); }

  #toast{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(13,18,32,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* Themed confirm modal — the Expansion Research idea of the same name: replaces the native
     browser confirm() dialog (breaks the pixel-art theme, per the project owner) with one that
     matches it. Self-contained (own button styling, not .btn/.btn-danger) since this page has no
     such generic classes of its own — see showConfirm below. */
  #confirm-modal{
    position:fixed; inset:0; z-index:45; display:none;
    background:rgba(8,10,18,.75);
    align-items:center; justify-content:center; padding:20px;
  }
  #confirm-modal.show{ display:flex; }
  #confirm-card{
    max-width:340px; width:100%;
    background:linear-gradient(180deg,#1c2238 0%, #0d1220 100%);
    border:2px solid var(--gold); border-radius:14px;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 12px 30px rgba(0,0,0,.6);
  }
  #confirm-message{ font-size:14px; color:var(--parchment); line-height:1.5; margin-bottom:18px; text-align:center; }
  #confirm-actions{ display:flex; gap:10px; }
  #confirm-actions button{
    flex:1; font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px;
    border-radius:8px; padding:10px 14px; cursor:pointer;
  }
  #confirm-cancel{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }
  #confirm-ok{ background:transparent; color:#e2857f; border:1.5px solid #a9433a; font-weight:700; }
  #confirm-cancel:active, #confirm-ok:active{ transform:scale(.97); }
</style>
</head>
<body>
  <header>
    <h1>QUESTS</h1>
    <button id="back-btn" onclick="location.href='index.html?_='+Date.now()"><img src="assets/ui/sword-icon.png" alt=""> Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Active Quests &amp; History</div>

    <div class="section-label">Active Quests</div>
    <div id="active-list"></div>

    <div class="section-label">Recently Completed</div>
    <div id="completed-list"></div>
  </main>
  <div id="toast"></div>

  <div id="confirm-modal">
    <div id="confirm-card">
      <div id="confirm-message"></div>
      <div id="confirm-actions">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const QUEST_KEY = "goblinwar_quests";
const COMPLETEDQUEST_KEY = "goblinwar_completedQuests";
const CAL_KEY = "goblinwar_gameDay";
const gameDay = parseInt(localStorage.getItem(CAL_KEY) || "0", 10); // for the Rival Adventurer race countdown below
const HOURS_PER_DAY = 24;
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// Themed confirm modal — the Expansion Research idea of the same name. showConfirm(message,
// onConfirm) is the async-callback equivalent of the native `if(!confirm(message)) return; ...`
// pattern it replaces — every call site below wraps its own "rest of the function" in the
// callback instead. Only one at a time; Cancel (or a second call) just discards whatever was
// pending.
let confirmResolve = null;
function showConfirm(message, onConfirm){
  document.getElementById('confirm-message').textContent = message;
  confirmResolve = onConfirm;
  document.getElementById('confirm-modal').classList.add('show');
}
document.getElementById('confirm-cancel').addEventListener('click', ()=>{
  confirmResolve = null;
  document.getElementById('confirm-modal').classList.remove('show');
});
document.getElementById('confirm-ok').addEventListener('click', ()=>{
  document.getElementById('confirm-modal').classList.remove('show');
  const fn = confirmResolve;
  confirmResolve = null;
  if(fn) fn();
});

// Mirrors index.html's formatDuration exactly (duplicated per the no-modules convention) — used
// here to render the distanceHours a quest was accepted with (see index.html's
// generateBoardOffers), not to compute a new one.
function formatDuration(hours){
  if(hours < HOURS_PER_DAY) return `${hours} hour${hours===1?'':'s'}`;
  const d = Math.floor(hours/HOURS_PER_DAY), h = hours%HOURS_PER_DAY;
  return `${d} day${d===1?'':'s'}${h ? ` ${h} hour${h===1?'':'s'}` : ''}`;
}
function dayLabel(dayCount){
  const day = (dayCount % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(dayCount / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(dayCount / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  return `Day ${day}, Month ${month}, Year ${year}`;
}

// Mirrors index.html's COMPANION_QUESTS exactly (duplicated per the no-modules convention) —
// title/ask text only, needed by questTitle/questDesc's companion_kill/companion_deliver
// branches below.
const COMPANION_QUESTS = {
  "brannoc-ward": { title: "An Old Debt", ask: "asks you to put down a raiding party in his old mentor's name — a debt he never got to repay." },
  "wren-sable": { title: "Word Home", ask: "asks you to carry a letter back to her family, to let them know she's still alive." },
  "thrain-emberforge": { title: "Cleared Roads", ask: "asks you to clear the bandits off the trade road his old forge always depended on." }
};
// Mirrors index.html's questTitle/questDesc (duplicated per the no-modules convention) — this
// copy had drifted (missing the companion_kill/companion_deliver branches entirely, and now also
// the kingdom-specific "Drive Off X's Raiders" wording — see context/quests.md's "Kingdom-specific
// kill quests") since quests.html's own Abandon flow below needs questTitle to actually name a
// companion quest rather than falling back to the generic "Quest".
function questTitle(q){
  if(q.type === 'deliver_message') return 'Deliver a Message';
  if(q.type === 'deliver_cargo') return 'Deliver Cargo';
  if(q.type === 'destroy_goblin_nest') return 'Destroy a Goblin Nest';
  if(q.type === 'protect_caravan') return 'Protect a Caravan';
  if(q.type === 'train_villagers') return 'Train the Villagers';
  if(q.type === 'ask_for_news') return 'Ask Around for News';
  if(q.type === 'bounty_variant') return `Bounty: ${q.targetVariant}`;
  // 3 mirrors index.html's KINGDOM_FAVOR_MAX_TIER literally — this file never loads enough of
  // index.html's war/reputation machinery to import the real constant, same no-modules convention
  // as everything else duplicated here.
  if(q.type === 'kingdom_favor') return q.tier >= 3 ? `A Lasting Alliance with ${q.targetKingdom}` : `A Favor for ${q.targetKingdom}`;
  if(q.type === 'kill_bandits') return 'Deal with the Bandits';
  if(q.type === 'kill_raiders') return q.targetKingdom ? `Drive Off ${q.targetKingdom}'s Raiders` : 'Drive Off the Raiders';
  if(q.type === 'companion_kill' || q.type === 'companion_deliver') return (COMPANION_QUESTS[q.companionId] && COMPANION_QUESTS[q.companionId].title) || 'A Personal Favor';
  if(q.type === 'smuggle_supplies') return 'Smuggle Supplies Through Enemy Lines';
  if(q.type === 'debt_repay') return 'A Debt to Repay';
  if(q.type === 'companion_defend') return 'Defend My Home';
  return 'Quest';
}
function questDistanceNote(q){
  if(typeof q.distanceHours !== 'number') return '';
  return ` (${formatDuration(q.distanceHours)} away)`;
}
function questDesc(q){
  if(q.type === 'deliver_message') return `Carry word from ${q.giverName} to ${q.targetName}.${questDistanceNote(q)}`;
  if(q.type === 'deliver_cargo') return `Carry a shipment from ${q.giverName} to ${q.targetName}.${questDistanceNote(q)}`;
  if(q.type === 'destroy_goblin_nest') return `${q.giverName} wants a goblin nest thinned out before it grows bold — ${Math.min(q.killsProgress||0, q.killsRequired)} of ${q.killsRequired} goblins slain.`;
  if(q.type === 'protect_caravan') return `${q.giverName} has hired you to guard the next caravan leaving town — defend it from whatever finds it on the road.`;
  if(q.type === 'train_villagers') return `${q.giverName} wants the local militia drilled — a day's Work here in town will see to it.`;
  if(q.type === 'ask_for_news') return `${q.giverName} wants to know what's being said around town.`;
  if(q.type === 'bounty_variant') return `A bounty's been posted on ${q.targetVariant}, a notorious threat last seen prowling this region. Bring proof of the kill.`;
  if(q.type === 'kingdom_favor') return q.tier >= 3
    ? `${q.giverName} says this is the last thing ${q.targetKingdom} will ever need to ask of you — stand with them once more against the goblin and ork raiders threatening the region, and your two peoples' bond is sealed for good.`
    : `${q.giverName} asks you to prove your continued goodwill toward ${q.targetKingdom} by driving off the goblin and ork raiders threatening the region.`;
  if(q.type === 'kill_bandits') return `${q.giverName} asked you to see to the bandits plaguing the roads.${questRivalNote(q)}`;
  if(q.type === 'kill_raiders') return (q.targetKingdom
    ? `${q.giverName} asked you to drive off ${q.targetKingdom}'s raiders threatening the region.`
    : `${q.giverName} asked you to drive off the goblin and ork raiders threatening the region.`) + questRivalNote(q);
  if(q.type === 'companion_deliver') return `Carry word from ${q.giverName} to ${q.targetName}.${questDistanceNote(q)}`;
  if(q.type === 'companion_kill') return `${q.giverName} ${(COMPANION_QUESTS[q.companionId] && COMPANION_QUESTS[q.companionId].ask) || 'asked for your help.'}`;
  if(q.type === 'smuggle_supplies') return `${q.giverName} needs a quiet shipment run straight through to ${q.targetName}, enemy lines or not — the pay reflects the risk.${questDistanceNote(q)}`;
  // 60 mirrors index.html's DEBT_REPAY_GOLD_COST literally — same no-modules convention as the
  // "3" literal in questTitle above (this file never loads enough of index.html's war/
  // reputation machinery to import the real constant).
  if(q.type === 'debt_repay') return `Carry the 60g you paid up front to ${q.targetName} in person — a real gesture ${q.targetKingdom} might actually notice.${questDistanceNote(q)}`;
  if(q.type === 'companion_defend') return `${q.giverName} begged you to help defend ${q.targetName} — win a Defend the Walls fight there while the siege still holds.`;
  return '';
}
// Rival Adventurer race — see index.html's generateNotableFigureOffer/checkRivalQuestExpiry.
function questRivalNote(q){
  if(!q.isRival) return '';
  const daysLeft = Math.max(0, q.rivalDeadlineDay - gameDay);
  return ` A rival party is after this too — claim it within ${daysLeft} day${daysLeft===1?'':'s'} or lose it.`;
}

function getQuests(){ try{ return JSON.parse(localStorage.getItem(QUEST_KEY)) || []; }catch(e){ return []; } }
function saveQuests(quests){ localStorage.setItem(QUEST_KEY, JSON.stringify(quests)); }
function getActiveQuests(){ return getQuests().filter(q => q.status === 'active'); }
function getCompletedQuests(){ try{ return JSON.parse(localStorage.getItem(COMPLETEDQUEST_KEY)) || []; }catch(e){ return []; } }

// Real consequences for quest refusal/abandonment — the Expansion Research idea of the same
// name. Abandoning used to just remove the quest with no other bookkeeping — a free reroll
// against the Board/Notable Figure's own seeded-offer cadence, and a companion's own personal
// favor could be walked away from and immediately re-offered at the Campfire (getCompanionQuestOffer
// only excludes an already-*active* quest, not an abandoned one) for zero cost. Scoped to
// abandonment specifically, since that's the one action with real persisted state to react to —
// there's no separate "decline" action anywhere that leaves a trace to penalize (not accepting a
// Notable Figure's offer, say, writes nothing at all). See context/quests.md.
//
// Reputation (board/notable_figure) and loyalty (companion) are duplicated here from index.html
// per the no-modules convention, same as questTitle/questDesc above — this page never loads the
// graph, so giverKingdom is stamped onto the quest object at accept time (index.html) rather than
// resolved here from a live burg lookup.
const REPUTATION_KEY = "goblinwar_reputation";
const RENOWN_TITLE_KEY = "goblinwar_renownTitle";
function reputationLabel(val){
  if(val > 50) return "Trusted";
  if(val > 10) return "Friendly";
  if(val >= -10) return "Neutral";
  if(val >= -50) return "Unfriendly";
  return "Hostile";
}
function updateRenownTitle(reputationMap){
  const trusted = Object.keys(reputationMap).filter(k => reputationLabel(reputationMap[k]) === 'Trusted');
  const best = trusted.reduce((top, k) => (!top || reputationMap[k] > reputationMap[top]) ? k : top, null);
  localStorage.setItem(RENOWN_TITLE_KEY, best ? `Hero of ${best}` : "");
}
function adjustReputation(kingdom, delta){
  if(!kingdom) return;
  let map;
  try{ map = JSON.parse(localStorage.getItem(REPUTATION_KEY)) || {}; }catch(e){ map = {}; }
  map[kingdom] = Math.max(-100, Math.min(100, (map[kingdom] || 0) + delta));
  localStorage.setItem(REPUTATION_KEY, JSON.stringify(map));
  updateRenownTitle(map);
}
const PARTY_KEY = "goblinwar_party";
const LOYALTY_KEY = "goblinwar_companionLoyalty";
function getParty(){ try{ return JSON.parse(localStorage.getItem(PARTY_KEY)) || []; }catch(e){ return []; } }
function adjustCompanionLoyalty(id, delta, name){
  if(!delta) return;
  const party = getParty();
  if(!party.includes(id)) return;
  let loyalty;
  try{ loyalty = JSON.parse(localStorage.getItem(LOYALTY_KEY)) || {}; }catch(e){ loyalty = {}; }
  const next = Math.max(0, Math.min(100, (loyalty[id] === undefined ? 50 : loyalty[id]) + delta));
  if(next <= 0){
    delete loyalty[id];
    localStorage.setItem(LOYALTY_KEY, JSON.stringify(loyalty));
    localStorage.setItem(PARTY_KEY, JSON.stringify(party.filter(x => x !== id)));
    showToast(`${name || id} lost all faith in you and left your service for good.`);
    return;
  }
  loyalty[id] = next;
  localStorage.setItem(LOYALTY_KEY, JSON.stringify(loyalty));
}
const QUEST_ABANDON_REP_PENALTY = -10;        // a Board job — minor, impersonal
const QUEST_ABANDON_REP_PENALTY_FIGURE = -18; // a Notable Figure's own promise — worse to break than a job posting
const QUEST_ABANDON_LOYALTY_PENALTY = -15;    // a companion's personal favor — the most personal of the three

function abandonQuest(id){
  const quests = getQuests();
  const q = quests.find(x => x.id === id);
  if(!q) return;
  showConfirm(`Abandon "${questTitle(q)}"? This cannot be undone.`, ()=>{
    saveQuests(quests.filter(x => x.id !== id));
    let note = '';
    if(q.source === 'companion'){
      adjustCompanionLoyalty(q.companionId, QUEST_ABANDON_LOYALTY_PENALTY, q.giverName);
      note = ` ${q.giverName} won't soon forget it.`;
    } else if(q.source === 'notable_figure'){
      adjustReputation(q.giverKingdom, QUEST_ABANDON_REP_PENALTY_FIGURE);
      if(q.giverKingdom) note = ` Word of it will reach ${q.giverKingdom}.`;
    } else if(q.source === 'board'){
      adjustReputation(q.giverKingdom, QUEST_ABANDON_REP_PENALTY);
      if(q.giverKingdom) note = ` Word of it will reach ${q.giverKingdom}.`;
    }
    showToast(`Quest abandoned.${note}`);
    render();
  });
}

function render(){
  const active = getActiveQuests();
  const completed = getCompletedQuests();

  document.getElementById('active-list').innerHTML = active.length ? active.map(q => `
    <div class="quest-card">
      <div class="quest-title">${questTitle(q)}</div>
      <div class="quest-desc">${questDesc(q)}</div>
      <div class="quest-row">
        <span class="quest-reward">${q.reward.gold}g &middot; ${q.reward.xp} XP</span>
      </div>
      <div class="quest-actions">
        ${q.targetBurgId ? `<button class="view-btn" data-view="${q.targetBurgId}">View Location</button>` : ''}
        <button class="abandon-btn" data-abandon="${q.id}">Abandon</button>
      </div>
    </div>
  `).join('') : `<div class="empty-note">No quests in progress. Visit a Quest Board or Notable Figure to take one on.</div>`;

  document.getElementById('completed-list').innerHTML = completed.length ? completed.map(q => `
    <div class="quest-card">
      <div class="quest-title">${questTitle(q)}</div>
      <div class="quest-desc">${questDesc(q)}</div>
      <div class="quest-row">
        <span class="quest-reward">${q.reward.gold}g &middot; ${q.reward.xp} XP</span>
        <span class="quest-completed-day">${dayLabel(q.completedDay)}</span>
      </div>
    </div>
  `).join('') : `<div class="empty-note">Nothing completed yet.</div>`;

  document.querySelectorAll('[data-abandon]').forEach(btn => {
    btn.addEventListener('click', ()=> abandonQuest(btn.dataset.abandon));
  });
  // Hands off to index.html's own viewLocation() via a query param — this page never loads
  // travel-graph.json itself (see context/quests.md), so it can't center the map here directly.
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      location.href = 'index.html?viewBurg=' + encodeURIComponent(btn.dataset.view) + '&_=' + Date.now();
    });
  });
}
render();
</script>
<script>
// Service worker registration — see sw.js for what it does and why (network-first, offline
// fallback only; never serves stale content while the network is actually reachable). The
// registration URL itself is cache-busted, same reasoning as every internal nav link (CLAUDE.md)
// — GitHub Pages' CDN (Cache-Control: max-age=600) could otherwise keep handing back a stale
// cached copy of sw.js itself for several minutes after a real update ships.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js?_=' + Date.now()).catch(()=>{}));
}
</script>
</body>
</html>
