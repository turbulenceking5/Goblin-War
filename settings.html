<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Settings</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; --bad:#e2857f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:16px; text-align:center; }
  .section-label{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:22px 0 10px; }

  .current-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; text-align:center; margin-bottom:6px;
  }
  .current-card b{ font-family:'Cinzel Decorative', serif; font-size:16px; color:var(--gold-lt); }
  .current-card div{ font-size:13px; color:#a9926a; margin-top:4px; }

  .btn{
    font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px;
    border:none; border-radius:8px; padding:10px 14px; cursor:pointer; flex:1;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; box-shadow:0 3px 0 #7a5715; }
  .btn-secondary{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }
  .btn-danger{
    background:transparent; color:var(--bad); border:1.5px solid var(--bad);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; border-radius:8px;
    padding:11px 14px; width:100%; cursor:pointer; margin-top:8px;
  }
  .btn-danger:active{ transform:scale(.98); }
  .account-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; margin-bottom:6px;
  }
  .account-row{ display:flex; flex-direction:column; gap:8px; }
  .account-btn-row{ display:flex; gap:10px; margin-top:2px; }
  .account-status{ font-size:13.5px; color:#a9926a; margin-bottom:10px; }
  .account-status b{ color:var(--gold-lt); }
  .account-synced{ font-size:11.5px; color:#a9926a; text-align:center; margin-top:8px; }
  .menu-item{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px 16px; margin-bottom:6px; cursor:pointer;
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:.5px; color:var(--parchment);
  }
  .menu-item:active{ transform:scale(.98); }
  .menu-item .chevron{ color:var(--gold-lt); font-size:17px; }
  #toast{
    position:fixed; top:66px; left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
  <header>
    <h1>SETTINGS</h1>
    <button id="back-btn" onclick="location.href='index.html?_='+Date.now()">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Game Options</div>

    <div class="current-card">
      <b id="current-name">—</b>
      <div id="current-location">—</div>
      <div id="current-date">—</div>
    </div>

    <div class="section-label">Account</div>
    <div class="account-card" id="account-card">
      <div class="account-status" id="account-status">Checking login status…</div>
      <div class="account-row" id="logged-in-actions" style="display:none;">
        <div class="account-btn-row">
          <button class="btn btn-secondary" id="switch-character-btn">Switch Character</button>
          <button class="btn btn-primary" id="save-now-btn">Save Now</button>
        </div>
        <button class="btn-danger" id="logout-btn">Log Out</button>
        <div class="account-synced" id="cloud-synced"></div>
      </div>
    </div>

    <div class="menu-item" onclick="location.href='changelog.html?_='+Date.now()">
      <span>Change Log</span>
      <span class="chevron">&rsaquo;</span>
    </div>

    <button class="btn-danger" id="delete-character-btn">Delete This Character</button>
  </main>

  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const NAME_KEY = "goblinwar_characterName";
const LOC_KEY = "goblinwar_currentBurg";
const CAL_KEY = "goblinwar_gameDay";
const HEADING_KEY = "goblinwar_heading";
const HEALTH_KEY = "goblinwar_health";
const MAXHEALTH_KEY = "goblinwar_maxHealth";
const STAMINA_KEY = "goblinwar_stamina";
const MAXSTAMINA_KEY = "goblinwar_maxStamina";
const AGE_KEY = "goblinwar_age";
const GOLD_KEY = "goblinwar_gold";
const INV_KEY = "goblinwar_inventory";
const EQUIPPED_KEY = "goblinwar_equipped";
const TERRITORY_KEY = "goblinwar_territoryControl";
const RELATIONS_KEY = "goblinwar_relations";
const REINFORCE_KEY = "goblinwar_reinforcements";
const LASTWARTICK_KEY = "goblinwar_lastWarTick";
const POPULATION_KEY = "goblinwar_population";
const SIEGE_KEY = "goblinwar_sieges";
const REFUGEE_ARRIVAL_KEY = "goblinwar_refugeeArrivals";
const SIEGE_DEFENSE_COOLDOWN_KEY = "goblinwar_siegeDefenseCooldowns";
const LEVEL_KEY = "goblinwar_level";
const XP_KEY = "goblinwar_xp";
const SKILLPOINTS_KEY = "goblinwar_skillPoints";
const STATS_KEY = "goblinwar_stats";
const SKILLS_KEY = "goblinwar_skills";
const QUEST_KEY = "goblinwar_quests";
const DEFAULT_INVENTORY = [
  { name:"Food", qty:10, weight:1, value:2 },
  { name:"Waterskin", qty:1, weight:2, value:3 },
  { name:"Bedroll", qty:1, weight:3, value:5 },
];
const ACTIVE_CHAR_KEY = "goblinwar_activeCharacterId";
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;

let burgNames = {}; // id -> name, for display only

function dateStr(dayCount){
  const day = (dayCount % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(dayCount / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(dayCount / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  return `Day ${day}, Month ${month}, Year ${year}`;
}

function locationName(burgId){
  return burgNames[burgId] || `Location #${burgId}`;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function renderCurrent(){
  const burgId = localStorage.getItem(LOC_KEY) || "5";
  const day = parseInt(localStorage.getItem(CAL_KEY) || "0", 10);
  const hp = localStorage.getItem(HEALTH_KEY) || "100";
  const maxHp = localStorage.getItem(MAXHEALTH_KEY) || "100";
  const stamina = localStorage.getItem(STAMINA_KEY) || "100";
  const maxStamina = localStorage.getItem(MAXSTAMINA_KEY) || "100";
  const gold = localStorage.getItem(GOLD_KEY) || "50";
  document.getElementById('current-name').textContent = localStorage.getItem(NAME_KEY) || "Unnamed Hero";
  document.getElementById('current-location').textContent = locationName(burgId);
  document.getElementById('current-date').textContent = `${dateStr(day)} · ${hp}/${maxHp} HP · ${stamina}/${maxStamina} STA · ${gold}g`;
}

// Same snapshot shape index.html's collectCharacterSnapshot() and characters.html's
// freshCharacterData()/applyCharacterData() use (duplicated per the no-modules convention,
// see CLAUDE.md) — this is the whole character, not just the old three-field summary the
// local save slots used, since it's now the only thing standing between "still playing" and
// "gone": there's exactly one save per character (see context/characters.md), no slots.
function collectCharacterSnapshot(){
  return {
    name: localStorage.getItem(NAME_KEY) || "Unnamed Hero",
    burgId: localStorage.getItem(LOC_KEY) || "5",
    day: parseInt(localStorage.getItem(CAL_KEY) || "0", 10),
    heading: parseFloat(localStorage.getItem(HEADING_KEY) || "0"),
    health: parseInt(localStorage.getItem(HEALTH_KEY) || "100", 10),
    maxHealth: parseInt(localStorage.getItem(MAXHEALTH_KEY) || "100", 10),
    stamina: parseInt(localStorage.getItem(STAMINA_KEY) || "100", 10),
    maxStamina: parseInt(localStorage.getItem(MAXSTAMINA_KEY) || "100", 10),
    age: localStorage.getItem(AGE_KEY) || "24",
    gold: parseInt(localStorage.getItem(GOLD_KEY) || "50", 10),
    inventory: localStorage.getItem(INV_KEY) || JSON.stringify(DEFAULT_INVENTORY),
    equipped: localStorage.getItem(EQUIPPED_KEY) || "{}",
    level: parseInt(localStorage.getItem(LEVEL_KEY) || "1", 10),
    xp: parseInt(localStorage.getItem(XP_KEY) || "0", 10),
    skillPoints: parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10),
    stats: localStorage.getItem(STATS_KEY) || JSON.stringify({str:0,agi:0,int:0}),
    skills: localStorage.getItem(SKILLS_KEY) || "{}",
    quests: localStorage.getItem(QUEST_KEY) || "[]",
    territoryControl: localStorage.getItem(TERRITORY_KEY) || "{}",
    relations: localStorage.getItem(RELATIONS_KEY) || "{}",
    reinforcements: localStorage.getItem(REINFORCE_KEY) || "{}",
    lastWarTick: parseInt(localStorage.getItem(LASTWARTICK_KEY) || "0", 10),
    population: localStorage.getItem(POPULATION_KEY) || "{}",
    sieges: localStorage.getItem(SIEGE_KEY) || "{}",
    refugeeArrivals: localStorage.getItem(REFUGEE_ARRIVAL_KEY) || "{}",
    siegeDefenseCooldowns: localStorage.getItem(SIEGE_DEFENSE_COOLDOWN_KEY) || "{}",
    savedAt: new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
  };
}

// ===================== ACCOUNT (Supabase) =====================
// `sb` and `authGateReady` come from assets/auth-client.js (loaded above), which is also
// what enforces that this page requires a login AND an active character — see
// context/accounts.md and context/characters.md.
const accountStatusEl = document.getElementById('account-status');
const loggedInActionsEl = document.getElementById('logged-in-actions');
const cloudSyncedEl = document.getElementById('cloud-synced');
let activeCharId = null;

authGateReady.then(session=>{
  if(!session) return; // already being redirected
  activeCharId = localStorage.getItem(ACTIVE_CHAR_KEY);
  accountStatusEl.innerHTML = `Logged in as <b>${session.user.email}</b>`;
  loggedInActionsEl.style.display = 'flex';

  sb.from('characters').select('updated_at').eq('id', activeCharId).maybeSingle().then(({ data: row })=>{
    if(row) cloudSyncedEl.textContent = `Last saved ${new Date(row.updated_at).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}`;
  });

  document.getElementById('save-now-btn').addEventListener('click', async ()=>{
    const snapshot = collectCharacterSnapshot();
    const { error } = await sb.from('characters')
      .update({ data: snapshot, updated_at: new Date().toISOString() })
      .eq('id', activeCharId);
    if(error){ showToast(`Save failed: ${error.message}`); return; }
    cloudSyncedEl.textContent = `Last saved ${snapshot.savedAt}`;
    showToast('Saved.');
  });
});

document.getElementById('switch-character-btn').addEventListener('click', ()=>{
  location.href = 'characters.html?_=' + Date.now();
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  accountStatusEl.textContent = 'Logging out…';
  await sb.auth.signOut(); // assets/auth-client.js's SIGNED_OUT listener redirects to login.html
});

document.getElementById('delete-character-btn').addEventListener('click', async ()=>{
  const name = localStorage.getItem(NAME_KEY) || "this character";
  if(!confirm(`Delete ${name}? This cannot be undone.`)) return;
  const { error } = await sb.from('characters').delete().eq('id', activeCharId);
  if(error){ showToast(`Delete failed: ${error.message}`); return; }
  localStorage.removeItem(ACTIVE_CHAR_KEY);
  location.href = 'characters.html?_=' + Date.now();
});

fetch('assets/travel-graph.json').then(r=>r.json()).then(data=>{
  Object.entries(data.burgs).forEach(([id,b])=> burgNames[id] = b.name);
  renderCurrent();
}).catch(()=>{
  // still usable without name resolution — fall back to raw ids
  renderCurrent();
});
</script>
</body>
</html>
