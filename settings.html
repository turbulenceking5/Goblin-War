<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Settings</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; --bad:#e2857f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:16px; text-align:center; }
  .section-label{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:22px 0 10px; }

  .current-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; text-align:center; margin-bottom:6px;
  }
  .current-card b{ font-family:'Cinzel Decorative', serif; font-size:16px; color:var(--gold-lt); }
  .current-card div{ font-size:13px; color:#a9926a; margin-top:4px; }

  .slot{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .slot-title{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#a9926a; margin-bottom:4px; }
  .slot-summary{ font-size:14.5px; color:var(--parchment); margin-bottom:12px; min-height:20px; }
  .slot-empty{ font-style:italic; color:#a9926a; }
  .slot-actions{ display:flex; gap:10px; }
  .btn{
    font-family:'Cinzel', serif; font-size:12.5px; letter-spacing:.5px;
    border:none; border-radius:8px; padding:10px 14px; cursor:pointer; flex:1;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-lt), var(--gold)); color:#241705; font-weight:700; box-shadow:0 3px 0 #7a5715; }
  .btn-secondary{ background:transparent; color:var(--parchment); border:1.5px solid rgba(209,164,69,.4); }
  .btn-secondary:disabled{ opacity:.4; }
  .btn-danger{
    background:transparent; color:var(--bad); border:1.5px solid var(--bad);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:.5px; border-radius:8px;
    padding:11px 14px; width:100%; cursor:pointer; margin-top:8px;
  }
  .btn-danger:active{ transform:scale(.98); }
  .account-card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:14px; margin-bottom:6px;
  }
  .account-row{ display:flex; flex-direction:column; gap:8px; }
  .account-btn-row{ display:flex; gap:10px; margin-top:2px; }
  .account-status{ font-size:13.5px; color:#a9926a; margin-bottom:10px; }
  .account-status b{ color:var(--gold-lt); }
  .account-synced{ font-size:11.5px; color:#a9926a; text-align:center; margin-top:8px; }
  .changelog-entry{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .changelog-date{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin-bottom:6px; }
  .changelog-entry ul{ margin:0; padding-left:18px; }
  .changelog-entry li{ font-size:14.5px; color:var(--parchment); margin-bottom:4px; line-height:1.4; }
  #toast{
    position:fixed; top:66px; left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
  <header>
    <h1>SETTINGS</h1>
    <button id="back-btn" onclick="location.href='index.html'">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Game Options</div>

    <div class="current-card">
      <b id="current-location">—</b>
      <div id="current-date">—</div>
    </div>

    <div class="section-label">Account &amp; Cloud Save</div>
    <div class="account-card" id="account-card">
      <div class="account-status" id="account-status">Checking login status…</div>
      <div class="account-row" id="logged-in-actions" style="display:none;">
        <div class="account-btn-row">
          <button class="btn btn-secondary" id="cloud-load-btn">Load from Cloud</button>
          <button class="btn btn-primary" id="cloud-save-btn">Save to Cloud</button>
        </div>
        <button class="btn-danger" id="logout-btn">Log Out</button>
        <div class="account-synced" id="cloud-synced"></div>
      </div>
    </div>

    <div class="section-label">Save Slots</div>
    <div id="slots"></div>

    <div class="section-label">Change Log</div>
    <div id="changelog-list"></div>

    <button class="btn-danger" id="new-game-btn">Start New Game (reset progress)</button>
  </main>

  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const LOC_KEY = "goblinwar_currentBurg";
const CAL_KEY = "goblinwar_gameDay";
const HEADING_KEY = "goblinwar_heading";
const HEALTH_KEY = "goblinwar_health";
const MAXHEALTH_KEY = "goblinwar_maxHealth";
const STAMINA_KEY = "goblinwar_stamina";
const MAXSTAMINA_KEY = "goblinwar_maxStamina";
const AGE_KEY = "goblinwar_age";
const GOLD_KEY = "goblinwar_gold";
const INV_KEY = "goblinwar_inventory";
const EQUIPPED_KEY = "goblinwar_equipped";
const DEFAULT_INVENTORY = [
  { name:"Food", qty:10, weight:1, value:2 },
  { name:"Waterskin", qty:1, weight:2, value:3 },
  { name:"Bedroll", qty:1, weight:3, value:5 },
];
const SLOT_KEYS = ["goblinwar_slot_1","goblinwar_slot_2","goblinwar_slot_3"];
const DAYS_PER_MONTH = 30, MONTHS_PER_YEAR = 12;

// Kept identical to the CHANGELOG array in index.html (see CLAUDE.md's no-modules
// convention) — update both whenever a change ships, or this page and the "What's New"
// popup on the map will disagree.
// Namespaced per logged-in account — see the matching comment in index.html — set once
// authGateReady resolves, below.
let CHANGELOG_SEEN_KEY = null;
const CHANGELOG = [
  { id:1, date:"2026-09-03", changes:[
    "Added a Change Log to Settings, and a \"What's New\" popup — it now greets you on the map after any update you haven't seen yet."
  ]},
  { id:2, date:"2026-09-03", changes:[
    "Switched the whole game to a dark theme.",
    "Added an \"Update available\" banner that drops down from the top of the map when a new version has shipped — tap it to refresh."
  ]},
  { id:3, date:"2026-09-03", changes:[
    "Goblin and Ork raiders now show real portrait art in combat instead of a hand-drawn icon.",
    "Goblin raiding parties now come in four distinct varieties — Raider, Shieldbearer, Skirmisher, and Archer — each with its own toughness and bite, not just a reskinned fight."
  ]},
  { id:4, date:"2026-09-03", changes:[
    "Bandits now show real portrait art too — every enemy in the game has a proper look.",
    "Ork raiding parties now come in three varieties — Raider, Berserker, and Warlord — with the Warlord as the toughest fight in the game."
  ]},
  { id:5, date:"2026-09-04", changes:[
    "Added accounts and cloud saves — log in from Settings to back up your character and load it on another device."
  ]},
  { id:6, date:"2026-09-04", changes:[
    "An account is now required to play — log in or sign up on the new login screen before entering the realm."
  ]},
];

let burgNames = {}; // id -> name, for display only

function dateStr(dayCount){
  const day = (dayCount % DAYS_PER_MONTH) + 1;
  const month = (Math.floor(dayCount / DAYS_PER_MONTH) % MONTHS_PER_YEAR) + 1;
  const year = Math.floor(dayCount / (DAYS_PER_MONTH*MONTHS_PER_YEAR)) + 1;
  return `Day ${day}, Month ${month}, Year ${year}`;
}

function locationName(burgId){
  return burgNames[burgId] || `Location #${burgId}`;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function renderCurrent(){
  const burgId = localStorage.getItem(LOC_KEY) || "5";
  const day = parseInt(localStorage.getItem(CAL_KEY) || "0", 10);
  const hp = localStorage.getItem(HEALTH_KEY) || "100";
  const maxHp = localStorage.getItem(MAXHEALTH_KEY) || "100";
  const stamina = localStorage.getItem(STAMINA_KEY) || "100";
  const maxStamina = localStorage.getItem(MAXSTAMINA_KEY) || "100";
  const gold = localStorage.getItem(GOLD_KEY) || "50";
  document.getElementById('current-location').textContent = locationName(burgId);
  document.getElementById('current-date').textContent = `${dateStr(day)} · ${hp}/${maxHp} HP · ${stamina}/${maxStamina} STA · ${gold}g`;
}

function renderSlots(){
  const container = document.getElementById('slots');
  container.innerHTML = '';
  SLOT_KEYS.forEach((key, i)=>{
    const raw = localStorage.getItem(key);
    const slotEl = document.createElement('div');
    slotEl.className = 'slot';
    let summaryHTML, loadDisabled;
    if(raw){
      const data = JSON.parse(raw);
      const stamina = (data.stamina!==undefined) ? ` &middot; ${data.stamina}/${data.maxStamina||100} STA` : '';
      const hpGold = (data.health!==undefined) ? ` &middot; ${data.health}/${data.maxHealth||100} HP${stamina} &middot; ${data.gold||0}g` : '';
      summaryHTML = `${locationName(data.burgId)} — ${dateStr(data.day)}${hpGold}<br><span style="font-size:11.5px; color:#a9926a;">Saved ${data.savedAt}</span>`;
      loadDisabled = '';
    } else {
      summaryHTML = `<span class="slot-empty">Empty</span>`;
      loadDisabled = 'disabled';
    }
    slotEl.innerHTML = `
      <div class="slot-title">Slot ${i+1}</div>
      <div class="slot-summary">${summaryHTML}</div>
      <div class="slot-actions">
        <button class="btn btn-secondary" data-load="${i}" ${loadDisabled}>Load</button>
        <button class="btn btn-primary" data-save="${i}">Save Here</button>
      </div>
    `;
    container.appendChild(slotEl);
  });

  container.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.save, 10);
      localStorage.setItem(SLOT_KEYS[i], JSON.stringify(collectLiveState()));
      showToast(`Saved to Slot ${i+1}.`);
      renderSlots();
    });
  });
  container.querySelectorAll('[data-load]').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.load, 10);
      const data = JSON.parse(localStorage.getItem(SLOT_KEYS[i]));
      if(!confirm(`Load Slot ${i+1}? Your current unsaved progress will be overwritten.`)) return;
      applyLoadedState(data);
      location.href = 'index.html';
    });
  });
}

// Shared by save slots and cloud save — the full snapshot of live state.
function collectLiveState(){
  return {
    burgId: localStorage.getItem(LOC_KEY) || "5",
    day: parseInt(localStorage.getItem(CAL_KEY) || "0", 10),
    heading: parseFloat(localStorage.getItem(HEADING_KEY) || "0"),
    health: parseInt(localStorage.getItem(HEALTH_KEY) || "100", 10),
    maxHealth: parseInt(localStorage.getItem(MAXHEALTH_KEY) || "100", 10),
    stamina: parseInt(localStorage.getItem(STAMINA_KEY) || "100", 10),
    maxStamina: parseInt(localStorage.getItem(MAXSTAMINA_KEY) || "100", 10),
    age: localStorage.getItem(AGE_KEY) || "24",
    gold: parseInt(localStorage.getItem(GOLD_KEY) || "50", 10),
    inventory: localStorage.getItem(INV_KEY) || JSON.stringify(DEFAULT_INVENTORY),
    equipped: localStorage.getItem(EQUIPPED_KEY) || "{}",
    savedAt: new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
  };
}

// Shared by save slots and cloud load — writes a saved snapshot back onto the live keys.
// Each field guarded with `if(defined)`, same reasoning as save-system.md: a snapshot from
// an older version of the game may be missing fields that didn't exist yet.
function applyLoadedState(data){
  localStorage.setItem(LOC_KEY, data.burgId);
  localStorage.setItem(CAL_KEY, String(data.day));
  localStorage.setItem(HEADING_KEY, String(data.heading));
  if(data.health!==undefined) localStorage.setItem(HEALTH_KEY, String(data.health));
  if(data.maxHealth!==undefined) localStorage.setItem(MAXHEALTH_KEY, String(data.maxHealth));
  if(data.stamina!==undefined) localStorage.setItem(STAMINA_KEY, String(data.stamina));
  if(data.maxStamina!==undefined) localStorage.setItem(MAXSTAMINA_KEY, String(data.maxStamina));
  if(data.age!==undefined) localStorage.setItem(AGE_KEY, String(data.age));
  if(data.gold!==undefined) localStorage.setItem(GOLD_KEY, String(data.gold));
  if(data.inventory) localStorage.setItem(INV_KEY, data.inventory);
  if(data.equipped) localStorage.setItem(EQUIPPED_KEY, data.equipped);
}

// ===================== ACCOUNT / CLOUD SAVE (Supabase) =====================
// One cloud save per account, stored in the `saves` table (see supabase/schema.sql) as a
// row keyed by user id — a separate thing from the three local save slots above, which
// stay device-only. Session persistence (staying logged in across reloads) is handled
// automatically by the Supabase client via its own localStorage key. `sb` and
// `authGateReady` come from assets/auth-client.js (loaded above), which is also what
// enforces that this page requires a login in the first place — see context/accounts.md.
const accountStatusEl = document.getElementById('account-status');
const loggedInActionsEl = document.getElementById('logged-in-actions');
const cloudSyncedEl = document.getElementById('cloud-synced');

// This page requires a login (see assets/auth-gate-sync.js / assets/auth-client.js), so the
// only states worth rendering here are "still confirming" and "confirmed" — there's no
// logged-out form to show, unlike a page a visitor can reach without an account.
authGateReady.then(session=>{
  if(!session) return; // already being redirected to login.html
  accountStatusEl.innerHTML = `Logged in as <b>${session.user.email}</b>`;
  loggedInActionsEl.style.display = 'flex';

  sb.from('saves').select('saved_at').eq('user_id', session.user.id).maybeSingle().then(({ data: row })=>{
    if(row) cloudSyncedEl.textContent = `Last saved to cloud ${new Date(row.saved_at).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}`;
  });

  document.getElementById('cloud-save-btn').addEventListener('click', async ()=>{
    const state = collectLiveState();
    const { error } = await sb.from('saves').upsert({
      user_id: session.user.id,
      data: state,
      saved_at: new Date().toISOString()
    });
    if(error){ showToast(`Cloud save failed: ${error.message}`); return; }
    cloudSyncedEl.textContent = `Saved to cloud ${state.savedAt}`;
    showToast('Saved to cloud.');
  });

  document.getElementById('cloud-load-btn').addEventListener('click', async ()=>{
    const { data: row, error } = await sb.from('saves').select('data, saved_at').eq('user_id', session.user.id).maybeSingle();
    if(error){ showToast(`Cloud load failed: ${error.message}`); return; }
    if(!row){ showToast('No cloud save found yet.'); return; }
    if(!confirm('Load your cloud save? Your current unsaved progress will be overwritten.')) return;
    applyLoadedState(row.data);
    location.href = 'index.html';
  });
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  accountStatusEl.textContent = 'Logging out…';
  await sb.auth.signOut(); // assets/auth-client.js's SIGNED_OUT listener redirects to login.html
});

document.getElementById('new-game-btn').addEventListener('click', ()=>{
  if(!confirm("Start a new game? Your current unsaved progress (not in a save slot) will be lost.")) return;
  localStorage.setItem(LOC_KEY, "5");
  localStorage.setItem(CAL_KEY, "0");
  localStorage.setItem(HEADING_KEY, "0");
  localStorage.setItem(MAXHEALTH_KEY, "100");
  localStorage.setItem(HEALTH_KEY, "100");
  localStorage.setItem(MAXSTAMINA_KEY, "100");
  localStorage.setItem(STAMINA_KEY, "100");
  localStorage.setItem(AGE_KEY, "24");
  localStorage.setItem(GOLD_KEY, "50");
  localStorage.setItem(INV_KEY, JSON.stringify(DEFAULT_INVENTORY));
  localStorage.setItem(EQUIPPED_KEY, "{}");
  location.href = 'index.html';
});

function renderChangelog(){
  const container = document.getElementById('changelog-list');
  const newestFirst = CHANGELOG.slice().reverse();
  container.innerHTML = newestFirst.map(entry => `
    <div class="changelog-entry">
      <div class="changelog-date">${entry.date}</div>
      <ul>${entry.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
  `).join('');
  // Reading the full log here counts as "seen" — no need for the map's popup to repeat it.
  if(CHANGELOG_SEEN_KEY) localStorage.setItem(CHANGELOG_SEEN_KEY, String(CHANGELOG[CHANGELOG.length-1].id));
}
renderChangelog();
authGateReady.then(session=>{
  if(!session) return; // being redirected to login.html
  CHANGELOG_SEEN_KEY = `goblinwar_lastSeenChangelog_${session.user.id}`;
  renderChangelog(); // re-run now that CHANGELOG_SEEN_KEY is set, so the "mark seen" write happens
});

fetch('assets/travel-graph.json').then(r=>r.json()).then(data=>{
  Object.entries(data.burgs).forEach(([id,b])=> burgNames[id] = b.name);
  renderCurrent();
  renderSlots();
}).catch(()=>{
  // still usable without name resolution — fall back to raw ids
  renderCurrent();
  renderSlots();
});
</script>
</body>
</html>
