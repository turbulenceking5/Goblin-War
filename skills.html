<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/supabase-config.js"></script>
<script src="assets/auth-gate-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goblin War">
<meta name="theme-color" content="#1c2a2c">
<title>Goblin War — Skills</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1d10; --gold:#a97a1f; --gold-lt:#d1a445; --water-dk:#22323a; --parchment:#e9dcb8; --parchment-shadow:#b9a06e; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; min-height:100%; background:#1c150c; font-family:'EB Garamond', serif; color:var(--parchment); }
  header{
    background:linear-gradient(180deg, var(--ink) 0%, #1b1208 100%);
    border-bottom:3px solid var(--gold);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.5); position:sticky; top:0; z-index:10;
  }
  h1{ font-family:'Cinzel Decorative', serif; font-size:18px; letter-spacing:1px; color:var(--gold-lt); margin:0; text-shadow:0 2px 3px rgba(0,0,0,.6); }
  #back-btn{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.5px;
    background:transparent; color:var(--gold-lt); border:1.5px solid var(--gold);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #back-btn:active{ transform:scale(.96); }
  main{ padding:22px 20px 60px; max-width:520px; margin:0 auto; }
  .subtitle{ font-family:'Cinzel', serif; font-size:11px; letter-spacing:2px; color:#a9926a; text-transform:uppercase; margin-bottom:18px; text-align:center; }

  .card{
    background:rgba(255,255,255,.06); border:1.5px solid rgba(209,164,69,.35); border-radius:12px;
    padding:18px; margin-bottom:16px;
  }
  .hero-row{ display:flex; align-items:center; gap:14px; }
  .level-badge{
    flex:none; width:54px; text-align:center; border:2px solid var(--gold); border-radius:10px;
    padding:6px 4px; background:rgba(255,255,255,.08);
  }
  .level-num{ font-family:'Cinzel Decorative', serif; font-size:22px; color:var(--parchment); line-height:1; }
  .level-label{ font-family:'Cinzel', serif; font-size:8px; letter-spacing:1px; text-transform:uppercase; color:#a9926a; margin-top:2px; }
  .level-caption{ font-family:'Cinzel Decorative', serif; font-size:16px; color:var(--parchment); }
  .xp-track{ background:rgba(0,0,0,.3); border-radius:8px; height:8px; overflow:hidden; border:1px solid rgba(209,164,69,.35); margin-top:12px; }
  .xp-fill{ height:100%; background:linear-gradient(90deg,#8a6a1f,var(--gold-lt)); }
  .xp-label{ font-size:10px; color:#a9926a; margin-top:4px; text-align:center; }

  .stat-label{ font-family:'Cinzel', serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#a9926a; margin:16px 0 6px; }
  .stat-label:first-child{ margin-top:0; }

  .stats-box{ background:rgba(255,255,255,.05); border:1.5px solid rgba(209,164,69,.35); border-radius:10px; padding:4px 14px; }
  .stat-line{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13.5px; border-bottom:1px solid rgba(255,255,255,.08); }
  .stat-line:last-child{ border-bottom:none; }
  .stat-line span:first-child{ color:var(--parchment); }
  .stat-value-row{ display:flex; align-items:center; gap:8px; }
  .stat-value-row span{ color:#a9926a; font-weight:600; min-width:14px; text-align:right; }
  .stat-plus-btn{
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--gold); background:rgba(209,164,69,.2);
    color:var(--gold-lt); font-family:'Cinzel', serif; font-weight:700; font-size:14px; line-height:1; cursor:pointer;
  }
  .stat-plus-btn:active{ transform:scale(.94); }
  .stat-plus-btn:disabled{ opacity:.3; border-color:rgba(209,164,69,.35); color:#a9926a; cursor:not-allowed; }
  .stats-note{ font-size:10.5px; color:#a9926a; text-align:center; margin-top:8px; font-style:italic; }
  .stats-note b{ color:var(--gold-lt); font-style:normal; }

  .perk-unlock-btn{
    flex:none; font-family:'Cinzel', serif; font-size:11px; padding:8px 12px; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--gold); background:rgba(209,164,69,.2); color:var(--gold-lt); font-weight:700;
  }
  .perk-unlock-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .perk-unlocked-badge{ flex:none; font-family:'Cinzel', serif; font-size:11px; color:#7fbf6a; font-weight:700; }

  /* Skill tree — Perks and Special Attacks rendered as one branching tree per stat, Cyberpunk-
     style, rather than two flat lists. See "Skill tree" comment near renderBranch() in the
     script below for how PERKS/MOVES map onto tiers/nodes. */
  .tree-branch{ margin-bottom:20px; }
  .tree-branch:last-child{ margin-bottom:0; }
  .tree-branch-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .tree-branch-name{ font-family:'Cinzel Decorative', serif; font-size:14px; color:var(--gold-lt); }
  .tree-branch-value{ font-family:'Cinzel', serif; font-size:11px; color:#a9926a; letter-spacing:.5px; }
  .tree-branch-value b{ color:var(--parchment); font-size:13px; }
  .tree-row{ display:flex; align-items:center; gap:0; overflow-x:auto; padding:2px 2px 6px; }
  .tree-tier{ display:flex; flex-direction:column; gap:8px; justify-content:center; flex:none; }
  .tree-link{ flex:none; width:14px; height:2px; align-self:center; background:rgba(209,164,69,.35); }
  .tree-node{
    flex:none; width:70px; min-height:58px; border-radius:10px; border:1.5px dashed rgba(209,164,69,.35);
    background:rgba(255,255,255,.04); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 4px; cursor:pointer; text-align:center; transition:border-color .15s, background .15s;
  }
  .tree-node .node-icon{ font-size:13px; color:#a9926a; }
  .tree-node .node-name{ font-family:'Cinzel', serif; font-size:8.5px; line-height:1.25; color:#a9926a; }
  .tree-node.ready{ border-style:solid; border-color:var(--gold); background:rgba(209,164,69,.12); }
  .tree-node.ready .node-name, .tree-node.ready .node-icon{ color:var(--parchment); }
  .tree-node.unlocked{ border-style:solid; border-color:#7fbf6a; background:rgba(127,191,106,.15); }
  .tree-node.unlocked .node-name{ color:var(--parchment); }
  .tree-node.unlocked .node-icon{ color:#7fbf6a; }
  .tree-node.selected{ box-shadow:0 0 0 2px var(--gold-lt); }

  .node-detail{
    margin-top:6px; background:rgba(255,255,255,.05); border:1.5px solid rgba(209,164,69,.35); border-radius:10px;
    padding:12px; display:none;
  }
  .node-detail.show{ display:block; }
  .node-detail-name{ font-family:'Cinzel', serif; font-size:13px; color:var(--parchment); font-weight:700; }
  .node-detail-name span{ font-size:10px; color:#a9926a; font-weight:400; margin-left:4px; }
  .node-detail-desc{ font-size:12px; color:#a9926a; margin-top:4px; line-height:1.5; }
  .node-detail-req{ font-size:10.5px; color:#a9926a; margin-top:6px; font-style:italic; }
  .node-detail-action{ margin-top:10px; }

  #toast{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-14px);
    background:rgba(20,14,6,.94); color:var(--parchment);
    font-family:'Cinzel', serif; font-size:12px; letter-spacing:1px;
    padding:9px 16px; border-radius:6px; border:1px solid var(--gold);
    opacity:0; pointer-events:none; z-index:40; transition:opacity .25s, transform .25s;
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
  <header>
    <h1>SKILLS</h1>
    <button id="back-btn" onclick="location.href='index.html?_='+Date.now()">&larr; Back to Map</button>
  </header>
  <main>
    <div class="subtitle">Skills &amp; Progression</div>

    <div class="card">
      <div class="hero-row">
        <div class="level-badge">
          <div class="level-num" id="level-num">1</div>
          <div class="level-label">Level</div>
        </div>
        <div class="level-caption">Level &amp; Experience</div>
      </div>
      <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      <div class="xp-label" id="xp-label">XP: 0 / 40</div>
    </div>

    <div class="card">
      <div class="stat-label">Character Stats</div>
      <div class="stats-box" id="stats-box">
        <div class="stat-line" data-stat="str">
          <span>Strength</span>
          <div class="stat-value-row"><span id="stat-str">0</span><button class="stat-plus-btn" data-stat="str">+</button></div>
        </div>
        <div class="stat-line" data-stat="agi">
          <span>Agility</span>
          <div class="stat-value-row"><span id="stat-agi">0</span><button class="stat-plus-btn" data-stat="agi">+</button></div>
        </div>
        <div class="stat-line" data-stat="int">
          <span>Intelligence</span>
          <div class="stat-value-row"><span id="stat-int">0</span><button class="stat-plus-btn" data-stat="int">+</button></div>
        </div>
      </div>
      <div class="stats-note">Skill points available: <b id="skill-points-value">0</b></div>
    </div>

    <div class="card">
      <div class="stat-label">Skill Tree</div>
      <div id="skill-tree"></div>
      <div class="node-detail" id="node-detail"></div>
      <div class="stats-note">Tap a node for details. ✦ passive perks, ⚔ special attacks — each costs 1 skill point once its stat requirement is met.</div>
    </div>
  </main>
  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/auth-client.js"></script>
<script>
const LEVEL_KEY = "goblinwar_level";
const XP_KEY = "goblinwar_xp";
const SKILLPOINTS_KEY = "goblinwar_skillPoints";
const STATS_KEY = "goblinwar_stats";
const SKILLS_KEY = "goblinwar_skills";
const STAT_LABELS = { str:"Strength", agi:"Agility", int:"Intelligence" };
// Mirrors index.html's PERKS exactly (duplicated per the no-modules convention) — the actual
// mechanical effects live there (getEquipDamageBonus, getCarryCapacity, combatAttack, etc.);
// this copy only drives the unlock UI.
const PERKS = [
  { id:"power_strike",  name:"Power Strike",  stat:"str", req:2, desc:"+2 flat damage on attack." },
  { id:"iron_skin",     name:"Iron Skin",     stat:"str", req:2, desc:"-1 flat damage taken." },
  { id:"pack_mule",     name:"Pack Mule",     stat:"str", req:4, desc:"+10 carry capacity." },
  { id:"evasion",       name:"Evasion",       stat:"agi", req:2, desc:"15% chance to fully dodge an enemy's counter-attack." },
  { id:"second_wind",   name:"Second Wind",   stat:"agi", req:2, desc:"25% chance an attack costs no stamina." },
  { id:"sure_feet",     name:"Sure Feet",     stat:"agi", req:4, desc:"-10% ambush chance while traveling or camping." },
  { id:"silver_tongue", name:"Silver Tongue", stat:"int", req:2, desc:"-10% Marketplace buy prices." },
  { id:"scavenger",     name:"Scavenger",     stat:"int", req:2, desc:"+20% gold from combat victories." },
  { id:"field_rations", name:"Field Rations", stat:"int", req:4, desc:"-10% Hunger/Thirst lost while traveling or waiting." },
];
// Mirrors index.html's MOVES exactly (duplicated per the no-modules convention) — the actual
// combat effects live there (combatSpecial); this copy only drives the unlock UI. Shares the
// same goblinwar_skills storage and skill-point cost as PERKS above (ids don't collide).
const MOVES = [
  { id:"crushing_blow",   name:"Crushing Blow",   stat:"str", req:2, desc:"2x damage, single hit. Costs 35 stamina, once per fight." },
  { id:"reckless_swing",  name:"Reckless Swing",  stat:"str", req:4, desc:"2.5x damage, but the enemy's counter ignores your armor and Evasion this turn. Costs 30 stamina, once per fight." },
  { id:"precise_shot",    name:"Precise Shot",    stat:"agi", req:2, desc:"Always deals your maximum damage roll instead of a random one. Costs 25 stamina, once per fight." },
  { id:"adrenaline_rush", name:"Adrenaline Rush", stat:"agi", req:4, desc:"A free extra attack this turn, at no extra stamina cost. Costs 15 stamina, once per fight." },
  { id:"war_cry",         name:"War Cry",         stat:"int", req:2, desc:"Cuts every enemy's damage by 30% for the rest of the fight. Costs 20 stamina, once per fight." },
  { id:"cleave",          name:"Cleave",          stat:"str", req:6, desc:"Hits every enemy in the fight for 60% damage. Costs 40 stamina, once per fight." },
];

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// Same curve as index.html's xpForLevel/addXp (duplicated per the no-modules convention) —
// XP needed to go from `level` to `level+1`, not cumulative.
function xpForLevel(level){ return Math.round(40 * Math.pow(level, 1.5)); }

function getStats(){ try{ return Object.assign({str:0,agi:0,int:0}, JSON.parse(localStorage.getItem(STATS_KEY))); }catch(e){ return {str:0,agi:0,int:0}; } }
function getUnlockedSkills(){ try{ return JSON.parse(localStorage.getItem(SKILLS_KEY)) || {}; }catch(e){ return {}; } }

// Skill tree — per the project owner, Perks and Special Attacks should read as one branching
// tree per stat (like Cyberpunk 2077's attribute trees), not two flat lists. The unlock rules
// haven't changed at all (gated on a stat threshold, costs 1 shared skill point, same
// goblinwar_skills storage PERKS and MOVES have always shared) — only the presentation is new.
// ALL_SKILLS merges both catalogs, tagged by `type`, so one render path can group them; a tree
// "tier" is just every skill at the same {stat, req} pair (index.html's actual mechanical
// effects are untouched — see the PERKS/MOVES comments above).
const ALL_SKILLS = [
  ...PERKS.map(p => ({ ...p, type:'perk' })),
  ...MOVES.map(m => ({ ...m, type:'move' })),
];
function findSkill(id){ return ALL_SKILLS.find(s => s.id === id); }
// Every distinct `req` value for a stat, ascending, becomes one column (tier) of the tree; every
// skill sharing that {stat, req} pair becomes one node stacked in that column. A gold connector
// line is drawn between adjacent tiers so unlocking reads as progressing rightward along a branch.
function buildTiers(stat){
  const items = ALL_SKILLS.filter(s => s.stat === stat);
  const reqs = [...new Set(items.map(s => s.req))].sort((a,b) => a - b);
  return reqs.map(req => items.filter(s => s.req === req));
}

let selectedSkillId = null;

function renderNodeDetail(){
  const panel = document.getElementById('node-detail');
  const skill = selectedSkillId && findSkill(selectedSkillId);
  if(!skill){
    panel.classList.remove('show');
    panel.innerHTML = '';
    return;
  }
  const stats = getStats();
  const skillPoints = parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10);
  const unlocked = getUnlockedSkills();
  const isUnlocked = !!unlocked[skill.id];
  const meetsReq = stats[skill.stat] >= skill.req;
  const action = isUnlocked
    ? `<span class="perk-unlocked-badge">Unlocked</span>`
    : `<button class="perk-unlock-btn" id="node-unlock-btn" ${(!meetsReq || skillPoints <= 0) ? 'disabled' : ''}>Unlock (1 point)</button>`;
  panel.innerHTML = `
    <div class="node-detail-name">${skill.name}<span>${skill.type === 'move' ? 'Special Attack' : 'Passive Perk'}</span></div>
    <div class="node-detail-desc">${skill.desc}</div>
    <div class="node-detail-req">Requires ${STAT_LABELS[skill.stat]} ${skill.req}${meetsReq || isUnlocked ? '' : ` (have ${stats[skill.stat]})`}</div>
    <div class="node-detail-action">${action}</div>
  `;
  panel.classList.add('show');
  const btn = document.getElementById('node-unlock-btn');
  if(btn) btn.addEventListener('click', ()=>{
    const points = parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10);
    if(points <= 0) return;
    const unlockedNow = getUnlockedSkills();
    unlockedNow[skill.id] = true;
    localStorage.setItem(SKILLS_KEY, JSON.stringify(unlockedNow));
    localStorage.setItem(SKILLPOINTS_KEY, String(points - 1));
    showToast(`Unlocked ${skill.name}.`);
    renderProgression();
  });
}

function renderBranch(stat){
  const stats = getStats();
  const unlocked = getUnlockedSkills();
  const tiers = buildTiers(stat);
  const rowHTML = tiers.map((tier, i) => {
    const nodesHTML = tier.map(s => {
      const isUnlocked = !!unlocked[s.id];
      const meetsReq = stats[stat] >= s.req;
      const cls = isUnlocked ? 'unlocked' : (meetsReq ? 'ready' : '');
      const icon = isUnlocked ? '&#10003;' : (s.type === 'move' ? '&#9876;' : '&#10022;');
      return `<div class="tree-node ${cls}" data-skill="${s.id}"><div class="node-icon">${icon}</div><div class="node-name">${s.name}</div></div>`;
    }).join('');
    const link = i < tiers.length - 1 ? `<div class="tree-link"></div>` : '';
    return `<div class="tree-tier">${nodesHTML}</div>${link}`;
  }).join('');
  return `
    <div class="tree-branch" data-branch="${stat}">
      <div class="tree-branch-header">
        <div class="tree-branch-name">${STAT_LABELS[stat]}</div>
        <div class="tree-branch-value">Stat: <b>${stats[stat]}</b></div>
      </div>
      <div class="tree-row">${rowHTML}</div>
    </div>
  `;
}

// Spending a point on a raw stat here only raises the Strength/Agility/Intelligence number —
// see renderBranch()/renderNodeDetail() above for where a point instead unlocks a tree node.
function renderProgression(){
  const level = parseInt(localStorage.getItem(LEVEL_KEY) || "1", 10);
  const xp = parseInt(localStorage.getItem(XP_KEY) || "0", 10);
  const skillPoints = parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10);
  const stats = getStats();
  const xpNeeded = xpForLevel(level);

  document.getElementById('level-num').textContent = level;
  document.getElementById('xp-fill').style.width = Math.max(0, Math.min(100, Math.round((xp/xpNeeded)*100))) + '%';
  document.getElementById('xp-label').textContent = `XP: ${xp} / ${xpNeeded}`;
  document.getElementById('skill-points-value').textContent = skillPoints;
  Object.keys(STAT_LABELS).forEach(stat => {
    document.getElementById(`stat-${stat}`).textContent = stats[stat];
  });
  document.querySelectorAll('.stat-plus-btn').forEach(btn => {
    btn.disabled = skillPoints <= 0;
  });

  document.getElementById('skill-tree').innerHTML = Object.keys(STAT_LABELS).map(renderBranch).join('');
  document.querySelectorAll('.tree-node').forEach(el => {
    if(el.dataset.skill === selectedSkillId) el.classList.add('selected');
    el.addEventListener('click', ()=>{
      selectedSkillId = el.dataset.skill;
      document.querySelectorAll('.tree-node.selected').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
      renderNodeDetail();
    });
  });
  renderNodeDetail();
}
renderProgression();

document.querySelectorAll('.stat-plus-btn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    const skillPoints = parseInt(localStorage.getItem(SKILLPOINTS_KEY) || "0", 10);
    if(skillPoints <= 0) return;
    const stat = btn.dataset.stat;
    const stats = getStats();
    stats[stat] += 1;
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    localStorage.setItem(SKILLPOINTS_KEY, String(skillPoints - 1));
    showToast(`${STAT_LABELS[stat]} increased to ${stats[stat]}.`);
    renderProgression();
  });
});
</script>
</body>
</html>
